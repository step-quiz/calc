<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de textos de calc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Code+Pro:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<!--
  Artifact «Editor de textos de calc». Font: proves/editor-textos/ del repositori calc (plantilla.html + extreu.js,
  muntat per construeix.js). Imita la portada i la columna esquerra de la fitxa del web (mateixes lletres, mides i
  amplades); a la dreta, en lloc de la calculadora, l'editor. Base de dades (capacitat db): canvis/<id de la fitxa> =
  {id, titol, model, camps: {clau: text nou}, originals: {clau: text original}, comentari, actualitzat}.
  Claus: titol, enunciat, tancament, provaTu.enunciat, provaTu.solucio, araTu.enunciat, pas.<n>@<model>.
-->
<style>
:root{
  --bg:#f2f0eb; --surface:#faf8f4; --border:#d3cec4; --txt:#1e293b; --muted:#64748b; --hd-bg:#4b5059; --hd-txt:#f2f0eb;
  --cat:#3b82f6; --lcd-fons:#dde3d6; --lcd-tinta:#1b2016; --tecla-vora:#94a3b8; --vellut:#9e1b32; --editada:#c2410c;
  --lletra:'Libre Baskerville', Georgia, 'Times New Roman', serif;
  --mono:'Source Code Pro', ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
#app{display:contents}
html, body{margin:0}
body{min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--txt); font:15px/1.55 var(--lletra)}
button{font:inherit; color:inherit}
math{font-size:1.08em}
/* Tot el que es pot clicar: vora negra gruixuda i fons gris clar, sense moure res (David) */
.clicable:hover, .clicable:focus-visible{background:#e7e5e0 !important; border-color:#000 !important; box-shadow:0 0 0 1.5px #000 !important; outline:none}

/* Capçalera */
.cap{display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:8px 12px; background:var(--hd-bg); color:var(--hd-txt)}
.cap h1{margin:0; font-size:1.1rem}
.cap label{display:flex; align-items:center; gap:6px; font:.72rem var(--mono); color:color-mix(in srgb, var(--hd-txt) 85%, transparent)}
.cap select{font:inherit; color:var(--txt); background:var(--surface); border:1px solid var(--surface); border-radius:5px; padding:3px 4px; cursor:pointer}
.estat{margin-left:auto; font:600 .72rem var(--mono)}
.estat.mal{color:#fecaca}
.torna{padding:4px 10px; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--txt); font:.72rem var(--mono); cursor:pointer;
  box-shadow:0 3px 0 #94a3b8}
.on-som{flex:1; display:flex; flex-wrap:wrap; justify-content:center; align-items:baseline; column-gap:.5em; text-align:center}
.on-som p{margin:0; font-size:.95rem; line-height:1.3}
.on-som .bloc-nom{color:color-mix(in srgb, var(--hd-txt) 70%, transparent)}
.marca{flex-shrink:0; align-self:center; margin-left:auto; padding:2px 7px; border-radius:999px; background:var(--editada); color:#fff; font:600 .64rem/1.3 var(--mono); white-space:nowrap}

/* Portada */
.portada{flex:1; width:100%; max-width:1300px; margin:0 auto; padding:24px 10px 40px}
.avis{margin:0 0 14px; padding:8px 14px; border-radius:8px; background:#fff7ed; border:1px solid #fdba74; font-size:.85rem; color:#7c2d12}
.bombolles{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px}
.bombolla{position:relative; padding:7px 16px; border:2px solid var(--cat); border-radius:999px; background:#fdfdfb; font-size:.85rem; cursor:pointer}
.bombolla .marca{position:absolute; top:-9px; right:-4px}
.blocs{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:16px}
@media (max-width:999px){ .blocs{grid-template-columns:repeat(auto-fill, minmax(min(380px, 100%), 1fr))} }
.bloc{display:flex; flex-direction:column; gap:8px; background:#fdfdfb; border:2px solid var(--cat); border-radius:10px; padding:16px}
.bloc .num{font:.78rem var(--mono); color:var(--muted)}
.bloc h2{margin:0; font-size:.92rem; color:var(--cat)}
.llista{list-style:none; margin:6px 0 0; padding:0; display:flex; flex-direction:column; gap:6px}
.llista button{width:100%; display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--border); border-radius:6px;
  background:transparent; font-size:.85rem; text-align:left; cursor:pointer}
.llista .n{font:.68rem var(--mono); opacity:.7; min-width:1.6em}
.separa-grup{width:80%; margin:7px auto; border-top:1.5px solid #000}

/* Textos (com text.js i estil.css del web) */
.opcio-menu{font:600 .86em var(--mono); white-space:nowrap; background:var(--lcd-fons); color:var(--lcd-tinta); border-radius:3px; padding:0 .3em}
.avis-error{font-weight:700; color:var(--vellut)}
.frase-mat, .frase-calc{display:block; margin:3px 0; padding:3px 9px; border-radius:6px}
.frase-mat{background:#faf5e8}
.frase-calc{background:color-mix(in srgb, var(--lcd-fons) 55%, var(--surface)); font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size:.94em}
.frase-mat:first-child, .frase-calc:first-child{margin-top:0}
.frase-mat:last-child, .frase-calc:last-child{margin-bottom:0}
.frase-nota{display:block; font-style:italic; margin-top:.2em}
.tecla{display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--tecla-vora); background:var(--surface); box-shadow:0 1.5px 0 var(--tecla-vora);
  font:600 15px/1 var(--mono); color:var(--txt); white-space:nowrap}
.tecla.petita{min-width:1.85em; height:1.5em; padding:0 .32em; border-radius:.38em; font-size:.8em; vertical-align:middle; position:relative; top:-.08em}
.tecla .cara{display:inline-flex; align-items:center}
.tecla svg, .tecla .icona-tecla{width:1.15em; height:1.15em}
.tecla-exe, .tecla.t-exe{background:#1f2937; color:#fff}
.tecla-shift{background:#2563eb; color:#fff}

/* Fitxa: la columna esquerra com la del web; a la dreta, l'editor */
.contingut{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0, 4fr) minmax(0, 3fr); grid-template-rows:minmax(0, 1fr); padding:10px 15%; gap:0}
body.a-fitxa{height:100vh; height:100dvh; overflow:hidden}
html:has(body.a-fitxa){overflow:hidden}
@media (max-width:999px){ .contingut{display:flex; flex-direction:column; padding:14px} body.a-fitxa{height:auto; overflow:visible} html:has(body.a-fitxa){overflow:auto} }
.columna{display:flex; flex-direction:column; gap:12px; min-height:0; overflow-y:auto; padding-right:2px}
.enunciat{margin:0; padding:12px 16px; border:1.5px solid var(--border); border-radius:12px; background:var(--surface); font-size:16.5px; line-height:1.55}
.reproductor{display:flex; gap:6px}
.boto{width:40px; height:40px; padding:0; border-radius:50%; border:1px solid var(--border); background:var(--surface); display:grid; place-items:center; cursor:pointer}
.boto:disabled{opacity:.4; cursor:default}
.passos{list-style:none; margin:0; padding:2px; display:flex; flex-direction:column; gap:3px}
.pas{border:1.5px solid transparent; border-radius:12px}
.pas .capr{display:flex; align-items:center; gap:12px; width:100%; min-width:0; text-align:left; padding:5px 10px; min-height:36px; border:1.5px solid transparent; border-radius:10px; background:transparent; cursor:pointer}
.pas .num{min-width:1.3em; flex:none; font:600 12.5px/1 var(--mono); color:var(--muted); text-align:right}
.pas .resum{flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:14px; color:var(--muted)}
.pas .resum .frase-mat, .pas .resum .frase-calc{display:inline; margin:0 .4em 0 0; padding:0; background:none; font:inherit}
.pas .resum br{display:none}
.pas .frase{display:none; margin:0; font-size:16.5px; line-height:1.6}
.pas.actual{display:flex; align-items:baseline; background:var(--surface); border-color:var(--cat); box-shadow:0 2px 8px rgba(15,23,42,.07)}
.pas.actual .capr{width:auto; flex:none; padding-right:12px}
.pas.actual .resum{display:none}
.pas.actual .frase{display:block; flex:1; min-width:0; padding:6px 14px 10px 0}
.pas.actual .num{color:var(--cat)}
.pas.fet{opacity:.55}
.pas.error.actual{border-color:var(--vellut)}
.pas.final .resum{font:13.5px var(--mono); color:var(--cat)}
.prova{padding:12px 16px; border:1.5px dashed var(--cat); border-radius:12px; background:var(--surface); font-size:16px}
.prova h3{margin:0 0 6px; font:600 .8rem var(--mono); color:var(--cat)}
.prova .sol{margin-top:8px; padding-top:8px; border-top:1px solid var(--border)}

.panell{display:flex; flex-direction:column; gap:10px; min-height:0; overflow-y:auto; overscroll-behavior:contain; margin-left:clamp(20px, 2.5vw, 48px);
  padding:0 12px 40px; background:#fff; border:1px solid var(--border); border-radius:10px; font-size:.9rem}
.panell-cap{position:sticky; top:0; z-index:2; display:flex; align-items:baseline; gap:10px; margin:0 -12px; padding:10px 12px 8px; background:#fff; border-bottom:1px solid var(--border)}
.panell-cap b{font-size:.95rem}
.panell-model{font:600 .72rem var(--mono); color:#475569}
.panell-cap{flex-wrap:wrap}
.eines{display:flex; gap:4px; margin-left:auto}
.eina[data-eina="B"]{font-weight:900}
.eina{min-width:30px; height:28px; padding:0 6px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; color:#111827; cursor:pointer; font:600 .95rem/1 var(--mono)}
.copiat{flex-basis:100%; min-height:1em; font:600 .7rem var(--mono); color:#15803d; text-align:right}
.ajuda{font-size:.8rem; color:#475569}
.ajuda summary{width:max-content; padding:2px 8px; border:1px solid #cbd5e1; border-radius:6px; cursor:pointer}
.ajuda ul{margin:6px 0 0; padding-left:1.2em}
.ajuda code{background:#f1f5f9; padding:0 3px; border-radius:3px; font-size:.95em}
.camp{display:flex; flex-direction:column; gap:4px; padding:8px 10px; border:1px solid #e5e7eb; border-left:5px solid #e5e7eb; border-radius:8px}
.camp.actual{border-color:var(--cat); border-left-color:var(--cat); background:color-mix(in srgb, var(--cat) 5%, #fff)}
.camp.editat{border-left-color:var(--editada)}
.camp-cap{display:flex; align-items:center; gap:8px; min-height:24px}
.camp-nom{font:600 .74rem var(--mono); color:#334155}
.camp.editat .camp-nom::after{content:' · editat'; color:var(--editada)}
.camp textarea{width:100%; resize:vertical; overflow:hidden; min-height:2.4em; padding:6px 8px; border:1.5px solid #cbd5e1; border-radius:6px;
  font:.82rem/1.45 var(--mono); color:#111827; background:#fcfcfa}
.camp textarea:focus{outline:none; border-color:#000; box-shadow:0 0 0 1.5px #000; background:#fff}
.camp.comentari{border-style:dashed}
.camp.comentari textarea{font:.9rem/1.45 system-ui, sans-serif}
.petit-boto{margin-left:auto; padding:2px 9px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; color:#111827; cursor:pointer; font:600 .7rem var(--mono)}
.missatge{position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:9; padding:8px 14px; border-radius:8px; background:#fde2e1; border:1px solid #b91c1c; color:#7f1d1d; font-size:.85rem}
</style>
</head>
<body>
<div id="app"></div>
<p class="missatge" id="missatge" hidden></p>
<script>
const DADES = {"versio":"116","models":[{"id":"fx-82sp-cw","curt":"fx-82SP CW"},{"id":"fx-570sp-cw","curt":"fx-570/991SP CW"},{"id":"fx-570sp-x2","curt":"fx-570/991SP X II"},{"id":"fx-82sp-x2","curt":"fx-82/85SP X II"},{"id":"fx-82ms","curt":"fx-82/85/350MS"}],"blocs":[{"id":"exacte","titol":"Treballar en mode 'exacte' o 'decimal'","color":"#0c1736","etapes":["batx"],"petit":false},{"id":"fraccions","titol":"Operar amb fraccions i potències","color":"#0d235e","etapes":["batx"],"petit":false},{"id":"angles","titol":"Treballar en mode 'graus' o 'radiants'","color":"#033d63","etapes":["batx"],"petit":false},{"id":"pau","titol":"Funcions útils per a la PAU","color":"#876d0d","etapes":["batx"],"petit":false},{"id":"pau-ag","titol":"Exercicis PAU. Àlgebra i Geometria","color":"#853300","etapes":["batx"],"petit":false},{"id":"pau-ap","titol":"Exercicis PAU. Anàlisi i Probabilitat","color":"#945600","etapes":["batx"],"petit":false},{"id":"simbols","titol":"Interpretar els indicadors de pantalla","color":"#3d4f1f","etapes":["batx","eso"],"petit":true},{"id":"examen","titol":"Configurar-ho tot abans d'un examen","color":"#3d4f1f","etapes":["batx","eso"],"petit":true},{"id":"eso-inici","titol":"Correcció d'errors d'escriptura","color":"#3d4f1f","etapes":["batx","eso"],"petit":true},{"id":"eso-pantalla","titol":"Fracció o decimal. Arrodonir. Notació científica","color":"#0b4a40","etapes":["eso"],"petit":false},{"id":"eso-parentesis","titol":"Ús dels parèntesis","color":"#0d5c4f","etapes":["eso"],"petit":false},{"id":"eso-proporcionalitat","titol":"Proporcionalitat","color":"#1b5e3b","etapes":["eso"],"petit":false},{"id":"eso-percentatges","titol":"Percentatges","color":"#14532d","etapes":["eso"],"petit":false},{"id":"eso-mitjanes","titol":"Mitjanes","color":"#3b2a6b","etapes":["eso"],"petit":false},{"id":"eso-geometria","titol":"Pitàgores, àrees i volums","color":"#4f2a73","etapes":["eso"],"petit":false},{"id":"eso-trigonometria","titol":"Trigonometria","color":"#602f6a","etapes":["eso"],"petit":false}],"fitxes":{"fx-82sp-cw":[{"id":"exacte-decimal","bloc":"exacte","titol":"Valor exacte i valor decimal","enunciat":"Calcula $\\sin 45^\\circ$ en forma exacta i també en forma decimal.","font":"","passos":[["[calc]Escriu $\\mathrm{sen}(45)$: [[sen]], el 45 i [[rpar]]. A la tecla de la calculadora, el sinus es diu sen; als enunciats en català, sin. La calculadora és en graus (D).[/calc]",0],["[calc]Prem [[exe]]. Com que la calculadora és en mode {{E Mat/S Mat}}, el resultat és el valor exacte, $\\frac{\\sqrt{2}}{2}$.[/calc] [mat]A la PAU, aquesta és la resposta.[/mat]",0],["[calc]La tecla [[format]] obre un menú per canviar com es mostra el resultat. La primera opció, {{Estándar}}, és la forma exacta.[/calc]",0],["[calc]Baixa fins a {{Decimal}} amb [[down]].[/calc]",0],["[calc]Prem [[ok]]. És el mateix nombre, però ara en decimal: 0.7071067812.[/calc]",0],["[calc]Per tornar a la forma exacta: [[format]] i [[ok]], perquè {{Estándar}} ja està triada.[/calc]",0],["[calc]Ara una drecera. Esborra amb [[ac]] i torna a escriure $\\mathrm{sen}(45)$.[/calc]",0],["[calc]En lloc de [[exe]], prem [[shift]] i després [[exe]] (a sobre d'EXE hi ha ≈): surt el resultat en decimal directament.[/calc]",0]],"araTu":{"enunciat":"Calcula $\\cos 30^\\circ$ en forma exacta i en forma decimal."}},{"id":"mode-decimal","bloc":"exacte","titol":"Em surt 0.5 en lloc d'1/2","enunciat":"Calcules $1\\div 2$ i la calculadora dona 0.5, mai fraccions ni arrels. Arregla-ho.","font":"","passos":[["[calc]Calcules $1\\div 2$ i surt 0.5. La icona √ hi és, però no ajuda: surt tant en {{E Mat/S Mat}} com en {{E Mat/S Decimal}}.[/calc]",0],["[calc]Prem [[settings]]: s'obre el menú CONFIG, amb {{Config cálculo}} triat.[/calc]",0],["[calc]Prem [[ok]]. La primera opció és {{Entrada/Salida}}.[/calc]",0],["[calc]Prem [[ok]]. Aquí hi ha el problema: el ◉ és a {{E Mat/S Decimal}}. Vol dir «entrada matemàtica, sortida sempre decimal».[/calc]",0],["[calc]Puja a {{E Mat/S Mat}} amb [[up]]: entrada i sortida matemàtiques (fraccions, arrels, π).[/calc]",0],["[calc]Prem [[ok]]: el ◉ passa a {{E Mat/S Mat}}.[/calc]",0],["[calc]Prem [[ac]] per tornar a la pantalla de càlcul. En canviar aquest ajust, l'historial s'esborra (ja no hi ha ▲).[/calc]",0],["[calc]Torna a calcular $1\\div 2$: ara surt $\\frac{1}{2}$.[/calc]",0]],"araTu":{"enunciat":"La calculadora és en mode {{E Mat/S Decimal}} i $\\sqrt{8}$ dona 2.828427125. Posa-la en mode {{E Mat/S Mat}} i torna-ho a calcular."}},{"id":"fix","bloc":"exacte","titol":"Tot em surt arrodonit (FIX)","enunciat":"Tens la fracció d'$\\frac{1}{6}$ i, quan la passes a decimal, et surt 0.17.\nEl motiu és que tens activat el \"FIX\" a la barra de dalt, i algú va fixar 2 decimals.","font":"","passos":[["[calc]Amb [[shift]] [[exe]] demanes el decimal i surt 0.17: és arrodonit a 2 decimals per culpa de FIX.[/calc] [mat]Si calcules amb arrodoniments, s'acumulen errors.[/mat]",0],["[calc]Obre [[settings]] i entra a {{Config cálculo}} amb [[ok]].[/calc]",0],["[calc]Baixa fins a {{Formato número}}.[/calc]",0],["[calc]Prem [[ok]]. El ◉ és a {{Fijar decim}}: decimals fixos.[/calc]",0],["[calc]Baixa fins a {{Normal}} i prem [[ok]]. Surten els dos tipus, Norm1 i Norm2, amb un exemple de cada un. La de fàbrica és Norm2.[/calc]",0],["[calc]El menú s'obre a Norm1: baixa a Norm2 amb [[down]] i prem [[ok]]. El ◉ passa a {{Normal}}.[/calc]",0],["[calc]Prem [[ac]]. A la barra ja no hi ha FIX.[/calc]",0],["[calc]Torna a demanar el decimal: 0.1666666667.[/calc] [mat]Arrodoneix tu al final, només quan escriguis la resposta.[/mat]",0]],"araTu":{"enunciat":"A la barra hi ha FIX. Treu-lo i calcula el decimal de $\\frac{2}{3}$ amb tots els decimals."}},{"id":"frac-plantilla","bloc":"fraccions","titol":"Escriu una fracció amb la plantilla","enunciat":"Calcula $\\frac{3}{4}+\\frac{5}{6}$ escrivint les fraccions amb la tecla de fracció.","font":"","passos":[["[calc]Prem [[frac]]: surt la plantilla de fracció, amb el cursor al numerador. Escriu el 3, baixa al denominador amb [[down]] i escriu el 4.[/calc]",0],["[calc]Per sortir del denominador, prem [[right]]; ara ja pots escriure el [[mes]]. Sense el [[right]], el «+» s'escriuria dins del 4.[/calc]",0],["[calc]La segona fracció, igual: [[frac]], el 5, [[down]] i el 6.[/calc]",0],["[calc]Prem [[exe]]: $\\frac{3}{4}+\\frac{5}{6}=\\frac{19}{12}$. Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 1.583333333.[/calc]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i escriu $\\frac{3}{4}$; sense prémer [[right]], prem [[mes]]: el «+» queda dins del denominador.[/calc]",1],["[calc]Acaba igual i prem [[exe]]: surt $\\frac{18}{29}$, perquè has calculat $\\frac{3}{4+\\frac{5}{6}}$. Després del denominador, sempre [[right]].[/calc]",1]],"tancament":"[calc]Recorda: després d'escriure el denominador, prem [[right]] per sortir de la fracció.[/calc] [mat]$\\frac{3}{4}+\\frac{5}{6}=\\frac{19}{12}$.[/mat]","araTu":{"enunciat":"Calcula $\\frac{2}{5}+\\frac{1}{3}$ amb la plantilla de fracció."}},{"id":"frac-prioritat","bloc":"fraccions","titol":"Fracció de sumes: on van els parèntesis","enunciat":"Calcula $\\frac{2+3}{4-1}$. Una manera d'escriure-ho dona un resultat equivocat.","font":"","passos":[["[calc]!!Error típic!!, com no s'ha de fer: tot en una línia, $2+3\\div 4-1$.[/calc]",1],["[calc]Prem [[exe]]: surt $\\frac{7}{4}$, no $\\frac{5}{3}$. La calculadora divideix només el 3 entre 4: $2+\\frac{3}{4}-1$. (Surt en fracció perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 1.75.)[/calc]",1],["[calc]Ara bé: prem [[frac]] i escriu tot el numerador, $2+3$.[/calc]",0],["[calc]Baixa amb [[down]] i escriu tot el denominador, $4-1$. La barra de la fracció ja fa de parèntesi.[/calc]",0],["[calc]Prem [[exe]]: $\\frac{5}{3}$. També aniria bé $(2+3)\\div(4-1)$ amb parèntesis, però la plantilla és més curta.[/calc]",0]],"araTu":{"enunciat":"Calcula $\\frac{7-1}{2+1}$ amb la plantilla de fracció."}},{"id":"pot-negativa","bloc":"fraccions","titol":"Potències de negatius","enunciat":"Calcula $(-2)^4$. Si t'oblides dels parèntesis, el resultat és diferent del que tu esperaves.","font":"","passos":[["[calc]La base és $-2$: escriu-la entre parèntesis, amb [[lpar]], [[menys]], el 2 i [[rpar]].[/calc]",0],["[calc]Prem [[pot]]: l'exponent surt en petit. Escriu el 4.[/calc]",0],["[calc]Prem [[exe]]: $(-2)^4=16$.[/calc]",0],["[calc]!!Error típic!!: sense parèntesis. Esborra amb [[ac]] i escriu $-2^4$: [[menys]], el 2, [[pot]] i el 4.[/calc]",1],["[calc]Prem [[exe]]: surt −16.[/calc] [mat]La potència té més prioritat que el signe: és $-(2^4)$. Per elevar un negatiu, sempre amb parèntesis.[/mat]",1]],"tancament":"[mat]Recorda: per elevar un nombre negatiu, posa'l entre parèntesis: $(-2)^4=16$.[/mat]","araTu":{"enunciat":"Calcula $(-3)^4$."}},{"id":"pot-fraccio","bloc":"fraccions","titol":"Potència d'una fracció","enunciat":"Calcula $\\left(\\frac{2}{3}\\right)^{-2}$.","font":"","passos":[["[calc]Escriu la fracció entre parèntesis: [[lpar]], [[frac]], el 2, [[down]] i el 3.[/calc]",0],["[calc]Surt de la fracció amb [[right]] i tanca amb [[rpar]].[/calc] [mat]Els parèntesis diuen que l'exponent afecta tota la fracció.[/mat]",0],["[calc]Prem [[pot]] i escriu l'exponent $-2$: [[menys]] i el 2.[/calc]",0],["[calc]Prem [[exe]]: $\\left(\\frac{2}{3}\\right)^{-2}=\\frac{9}{4}$.[/calc] [mat]Un exponent negatiu inverteix la fracció.[/mat] [calc]Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 2.25.[/calc]",0],["[calc]!!Error típic!!: sense parèntesis. Esborra amb [[ac]] i escriu [[frac]], el 2, [[down]] i el 3, i no surtis del denominador.[/calc]",1],["[calc]Si ara prems [[pot]], l'exponent $-2$ s'escriu dins del denominador: només afecta el 3.[/calc]",1],["[calc]Prem [[exe]]: surt 18, perquè $\\frac{2}{3^{-2}}=\\frac{2}{1/9}$. Els parèntesis són imprescindibles.[/calc]",1]],"tancament":"[mat]Recorda: per elevar una fracció, posa-la entre parèntesis: $\\left(\\frac{2}{3}\\right)^{-2}=\\frac{9}{4}$.[/mat]","araTu":{"enunciat":"Calcula $\\left(\\frac{3}{2}\\right)^{-3}$."}},{"id":"arrel-n","bloc":"fraccions","titol":"Arrels quadrades, cúbiques, ...","enunciat":"Calcula l'arrel cúbica de $-27$, és a dir, $\\sqrt[3]{-27}$.","font":"","passos":[["[calc]Prem [[shift]] i [[arrel]] (a sobre de la tecla hi ha l'arrel d'índex n). Surt una arrel amb dos quadres: el petit és l'índex i el gran, el radicand.[/calc]",0],["[calc]Escriu l'índex, el 3, i prem [[right]] per passar al radicand.[/calc]",0],["[calc]Escriu el radicand, $-27$: [[menys]], el 2 i el 7.[/calc]",0],["[calc]Prem [[exe]]: $\\sqrt[3]{-27}=-3$, perquè $(-3)^3=-27$.[/calc] [mat]Una arrel d'índex senar d'un negatiu sí que existeix.[/mat]",0],["[calc]Amb qualsevol altre índex, igual: [[shift]] [[arrel]], l'índex, [[right]] i el radicand.[/calc] [mat]Per exemple, $\\sqrt[4]{16}=2$.[/mat]",0]],"araTu":{"enunciat":"Calcula $\\sqrt[5]{-32}$."}},{"id":"canvia-radians","bloc":"angles","titol":"Posa la calculadora en radians","enunciat":"En un exercici de trigonometria cal treballar en radians: calcula $\\sin\\frac{\\pi}{6}$.","font":"","passos":[["[calc]Ara la calculadora és en graus: a la barra hi ha D.[/calc] [mat]Si l'angle porta π, o és la x d'una funció, ha de ser R.[/mat]",0],["[calc]Prem [[settings]]: menú CONFIG.[/calc]",0],["[calc]Entra a {{Config cálculo}} amb [[ok]].[/calc]",0],["[calc]Baixa a {{Unidad angular}} amb [[down]].[/calc]",0],["[calc]Prem [[ok]]. El ◉ és a {{Grado sexag (D)}}: graus sexagesimals.[/calc]",0],["[calc]Baixa a {{Radián}}.[/calc]",0],["[calc]Prem [[ok]]: el ◉ passa a {{Radián}}.[/calc]",0],["[calc]Prem [[ac]] per tornar a calcular. A la barra ara hi ha R.[/calc]",0],["[calc]Escriu $\\mathrm{sen}(\\pi\\div 6)$. La π és [[shift]] [[7]]. A la calculadora, el sinus (sin) es diu sen.[/calc]",0],["[calc]Prem [[exe]]: $\\sin\\frac{\\pi}{6}=\\frac{1}{2}$. Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 0.5.[/calc]",0]],"araTu":{"enunciat":"Ara que la calculadora és en radians (R), calcula $\\cos\\frac{\\pi}{4}$."}},{"id":"error-angles","bloc":"angles","titol":"Troba l'error: el mode equivocat","enunciat":"La Laia calcula $\\cos\\frac{\\pi}{3}$, que hauria de ser $\\frac{1}{2}$, però la calculadora li dona aquest resultat: 0.9998329795.\nQuè ha passat?","font":"","passos":[["[calc]!!Error típic!!: el que ha fet la Laia, $\\cos(\\pi\\div 3)$ i [[exe]]. Surt 0.9998329795, i no $\\frac{1}{2}$.[/calc]",1],["[calc]Mira la barra: D. La calculadora ha entès «π/3 graus», un angle d'un grau escàs, i el seu cosinus és gairebé 1.[/calc]",1],["[calc]Ho arreglem: [[settings]], [[ok]] ({{Config cálculo}}), [[down]] ({{Unidad angular}}) i [[ok]].[/calc]",0],["[calc]Tria {{Radián}}: [[down]] i [[ok]].[/calc]",0],["[calc]Prem [[ac]]. Ara hi ha R.[/calc]",0],["[calc]El mateix càlcul dona $\\frac{1}{2}$. Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 0.5.[/calc]",0],["[calc]!!Error típic!!, el contrari: esborra amb [[ac]] i calcula $\\mathrm{sen}(30)$ en radians: és el sinus de 30 radians, −0.9880316241. Si el 30 són graus, la calculadora ha de ser en D.[/calc]",1]],"tancament":"[calc]Recorda: abans de calcular, mira la unitat dels angles a dalt de la pantalla: R si l'angle és en radians (per exemple, si porta π); D si és en graus.[/calc]","araTu":{"enunciat":"Amb la calculadora en radians (R a la barra), calcula $\\cos\\frac{2\\pi}{3}$."}},{"id":"graus-radians","bloc":"angles","titol":"Convertir de graus a radiants","enunciat":"Expressa en radiants un angle de $60^\\circ$.","font":"","passos":[["[mat]Per canviar d'unitats es multiplica per un factor de conversió que val 1: $\\frac{\\pi\\ \\mathrm{rad}}{180^\\circ}$, perquè $\\pi$ rad i $180^\\circ$ són el mateix angle.[/mat] [calc]Escriu 60 i [[per]].[/calc]",0],["[mat]$60^\\circ\\cdot\\frac{\\pi\\ \\mathrm{rad}}{180^\\circ}$: els graus que vols treure van al denominador i se simplifiquen amb els de dalt; només hi queden radiants.[/mat] [calc]Prem [[frac]], escriu π ([[shift]] [[7]]) al numerador i, amb [[down]], 180 al denominador.[/calc]",0],["[calc]Prem [[exe]]: obtens $\\frac{\\pi}{3}$. Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 1.047197551.[/calc] [mat]$60^\\circ=\\frac{\\pi}{3}$ rad.[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i escriu el factor capgirat, $\\frac{180}{\\pi}$.[/calc] [mat]$60^\\circ\\cdot\\frac{180^\\circ}{\\pi\\ \\mathrm{rad}}$: els graus queden a dalt tots dos cops i no se simplifiquen. El que surt ja no són radiants.[/mat]",1],["[calc]Prem [[shift]] [[exe]] (≈): surt 3437.746771.[/calc] [mat]No pot ser: 1 rad són uns $57^\\circ$, així que $60^\\circ$ ha de ser una mica més d'1 rad. El factor de conversió estava capgirat: no s'han simplificat els graus.[/mat]",1]],"tancament":"[mat]Recorda: al factor de conversió, al numerador hi va la unitat que vols ($\\pi$ rad) i al denominador la que vols treure ($180^\\circ$), perquè se simplifiqui.\n$60^\\circ=\\frac{\\pi}{3}$ rad.[/mat]","araTu":{"enunciat":"Expressa en radiants un angle de $135^\\circ$."}},{"id":"definir-fx","bloc":"pau","titol":"Defineix les funcions f(x) i g(x), i calcula'n valors","enunciat":"Sigui $f(x)=x^3-3x+2$. La funció derivada és $f'(x)=3x^2-3$.\nResolent l'equació $f'(x)=0$ has obtingut els punts crítics: $x=-1$ i $x=1$.\n\nTroba les coordenades del mínim relatiu R(x,y) i del màxim relatiu S(x,y).","font":"","passos":[["[calc]Defineix $f$ un sol cop. Prem [[funcio]] (FUNCTION), baixa fins a {{Definir f(x)}} i prem [[ok]].[/calc]",0],["[calc]Escriu $x^3-3x+2$. La $x$ és la tecla [[x]]; l'exponent és [[pot]] i, amb [[right]], en surts.[/calc]",0],["[calc]Prem [[exe]]: $f$ queda desada i tornes a la pantalla de càlcul.[/calc]",0],["[calc]Ara $g$, igual però triant {{Definir g(x)}}: [[funcio]], tres cops [[down]] i [[ok]].[/calc]",0],["[calc]Escriu $3x^2-3$. L'exponent 2 té tecla pròpia: [[x2]].[/calc]",0],["[calc]Prem [[exe]]: $f$ i $g$ ja són desades. No cal tornar-les a escriure.[/calc]",0],["[calc]Calcula $f(-1)$: [[funcio]], {{f(x)}} amb [[ok]] (escriu «f(»), $-1$, [[rpar]] i [[exe]]. Surt 4: el punt és $(-1,\\,4)$.[/calc]",0],["[mat]Igual amb $f(1)=0$: el punt és $(1,\\,0)$.[/mat]",0],["[calc]Per saber quin és el mínim, mira el signe de $g$ entre els dos punts: {{g(x)}} és la fila de sota de {{f(x)}}.[/calc] [mat]$g(0)=-3<0$, així que $f$ decreix de $x=-1$ a $x=1$: el màxim és $S(-1,\\,4)$ i el mínim és $R(1,\\,0)$. R és a l'eix $OX$ perquè $x=1$ és arrel doble de $f=(x-1)^2(x+2)$.[/mat]",0],["[mat]Com que ja tens $f$ i $g=f'$, la recta tangent és immediata. A $x=2$: $f(2)=4$ (el punt) i $g(2)=9$ (el pendent). La tangent és $y-4=9(x-2)$, és a dir, $y=9x-14$.[/mat]",0]],"araTu":{"enunciat":"Amb $f$ i $g=f'$ encara desades, troba la recta tangent a la gràfica de $f$ a $x=-2$."}},{"id":"barrow","bloc":"pau","titol":"Regla de Barrow amb f(x)","enunciat":"La superfície del terreny és $\\int_1^6 f(x)\\,dx-\\frac{25}{2}$, amb $f(x)=-x^3+7x^2-6x+5$ (el $\\frac{25}{2}$ és el triangle que no hi entra). A mà has trobat la primitiva $F(x)=-\\frac{x^4}{4}+\\frac{7x^3}{3}-3x^2+5x$. Calcula $F(6)-F(1)$ amb la calculadora.","font":"PAU juny 2024, qüestió 3 b)","passos":[["[calc]Defineix la primitiva $F$ com a $f(x)$: així l'escrius un sol cop. [[funcio]], baixa fins a {{Definir f(x)}} i [[ok]].[/calc]",0],["[calc]El primer terme, $-\\frac{x^4}{4}$: [[menys]], [[frac]], [[x]], [[pot]] 4, [[right]] per sortir de l'exponent, [[down]], 4 i [[right]] per sortir de la fracció.[/calc]",0],["[calc]El segon, $+\\frac{7x^3}{3}$, igual: [[mes]], [[frac]], $7x^3$, [[down]], 3 i [[right]].[/calc]",0],["[calc]I la resta, $-3x^2+5x$. El quadrat és [[x2]].[/calc]",0],["[calc]Prem [[exe]]: $F$ queda desada com a $f$.[/calc]",0],["[calc]Regla de Barrow en una sola línia: escriu $f(6)-f(1)$. Cada $f($ és [[funcio]] i [[ok]].[/calc]",0],["[calc]Prem [[exe]]: $\\int_1^6 f(x)\\,dx=\\frac{1175}{12}$, exacte perquè la calculadora és en mode {{E Mat/S Mat}} (en mode {{E Mat/S Decimal}} sortiria 97.91666667). Sense fer les fraccions a mà.[/calc]",0],["[calc]Resta-hi el triangle: [[ans]], [[menys]] i $\\frac{25}{2}$.[/calc] [mat]La superfície és $\\frac{1025}{12}\\approx 85{,}42\\,\\text{u}^2$, com a la pauta.[/mat]",0]]},{"id":"ans","bloc":"pau","titol":"Reutilitza l'últim resultat (Ans)","enunciat":"Calcula $\\dfrac{8}{\\sin 35^\\circ}$ amb la calculadora en graus, sense copiar cap decimal intermedi.","font":"","passos":[["[calc]Primer, $\\sin 35^\\circ$: [[sen]], el 35 i [[rpar]].[/calc]",0],["[calc]Prem [[exe]]. La calculadora desa el resultat a [[ans]] sense arrodonir-lo: la pantalla només en mostra els deu primers dígits.[/calc]",0],["[mat]Ara vols $8\\div\\sin 35^\\circ$.[/mat] [calc]No escriguis el decimal: escriu 8, [[entre]] i la tecla [[ans]].[/calc]",0],["[calc]Prem [[exe]]: 13.94757436. Cap decimal copiat, cap error d'arrodoniment.[/calc]",0],["[calc]Si ara en vols el doble, no cal [[ans]]: després d'un resultat, una operació com [[per]] ja comença amb Ans.[/calc]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i copia només 0.57 en lloc de $\\sin 35^\\circ$. Surt $\\frac{800}{57}\\approx 14{,}04$ i no 13,95: ja falla el primer decimal. (Surt en fracció perquè la calculadora és en mode {{E Mat/S Mat}}.)[/calc]",1]],"tancament":"[calc]Recorda: per fer servir un resultat en el càlcul següent, prem [[ans]]. Així t'estalvies copiar tots els decimals.[/calc]","araTu":{"enunciat":"Calcula $\\dfrac{10}{\\cos 40^\\circ}$ amb la calculadora en graus, sense copiar cap decimal intermedi."}},{"id":"logaritmes","bloc":"pau","titol":"Logaritme en qualsevol base","enunciat":"Resol l'equació $3^x=7$: calcula $x=\\log_3 7$ i comprova el resultat.","font":"","passos":[["[calc]Prem [[logab]]: surt un logaritme amb dos quadres. El petit és la base i el gran, el nombre.[/calc]",0],["[calc]Escriu la base, el 3, i prem [[right]] per passar al nombre.[/calc]",0],["[calc]Escriu el 7. El parèntesi ja hi és: no cal tancar-lo.[/calc]",0],["[calc]Prem [[exe]]: $x=\\log_3 7\\approx 1{,}7712$.[/calc]",0],["[mat]Comprova-ho: $3^x$ ha de valer 7.[/mat] [calc]Escriu 3, [[pot]] i, a l'exponent, [[ans]] (el resultat d'abans, sense copiar-lo).[/calc]",0],["[calc]Prem [[exe]]: surt 7. ✓[/calc]",0],["[calc]Per a base 10 i per a base $e$ hi ha tecles pròpies: log és [[shift]] [[x2]] i ln és [[shift]] [[logab]]. Prova $\\log 1000$.[/calc]",0],["[calc]Prem [[exe]]: $\\log 1000=3$.[/calc]",0]],"araTu":{"enunciat":"Resol l'equació $2^x=10$: calcula $x=\\log_2 10$ i comprova el resultat."}},{"id":"combinatoria","bloc":"pau","titol":"Nombres combinatoris","enunciat":"Una variable $X$ segueix una binomial amb $n=6$ i $p=\\frac{1}{3}$.\nCalcula $P(X=4)=\\binom{6}{4}\\left(\\frac{1}{3}\\right)^{4}\\left(\\frac{2}{3}\\right)^{2}$.","font":"","passos":[["[calc]Escriu el 6 i prem [[catalog]]. El nombre combinatori s'escriu entre el 6 i el 4, i és al CATALOG.[/calc]",0],["[calc]Baixa fins a {{Probabilidad}} i prem [[ok]]: hi ha el percentatge, el factorial, les permutacions i les combinacions.[/calc]",0],["[calc]Tria {{Combinación(C)}} amb tres cops [[down]] i prem [[ok]]: s'escriu un C darrere del 6.[/calc]",0],["[calc]Escriu el 4: «6C4» és $\\binom{6}{4}$.[/calc]",0],["[mat]Ara $p^4=\\left(\\frac{1}{3}\\right)^4$.[/mat] [calc]Prem [[per]], obre un parèntesi i escriu la fracció $\\frac{1}{3}$ amb [[frac]].[/calc]",0],["[calc]Surt de la fracció amb [[right]], tanca amb [[rpar]] i escriu l'exponent amb [[pot]] i el 4.[/calc]",0],["[mat]I $(1-p)^2=\\left(\\frac{2}{3}\\right)^2$.[/mat] [calc]Surt de l'exponent amb [[right]] i fes el mateix: [[per]], $\\left(\\frac{2}{3}\\right)$ i l'exponent 2.[/calc]",0],["[calc]Prem [[exe]]: $P(X=4)=\\frac{20}{243}$, perquè $\\binom{6}{4}=15$. Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 0.08230452675. Al mateix menú hi ha {{Factorial(!)}} i {{Permutación(P)}}.[/calc]",0]],"araTu":{"enunciat":"Amb $n=8$ i $p=\\frac{1}{2}$, calcula $P(X=3)=\\binom{8}{3}\\left(\\frac{1}{2}\\right)^{8}$."}},{"id":"verificar","bloc":"pau","titol":"Comprova una igualtat","enunciat":"Comprova que es compleix aquesta igualtat: $\\dfrac{1}{\\sqrt{2}}=\\dfrac{\\sqrt{2}}{2}$.","font":"","passos":[["[calc]Prem [[tools]] (TOOLS): surt un menú amb {{Deshacer}}, {{Simplificar}} i {{Verificar ON}}.[/calc]",0],["[calc]Baixa dues files amb [[down]] fins a {{Verificar ON}} i prem [[ok]]: a dalt surt ✔. Compte: mentre Verificar és activat, la calculadora només serveix per verificar i l'historial s'esborra.[/calc]",0],["[calc]Escriu el primer membre: [[frac]], el 1, [[down]], [[arrel]] i el 2.[/calc]",0],["[calc]Surt de l'arrel i de la fracció amb dos [[right]] i prem [[catalog]]: ara hi ha {{Verificar}} a dalt de tot.[/calc]",0],["[calc]Prem [[ok]] per entrar a {{Verificar}} i [[ok]] un altre cop per triar el signe {{=}} (també hi ha $\\neq$, $>$, $<$, $\\geq$ i $\\leq$).[/calc]",0],["[calc]Escriu el segon membre: [[frac]], [[arrel]], el 2, [[right]] per sortir de l'arrel, [[down]] i el 2.[/calc]",0],["[calc]Prem [[exe]]: {{Verdadero}}. Si no fos cert, diria {{Falso}}. Compte: ara [[ans]] val 1 (o 0 si és fals), i si verifiques una solució arrodonida pot sortir {{Falso}} encara que sigui bona.[/calc]",0],["[calc]Quan acabis, desactiva-ho: [[tools]], baixa a {{Verificar OFF}} amb [[down]] (la primera fila és {{Deshacer}}) i [[ok]]. El ✔ desapareix i la calculadora torna a calcular amb normalitat.[/calc]",0]],"araTu":{"enunciat":"Comprova amb {{Verificar}} que $\\sqrt{12}=2\\sqrt{3}$."}},{"id":"producte-escalar-vectorial","bloc":"pau","titol":"Producte escalar i producte vectorial","enunciat":"Siguin $\\vec u=(2,-1,3)$ i $\\vec v=(1,4,-2)$.\nCalcula el producte escalar $\\vec u\\cdot\\vec v$ i el producte vectorial $\\vec u\\times\\vec v$.","font":"","passos":[["[mat]$\\vec u\\cdot\\vec v=u_1v_1+u_2v_2+u_3v_3$.[/mat] [calc]Escriu-ho en una sola línia. Els nombres negatius, entre parèntesis; el signe és [[menys]].[/calc]",0],["[calc]Prem [[exe]].[/calc] [mat]$\\vec u\\cdot\\vec v=-8$.[/mat]",0],["[mat]Al producte vectorial, cada component és un determinant 2×2. La primera és $u_2v_3-u_3v_2=-10$.[/mat] [calc]Escriu-la i prem [[exe]]: després d'un resultat, un número nou comença un càlcul nou.[/calc]",0],["[mat]La segona, $u_3v_1-u_1v_3=7$.[/mat]",0],["[mat]La tercera, $u_1v_2-u_2v_1=9$. Per tant, $\\vec u\\times\\vec v=(-10,\\,7,\\,9)$.[/mat]",0]]},{"id":"pau-alg-24j-q2","bloc":"pau-ag","titol":"(2024). Comprova la solució d'un sistema","enunciat":"Per a $k=0$, el sistema és $$\\begin{cases}4x+2y-z=4\\\\ x-y=3\\\\ 3x+3y=1\\end{cases}$$ i has obtingut la solució $$x=\\frac{5}{3},\\qquad y=-\\frac{4}{3},\\qquad z=0.$$ Comprova que la solució trobada és correcta amb la calculadora.","font":"PAU juny 2024, qüestió 2 a)","passos":[["[calc]Primera equació, $4x+2y-z$: escriu $4\\times\\frac{5}{3}+2\\times\\left(-\\frac{4}{3}\\right)-0$. Posa $y$ entre parèntesis; el signe negatiu és la tecla [[menys]] de sempre.[/calc]",0],["[calc]Prem [[exe]]: surt 4, que és el membre de la dreta. ✓[/calc]",0],["[calc]Segona equació, $x-y$ (amb $k=0$, el terme $kz$ no hi és): escriu $\\frac{5}{3}-\\left(-\\frac{4}{3}\\right)$. No cal esborrar res: en començar a escriure, el càlcul anterior desapareix.[/calc]",0],["[calc]Prem [[exe]]: surt 3, el membre de la dreta. ✓[/calc]",0],["[calc]Tercera equació, $3x+3y$: escriu $3\\times\\frac{5}{3}+3\\times\\left(-\\frac{4}{3}\\right)$.[/calc]",0],["[calc]Prem [[exe]]: surt 1, el membre de la dreta. ✓ Es compleixen les tres equacions: la solució és correcta.[/calc]",0]],"grup":"Àlgebra"},{"id":"pau-alg-24s-q2","bloc":"pau-ag","titol":"(2024). Un menor orlat amb la regla de Sarrus","enunciat":"Per a $m=1$, el rang de la matriu $A$ és 2. Per saber el rang de la matriu ampliada $A'$, calcula amb la regla de Sarrus el menor d'ordre 3 de les columnes de $x$, de $y$ i dels termes independents: $$A'=\\left(\\begin{array}{rrr|r}1&-3&1&-2\\\\1&1&2&3\\\\1&1&2&1\\end{array}\\right)\\qquad\\begin{vmatrix}1&-3&-2\\\\1&1&3\\\\1&1&1\\end{vmatrix}$$","font":"PAU setembre 2024, qüestió 2 a)","passos":[["[mat]El primer claudàtor de Sarrus són els tres productes amb signe +.[/mat] [calc]Escriu $1\\times 1\\times 1+(-3)\\times 3\\times 1+(-2)\\times 1\\times 1$, cada factor tal com és a la matriu. Els negatius, entre parèntesis i amb la tecla [[menys]].[/calc]",0],["[calc]Prem [[exe]]: el primer claudàtor val −10.[/calc]",0],["[calc]Ara resta-hi el segon claudàtor, el dels tres productes amb signe −: [[ans]] (el −10), [[menys]] i els tres productes entre parèntesis.[/calc] [mat]Sense aquest parèntesi, el − només afectaria el primer producte.[/mat]",0],["[calc]Prem [[exe]]: el menor val $-8\\neq 0$.[/calc] [mat]Per tant, el rang de la matriu $A'$ és 3 i, com que el de la matriu $A$ és 2, per a $m=1$ el sistema és incompatible.[/mat]",0]],"grup":"Àlgebra"},{"id":"pau-geo-25s-q4b","bloc":"pau-ag","titol":"(2025). Distància d'un punt a un pla","enunciat":"Considereu el pla $\\pi: 2x-y+z=5$ i el punt $P=(0,1,3)$.\nComproveu que la distància de $P$ a $\\pi$ és $\\frac{\\sqrt{6}}{2}$. $$d(P,\\pi)=\\frac{|2\\cdot 0-1+3-5|}{\\sqrt{2^2+(-1)^2+1^2}}$$","font":"PAU setembre 2025, exercici 4 B a)","passos":[["[mat]Primer, el numerador: substitueix $P$ a $2x-y+z-5$.[/mat] [calc]Escriu $2\\times 0-1+3-5$.[/calc]",0],["[calc]Prem [[exe]]: surt −3.[/calc] [mat]El valor absolut el fas tu: $|-3|=3$.[/mat]",0],["[calc]Ara la distància: la fracció [[frac]] amb el 3 a dalt; [[down]] i, a baix, l'arrel [[arrel]] de $2^2+(-1)^2+1^2$. El quadrat és [[x2]]. El −1, entre parèntesis: [[lpar]] [[menys]] 1 [[rpar]].[/calc]",0],["[calc]Prem [[exe]]: surt $\\frac{\\sqrt{6}}{2}$, el valor de l'enunciat. ✓ En mode {{E Mat/S Mat}} la calculadora racionalitza sola; en mode decimal sortiria 1.224744871 i no ho podries comparar.[/calc]",0]],"grup":"Geometria"},{"id":"pau-geo-25s-q4b-c","bloc":"pau-ag","titol":"(2025). El punt simètric respecte d'un pla","enunciat":"Considereu el pla $\\pi: 2x-y+z=5$ i el punt $P=(0,1,3)$.\n- Trobeu un pla $\\pi_2$ paral·lel a $\\pi$, que no passi per $P$, a una distància $\\frac{\\sqrt{6}}{2}$ de $\\pi$. Aquest pla passarà pel punt simètric $P'$ de $P$.\n- A més, sabem que la recta perpendicular a $\\pi$ per $P$, $(2\\lambda,\\,1-\\lambda,\\,3+\\lambda)$, talla el pla per a $\\lambda=\\frac{1}{2}$, al punt $M=\\left(1,\\frac{1}{2},\\frac{7}{2}\\right)$.","font":"PAU setembre 2025, exercici 4 B c)","passos":[["[mat]Primer, comprova que el punt $M$ és al pla: substitueix-lo a $2x-y+z$.[/mat] [calc]Escriu $2\\times 1-\\frac{1}{2}+\\frac{7}{2}$, amb [[frac]] per a les fraccions i [[right]] per sortir-ne.[/calc]",0],["[calc]Prem [[exe]]: surt 5, el terme independent del pla. ✓ El punt $M$ és el punt del pla $\\pi$ més proper a $P$.[/calc]",0],["[mat]El punt $M$ és el punt mitjà de $P$ i $P'$, així que $P'=2M-P$.[/mat] [calc]Les dues primeres coordenades són $2\\cdot 1-0=2$ i $2\\cdot\\frac{1}{2}-1=0$; la tercera, amb la calculadora: $2\\times\\frac{7}{2}-3=4$.[/calc] [mat]Per tant, $P'=(2,\\,0,\\,4)$.[/mat]",0],["[mat]Comprova que el punt $P'$ és a una distància $\\frac{\\sqrt{6}}{2}$ del pla $\\pi$. El numerador de la fórmula: substitueix $P'$ a $2x-y+z-5$.[/mat] [calc]Surt 3.[/calc]",0],["[calc]Ara la fracció: el 3 a dalt i, a baix, l'arrel de $2^2+(-1)^2+1^2$, com a l'apartat a).[/calc]",0],["[calc]Prem [[exe]]: $\\frac{\\sqrt{6}}{2}$. ✓ El punt $P'$ és a la mateixa distància del pla que $P$, a l'altra banda.[/calc] [calc](Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 1.224744871.)[/calc]",0],["[mat]El pla $\\pi_2$ és $2x-y+z=E$ amb $E=2\\cdot 2-0+4=8$: $\\pi_2: 2x-y+z=8$.[/mat]",0]],"grup":"Geometria"},{"id":"pau-geo-26j2-q4b","bloc":"pau-ag","titol":"(2026). Distàncies en centímetres","enunciat":"Un braç robòtic desplaça un sensor en línia recta des del punt $A=(1,2,3)$ fins al punt $B=(5,3,7)$, per damunt del pla $\\pi$, d'equació general $x-y-5=0$.\n[a]4.1. Quina distància ha recorregut el sensor?\n[/a] [b]4.2. En acabar el moviment, a quina distància del pla es troba el sensor?[/b]\nExpressa el resultat en centímetres.","font":"PAU juny 2026 (sèrie 5), exercici 4 B","passos":[["[mat]4.1. El vector $\\vec{AB}=(4,1,4)$, i la distància és el seu mòdul.[/mat] [calc]Escriu [[arrel]] i, a dins, $4^2+1^2+4^2$: el quadrat és [[x2]].[/calc]",0],["[calc]Prem [[exe]]: $\\sqrt{33}$, el valor exacte, perquè la calculadora és en mode {{E Mat/S Mat}}. En mode {{E Mat/S Decimal}} sortiria directament 5.744562647.[/calc]",0],["[calc]Com que és una longitud en centímetres, dona'n també el decimal: [[format]], {{Decimal}} amb [[down]] i [[ok]].[/calc] [mat]El sensor ha recorregut $\\sqrt{33}\\approx 5{,}74$ cm.[/mat]",0],["[mat]4.2. La distància del punt $B$ al pla. Primer, el numerador: substitueix $B$ a $x-y-5$, és a dir, $5-3-5$.[/mat] [calc]Surt −3; el valor absolut el fas tu: 3.[/calc]",0],["[calc]Ara la fracció: [[frac]] amb el 3 a dalt i, a baix, l'arrel de $1^2+(-1)^2+0^2$. El −1, entre parèntesis.[/calc]",0],["[calc]Prem [[exe]]: $\\frac{3\\sqrt{2}}{2}$. La calculadora ja racionalitza.[/calc]",0],["[calc]En decimal, amb [[format]] i {{Decimal}}: el sensor és a $\\frac{3\\sqrt{2}}{2}\\approx 2{,}12$ cm del pla.[/calc]",0]],"grup":"Geometria"},{"id":"pau-ana-23s-q4","bloc":"pau-ap","titol":"(2023). Bolzano amb la e","enunciat":"Sigui $f(x)=-3x+e^{2x}-1$.\nJustifiqueu que l'equació $f(x)=2$ té una solució a l'interval $(-1,\\,0)$.","font":"PAU setembre 2023, qüestió 4 a)","passos":[["[calc]Defineix $f$: [[funcio]], dos cops [[down]] fins a {{Definir f(x)}} i [[ok]]. La $e$ és [[shift]] [[8]]; l'exponent, amb [[pot]]: escriu $2x$ i surt de l'exponent amb [[right]] abans del $-1$.[/calc]",0],["[calc]Prem [[exe]]: $f$ queda desada i tornes a la pantalla de càlcul.[/calc]",0],["[calc]Calcula $f(-1)$: [[funcio]], {{f(x)}} amb [[ok]], $-1$, [[rpar]] i [[exe]].[/calc] [mat]$f(-1)\\approx 2{,}135>2$.[/mat]",0],["[mat]$f(0)=0<2$. La funció $g(x)=f(x)-2$ és contínua, $g(-1)>0$ i $g(0)<0$: pel teorema de Bolzano, hi ha un $c\\in(-1,\\,0)$ amb $f(c)=2$. ✓[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i calcula $f(-1)$ sortint de l'exponent amb [[right]] abans de la $x$: la calculadora fa $e^2\\cdot(-1)$ en lloc d'$e^{-2}$.[/calc] [mat]No pot ser: $e^{-2}$ és positiu i petit, i $f(-1)$ ha de ser una mica més gran que 2.[/mat]",1]],"grup":"Anàlisi","tancament":"[mat]Recorda: tot l'exponent, $2x$, ha d'anar a l'exponent: $e^{2x}$. Així, $f(-1)\\approx 2{,}135>2$ i $f(0)=0<2$.[/mat]"},{"id":"pau-ana-24i-q1","bloc":"pau-ap","titol":"(2024). Bolzano amb la calculadora","enunciat":"Considereu $f(x)=-2+10(x-1)\\ln x$, per a $x>0$.\nComproveu que $f$ té una arrel a l'interval $[1;\\,1{,}5]$ i busqueu un interval d'una dècima de longitud que també la contingui.","font":"PAU juny 2024 (incidències), qüestió 1 a)","passos":[["[calc]Hauràs de calcular $f$ en diversos punts: defineix-la un sol cop. Prem [[funcio]] (FUNCTION).[/calc]",0],["[calc]Baixa fins a {{Definir f(x)}} i prem [[ok]].[/calc]",0],["[calc]Escriu $-2+10(x-1)\\ln(x)$. La $x$ és la tecla [[x]], i ln és [[shift]] [[logab]].[/calc]",0],["[calc]Prem [[exe]]: $f$ queda desada i tornes a la pantalla de càlcul.[/calc]",0],["[calc]Calcula $f(1)$: [[funcio]], {{f(x)}} amb [[ok]] (escriu «f(»), l'1 i tanca el parèntesi.[/calc]",0],["[calc]Prem [[exe]]: $f(1)=-2<0$.[/calc]",0],["[calc]Ara $f(1{,}5)$, igual.[/calc]",0],["[mat]$f(1{,}5)\\approx 0{,}0273>0$. Com que $f$ és contínua a $[1;\\,1{,}5]$ i canvia de signe, pel teorema de Bolzano hi ha una arrel. ✓[/mat]",0],["[mat]$f(1{,}5)$ és molt a prop de 0: l'arrel deu ser a prop d'1,5. Prova $f(1{,}4)$.[/mat]",0],["[mat]$f(1{,}4)\\approx -0{,}654<0$: hi ha canvi de signe a $[1{,}4;\\,1{,}5]$, un interval d'una dècima. ✓[/mat]",0]],"grup":"Anàlisi"},{"id":"pau-ana-25i-q4a","bloc":"pau-ap","titol":"(2025). Una arrel cúbica en una optimització","enunciat":"Una ampolla de perfum té una part cilíndrica de $100\\,\\text{cm}^3$, de radi $r$ i altura $h=\\frac{100}{\\pi r^2}$.\nLa seva superfície total és $S(r)=3\\pi r^2+\\frac{200}{r}$.\n\nHas calculat $S'(r)$, i la solució de l'equació $S'(r)=0$ és $r^3=\\frac{100}{3\\pi}$.\n\nCalcula les dimensions de l'ampolla i la superfície mínima.","font":"PAU juny 2025 (incidències), exercici 4 A b)","passos":[["[mat]El radi és $r=\\sqrt[3]{\\frac{100}{3\\pi}}$.[/mat] [calc]Prem [[shift]] [[arrel]] (arrel d'índex n), escriu l'índex 3 i, amb [[right]], passa al radicand: la fracció $\\frac{100}{3\\pi}$ amb [[frac]] (π és [[shift]] [[7]]).[/calc]",0],["[calc]És una longitud: demana el decimal amb [[shift]] [[exe]] (≈). El radi és $r\\approx 2{,}20$ cm, i la calculadora el desa a [[ans]] amb tots els decimals.[/calc]",0],["[calc]L'altura, $h=\\frac{100}{\\pi r^2}$, sense copiar el radi: [[frac]], el 100, [[down]], π, [[ans]] i [[x2]].[/calc]",0],["[calc]Amb [[shift]] [[exe]]: l'altura és $h\\approx 6{,}59$ cm.[/calc]",0],["[calc]Ara [[ans]] ja és l'altura: per a $S(r)$, escriu el radi amb quatre decimals, 2.1974. Amb [[shift]] [[exe]], la superfície mínima és $S\\approx 136{,}52\\,\\text{cm}^2$.[/calc]",0]],"grup":"Anàlisi"},{"id":"pau-ana-25j-q1","bloc":"pau-ap","titol":"(2025). Intueix els límits amb f(x)","enunciat":"Considereu la funció $f(x)=\\dfrac{x^2-2x}{x-1}$.\n\nAbans de calcular-ne les asímptotes, fes-te una idea dels límits amb la calculadora:\n- (a.verticals) Assigna valors de $x$ molt propers a 1, per la dreta i per l'esquerra.\n- (a.horitzontals) Assigna valors de $x$ molt grans, tant positius com negatius.","font":"PAU juny 2025, exercici 1 a)","passos":[["[calc]Defineix $f$ un sol cop: [[funcio]], dos cops [[down]] fins a {{Definir f(x)}} i [[ok]]. Escriu la fracció amb [[frac]]: a dalt $x^2-2x$, [[down]] i, a baix, $x-1$.[/calc]",0],["[calc]Prem [[exe]]: $f$ queda desada i tornes a la pantalla de càlcul.[/calc]",0],["[mat]Valors una mica més grans que 1: $f(1{,}1)$.[/mat] [calc][[funcio]], {{f(x)}} amb [[ok]], 1.1 i [[rpar]]. Per veure com creix, el vols en decimal: [[shift]] [[exe]]. Surt −9.9.[/calc]",0],["[mat]$f(1{,}01)=-99{,}99$: com més a prop d'1, més negatiu. Per tant, $\\lim\\limits_{x\\to 1^+}f(x)=-\\infty$.[/mat]",0],["[mat]Ara per l'esquerra, amb valors una mica més petits que 1: $f(0{,}9)=9{,}9$.[/mat]",0],["[mat]$f(0{,}99)=99{,}99$, així que $\\lim\\limits_{x\\to 1^-}f(x)=+\\infty$. Els dos límits laterals són infinits: la recta $x=1$ és una asímptota vertical.[/mat]",0],["[mat]Ara valors de $x$ molt grans: $f(200)\\approx 198{,}99$.[/mat]",0],["[mat]$f(201)=199{,}995$: $\\lim\\limits_{x\\to+\\infty}f(x)=+\\infty$, i no hi ha asímptota horitzontal. A més, quan $x$ augmenta 1, $f(x)$ també augmenta gairebé 1: pot haver-hi una asímptota obliqua de pendent 1.[/mat]",0],["[mat]I valors molt negatius: $f(-200)\\approx -200{,}995$.[/mat]",0],["[mat]$f(-201)\\approx -201{,}995$: $\\lim\\limits_{x\\to-\\infty}f(x)=-\\infty$. Ara ja pots calcular el pendent $m$ i l'ordenada a l'origen $n$ de l'asímptota obliqua: surt $y=x-1$. Fixa't que $f(200)\\approx 200-1$.[/mat]",0]],"grup":"Anàlisi"},{"id":"pau-ana-25s-q4a","bloc":"pau-ap","titol":"(2025). Un vitrall en radians","enunciat":"Un vitrall de la Sagrada Família està limitat per:\n- les gràfiques de $y=3\\sin\\frac{x}{4}$ i $y=3\\cos\\frac{x}{4}$\n- des de l'eix d'ordenades fins al primer punt de tall $C$, que té $x=\\pi$.\n[a]a) Calculeu les coordenades del punt $C$.\n[/a] [b]b) Calculeu el preu del vitrall, a 750 € el m²\n\nNota: l'àrea és $\\left[12\\sin\\frac{x}{4}+12\\cos\\frac{x}{4}\\right]_0^{\\pi}$.[/b]","font":"PAU setembre 2025, exercici 4 A","passos":[["[calc]El sinus i el cosinus són d'una $x$ en metres, no d'un angle en graus: posa la calculadora en radians. [[settings]], [[ok]], [[down]] ({{Unidad angular}}), [[ok]], [[down]] ({{Radián}}), [[ok]] i [[ac]]. A la barra, R.[/calc]",0],["[mat]a) La segona coordenada del punt $C$ és $3\\sin\\frac{\\pi}{4}$.[/mat] [calc]Escriu el 3, [[sen]] i la fracció $\\frac{\\pi}{4}$ amb [[frac]] (π és [[shift]] [[7]]); surt de la fracció amb [[right]] i tanca amb [[rpar]].[/calc]",0],["[calc]Prem [[exe]]: $C=\\left(\\pi,\\frac{3\\sqrt{2}}{2}\\right)$.[/calc] [mat]I $B=(0,3)$, perquè $3\\cos 0=3$.[/mat] [calc]Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 2.121320344.[/calc]",0],["[mat]b) Regla de Barrow: $F(\\pi)-F(0)$. Com que $\\sin 0=0$ i $\\cos 0=1$, $F(0)=12$.[/mat] [calc]Escriu $12\\sin\\frac{\\pi}{4}+12\\cos\\frac{\\pi}{4}-12$.[/calc]",0],["[calc]Per al preu cal un decimal: prem [[shift]] [[exe]] (≈).[/calc] [mat]L'àrea és $12(\\sqrt{2}-1)\\approx 4{,}97\\,\\text{m}^2$.[/mat]",0],["[calc]Ara [[per]] 750: després d'un resultat, el càlcul comença amb Ans, sense arrodonir. Amb [[shift]] [[exe]], el preu del vitrall és de $3.727{,}92$ €.[/calc]",0]],"grup":"Anàlisi"},{"id":"pau-ana-26j-q4a","bloc":"pau-ap","titol":"(2026). Dues baranes: π, ≈ i Ans","enunciat":"Dues baranes fan 10 m en total: la d'un espai circular i la d'un espai quadrat.\nSi la barana del cercle fa $x$ metres, la suma de les dues superfícies és $S(x)=\\frac{x^2}{4\\pi}+\\left(\\frac{10-x}{4}\\right)^2$.\nAmb la derivada has trobat $x=\\frac{10\\pi}{\\pi+4}$.\n\nCalcula la longitud de cada barana i la superfície mínima.","font":"PAU juny 2026, exercici 4 A","passos":[["[calc]Escriu $x$ amb [[frac]]: a dalt $10\\pi$ (π és [[shift]] [[7]]), [[down]] i, a baix, $\\pi+4$.[/calc]",0],["[calc]És una longitud: demana el decimal amb [[shift]] [[exe]] (≈).[/calc] [mat]La barana del cercle fa 4,40 m.[/mat] [calc]La calculadora la desa a [[ans]] amb tots els decimals.[/calc]",0],["[calc]La del quadrat és $10-\\mathrm{Ans}$: escriu 10, [[menys]], [[ans]] i prem [[exe]].[/calc] [mat]La barana del quadrat fa 5,60 m.[/mat]",0],["[mat]Ara [[ans]] és la barana del quadrat, i la del cercle és $10-\\mathrm{Ans}$.[/mat] [calc]Escriu $S$ amb [[ans]], sense copiar cap decimal: $\\frac{(10-\\mathrm{Ans})^2}{4\\pi}+\\left(\\frac{\\mathrm{Ans}}{4}\\right)^2$.[/calc]",0],["[calc]Prem [[shift]] [[exe]] (≈).[/calc] [mat]La superfície mínima és $S\\approx 3{,}50\\,\\text{m}^2$.[/mat]",0]],"grup":"Anàlisi"},{"id":"pau-pro-26j2-q3","bloc":"pau-ap","titol":"(2026). Màxim i mínim absoluts en un interval","enunciat":"L'Alba dedica cada setmana $x$ hores a llegir, entre 1 i 6, i $y$ hores a fer esport, amb $y=7-x+\\ln(2x-1)$.\nAmb la derivada has trobat que l'únic punt crític és $x=1{,}5$.\n\nCalcula el màxim i el mínim d'hores d'esport.","font":"PAU juny 2026 (sèrie 5), exercici 3.3","passos":[["[calc]Calcularàs $y$ en tres punts: defineix-la un sol cop com a $f(x)$. [[funcio]], dos cops [[down]] fins a {{Definir f(x)}} i [[ok]].[/calc]",0],["[calc]Escriu $7-x+\\ln(2x-1)$. La $x$ és la tecla [[x]], i ln és [[shift]] [[logab]].[/calc]",0],["[calc]Prem [[exe]]: $f$ queda desada i tornes a la pantalla de càlcul.[/calc]",0],["[mat]En un interval tancat, el màxim i el mínim absoluts són al punt crític o als extrems de l'interval: cal $f(1)$, $f(1{,}5)$ i $f(6)$.[/mat] [calc][[funcio]], {{f(x)}} amb [[ok]], l'1, [[rpar]] i [[exe]]: $f(1)=6$.[/calc]",0],["[calc]Ara $f(1{,}5)$, igual.[/calc] [mat]$f(1{,}5)\\approx 6{,}193$.[/mat]",0],["[mat]$f(6)\\approx 3{,}398$. El màxim és de 6,19 h d'esport (amb $x=1{,}5$), i el mínim, de 3,40 h (amb $x=6$).[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i calcula $y(6)$ escrivint ln amb la tecla log ([[shift]] [[x2]]): surt 2.041392685 i no 3.397895273.[/calc] [mat]log és el logaritme en base 10, no el neperià.[/mat]",1]],"grup":"Anàlisi","tancament":"[mat]Recorda: $\\ln$ és el logaritme neperià, i log és el logaritme en base 10. El màxim és de 6,19 h i el mínim, de 3,40 h.[/mat]"},{"id":"pau-ana-26s-q1","bloc":"pau-ap","titol":"(2026). Creixement i extrems amb f(x) i g(x)","enunciat":"Considereu la funció $f(x)=\\dfrac{5x}{x^2+1}$.\nHas trobat la derivada, $f'(x)=\\dfrac{5(1-x^2)}{(x^2+1)^2}$, que s'anul·la a $x=-1$ i a $x=1$.\n\nEstudia el creixement i els extrems relatius de $f$.","font":"PAU setembre 2026, exercici 1.1","passos":[["[calc]La funció, sempre a $f(x)$: [[funcio]], dos cops [[down]] fins a {{Definir f(x)}}, [[ok]] i la fracció amb [[frac]].[/calc]",0],["[calc]Prem [[exe]]: $f$ queda desada.[/calc]",0],["[calc]La derivada, sempre a $g(x)$: [[funcio]], tres cops [[down]] fins a {{Definir g(x)}} i [[ok]]. Escriu la fracció.[/calc]",0],["[calc]Prem [[exe]]: $g$ queda desada.[/calc]",0],["[mat]Per saber el signe de $f'$ a $(-\\infty,-1)$, n'hi ha prou amb un punt: $g(-2)=-\\frac{3}{5}<0$, i $f$ decreix.[/mat] [calc]$g(x)$ és la segona del menú: [[funcio]], [[down]] i [[ok]]. Surt una fracció perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria −0.6.[/calc]",0],["[mat]$g(0)=5>0$: $f$ creix a $(-1,\\,1)$.[/mat]",0],["[mat]$g(2)=-\\frac{3}{5}<0$: $f$ decreix a $(1,+\\infty)$.[/mat]",0],["[mat]A $x=-1$, $f$ passa de decréixer a créixer: hi ha un mínim relatiu a $\\left(-1,-\\frac{5}{2}\\right)$.[/mat]",0],["[mat]A $x=1$, passa de créixer a decréixer: hi ha un màxim relatiu a $\\left(1,\\frac{5}{2}\\right)$.[/mat]",0]],"grup":"Anàlisi"},{"id":"pau-pro-24i-q4","bloc":"pau-ap","titol":"(2024). Probabilitat total, Bayes i binomial","enunciat":"La Rut tira un dau.\n- si surt 1, 2, 3 o 4, resol el problema ella mateixa i l'encerta el 75 % de les vegades\n- si surt 5 o 6, el copia d'Internet i l'encerta el 40 %.\nCalcula:\n[a]a) Probabilitat que la solució sigui correcta.\n[/a] [b]b) Probabilitat que l'hagi resolt ella si és correcta.\n[/b] [c]c) Probabilitat que, de 5 problemes, almenys 4 siguin correctes.[/c]","font":"PAU juny 2024 (incidències), qüestió 4","passos":[["[mat]a) Probabilitat total: $P(C)=\\frac{4}{6}\\cdot 0{,}75+\\frac{2}{6}\\cdot 0{,}4$.[/mat] [calc]Escriu-ho tal qual, amb fraccions i decimals.[/calc]",0],["[calc]Prem [[exe]]: $P(C)=\\frac{19}{30}$. La calculadora dona la fracció exacta, encara que hagis escrit decimals, perquè és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 0.6333333333.[/calc]",0],["[mat]b) Bayes: $P(R\\mid C)=\\dfrac{\\frac{4}{6}\\cdot 0{,}75}{P(C)}$.[/mat] [calc]Escriu $\\left(\\frac{4}{6}\\times 0.75\\right)\\div\\frac{19}{30}$.[/calc]",0],["[calc]Prem [[exe]]: $P(R\\mid C)=\\frac{15}{19}$.[/calc]",0],["[mat]c) Binomial, amb $n=5$ i $p=\\frac{19}{30}$: $P(X\\ge 4)=5\\,p^4(1-p)+p^5$, perquè $\\binom{5}{4}=5$ i $1-p=\\frac{11}{30}$.[/mat] [calc]La potència és [[pot]]; amb [[right]] surts de l'exponent.[/calc]",0],["[calc]Prem [[exe]]: $P(X\\ge 4)\\approx 0{,}3969$. La fracció exacta tindria massa xifres, i la calculadora la dona en decimal.[/calc]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i, si arrodoneixes $p\\approx 0{,}63$, surt 0.3906734328 i no 0.3968623045: ja falla la segona xifra decimal. Treballa amb $\\frac{19}{30}$.[/calc]",1]],"grup":"Probabilitat","tancament":"[mat]Recorda: treballa amb el valor exacte, $p=\\frac{19}{30}$, i no amb un decimal arrodonit: $P(X\\ge 4)\\approx 0{,}3969$.[/mat]"},{"id":"pau-pro-24s-q4","bloc":"pau-ap","titol":"(2024). Binomial, probabilitat total i Bayes","enunciat":"El 20 % dels habitants d'una regió pateix arrítmia. Un monitor Holter la detecta en el 95 % dels qui la pateixen, i dona falsos positius en el 0,5 % dels qui no en pateixen. \nCalcula el següent:\n[a]a) Si prenem 4 persones a l'atzar, probabilitat que almenys una pateixi arrítmia.\n[/a] [b]b) Probabilitat total d'obtenir un diagnòstic positiu.\n[/b] [c]c) Si el diagnòstic és negatiu, probabilitat que la persona pateixi arrítmia.[/c]","font":"PAU setembre 2024, qüestió 4","passos":[["[mat]a) El nombre de persones amb arrítmia segueix una binomial $B(4;\\,0{,}2)$. «Almenys una» és l'esdeveniment contrari de «cap»: $1-0{,}8^4$.[/mat] [calc]L'exponent és [[pot]].[/calc]",0],["[calc]Prem [[shift]] [[exe]]: 0.5904. Amb [[exe]] sortiria la fracció $\\frac{369}{625}$, perquè la calculadora és en mode {{E Mat/S Mat}} i has escrit decimals exactes.[/calc]",0],["[mat]b) Probabilitat total. Hi ha dues maneres de donar positiu: amb arrítmia ($0{,}2$ i $0{,}95$) o sense ($0{,}8$ i $0{,}005$).[/mat] [calc]Escriu $0.95\\times 0.2+0.005\\times 0.8$.[/calc]",0],["[calc]Amb [[shift]] [[exe]]: la probabilitat d'un diagnòstic positiu és 0,194.[/calc]",0],["[mat]c) Bayes: tenir arrítmia i donar negatiu, $0{,}2\\cdot(1-0{,}95)$, dividit per la probabilitat d'un negatiu, $1-0{,}194$.[/mat] [calc]El 0.194 és a [[ans]]: no cal copiar-lo. El denominador, entre parèntesis.[/calc]",0],["[calc]Prem [[shift]] [[exe]]: $\\approx 0{,}0124$.[/calc] [mat]Només l'1,24 % de les persones que donen negatiu pateixen arrítmia.[/mat]",0]],"grup":"Probabilitat"},{"id":"pau-pro-25j-q3","bloc":"pau-ap","titol":"(2025). Probabilitat total i un màxim","enunciat":"El 60 % de les peces d'una empresa són de ferro i la resta, d'acer. El 95 % de les peces de ferro no tenen cap defecte, i el 3 % de les d'acer són defectuoses.\nCalcula:\n[a]a) Probabilitat que una peça a l'atzar sigui defectuosa.\n[/a] [c]b) Valor màxim de la funció $f(p)=5(p^4-p^5)$ per a $p\\ge 0$ (nota: amb la derivada has trobat que el màxim és a $p=\\frac{4}{5}$).[/c]","font":"PAU juny 2025, exercici 3","passos":[["[mat]a) De les peces de ferro, en són defectuoses el 5 % (100 − 95).[/mat] [calc]Probabilitat total; escriu $0.05\\times 0.6+0.03\\times 0.4$.[/calc]",0],["[calc]Prem [[shift]] [[exe]]: 0.042, és a dir, un 4,2 % de les peces són defectuoses.[/calc]",0],["[mat]c) El valor màxim és $f\\left(\\frac{4}{5}\\right)$.[/mat] [calc]Com que $\\frac{4}{5}=0{,}8$, escriu $5\\times(0.8^4-0.8^5)$. Després de cada exponent, surt-ne amb [[right]].[/calc]",0],["[calc]Prem [[exe]]: $\\frac{256}{625}$, el valor exacte del màxim, perquè la calculadora és en mode {{E Mat/S Mat}}. En mode {{E Mat/S Decimal}} sortiria 0.4096, és a dir, $\\approx 0{,}41$.[/calc]",0]],"grup":"Probabilitat"},{"id":"abans-examen","bloc":"examen","titol":"Comprova la calculadora en 30 segons","enunciat":"Abans de començar l'examen, comprova que la calculadora està ben configurada.","font":"","passos":[["[calc]Calcula $1\\div 2$: ha de sortir $\\frac{1}{2}$, perquè la calculadora ha de ser en mode {{E Mat/S Mat}}, el que dona resultats exactes. Si surt 0.5, és en {{E Mat/S Decimal}}: arregla-ho com a la fitxa «Em surt 0.5 en lloc d'1/2».[/calc]",0],["[calc]Mira la lletra de la unitat dels angles: D (graus) o R (radians).[/calc] [mat]Si l'examen té funcions trigonomètriques de $x$, ha de ser R; per a angles en graus, D.[/mat]",0],["[calc]Prem [[ac]]. A la barra no hi ha d'haver FIX ni SCI (si n'hi ha, fitxa «Tot em surt arrodonit») ni ✔ (si n'hi és, [[tools]] i {{Verificar OFF}}).[/calc]",0],["[calc]Si els menús no surten en l'idioma que esperes: [[settings]], {{Config sistema}} i {{Idioma}}. Tria també el mateix idioma a dalt d'aquesta pàgina («Calculadora en»): així les fitxes et mostraran els mateixos menús.[/calc]",0],["[calc]Prem [[ac]] per tornar a la pantalla de càlcul. Ja pots començar l'examen.[/calc]",0]],"araTu":{"enunciat":"Una sola operació ho comprova gairebé tot: calcula $\\cos 60$. Què ha de sortir per a un examen amb angles en graus?"}},{"id":"indicadors","bloc":"simbols","titol":"Què vol dir cada símbol de la pantalla?","enunciat":"A la pantalla, a més dels nombres, hi surten símbols: a la barra de dalt, a la línia de l'expressió i a la del resultat.","font":"","passos":[["[calc]Aquesta icona vol dir que escrius en format matemàtic: les fraccions i les arrels es veuen com al llibre. La calculadora està configurada per donar resultats exactes ({{E Mat/S Mat}}): per això el resultat surt $\\frac{\\sqrt{2}}{2}$ i no 0.7071067812.[/calc]",0],["[calc]La D amb fons fosc vol dir que els angles van en graus. És la que faràs servir quasi sempre.[/calc]",0],["[calc]El triangle ▲ vol dir que hi ha càlculs anteriors: amb [[up]] els tornes a veure.[/calc]",0],["[calc]Prem [[shift]]: a la barra surt una S. La tecla següent farà el que hi ha escrit a sobre seu (per exemple, [[shift]] [[7]] escriu π). La S desapareix sola.[/calc]",0],["[calc]Si en lloc de la D hi ha una R, els angles van en radians. Si hi ha una G, van en graus centesimals, una unitat que no faràs servir.[/calc]",0],["[calc]FIX vol dir que tots els resultats surten arrodonits a un nombre fix de decimals: aquí, a 2, i per això $1\\div 6$ surt 0.17.[/calc]",0],["[calc]SCI vol dir que tots els resultats surten en notació científica, amb un nombre fix de xifres: aquí, 3, i per això $1\\div 6$ surt $1.67\\times 10^{-1}$.[/calc]",0],["[calc]El ✔ vol dir que {{Verificar}} està activat: la calculadora no calcula, sinó que diu si una igualtat és certa o falsa.[/calc]",0],["[calc]Els triangles ◀ i ▶ a les vores de la línia volen dir que l'expressió no hi cap: n'hi ha més per aquest costat. Amb [[left]] i [[right]] t'hi mous.[/calc]",0],["[calc]Un «×10» amb un nombre petit a dalt vol dir que el resultat és en notació científica: és massa llarg per a la pantalla.[/calc] [mat]$2.592\\times 10^{13}$ és $2{,}592\\cdot 10^{13}$.[/mat]",0]],"provaTu":{"enunciat":"A la barra de dalt de la teva calculadora hi ha \"R\" i \"FIX\". Què vol dir cada cosa?","solucio":"La \"R\" vol dir que els angles van en radians.\n\"FIX\" vol dir que tots els resultats surten arrodonits a un nombre fix de decimals."}},{"id":"taula-bolzano","bloc":"pau","titol":"Taula de valors: Bolzano d'una passada","enunciat":"Considereu $f(x)=-2+10(x-1)\\ln x$, per a $x>0$.\nComproveu que $f$ té una arrel a l'interval $[1;\\,1{,}5]$ i busqueu un interval d'una dècima de longitud que la contingui, tot amb una sola taula de valors.","font":"PAU juny 2024 (incidències), qüestió 1 a)","passos":[["[calc]Prem [[home]]: surten les aplicacions de la calculadora.[/calc]",0],["[calc]Tria {{Tabla}} amb dues vegades [[right]] i prem [[ok]]: surt la taula, encara buida.[/calc]",0],["[calc]Defineix $f$: [[funcio]], dos cops [[down]] fins a {{Definir f(x)}} i [[ok]]. Escriu $-2+10(x-1)\\ln(x)$; ln és [[shift]] [[logab]].[/calc]",0],["[calc]Prem [[exe]]: $f$ queda desada i tornes a la taula.[/calc]",0],["[calc][[tools]] obre el menú de la taula: baixa fins a {{Rango tabla}} i prem [[ok]].[/calc]",0],["[mat]L'interval és $[1;\\,1{,}5]$, i les dècimes són els punts que t'interessen.[/mat] [calc]{{Inic.}} 1, {{Final}} 1.5 i {{Paso}} 0.1, cada un amb [[exe]]. A {{Ejecutar}}, [[exe]] una altra vegada: surt la taula.[/calc]",0],["[calc]Passa a la columna de $f$ amb [[right]]: a baix hi ha el valor sencer.[/calc] [mat]$f(1)=-2<0$.[/mat]",0],["[calc]Baixa fins a l'última fila, $x=1{,}5$.[/calc] [mat]$f(1{,}5)\\approx 0{,}0273>0$. Com que $f$ és contínua a $[1;\\,1{,}5]$ i canvia de signe, pel teorema de Bolzano hi ha una arrel. ✓[/mat]",0],["[mat]Una fila amunt, $f(1{,}4)\\approx -0{,}654<0$: hi ha canvi de signe a $[1{,}4;\\,1{,}5]$, un interval d'una dècima. ✓ Tot surt d'una sola taula.[/mat]",0]]},{"id":"eso-corregeix","bloc":"eso-inici","titol":"T'has equivocat en teclejar: com corregir-ho","enunciat":"Vols calcular \"$26\\cdot 4$\", però en teclejar t'equivoques totalment i escrius \"25 × 44\". T'expliquem com corregir-ho.","font":"","passos":[["[calc]Això és el que has escrit: 25 [[per]] 44. El cursor és al final.[/calc]",0],["[calc]Prem [[del]]: esborra el que hi ha just abans del cursor, el 4 de més. ([[ac]] ho esborraria tot.)[/calc]",0],["[calc]Ara el 5 ha de ser un 6. Prem [[left]] dues vegades: el cursor es mou fins just després del 5.[/calc]",0],["[calc]Prem [[del]] per esborrar el 5 i escriu el 6: s'afegeix on és el cursor.[/calc]",0],["[calc]Prem [[exe]]: obtens 104.[/calc] [mat]$26\\cdot 4=104$.[/mat]",0]]},{"id":"eso-fraccio-decimal","bloc":"eso-pantalla","titol":"Em surt una fracció: vull el decimal","enunciat":"Calcula $7\\div 4$ i dona el resultat:\n- en forma de fracció\n- en forma decimal.","font":"","passos":[["[calc]Escriu 7 [[entre]] 4.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $\\frac{7}{4}$. Surt en fracció perquè la calculadora està configurada per donar resultats exactes; si estigués configurada per donar decimals, sortiria 1.75.[/calc] [mat]Una divisió és una fracció: $7\\div 4=\\frac{7}{4}$.[/mat]",0],["[calc]Per tenir-lo en decimal, prem [[shift]] i [[exe]] (a sobre d'EXE hi ha ≈): obtens 1.75.[/calc] [mat]La resposta correcta és $\\frac{7}{4}=1{,}75$.[/mat]",0]],"provaTu":{"enunciat":"Calcula $9\\div 8$ i dona el resultat:\n- en forma de fracció\n- en forma decimal.","solucio":"[mat]$9\\div 8=\\frac{9}{8}=1{,}125$.[/mat]"}},{"id":"eso-arrodonir","bloc":"eso-pantalla","titol":"Arrodonir el que surt a la pantalla","enunciat":"Calcula $2\\div 3$ i arrodoneix el resultat a les centèsimes.","font":"","passos":[["[calc]Escriu 2 [[entre]] 3.[/calc]",0],["[calc]Prem [[shift]] [[exe]] (≈): obtens el resultat en decimal, que és 0.6666666667. La calculadora ja ha arrodonit l'última xifra (el 7).[/calc]",0],["[mat]Per arrodonir a les centèsimes, mira la tercera xifra decimal: és un 6, més gran o igual que 5, i per això la segona puja d'un: 0,67.[/mat] [mat]La resposta correcta és $2\\div 3\\approx 0{,}67$.[/mat]",0]],"provaTu":{"enunciat":"Calcula $5\\div 7$ i arrodoneix el resultat a les centèsimes.","solucio":"[mat]$5\\div 7=0{,}714285\\ldots\\approx 0{,}71$.[/mat]"}},{"id":"ll4-1-exemple2","bloc":"eso-pantalla","titol":"L'arrel de 50: entre quins enters és?","enunciat":"Sense calculadora, digues entre quins dos nombres enters es troba $\\sqrt{50}$.\nDesprés, calcula-la amb la calculadora.","font":"Llibre 4t ESO, unitat 1, exemple 2","passos":[["[mat]Abans de calcular, estima: $7^2=49$ i $8^2=64$. Com que 50 és una mica més que 49, $\\sqrt{50}$ és entre 7 i 8, una mica més que 7.[/mat]",0],["[calc]Prem [[arrel]] i escriu a dins 50.[/calc]",0],["[calc]Prem [[exe]]: obtens $5\\sqrt{2}$. Surt així perquè la calculadora està configurada per donar resultats exactes; si estigués configurada per donar decimals, sortiria 7.071067812.[/calc] [mat]És el mateix nombre: $\\sqrt{50}=\\sqrt{25\\cdot 2}=5\\sqrt{2}$.[/mat]",0],["[calc]Per tenir-lo en decimal, prem [[shift]] i [[exe]] (≈): obtens 7.071067812.[/calc] [mat]La resposta correcta és que $\\sqrt{50}$ és entre 7 i 8: val 7,07 aproximadament, com havíem estimat.[/mat]",0]],"provaTu":{"enunciat":"Sense calculadora, digues entre quins dos nombres enters es troba $\\sqrt{90}$. Després, calcula-la amb la calculadora.","solucio":"[mat]$9^2=81$ i $10^2=100$: entre 9 i 10. $\\sqrt{90}=3\\sqrt{10}\\approx 9{,}49$.[/mat]"}},{"id":"eso-notacio-cientifica","bloc":"eso-pantalla","titol":"Nombres molt grans: notació científica","enunciat":"La llum recorre $3\\cdot 10^8$ metres cada segon.\n• Un dia té 86 400 segons.\nQuants metres recorre la llum en un dia?","font":"","passos":[["[mat]$3\\cdot 10^8$ és un nombre en notació científica.[/mat] [calc]Escriu 3 i prem [[exp]]: surt «×10» amb el lloc de l'exponent. Escriu el 8 i surt de l'exponent amb [[right]].[/calc]",0],["[mat]En un dia, la llum recorre 86 400 vegades el que recorre en un segon.[/mat] [calc]Ara fes l'operació [[per]] 86400.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $2.592\\times 10^{13}$. El nombre és massa llarg i la calculadora el dona en notació científica.[/calc] [mat]La resposta correcta és $2{,}592\\cdot 10^{13}$ metres, és a dir, 25 920 000 000 000 m.[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i, en lloc de [[exp]], fes servir la tecla de potència: 3 [[pot]] 8, [[right]] i [[per]] 86400.[/calc]",1],["[calc]Prem [[exe]]: obtens 566870400.[/calc] [mat]No pot ser: la llum fa 300 milions de metres cada segon, i en un dia en faria només 567 milions. Has calculat $3^8=6.561$, no $3\\cdot 10^8$.[/mat]",1]],"tancament":"[calc]Recorda: $3\\cdot 10^8$ s'escriu amb [[exp]] (×10ˣ), no amb [[pot]].[/calc] [mat]La llum recorre $2{,}592\\cdot 10^{13}$ metres en un dia.[/mat]","provaTu":{"enunciat":"El so recorre 343 metres cada segon.\n• Un any té 31 536 000 segons.\nQuants metres recorre el so en un any?","solucio":"[mat]$343\\cdot 31.536.000=1{,}0816848\\cdot 10^{10}$ metres, és a dir, 10.816.848.000 m.[/mat]"}},{"id":"cb2-26-q4","bloc":"eso-parentesis","titol":"Les patates rebaixades: el percentatge de descompte","enunciat":"La Mia ha comprat dues bosses de patates fregides que estaven rebaixades.\n• Abans de la rebaixa, les dues bosses costaven 5 euros en total.\n• Amb la rebaixa, només ha pagat 4 euros per les dues.\nQuin percentatge de descompte s'ha aplicat?","font":"CB 2ESO (2026), pregunta 4","passos":[["[mat]El descompte és el que t'han rebaixat, 5 − 4 = 1 euro, dividit entre el preu d'abans, 5 euros, i multiplicat per 100.[/mat] [calc]Primer escriu la resta entre parèntesis: [[lpar]] 5 − 4 [[rpar]].[/calc]",0],["[calc]Ara fes l'operació [[entre]] 5 [[per]] 100.[/calc] [mat]Gràcies als parèntesis, es divideix tota la resta entre 5.[/mat]",0],["[calc]Prem [[exe]]: obtens el resultat, que és 20.[/calc] [mat]La resposta correcta és que s'ha aplicat un descompte del 20 %.[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i escriu-ho sense parèntesis, $5-4\\div 5\\times 100$.[/calc]",1],["[calc]Prem [[exe]]: obtens −75.[/calc] [mat]No pot ser: un descompte no és negatiu. Sense parèntesis, la divisió i la multiplicació es fan abans que la resta: s'ha calculat $5-80$.[/mat]",1]],"tancament":"[mat]Recorda: la resta, entre parèntesis: $(5-4)\\div 5\\cdot 100=20$. El descompte és del 20 %.[/mat]","provaTu":{"enunciat":"Una samarreta costava 40 euros i ara costa 34 euros. Quin percentatge de descompte s'ha aplicat?","solucio":"[mat]$(40-34)\\div 40\\cdot 100=15$: un descompte del 15 %.[/mat]"}},{"id":"eso-quadrat-negatiu","bloc":"eso-parentesis","titol":"El quadrat d'un nombre negatiu","enunciat":"Calcula el quadrat de −3, és a dir, $(-3)^2$.","font":"","passos":[["[mat]El quadrat de −3 és $(-3)\\cdot(-3)=9$: el signe també s'eleva al quadrat.[/mat] [calc]Escriu el −3 entre parèntesis: [[lpar]] [[menys]] 3 [[rpar]].[/calc]",0],["[calc]Prem [[x2]] per elevar-lo al quadrat.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és 9.[/calc] [mat]La resposta correcta és $(-3)^2=9$.[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i escriu-ho sense parèntesis: [[menys]] 3 [[x2]].[/calc]",1],["[calc]Prem [[exe]]: obtens −9.[/calc] [mat]No és el quadrat de −3: sense parèntesis, el quadrat només afecta el 3, i el signe es posa després: $-3^2=-(3^2)=-9$.[/mat]",1]],"tancament":"[mat]Recorda: per elevar un nombre negatiu, posa'l entre parèntesis: $(-3)^2=9$.[/mat]","provaTu":{"enunciat":"Calcula $(-5)^2$ i $-5^2$. Obtens el mateix resultat?","solucio":"[mat]$(-5)^2=25$ i $-5^2=-25$: no són iguals.[/mat]"}},{"id":"cb4-24-q7","bloc":"eso-parentesis","titol":"Les valoracions d'1 o 2 estrelles","enunciat":"En Víctor ven roba per internet i ha rebut 80 valoracions de clients, d'1 a 5 estrelles. Entre elles:\n• 8 clients li han donat 2 estrelles\n• 2 clients li han donat 1 estrella.\nEl 60 % de les valoracions d'1 o 2 estrelles diuen que la talla era equivocada. Quin percentatge representen aquestes valoracions sobre les 80?","font":"CB 4ESO (2024), pregunta 7","passos":[["[mat]Les valoracions d'1 o 2 estrelles són 8 + 2. El 60 % d'aquestes és $0{,}6\\cdot(8+2)$.[/mat] [calc]Escriu 0.6 [[per]] i la suma entre parèntesis: [[lpar]] 8 + 2 [[rpar]].[/calc]",0],["[mat]Per saber quin percentatge representen de les 80 valoracions, es divideix entre 80 i es multiplica per 100.[/mat] [calc]Ara fes l'operació [[entre]] 80 [[per]] 100.[/calc]",0],["[calc]Prem [[shift]] [[exe]] (≈): obtens el resultat en decimal, que és 7.5. Amb [[exe]] obtindries $\\frac{15}{2}$.[/calc] [mat]La resposta correcta és que representen el 7,5 % de les valoracions.[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i escriu-ho sense parèntesis, $0.6\\times 8+2\\div 80\\times 100$.[/calc]",1],["[calc]Prem [[shift]] [[exe]]: obtens 7.3.[/calc] [mat]És a prop de 7,5, però és incorrecte: sense parèntesis s'ha calculat $0{,}6\\cdot 8+\\frac{2}{80}\\cdot 100$.[/mat]",1]],"tancament":"[mat]Recorda: la suma, entre parèntesis: $0{,}6\\cdot(8+2)\\div 80\\cdot 100=7{,}5$. Representen el 7,5 % de les valoracions.[/mat]","provaTu":{"enunciat":"Una botiga ha rebut 120 valoracions. Entre elles:\n• 9 clients li han donat 2 estrelles;\n• 6 clients li han donat 1 estrella.\nEl 40 % de les valoracions d'1 o 2 estrelles es queixen del preu. Quin percentatge representen sobre les 120?","solucio":"[mat]$0{,}4\\cdot(9+6)\\div 120\\cdot 100=5$[/mat]\nR) El 5 % de les valoracions."}},{"id":"cb2-26-q5","bloc":"eso-proporcionalitat","titol":"La recepta del pastís","enunciat":"En Biel fa un pastís de xocolata seguint una recepta per a $5$ persones: cal posar $3$ ous i $180$ g de xocolata.\n\nAl cap d'uns dies, en Biel repeteix la recepta, però s'equivoca i hi posa $5$ ous.\n\nQuanta xocolata haurà d'utilitzar per mantenir les proporcions de la recepta?","font":"CB 2ESO (2026), pregunta 5","passos":[["[mat]Abans de calcular, pensa:\n• si té més ous, haurà de gastar més xocolata o menys xocolata?\n• si tingués el doble d'ous, és cert que caldria el doble de xocolata?[/mat]",0],["[mat]$3$ ous → $180$ g de xocolata\n$1$ ou → ?[/mat] [calc]Escriu $180$ [[entre]] $3$.[/calc]",0],["[calc]Prem [[exe]]: obtens $60$.[/calc] [mat]$1$ ou → $60$ g de xocolata[/mat]",0],["[mat]Amb $5$ ous, cal gastar $5$ vegades més xocolata que amb $1$ ou.[/mat] [calc]Fes l'operació [[per]] $5$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $300$.[/calc] [mat]R) En Biel ha de fer servir $300$ g de xocolata per $5$ ous.[/mat]",0],["[calc]!!Error típic!!:\nSi apliques malament la regla de tres: $180$ [[per]] $3$ [[entre]] $5$.[/calc]",1],["[calc]Prem [[exe]]: obtens $108$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té lògica que amb $5$ ous portis menys xocolata que amb $3$ ous.[/mat]",1]],"grup":"Proporcionalitat directa","tancament":"[mat]Recorda:\n• $180\\div 3=60$ g\n• $60\\cdot 5=300$ g[/mat]","provaTu":{"enunciat":"Una recepta per a fer creps demana posar $2$ ous i $250$ ml de llet.\nTu tens a la nevera $3$ ous i els vols gastar tots. Quanta llet hauràs de posar per mantenir les proporcions?","solucio":"[mat]$250\\div 2=125$ ml\n$125\\cdot 3=375$ ml[/mat]\nR) Hauré de fer servir $375$ ml de llet."}},{"id":"cb4-22-q26","bloc":"eso-proporcionalitat","titol":"L'aixeta del lavabo","enunciat":"En Nil estudia quanta aigua es fa servir a casa seva. Ha observat que l'aixeta del lavabo omple un got de $0{,}2$ litres en $3$ segons.\n\nQuants litres d'aigua surten de l'aixeta en $60$ segons?","font":"CB 4ESO (2022), pregunta 26","passos":[["[mat]Abans de calcular, pensa:\n• en $60$ segons obté més o menys de $0{,}2$ litres?\n• si manté l'aixeta oberta el doble de temps, surt el doble d'aigua?[/mat]",0],["[mat]$3$ segons → $0{,}2$ litres\n$1$ segon → ?[/mat] [calc]Escriu $0.2$ [[entre]] $3$.[/calc]",0],["[calc]Prem [[exe]]: obtens $\\frac{1}{15}$.\nSi surt en forma de fracció és perquè la calculadora està configurada per donar resultats exactes.\nSi estigués configurada per donar decimals, sortiria $0.06666666667$.[/calc] [mat]$1$ segon → $\\frac{1}{15}\\simeq 0{,}067$ litres[/mat]",0],["[mat]En $60$ segons surt $60$ vegades més aigua que en $1$ segon.[/mat] [calc]Fes l'operació [[per]] $60$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $4$.[/calc] [mat]R) En $60$ segons surten $4$ litres d'aigua de l'aixeta.[/mat]",0]],"grup":"Proporcionalitat directa","provaTu":{"enunciat":"Una aixeta omple una ampolla d'$1{,}5$ litres en $10$ segons.\nTu deixes l'aixeta oberta $2$ minuts ($120$ segons). Quants litres d'aigua hi surten, si raja sempre igual?","solucio":"[mat]$1{,}5\\div 10=0{,}15$ litres\n$0{,}15\\cdot 120=18$ litres[/mat]\nR) De l'aixeta surten $18$ litres d'aigua."}},{"id":"cb4-25-q8","bloc":"eso-proporcionalitat","titol":"El xarop","enunciat":"A en Mario li han receptat un xarop. En $5$ ml de xarop hi ha $105$ mg de principi actiu.\n\nQuants mg de principi actiu hi ha en $16$ ml del mateix xarop?","font":"CB 4ESO (2025), pregunta 8","passos":[["[mat]Abans de calcular, pensa:\n• si prens el triple de xarop, també prendràs el triple de principi actiu?[/mat]",0],["[mat]$5$ ml → $105$ mg\n$1$ ml → ?[/mat] [calc]Escriu $105$ [[entre]] $5$.[/calc]",0],["[calc]Prem [[exe]]: obtens $21$.[/calc] [mat]$1$ ml → $21$ mg[/mat]",0],["[mat]En $16$ ml hi ha $16$ vegades més principi actiu que en $1$ ml.[/mat] [calc]Fes l'operació [[per]] $16$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $336$.[/calc] [mat]R) En $16$ ml de xarop hi ha $336$ mg de principi actiu.[/mat]",0],["[calc]!!Error típic!!:\nSi apliques malament la regla de tres: $105$ [[per]] $5$ [[entre]] $16$.[/calc]",1],["[calc]Prem [[shift]] [[exe]] (≈): obtens $32.8125$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té sentit que en $16$ ml hi hagi menys principi actiu de medicament que en $5$ ml.[/mat]",1]],"grup":"Proporcionalitat directa","tancament":"[mat]Recorda:\n• $105\\div 5=21$ mg\n• $21\\cdot 16=336$ mg[/mat]","provaTu":{"enunciat":"En $10$ ml d'un xarop hi ha $250$ mg de principi actiu.\nTu has de prendre $6$ ml de xarop. Quants mg de principi actiu prendràs?","solucio":"[mat]$250\\div 10=25$ mg\n$25\\cdot 6=150$ mg[/mat]\nR) Prendré $150$ mg de principi actiu."}},{"id":"cb4-23-q26","bloc":"eso-proporcionalitat","titol":"La fotografia més petita","enunciat":"L'Anna té una fotografia de $62$ cm d'amplada i $34$ cm d'alçada. La vol imprimir més petita, de $42$ cm d'amplada.\n\nQuina alçada tindrà la fotografia impresa, si l'Anna no la vol deformar?","font":"CB 4ESO (2023), pregunta 26","passos":[["[mat]Si no es deforma, l'alçada és proporcional a l'amplada:\n$62$ cm d'amplada → $34$ cm d'alçada\n$42$ cm d'amplada → ?\nL'alçada
