ntors trigaran $6$ dies."}},{"id":"recu-f6-102","bloc":"eso-proporcionalitat","titol":"Els pots de pintura","enunciat":"En Carles recorda que quan va pintar la seva habitació, ja fa temps, va fer servir $6$ pots de pintura de $4$ kg cadascun.\nAra la vol tornar a pintar, però a la botiga només venen pots de $3$ kg.\n\nQuants pots de $3$ kg necessitarà?","font":"Banc de recuperació de 2n ESO (proporcionalitat directa i inversa)","passos":[["[mat]Abans de calcular, pensa:\n• amb pots més petits, calen més pots o menys?\n• en el fons, quants kg de pintura calen en total?[/mat]",0],["[mat]És una situació de proporcionalitat inversa.\n$6$ pots → $4$ kg cada pot\n$x$ pots → $3$ kg cada pot\n\nSabem que $6\\cdot 4=x\\cdot 3$.[/mat] [calc]Escriu $6$ [[per]] $4$.[/calc]",0],["[calc]Prem [[igual]]: obtens $24$.[/calc] [mat]Aquest nombre es manté constant: són els $24$ kg de pintura que calen.[/mat]",0],["[mat]Sabem que $x\\cdot 3=24$.[/mat] [calc]Fes l'operació $24$ [[entre]] $3$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $8$.[/calc] [mat]R) En Carles necessita $8$ pots de $3$ kg.[/mat]",0],["[calc]!!Error típic!!:\nSi fas una regla de tres directa: $6$ [[per]] $3$ [[entre]] $4$.[/calc]",1],["[calc]Prem [[igual]]: obtens $4.5$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té cap sentit, perquè si compres pots més petits, en necessites més de $6$, segur![/mat]",1]],"grup":"Proporcionalitat inversa","tancament":"[mat]Recorda:\n• L'equació és aquesta: $6\\cdot 4=x\\cdot 3$\n• La solució és aquesta: $x=8$ pots[/mat]","provaTu":{"enunciat":"Per omplir una piscina calen $12$ camions de $9.000$ litres.\nTu només tens camions de $6.000$ litres. Quants camions et caldran?","solucio":"[mat]$12\\cdot 9.000=x\\cdot 6.000$\n$x=108.000\\div 6.000=18$ camions[/mat]\nR) Em caldran $18$ camions."}},{"id":"ll4a-3-14","bloc":"eso-proporcionalitat","titol":"El taxi","enunciat":"Un taxi cobra $3{,}50$ € per començar el viatge i, després, $1{,}20$ € per cada km recorregut.\n\nPer anar a l'hospital a visitar un familiar has fet un trajecte de $5$ km. Després, per acompanyar-lo a casa seva, has fet un trajecte de $10$ km.\n\n**a)** Creus que el trajecte de $10$ km costa el doble que el de $5$ km?\n**b)** Quant costa cada trajecte?","font":"Llibre 4t ESO A, unitat 3, exercici 14","passos":[["[mat]Per fer un trajecte de $5$ km es paguen els $3{,}50$ € inicials i després $1{,}20$ € per cada km.\n$3{,}50$ € $+\\ 5\\cdot 1{,}20$ €[/mat] [calc]Escriu $3.5$ [[mes]] $1.2$ [[per]] $5$.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $9.5$.[/calc] [mat]El trajecte de $5$ km costa $9{,}50$ €.[/mat]",0],["[mat]Per un trajecte de $10$ km: $3{,}50$ € $+\\ 10\\cdot 1{,}20$ €[/mat] [calc]Esborra amb [[ac]] i escriu $3.5$ [[mes]] $10$ [[per]] $1.2$.[/calc]",0],["[calc]Prem [[igual]]: obtens $15.5$.[/calc] [mat]El trajecte de $10$ km costa $15{,}50$ €.[/mat]",0],["[mat]R) El trajecte de $5$ km costa $9{,}50$ € i el de $10$ km, $15{,}50$ €.\nEl preu no és proporcional als km recorreguts.[/mat]",0]],"grup":"Quan no és proporcional","provaTu":{"enunciat":"Un gimnàs cobra $30$ € de matrícula inicial i, posteriorment, cobra $25$ € cada mes.\n**a)** Quant pagaràs si hi vas $3$ mesos?\n**b)** I si hi vas $6$ mesos?\n**c)** En el segon cas, pagues el doble que en el primer cas?","solucio":"[mat]$30+25\\cdot 3=105$ €\n$30+25\\cdot 6=180$ €[/mat]\nR) Pagaré $105$ € i $180$ €, respectivament.\nNo és el doble, perquè la matrícula sempre es paga una sola vegada."}},{"id":"cb4-23-q23","bloc":"eso-percentatges","titol":"Les fotos amb descompte","enunciat":"Una botiga imprimeix fotografies en color a $0{,}30$ € cadascuna.\n\nL'Anna hi imprimeix $40$ fotografies en color i la botiga li fa un descompte del $25$ %.\n\nQuant li costarà imprimir les fotografies?","font":"CB 4ESO (2023), pregunta 23","passos":[["[mat]Sense descompte, $40$ fotografies costen això:\n$40\\cdot 0{,}30$ €.[/mat] [calc]Escriu $40$ [[per]] $0.3$.[/calc]",0],["[mat]Amb un descompte del $25$ %, es paga el $75$ % del preu.\nPagar el $75$ % és multiplicar per $0{,}75$.[/mat] [calc]Ara fes l'operació [[per]] $0.75$.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $9$.[/calc] [mat]R) A l'Anna li costarà $9$ € imprimir les $40$ fotografies.[/mat]",0],["[calc]!!Error típic!!:\nSi multipliques pel descompte en lloc de pel que es paga: $40$ [[per]] $0.3$ [[per]] $0.25$.[/calc]",1],["[calc]Prem [[igual]]: obtens $3$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té sentit: $3$ € és el que s'estalvia l'Anna, i no és el preu final que cal pagar.[/mat]",1]],"tancament":"[mat]Recorda:\n• Si et fan un descompte del $25$ %, en el fons vol dir que pagues un $75$ % del preu. Per tant, cal multiplicar per $0{,}75$\n\n$40\\cdot 0{,}30\\cdot 0{,}75=9$ €[/mat]","provaTu":{"enunciat":"Una llibreta costa $2{,}40$ €. Tu en compres $15$ i et fan un descompte del $20$ %.\nQuant pagaràs en total?","solucio":"[mat]$15\\cdot 2{,}40\\cdot 0{,}80=28{,}80$ €[/mat]\nR) Pagaré $28{,}80$ €."}},{"id":"cb4-23-q24","bloc":"eso-percentatges","titol":"Les fotos que imprimeix l'Anna","enunciat":"L'Anna va a una botiga a imprimir fotografies en color. Sap que van a $0{,}30$ € cada còpia.\n\nLi fan un descompte del $25$ % i paga $4{,}50$ €.\n\nQuantes fotografies ha imprès?","font":"CB 4ESO (2023), pregunta 24","passos":[["[mat]Amb el descompte, l'Anna paga el $75$ % del preu: $4{,}50$ € és el $75$ % del preu sense descompte.\nPer trobar el preu sense descompte, es divideix entre $0{,}75$.[/mat] [calc]Escriu $4.5$ [[entre]] $0.75$.[/calc]",0],["[calc]Prem [[igual]]: obtens $6$.[/calc] [mat]Sense descompte, les fotografies costarien $6$ €.[/mat]",0],["[mat]Cada fotografia costa $0{,}30$ €: hi ha tantes fotografies com vegades hi cap $0{,}30$ € en $6$ €.[/mat] [calc]Fes l'operació [[entre]] $0.3$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $20$.[/calc] [mat]R) L'Anna ha imprès $20$ fotografies.[/mat]",0],["[calc]!!Error típic!!:\nSi desfàs el descompte afegint un $25$ %, és a dir, multiplicant per $1.25$: $4.5$ [[per]] $1.25$ [[entre]] $0.3$.[/calc]",1],["[calc]Prem [[igual]]: obtens $18.75$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té cap sentit imprimir $18{,}75$ fotografies, i això ens fa sospitar que no hem plantejat bé les operacions.[/mat]",1]],"tancament":"[mat]Recorda:\n• Si has pagat el $75$ % del preu, per saber el preu sense descompte cal dividir entre $0{,}75$\n\n$4{,}50\\div 0{,}75=6$ €\n$6\\div 0{,}30=20$ fotografies[/mat]","provaTu":{"enunciat":"Unes llibretes costen $2{,}40$ € cadascuna. Amb un descompte del $20$ %, has pagat $28{,}80$ €.\nQuantes llibretes has comprat?","solucio":"[mat]$28{,}80\\div 0{,}80=36$ €\n$36\\div 2{,}40=15$ llibretes[/mat]\nR) He comprat $15$ llibretes."}},{"id":"ll4-2-25","bloc":"eso-percentatges","titol":"La declaració de l'IVA","enunciat":"En Jordi té una botiga d'electrodomèstics. Cada trimestre ha de fer la declaració de l'IVA a Hisenda.\n\nEn el primer trimestre de l'any ha cobrat $18.150$ € als seus clients, amb l'IVA del $21$ % inclòs.\n\n**a)** Quants diners ha facturat realment, sense IVA?\n**b)** Quants diners d'IVA haurà de pagar a Hisenda?","font":"Llibre 4t ESO, unitat 2, exercici 25","passos":[["[mat]Afegir l'IVA del $21$ % és multiplicar per $1{,}21$.\nPer calcular el preu sense IVA, cal fer aquesta operació:\n$18.150$ € $\\div 1{,}21$[/mat] [calc]Escriu $18150$ [[entre]] $1.21$.[/calc]",0],["[calc]Prem [[igual]]: obtens $15000$.[/calc] [mat]Sense IVA, en Jordi ha facturat $15.000$ €.[/mat]",0],["[mat]L'IVA és la diferència entre el que ha cobrat i el que ha facturat:\n$18.150$ € $-\\ 15.000$ €[/mat] [calc]Escriu $18150$ [[menys]] [[ans]].\n[[ans]] és el resultat d'abans.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $3150$.[/calc] [mat]R) En Jordi ha facturat $15.000$ € i haurà de pagar $3.150$ € d'IVA a Hisenda.[/mat]",0]],"provaTu":{"enunciat":"Tens una petita botiga de roba. En un trimestre has cobrat $24.200$ € als clients, amb l'IVA del $21$ % inclòs.\n**a)** Quants diners has facturat sense IVA?\n**b)** Quants diners d'IVA hauràs de pagar a Hisenda?","solucio":"[mat]$24.200\\div 1{,}21=20.000$ €\n$24.200-20.000=4.200$ €[/mat]\nR) He facturat $20.000$ € i hauré de pagar $4.200$ € d'IVA."}},{"id":"ll4a-2-17","bloc":"eso-percentatges","titol":"L'abric rebaixat","enunciat":"En una botiga de roba hi ha un cartell que diu: «Rebaixa del $40$ % i, els dijous, un $10$ % extra: tindràs un $50$ % de descompte!».\n\nEn Pau hi vol comprar un abric de $200$ €. Aprofita que és dijous per tenir més rebaixa. De fet, en Pau creu que haurà de pagar just la meitat, o sigui, $100$ €.\n\n**a)** Realment, quin és el preu rebaixat que pagarà en Pau?\n**b)** És cert que li han fet un $50$ % de descompte?","font":"Llibre 4t ESO A, unitat 2, exercici 17","passos":[["[mat]Abans de calcular, pensa:\n• el $10$ % extra es calcula sobre $200$ € o sobre un preu més petit?[/mat]",0],["[mat]Amb un $40$ % de descompte es paga el $60$ %: es multiplica per $0{,}6$.\nAmb el $10$ % extra es paga el $90$ % del que queda: es multiplica per $0{,}9$.[/mat] [calc]Escriu $200$ [[per]] $0.6$ [[per]] $0.9$.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $108$.[/calc] [mat]R) L'abric costa $108$ €.\nEl descompte que li han fet és:\n$200-108=92$ €\nPer tant, no li fan un $50$ % de descompte, perquè no li han rebaixat $100$ €.[/mat]",0],["[calc]!!Error típic!!:\nSi sumes els descomptes, $40$ % $+\\ 10$ % $=50$ %: $200$ [[per]] $0.5$.[/calc]",1],["[calc]Prem [[igual]]: obtens $100$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té sentit: el $10$ % extra és sobre $120$ €, no sobre $200$ €. Els descomptes encadenats no se sumen![/mat]",1]],"tancament":"[mat]Recorda:\n• Si et fan dos descomptes seguits, primer pagues el $60$ % del preu inicial i, després, el $90$ % del primer preu rebaixat. Per tant, cal multiplicar per $0{,}6$ i per $0{,}9$\n\n$200$ € $\\cdot 0{,}6\\cdot 0{,}9=108$ €[/mat]","provaTu":{"enunciat":"Una tauleta costa $300$ €. Primer la rebaixen un $20$ % i després, sobre el preu rebaixat, un $10$ % més.\n**a)** Quin és el preu final?\n**b)** Quin percentatge de descompte t'han fet en total?","solucio":"[mat]$300\\cdot 0{,}8\\cdot 0{,}9=216$ €\n$300-216=84$ €\n$84\\div 300=0{,}28$[/mat]\nR) La tauleta em costarà $216$ €.\nM'han fet un descompte del $28$ %, no del $30$ %."}},{"id":"ll4-2-16","bloc":"eso-percentatges","titol":"L'historial de preus del televisor","enunciat":"La Naia està mirant l'historial de preus d'un televisor en una botiga en línia. La Naia se sorprèn molt, fixa't què passa:\n\n• Fa $2$ mesos, el preu era $300$ €.\n• Fa $1$ mes, el preu va baixar exactament un $15$ %.\n• Ahir mateix, el preu va pujar exactament un $15$ %.\n\nPerò el preu actual, segons està veient la Naia, **no és** de $300$ €.\n\n**a)** Quin és el preu actual del televisor?\n**b)** Com pot ser que no torni a costar $300$ €?","font":"Llibre 4t ESO, unitat 2, exercici 16","passos":[["[mat]Abans de calcular, pensa:\n• Sabem que la baixada del $15$ % es calcula sobre $300$ €. Però... la pujada del $15$ %, sobre quin preu es calcula?[/mat]",0],["[mat]• Baixar un $15$ % és pagar el $85$ %: es multiplica per $0{,}85$.\n• Pujar un $15$ % és pagar el $115$ %: es multiplica per $1{,}15$.\nPreu actual: $300$ € $\\cdot 0{,}85\\cdot 1{,}15$[/mat] [calc]Escriu $300$ [[per]] $0.85$ [[per]] $1.15$.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $293.25$.[/calc] [mat]R) Ara el televisor costa $293{,}25$ €, i no $300$ €.\nLa baixada i la pujada no es compensen.[/mat]",0]],"provaTu":{"enunciat":"Una samarreta costa $40$ €. Primer el preu puja un $25$ % i després baixa un $25$ %.\nQuin és el preu final de la samarreta?","solucio":"[mat]$40\\cdot 1{,}25\\cdot 0{,}75=37{,}50$ €[/mat]\nR) La samarreta costa $37{,}50$ €, menys que al principi."}},{"id":"cb4-26-q15","bloc":"eso-mitjanes","titol":"Les places de l'hotel","enunciat":"Un hotel apunta cada setmana quantes places ha ocupat. En $4$ setmanes ha ocupat $168$, $154$, $210$ i $260$ places, respectivament.\n\nQuina ha estat la mitjana de places ocupades?","font":"CB 4ESO (2026), pregunta 15","passos":[["[mat]La mitjana és la suma de les places dividida entre el nombre de setmanes:\n$\\frac{168+154+210+260}{4}$[/mat] [calc]Primer escriu la suma entre parèntesis: [[lpar]] $168$ [[mes]] $154$ [[mes]] $210$ [[mes]] $260$ [[rpar]].[/calc]",0],["[calc]Ara fes l'operació [[entre]] $4$.[/calc] [mat]Gràcies als parèntesis, es divideix tota la suma entre $4$.[/mat]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $198$.[/calc] [mat]R) La mitjana ha estat de $198$ places ocupades per setmana.[/mat]",0],["[calc]!!Error típic!!:\nSi escrius la suma sense parèntesis: $168$ [[mes]] $154$ [[mes]] $210$ [[mes]] $260$ [[entre]] $4$.[/calc]",1],["[calc]Prem [[igual]]: obtens $597$.[/calc] [mat]La calculadora ha seguit bé les instruccions, però sense parèntesis només s'ha dividit el $260$ entre $4$.[/mat] [mat]No té cap sentit: la mitjana no pot ser més gran que les places de qualsevol setmana![/mat]",1]],"tancament":"[mat]Recorda:\n• Si vols dividir tota una suma, recorda d'escriure-la entre parèntesis.\n\n$(168+154+210+260)\\div 4=198$ places[/mat]","provaTu":{"enunciat":"Aquesta setmana, un bar ha venut $35$, $42$, $28$, $50$ i $45$ entrepans, de dilluns a divendres.\nQuina és la mitjana d'entrepans venuts per dia?","solucio":"[mat]$(35+42+28+50+45)\\div 5=40$[/mat]\nR) De mitjana, el bar ha venut $40$ entrepans per dia."}},{"id":"cb4-24-q8","bloc":"eso-mitjanes","titol":"Les estrelles de la botiga","enunciat":"Els $80$ clients d'una botiga han valorat la seva compra amb una puntuació d'$1$ a $5$ estrelles. Aquesta taula diu quants clients han donat cada puntuació:\n\n$$\\begin{array}{l|ccccc}\\text{Estrelles} & 5 & 4 & 3 & 2 & 1\\\\ \\hline \\text{Clients} & 22 & 32 & 16 & 8 & 2\\end{array}$$\nQuina és la puntuació mitjana de la botiga?","font":"CB 4ESO (2024), pregunta 8","passos":[["[mat]• Cada puntuació d'estrelles s'ha de multiplicar pel nombre de clients que l'han donada.\n• Després, cal sumar tots els resultats.\n• Finalment, caldrà fer una divisió.[/mat] [calc]La fx-82MS no té plantilla de fracció: escriu la suma entre parèntesis.[/calc]",0],["[mat]Necessitem saber el total de clients:\n$22+32+16+8+2=80$\nCaldrà dividir la nostra suma entre el total de clients, que és $80$.[/mat] [calc]Ara fes l'operació [[entre]] $80$.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $3.8$.[/calc] [mat]R) La puntuació mitjana és de $3{,}8$ estrelles.[/mat]",0]],"provaTu":{"enunciat":"Aquesta taula mostra les notes d'un examen de matemàtiques dels $30$ alumnes d'una classe:\n\n$$\\begin{array}{l|ccccccccc}\\text{Nota} & 2 & 3 & 4 & 5 & 6 & 7 & 8 & 9 & 10\\\\ \\hline \\text{Alumnes} & 1 & 2 & 3 & 5 & 6 & 5 & 4 & 2 & 2\\end{array}$$\nQuina és la nota mitjana de la classe?","solucio":"[mat]$\\frac{2\\cdot 1+3\\cdot 2+4\\cdot 3+5\\cdot 5+6\\cdot 6+7\\cdot 5+8\\cdot 4+9\\cdot 2+10\\cdot 2}{30}=\\frac{186}{30}=6{,}2$[/mat]\nR) La nota mitjana de la classe és un $6{,}2$."}},{"id":"cb4-25-q17","bloc":"eso-mitjanes","titol":"Les tardes a la biblioteca","enunciat":"S'ha fet una enquesta per saber quantes tardes per setmana els alumnes de 4t d'ESO d'un institut van a estudiar a la biblioteca del barri.\n\nDels alumnes enquestats, $25$ hi van $1$ tarda per setmana, $35$ hi van $2$ tardes, $25$ hi van $3$ tardes i $10$ hi van $4$ tardes.\n\nDe mitjana, quantes tardes per setmana hi van?","font":"CB 4ESO (2025), pregunta 17","passos":[["[mat]• Cada nombre de tardes s'ha de multiplicar pel nombre d'alumnes que hi van.\n• Després, cal sumar tots els resultats.\n• Finalment, caldrà fer una divisió.[/mat] [calc]Per començar, escriu la suma entre parèntesis.[/calc]",0],["[mat]Necessitem saber el total d'alumnes enquestats:\n$25+35+25+10$\nCaldrà dividir la nostra suma entre aquest total.[/mat] [calc]Ara fes l'operació [[entre]] i escriu aquesta suma, també entre parèntesis.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $2.210526316$.[/calc] [mat]R) De mitjana, hi van aproximadament $2{,}21$ tardes per setmana.[/mat]",0],["[calc]!!Error típic!!:\nSi no poses parèntesis al denominador: [[lpar]] … [[rpar]] [[entre]] $25$ [[mes]] $35$ [[mes]] $25$ [[mes]] $10$.[/calc]",1],["[calc]Prem [[igual]]: obtens $78.4$.[/calc] [mat]La calculadora ha seguit bé les instruccions, però sense parèntesis només s'ha dividit entre el primer $25$.[/mat] [mat]No té cap sentit: una setmana no té $78$ tardes![/mat]",1]],"tancament":"[mat]Recorda:\n• Si el denominador és una suma, recorda d'escriure'l entre parèntesis, o fer servir la plantilla de fracció si la calculadora en té.\n\n$\\frac{210}{95}\\simeq 2{,}21$ tardes per setmana[/mat]","provaTu":{"enunciat":"En una classe de $40$ alumnes, $12$ no tenen cap germà, $15$ en tenen $1$, $8$ en tenen $2$ i $5$ en tenen $3$.\nQuina és la mitjana de germans per alumne?","solucio":"[mat]$\\frac{0\\cdot 12+1\\cdot 15+2\\cdot 8+3\\cdot 5}{12+15+8+5}=\\frac{46}{40}=1{,}15$ germans[/mat]\nR) De mitjana, cada alumne té $1{,}15$ germans."}},{"id":"ll4a-8-56","bloc":"eso-mitjanes","titol":"La nota final de Tecnologia","enunciat":"A l'institut de la Marta, la nota final de Tecnologia es calcula així:\n• l'examen compta un $30$ %;\n• la part pràctica al laboratori, un $30$ %;\n• el projecte final, un $40$ %.\n\nLa Marta ha tret un $5$ a l'examen, un $6$ a les pràctiques i un $9$ al projecte.\n\nQuina és la nota mitjana de la Marta?","font":"Llibre 4t ESO A, unitat 8, exercici 56","passos":[["[mat]Abans de calcular, pensa:\n• és possible que la seva nota mitjana sigui un $4$?\n• creus que la seva nota s'acostarà més al $5$ o al $7$?[/mat]",0],["[mat]Cada nota es multiplica pel seu pes ($30$ % és $0{,}3$) i se sumen.\nNo cal dividir: els pesos ja sumen $1$, el $100$ %.[/mat] [calc]Escriu $0.3$ [[per]] $5$ [[mes]] $0.3$ [[per]] $6$ [[mes]] $0.4$ [[per]] $9$.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $6.9$.[/calc] [mat]R) La nota mitjana de la Marta és un $6{,}9$.[/mat]",0]],"provaTu":{"enunciat":"La nota d'una matèria es calcula amb aquesta mitjana ponderada: un $60$ % l'examen i un $40$ % els treballs.\nTu has tret un $4$ a l'examen i un $8$ als treballs. Quina és la teva nota mitjana?","solucio":"[mat]$0{,}6\\cdot 4+0{,}4\\cdot 8=5{,}6$[/mat]\nR) La meva nota mitjana és un $5{,}6$."}},{"id":"cb4-26-q7","bloc":"eso-geometria","titol":"El tram d'escala","enunciat":"Una escala uneix dues plantes d'un edifici. Cada tram d'escala puja una altura de $3$ m i avança una longitud de $5$ m.\n\nQuant mesura cada tram d'escala?","font":"CB 4ESO (2026), pregunta 7","passos":[["[mat]El tram és la hipotenusa d'un triangle rectangle amb catets de $3$ m i $5$ m.\nApliquem el teorema de Pitàgores per trobar quant mesura la hipotenusa:\n$\\sqrt{3^2+5^2}$[/mat] [calc]Prem [[arrel]] i escriu, entre parèntesis, $3$ [[x2]] [[mes]] $5$ [[x2]].[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $5.830951895$.[/calc] [mat]R) Cada tram d'escala mesura aproximadament $5{,}83$ m.[/mat]",0],["[calc]!!Error típic!!:\nSi escrius l'arrel sense parèntesis: [[arrel]] $3$ [[x2]] [[mes]] $5$ [[x2]].[/calc]",1],["[calc]Prem [[igual]]: obtens $28$.[/calc] [mat]La calculadora ha seguit bé les instruccions, però sense parèntesis l'arrel només afecta el $3^2$.[/mat] [mat]No té sentit: el tram no pot ser més llarg que $3+5=8$ m![/mat]",1]],"tancament":"[mat]Recorda:\n• A la fx-82MS, el que va dins de l'arrel s'ha d'escriure entre parèntesis\n\n$\\sqrt{3^2+5^2}\\simeq 5{,}83$ m[/mat]","provaTu":{"enunciat":"La rampa de l'skatepark del teu barri puja una altura d'$1{,}2$ m i avança una longitud de $5$ m.\nQuant mesura la rampa?","solucio":"[mat]$\\sqrt{1{,}2^2+5^2}=\\sqrt{26{,}44}\\simeq 5{,}14$ m[/mat]\nR) La rampa mesura aproximadament $5{,}14$ m."}},{"id":"ll4a-4-34","bloc":"eso-geometria","titol":"L'escala recolzada a la paret","enunciat":"En Marc recolza una escala de $5$ m en una paret per pintar-la. El peu de l'escala queda separat una distància de $4$ m respecte de la base de la paret.\n\nA quina altura de la paret arriba l'escala?","font":"Llibre 4t ESO A, unitat 4, exercici 34","passos":[["[mat]Abans de calcular, pensa:\n• quin és el costat més llarg del triangle: l'escala, la paret o el terra?\n• l'escala pot arribar a més de $5$ m d'altura?[/mat]",0],["[mat]Podem formar un triangle rectangle, on:\n• el tros de terra ($4$ m) és un catet;\n• l'altura a la qual arriba l'escala és l'altre catet;\n• la pròpia escala és la hipotenusa.\nPel teorema de Pitàgores, l'altura de l'escala val:\n$\\sqrt{5^2-4^2}$[/mat] [calc]Prem [[arrel]] i escriu, entre parèntesis, $5$ [[x2]] [[menys]] $4$ [[x2]].[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $3$.[/calc] [mat]R) L'escala arriba a $3$ m d'altura de la paret.[/mat]",0],["[calc]!!Error típic!!:\nSi sumes els quadrats en lloc de restar-los: [[arrel]] [[lpar]] $5$ [[x2]] [[mes]] $4$ [[x2]] [[rpar]].[/calc]",1],["[calc]Prem [[igual]]: obtens $6.403124237$.[/calc] [mat]La calculadora ha seguit les teves instruccions, però no té cap sentit, perquè una escala de $5$ m inclinada no pot arribar a $6{,}4$ m d'altura. L'altura màxima seria precisament $5$ m, posant-la vertical.[/mat]",1]],"tancament":"[mat]Recorda:\n• Si coneixes la hipotenusa i un catet, i vols trobar la mida de l'altre catet, et cal aplicar la fórmula adequada:\n\n$\\sqrt{5^2-4^2}=3$ m[/mat]","provaTu":{"enunciat":"Els bombers recolzen una escala de $6{,}5$ m en una paret. El peu de l'escala és a $2{,}5$ m de la paret.\nA quina altura arriba l'escala?","solucio":"[mat]$\\sqrt{6{,}5^2-2{,}5^2}=\\sqrt{36}=6$ m[/mat]\nR) L'escala arriba a $6$ m d'altura."}},{"id":"cb4-22-q8","bloc":"eso-geometria","titol":"El got de vidre","enunciat":"Un got de vidre té forma de cilindre. El radi de la base fa $3$ cm i l'alçada, $15$ cm.\n\nQuin és el volum del got?[nota]Volum d'un cilindre: $V=\\pi\\cdot r^2\\cdot h$[/nota]","font":"CB 4ESO (2022), pregunta 8","passos":[["[mat]El volum del got es calcula així, a partir del seu radi i de la seva altura:\n$V=\\pi\\cdot 3^2\\cdot 15$[/mat] [calc]Escriu π ([[shift]] [[exp]]), [[per]] $3$ [[x2]] [[per]] $15$.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $424.1150082$.[/calc] [mat]R) El volum del got és aproximadament de $424$ cm³.[/mat]",0]],"provaTu":{"enunciat":"Una llauna de refresc té forma de cilindre. El radi de la base fa $3$ cm i l'alçada, $11{,}66$ cm.\n• Quin és el volum de la llauna?\n• És cert que hi caben $330$ ml?","solucio":"[mat]$V=\\pi\\cdot 3^2\\cdot 11{,}66=104{,}94\\pi\\simeq 329{,}7$ cm³[/mat]\nR) El volum de la llauna és aproximadament de $329{,}7$ cm³, és a dir, uns $330$ ml: sí, hi caben."}},{"id":"cb4-25-q27","bloc":"eso-geometria","titol":"La tela del para-sol","enunciat":"Volem saber quanta tela fa falta per construir un para-sol. Podem aproximar l'àrea del para-sol per la d'un cercle de $0{,}75$ m de radi.\n\nTroba el valor d'aquesta àrea.[nota]Àrea del cercle: $A=\\pi\\cdot r^2$[/nota]","font":"CB 4ESO (2025), pregunta 27","passos":[["[mat]L'àrea del cercle es calcula així:\n$A=\\pi\\cdot 0{,}75^2$[/mat] [calc]Escriu π ([[shift]] [[exp]]), [[per]] $0.75$ [[x2]].[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $1.767145868$.[/calc] [mat]R) Calen aproximadament $1{,}77$ m² de tela.[/mat]",0]],"provaTu":{"enunciat":"Una pizza rodona fa $15$ cm de radi.\nQuant val la seva àrea?","solucio":"[mat]$A=\\pi\\cdot 15^2=225\\pi\\simeq 706{,}86$ cm²[/mat]\nR) La pizza té una àrea aproximada de $706{,}86$ cm²."}},{"id":"ll4a-4-8","bloc":"eso-geometria","titol":"L'ombra del campanar","enunciat":"Un dia de sol, la Júlia vol saber l'altura del campanar del seu poble. Fa aquest experiment:\n• En primer lloc, mesura l'ombra que fa el campanar al terra: són $12$ m.\n• Ràpidament, posa un pal vertical i pren mesures: el pal mesura $2$ m i la seva ombra, $1{,}5$ m.\n\nLa Júlia ha anat ràpid perquè no volia que el Sol canviés la seva inclinació respecte del terra.\n\nLa Júlia ja sap que el campanar mesura $16$ m d'altura. Com ho ha sabut?","font":"Llibre 4t ESO A, unitat 4, exercicis 8 i 11","passos":[["[mat]Abans de calcular, pensa:\n• el pal mesura més que la seva pròpia ombra, o menys?\n• aleshores, el campanar tindrà una altura superior o inferior a $12$ m?[/mat]",0],["[mat]El pal i el campanar, amb les seves ombres, formen triangles semblants.\nLa raó de semblança és aquesta:\n$12\\div 1{,}5$[/mat] [calc]Escriu $12$ [[entre]] $1.5$.[/calc]",0],["[calc]Prem [[igual]]: obtens $8$.[/calc] [mat]Això vol dir que l'ombra del campanar és $8$ vegades la del pal. Per tant, l'altura del campanar també serà $8$ vegades la del pal.\nCom que el pal mesura $2$ m, farem el següent:[/mat]",0],["[calc]Fes l'operació [[per]] $2$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $16$.[/calc] [mat]R) La Júlia ho ha sabut perquè l'altura del campanar és $8$ vegades la del pal: $2\\cdot 8=16$ m.[/mat]",0],["[calc]!!Error típic!!:\nSi inverteixes la raó i fas ombra entre altura: $1.5$ [[per]] $12$ [[entre]] $2$.[/calc]",1],["[calc]Prem [[igual]]: obtens $9$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té sentit: el campanar ($9$ m) seria més baix que la seva ombra ($12$ m), i el pal no![/mat]",1]],"tancament":"[mat]Recorda:\n• Si l'ombra és $8$ vegades més llarga, l'altura també és $8$ vegades més gran\n\n$12\\div 1{,}5=8$\n$2\\cdot 8=16$ m[/mat]","provaTu":{"enunciat":"Un fanal de $6$ m fa una ombra de $9$ m.\nA la mateixa hora, quina ombra faràs tu, si fas $1{,}8$ m d'alçada?","solucio":"[mat]$9\\div 6=1{,}5$\n$1{,}8\\cdot 1{,}5=2{,}7$ m[/mat]\nR) La meva ombra farà $2{,}7$ m."}},{"id":"eso-posa-graus","bloc":"eso-trigonometria","titol":"La calculadora en radians","enunciat":"A dalt de la pantalla de la calculadora hi ha una R: la calculadora treballa en radians.\n\nCalcula l'altura de l'arbre de la fitxa següent, $12\\cdot\\tan 35^\\circ$, i posa la calculadora en graus.","font":"","passos":[["[calc]!!Error típic!!:\nSi calcules amb la R a dalt de la pantalla: $12$ [[tan]] $35$.[/calc]",1],["[calc]Prem [[igual]]: obtens $5.685776645$.[/calc] [mat]La calculadora ha seguit bé les instruccions, però ha entès $35$ radians, i no $35^\\circ$.[/mat]",1],["[calc]Ho arreglem. Prem [[mode]]: surten els modes de càlcul.[/calc]",0],["[calc]Torna a prémer [[mode]]: ara surt la unitat dels angles, {{Deg}} (graus), {{Rad}} (radians) i {{Gra}}.[/calc]",0],["[calc]Prem l'[[1]], el número de {{Deg}}: tornes a la pantalla de càlcul, i ara a dalt hi ha una D.[/calc]",0],["[calc]Torna a escriure $12$ [[tan]] $35$.[/calc]",0],["[calc]Prem [[igual]]: obtens $8.402490459$.[/calc] [mat]R) Ara sí: l'arbre fa aproximadament $8{,}4$ m d'altura.[/mat]",0]],"provaTu":{"enunciat":"Primer, comprova que la calculadora és en graus: a dalt de la pantalla hi ha d'haver una D.\nDesprés, calcula $5\\cdot\\tan 30^\\circ$.","solucio":"[mat]$5\\cdot\\tan 30^\\circ=\\frac{5\\sqrt{3}}{3}\\simeq 2{,}89$[/mat]\n[nota]Si et surt $-32{,}03$, la calculadora és en radians.[/nota]"}},{"id":"ll4-7-37","bloc":"eso-trigonometria","titol":"L'arbre del pati","enunciat":"En Pol vol saber l'altura de l'arbre del pati de l'institut. Un dia de sol, l'arbre fa una ombra de $12$ m, i els raigs del sol formen un angle de $35^\\circ$ amb el terra.\n\nQuina és l'altura de l'arbre?","font":"Llibre 4t ESO, unitat 7, exercici 37","passos":[["[calc]Abans de res, mira la pantalla: hi ha d'haver una D (graus), perquè els angles d'aquest problema són en graus.\nSi hi ha una R, mira la fitxa anterior.[/calc]",0],["[mat]Podem formar un triangle rectangle, on:\n• l'ombra ($12$ m) és el catet contigu a l'angle de $35^\\circ$;\n• l'altura de l'arbre és el catet oposat.\nOposat i contigu → tangent. L'altura es calcula així:\n$h=12\\cdot\\tan 35^\\circ$[/mat] [calc]Escriu $12$, [[tan]] i $35$.\nNo cal el [[per]].[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $8.402490459$.[/calc] [mat]R) L'arbre fa aproximadament $8{,}4$ m d'altura.[/mat]",0]],"provaTu":{"enunciat":"Un fanal del carrer fa una ombra de $6$ m, quan els raigs del sol formen un angle de $40^\\circ$ amb el terra.\nQuina és l'altura del fanal?","solucio":"[mat]$h=6\\cdot\\tan 40^\\circ\\simeq 5{,}03$ m[/mat]\nR) El fanal fa aproximadament $5{,}03$ m d'altura."}},{"id":"ll4-7-38","bloc":"eso-trigonometria","titol":"L'escala dels bombers","enunciat":"Els bombers recolzen una escala de $5$ m a la paret d'un edifici. L'escala forma un angle de $60^\\circ$ amb el terra.\n\nA quina altura de la paret arriba l'escala?","font":"Llibre 4t ESO, unitat 7, exercici 38","passos":[["[mat]Podem formar un triangle rectangle, on:\n• la pròpia escala ($5$ m) és la hipotenusa;\n• l'altura a la qual arriba és el catet oposat a l'angle de $60^\\circ$.\nOposat i hipotenusa → sinus. L'altura es calcula així:\n$h=5\\cdot\\sin 60^\\circ$[/mat] [calc]Amb la D a la pantalla, escriu $5$, [[sin]] i $60$.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $4.330127019$.[/calc] [mat]R) L'escala arriba aproximadament a $4{,}33$ m d'altura.[/mat]",0]],"provaTu":{"enunciat":"L'estel de la Laia està lligat amb un fil de $20$ m, que forma un angle de $50^\\circ$ amb el terra.\nA quina altura vola l'estel?","solucio":"[mat]$h=20\\cdot\\sin 50^\\circ\\simeq 15{,}32$ m[/mat]\nR) L'estel vola aproximadament a $15{,}32$ m d'altura."}},{"id":"ll4-7-39","bloc":"eso-trigonometria","titol":"L'angle de l'escala","enunciat":"Per seguretat, una escala de mà ha de formar un angle d'uns $75^\\circ$ amb el terra. La Laia recolza una escala de $5$ m a la paret, amb la base a $1{,}5$ m de la paret.\n\nQuin angle forma l'escala amb el terra?","font":"Llibre 4t ESO, unitat 7, exercici 39","passos":[["[mat]Coneixem el catet contigu ($1{,}5$ m) i la hipotenusa ($5$ m): $\\cos\\alpha=\\frac{1{,}5}{5}$\nPer trobar l'angle, cal la funció inversa:\n$\\alpha=\\cos^{-1}(1{,}5\\div 5)$[/mat] [calc]Prem [[shift]] [[cos]] (a sobre hi ha cos⁻¹) i escriu, entre parèntesis, $1.5$ [[entre]] $5$.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $72.54239688$.\nÉs en graus, perquè a la pantalla hi ha D.[/calc] [mat]R) L'escala forma un angle d'aproximadament $72{,}5^\\circ$ amb el terra, una mica menys del recomanat.[/mat]",0],["[calc]!!Error típic!!:\nSi oblides la tecla [[shift]]: [[cos]] [[lpar]] $1.5$ [[entre]] $5$ [[rpar]].[/calc]",1],["[calc]Prem [[igual]]: obtens $0.999986292$.[/calc] [mat]La calculadora ha seguit les teves instruccions, però sense la funció inversa ha calculat un cosinus, no un angle. Un angle d'$1^\\circ$ voldria dir que l'escala està gairebé estirada a terra![/mat]",1]],"tancament":"[mat]Recorda:\n• Si vols trobar un angle a partir d'una raó, cal la funció inversa ([[shift]] [[cos]])\n\n$\\alpha=\\cos^{-1}(1{,}5\\div 5)\\simeq 72{,}5^\\circ$[/mat]","provaTu":{"enunciat":"Una rampa per a cadires de rodes fa $8$ m de llarg i puja una altura d'$1$ m.\nQuin angle forma la rampa amb el terra?","solucio":"[mat]$\\sin\\alpha=\\frac{1}{8}$\n$\\alpha=\\sin^{-1}(1\\div 8)\\simeq 7{,}2^\\circ$[/mat]\nR) La rampa forma un angle d'aproximadament $7{,}2^\\circ$ amb el terra."}}]},"tecles":{"fx-82sp-cw":{"0":"<span class=\"tecla tecla-num t-0 petita\" role=\"img\" aria-label=\"zero\" title=\"zero\"><span class=\"cara\">0</span></span>","1":"<span class=\"tecla tecla-num t-1 petita\" role=\"img\" aria-label=\"u\" title=\"u\"><span class=\"cara\">1</span></ angular":"2:Unidad angular","1:Grado sexag (D)":"1:Grado sexag (D)","2:Radián":"2:Radián","Tabla":"Tabla","Inic.":"Inic.","Final":"Final","Paso":"Paso","Verificar":"Verificar","1:=":"1:=","Verdadero":"Verdadero","Falso":"Falso","Calcular":"Calcular","Idioma":"Idioma"},"fx-82ms":{"Fix":"Fix","Sci":"Sci","Norm":"Norm","Norm 1~2?":"Norm 1~2?","ab/c":"ab/c","COMP":"COMP","SD":"SD","REG":"REG","Deg":"Deg","Rad":"Rad","Gra":"Gra"}},"etapes":[{"id":"batx","nom":"Batxillerat"},{"id":"eso","nom":"ESO"}]};

<script>
(function () {
'use strict';
const app = document.getElementById('app');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const guarda = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* cap */ } };
const llegeix = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
/** Desplaça només el contenidor (la columna o el panell) perquè «el» es vegi: mai la pàgina sencera. */
function aLaVista(el, cont) {
  if (!el || !cont) return;
  const r = el.getBoundingClientRect(), c = cont.getBoundingClientRect();
  if (r.top < c.top + 4) cont.scrollTop += r.top - c.top - 50;
  else if (r.bottom > c.bottom - 4) cont.scrollTop += r.bottom - c.bottom + 12;
}
const missatge = t => { const m = document.getElementById('missatge'); m.textContent = t; m.hidden = !t; };

/* ── Estat ─────────────────────────────────────────────────────────── */
let model = DADES.models.some(m => m.id === llegeix('ed-model')) ? llegeix('ed-model') : DADES.models[0].id;
let etapa = DADES.etapes.some(e => e.id === llegeix('ed-etapa')) ? llegeix('ed-etapa') : 'eso';
const docs = {};                 // canvis/<id>
// La fitxa oberta: el seu document és el de la pàgina (doc), i la base de dades no el substitueix mentre s'hi treballa
let obert = null, tocat = false;
let db = null, potEscriure = true;
const editada = d => Boolean(d && !d.aplicat && ((d.camps && Object.keys(d.camps).length) || (d.comentari && d.comentari.trim())));
const curt = () => DADES.models.find(m => m.id === model).curt;
const fitxesDe = () => DADES.fitxes[model];

/* ── Els textos, en HTML (com nucli/text.js del web; fórmules en MathML) ── */
const formula = (t, display) => { try { return katex.renderToString(t, {throwOnError: false, displayMode: display, output: 'mathml'}); } catch (e) { return esc(t); } };
function simple(t) {
  return String(t || '').split(/(\*\*[^*]+?\*\*|\$\$[^$]+\$\$|\$[^$]+\$|\[\[[^\]]+\]\]|\{\{[^}]+\}\}|!![^!]+!!)/).map(x => {
    if (/^\*\*[^*]+?\*\*$/.test(x)) return `<strong>${simple(x.slice(2, -2))}</strong>`;
    if (/^\$\$[^$]+\$\$$/.test(x)) return formula(x.slice(2, -2), true);
    if (/^\$[^$]+\$$/.test(x)) return formula(x.slice(1, -1), false);
    if (/^\[\[[^\]]+\]\]$/.test(x)) { const k = x.slice(2, -2); return DADES.tecles[model][k] || `<span class="tecla petita">${esc(k)}</span>`; }
    if (/^\{\{[^}]+\}\}$/.test(x)) { const k = x.slice(2, -2); return `<span class="opcio-menu">${esc(DADES.menus[model][k] || k)}</span>`; }
    if (/^!![^!]+!!$/.test(x)) return `<span class="avis-error">${esc(x.slice(2, -2))}</span>`;
    return esc(x).replace(/\n/g, '<br>');
  }).join('');
}
const apartats = t => String(t || '').split(/((?<!\[)\[[a-z]\](?!\])[\s\S]*?\[\/[a-z]\])/).map(x => {
  const m = /^\[([a-z])\]([\s\S]*)\[\/\1\]$/.exec(x); return m ? `<span class="apartat">${simple(m[2])}</span>` : simple(x); }).join('');
function text(t) {
  const tr = String(t || '').split(/(\[(?:mat|calc|nota)\][\s\S]*?\[\/(?:mat|calc|nota)\])/);
  return tr.map(x => { const m = /^\[(mat|calc|nota)\]([\s\S]*)\[\/\1\]$/.exec(x); return m ? `<span class="frase-${m[1]}">${apartats(m[2])}</span>` : (tr.length > 1 && !x.trim() ? '' : apartats(x)); }).join('');
}

/* ── Base de dades ─────────────────────────────────────────────────── */
const enCurs = {}, pendent = {};
async function desa(id, nou) {
  if (nou) docs[id] = nou;
  if (!db) { missatge('Sense base de dades: el canvi no s\'ha desat.'); return false; }
  if (!potEscriure) return false;
  if (enCurs[id]) { pendent[id] = true; return true; }
  enCurs[id] = true;
  let ok = true;
  try {
    const d = docs[id];
    if (!editada(d)) await db.doc('canvis/' + id).delete(); else await db.doc('canvis/' + id).set(JSON.parse(JSON.stringify(d)));
    missatge('');
  } catch (e) {
    ok = false;
    if (e && e.code === 'invalid_argument') { potEscriure = false; missatge('Només el propietari de l\'artifact pot desar canvis.'); }
    else missatge('No s\'ha pogut desar (' + ((e && e.code) || 'error') + ').');
  }
  enCurs[id] = false;
  if (pendent[id]) { pendent[id] = false; return desa(id); }
  return ok;
}

/* ── Portada ───────────────────────────────────────────────────────── */
const valorDe = (f, clau, original) => { const d = docs[f.id]; return d && d.camps && clau in d.camps ? d.camps[clau] : original; };
function capcalera(extra) {
  return `<header class="cap"><h1>Editor de textos</h1>
    <label>Etapa <select id="tria-etapa" class="clicable">${DADES.etapes.map(e => `<option value="${e.id}"${e.id === etapa ? ' selected' : ''}>${esc(e.nom)}</option>`).join('')}</select></label>
    <label>Calculadora <select id="tria-model" class="clicable">${DADES.models.map(m => `<option value="${m.id}"${m.id === model ? ' selected' : ''}>${esc(m.curt)}</option>`).join('')}</select></label>
    ${extra || ''}<span class="estat" id="estat"></span></header>`;
}
function portada() {
  document.body.classList.remove('a-fitxa');
  const blocs = DADES.blocs.filter(b => b.etapes.includes(etapa));
  const grans = blocs.filter(b => !b.petit), petits = blocs.filter(b => b.petit);
  const fs = fitxesDe();
  const marca = f => editada(docs[f.id]) ? '<span class="marca">✎ Editada</span>' : '';
  const titol = f => esc(valorDe(f, 'titol', f.titol));
  app.innerHTML = capcalera() + `<main class="portada">
    <p class="avis"><b>Editor de textos.</b> Navega com al web i obre una fitxa per canviar-ne les frases. Els passos són de la calculadora triada a dalt.
      <span class="marca" style="position:static">✎ Editada</span> = hi has fet canvis o un comentari.</p>
    <div class="bombolles">${petits.flatMap(b => fs.filter(f => f.bloc === b.id).map(f =>
      `<button class="bombolla clicable" style="--cat:${b.color}" data-fitxa="${f.id}">${esc(b.titol)}${marca(f)}</button>`)).join('')}</div>
    <div class="blocs">${grans.map((b, i) => {
      const ll = fs.filter(f => f.bloc === b.id);
      return `<section class="bloc" style="--cat:${b.color}"><span class="num">T${i + 1}</span><h2>${esc(b.titol)}</h2><ol class="llista">${ll.map((f, j) =>
        (j && f.grup && ll[j - 1].grup && f.grup !== ll[j - 1].grup ? '<li class="separa-grup"></li>' : '')
        + `<li><button class="clicable" data-fitxa="${f.id}"><span class="n">${j + 1}</span><span>${titol(f)}</span>${marca(f)}</button></li>`).join('')}</ol></section>`;
    }).join('')}</div></main>`;
  lligaCapcalera();
  app.querySelectorAll('[data-fitxa]').forEach(b => b.addEventListener('click', () => { location.hash = 'fitxa-' + b.dataset.fitxa; }));
}
function lligaCapcalera() {
  document.getElementById('tria-etapa').addEventListener('change', e => { etapa = e.target.value; guarda('ed-etapa', etapa); location.hash = ''; mostra(); });
  document.getElementById('tria-model').addEventListener('change', e => { model = e.target.value; guarda('ed-model', model); mostra(); });
}

/* ── Fitxa ─────────────────────────────────────────────────────────── */
let netejaFitxa = null;
function fitxa(id) {
  const f = fitxesDe().find(x => x.id === id);
  if (!f) { app.innerHTML = capcalera() + `<main class="portada"><p class="avis">La ${esc(curt())} no té la fitxa «${esc(id)}». Tria una altra calculadora o <a href="#">torna a la portada</a>.</p></main>`; lligaCapcalera(); return; }
  document.body.classList.add('a-fitxa');
  const bloc = DADES.blocs.find(b => b.id === f.bloc);
  const grans = DADES.blocs.filter(b => b.etapes.includes(etapa) && !b.petit);
  const t = grans.findIndex(b => b.id === bloc.id);
  const germanes = fitxesDe().filter(x => x.bloc === f.bloc);
  const n = germanes.findIndex(x => x.id === id) + 1;
  document.body.style.setProperty('--cat', bloc.color);

  // Els camps editables, en l'ordre de la pàgina
  const camps = [{clau: 'titol', nom: 'Títol', original: f.titol}, {clau: 'enunciat', nom: 'Enunciat', original: f.enunciat}];
  f.passos.forEach(([tx, err], i) => camps.push({clau: `pas.${i + 1}@${model}`, nom: `Pas ${i + 1}` + (err ? ' · zona d\'error' : ''), original: tx, pas: i, error: err}));
  if (f.tancament) camps.push({clau: 'tancament', nom: `Pas ${f.passos.length + 1} · tancament`, original: f.tancament, pas: f.passos.length});
  const nPassos = f.passos.length + (f.tancament ? 1 : 0);
  const final = f.araTu ? 'Ara tu' : f.provaTu ? 'Prova-ho tu' : null;
  if (f.araTu) camps.push({clau: 'araTu.enunciat', nom: 'Ara tu · enunciat', original: f.araTu.enunciat, pas: nPassos});
  if (f.provaTu) {
    camps.push({clau: 'provaTu.enunciat', nom: 'Prova-ho tu · enunciat', original: f.provaTu.enunciat, pas: nPassos});
    camps.push({clau: 'provaTu.solucio', nom: 'Prova-ho tu · solució', original: f.provaTu.solucio, pas: nPassos});
  }
  obert = id; tocat = false;
  // Un document ja aplicat al web (aplicat: true, el posa Claude) es conserva a la base de dades, però aquí no compta:
  // la fitxa ja porta aquells textos. Si es torna a editar, el document nou el substitueix.
  const desat = docs[id] && !docs[id].aplicat ? docs[id] : null;
  const doc = docs[id] = {id, titol: f.titol, model, camps: Object.assign({}, desat && desat.camps), originals: Object.assign({}, desat && desat.originals),
    comentari: (desat && desat.comentari) || '', actualitzat: (desat && desat.actualitzat) || ''};
  const val = c => (c.clau in doc.camps ? doc.camps[c.clau] : c.original);

  app.innerHTML = `<header class="cap"><button class="torna clicable" id="torna">← Fitxes</button>
      <div class="on-som"><p class="bloc-nom">${t >= 0 ? `T${t + 1} · ` : ''}${esc(bloc.titol)}</p><p id="titol-fitxa"></p><span class="marca" id="xip" hidden>✎ Editada</span></div>
      <label>Calculadora <select id="tria-model" class="clicable">${DADES.models.map(m => `<option value="${m.id}"${m.id === model ? ' selected' : ''}>${esc(m.curt)}</option>`).join('')}</select></label>
      <span class="estat" id="estat"></span></header>
    <main class="contingut"><div class="columna">
      <p class="enunciat" id="enunciat"></p>
      <div class="reproductor"><button class="boto clicable" id="ant" title="Pas anterior">◀</button><button class="boto clicable" id="seg" title="Pas següent">▶</button></div>
      <ol class="passos" id="passos"></ol>
      <section class="prova" id="prova" hidden></section>
    </div><aside class="panell" id="panell"></aside></main>`;
  document.getElementById('torna').addEventListener('click', () => { location.hash = ''; });
  document.getElementById('tria-model').addEventListener('change', e => { model = e.target.value; guarda('ed-model', model); mostra(); });
  const estat = document.getElementById('estat');

  // L'esquerra: enunciat, passos i «Prova-ho tu», amb els textos editats
  const ol = document.getElementById('passos');
  const files = [];
  const fila = (i, num, resumHtml, classe) => {
    const li = document.createElement('li');
    li.className = 'pas' + (classe ? ' ' + classe : '');
    li.innerHTML = `<button class="capr clicable" type="button"><span class="num">${num}</span><span class="resum"></span></button><div class="frase"></div>`;
    li.querySelector('button').addEventListener('click', () => vesA(i));
    ol.append(li);
    return li;
  };
  const zero = document.createElement('li');
  zero.className = 'pas';
  zero.innerHTML = '<div class="capr" style="cursor:default"><span class="resum">Prem ▶ o tria un pas (o un camp de la dreta).</span></div>';
  ol.append(zero);
  for (let i = 0; i < nPassos; i++) files.push(fila(i, i + 1, '', (camps.find(c => c.pas === i) || {}).error ? 'error' : ''));
  const filaFinal = final ? fila(nPassos, nPassos + 1, '', 'final') : null;
  if (filaFinal) filaFinal.querySelector('.resum').textContent = final;
  const pinta = c => {
    const v = val(c);
    if (c.clau === 'titol') document.getElementById('titol-fitxa').textContent = `${n}. ${v}`;
    else if (c.clau === 'enunciat') document.getElementById('enunciat').innerHTML = text(v);
    else if (c.pas !== undefined && c.pas < nPassos) { const h = text(v); files[c.pas].querySelector('.frase').innerHTML = h; files[c.pas].querySelector('.resum').innerHTML = h; }
    else pintaProva();
  };
  function pintaProva() {
    const p = document.getElementById('prova');
    const cv = k => { const c = camps.find(x => x.clau === k); return c ? text(val(c)) : ''; };
    p.innerHTML = f.araTu ? `<h3>Ara tu</h3><div>${cv('araTu.enunciat')}</div>`
      : f.provaTu ? `<h3>Prova-ho tu</h3><div>${cv('provaTu.enunciat')}</div><div class="sol"><b>Solució:</b><br>${cv('provaTu.solucio')}</div>` : '';
  }
  // Pas actual: -1 = cap
  let idx = -1;
  function vesA(i, desDelPanell) {
    idx = Math.max(-1, Math.min(nPassos + (final ? 0 : -1), i));
    files.forEach((li, k) => { li.classList.toggle('actual', k === idx); li.classList.toggle('fet', k < idx); });
    if (filaFinal) filaFinal.classList.toggle('actual', idx === nPassos);
    zero.classList.toggle('actual', idx < 0);
    document.getElementById('prova').hidden = idx !== nPassos;
    document.getElementById('ant').disabled = idx < 0;
    document.getElementById('seg').disabled = idx >= nPassos + (final ? 0 : -1);
    const actualLi = idx < 0 ? zero : idx === nPassos ? filaFinal : files[idx];
    aLaVista(actualLi, document.querySelector('.columna'));
    for (const e of elements) e.el.classList.toggle('actual', e.c.pas === idx);
    if (!desDelPanell) { const e = elements.find(x => x.c.pas === idx); if (e) aLaVista(e.el, panell); }
  }
  document.getElementById('ant').addEventListener('click', () => vesA(idx - 1));
  document.getElementById('seg').addEventListener('click', () => vesA(idx + 1));

  // La dreta: l'editor
  const panell = document.getElementById('panell');
  panell.innerHTML = `<div class="panell-cap"><b>Editor de textos</b><span class="panell-model">${esc(curt())}</span>
      <span class="eines" role="toolbar" aria-label="Símbols">${['B', '→', '•', '$$', '≃', '€', '⇒', '⇔'].map(t => `<button type="button" class="eina clicable" data-eina="${t}" title="${t === '$$' ? 'Posa el text seleccionat entre $…$ (fórmula)' : t === 'B' ? 'Posa el text seleccionat en negreta (**…**)' : t === '≃' ? 'Escriu \\simeq al camp (aproximadament igual, dins d\'una fórmula $…$)' : 'Copia ' + t + ' al porta-retalls'}">${t}</button>`).join('')}</span>
      <span class="copiat" id="copiat" aria-live="polite"></span></div>
    <details class="ajuda"><summary class="clicable">Com s'escriu</summary><ul>
      <li><code>$…$</code> fórmula · <code>$$…$$</code> fórmula en una línia pròpia</li>
      <li><code>[mat]…[/mat]</code> frase de matemàtiques · <code>[calc]…[/calc]</code> frase de calculadora · <code>[nota]…[/nota]</code> nota</li>
      <li><code>**a)**</code> negreta · <code>$3{,}50$ €</code> el € fora de la fórmula</li>
      <li><code>[[exe]]</code> una tecla · <code>{{Menú}}</code> una opció de menú · <code>!!Error típic!!</code> avís vermell</li>
      <li>Retorn = línia nova · <code>• </code> davant de cada dada de l'enunciat</li>
      <li>Els passos són de la calculadora triada (${esc(curt())}): si canvies un pas, Claude farà el mateix canvi a les altres calculadores quan el pas sigui equivalent.</li>
    </ul></details>`;
  const ajusta = ta => { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; };
  // Les icones: →, •, ⇒ i ⇔ es copien al porta-retalls; $$ posa la selecció del camp entre $…$ (sense selecció, $$ amb el
  // cursor al mig). Els botons no prenen el focus (mousedown), perquè el camp no perdi la selecció.
  let darrerCamp = null;
  panell.addEventListener('focusin', e => { if (e.target.tagName === 'TEXTAREA') darrerCamp = e.target; });
  const avisCopiat = t => { const c = document.getElementById('copiat'); c.textContent = t; clearTimeout(avisCopiat.t); avisCopiat.t = setTimeout(() => { c.textContent = ''; }, 1600); };
  panell.querySelectorAll('.eina').forEach(b => {
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', async () => {
      const t = b.dataset.eina;
      if (t === 'B') {
        const ta = darrerCamp;
        if (!ta) { avisCopiat('Primer selecciona el text d\'un camp'); return; }
        const a = ta.selectionStart, z = ta.selectionEnd, sel = ta.value.slice(a, z);
        ta.focus();
        ta.setRangeText('**' + sel + '**', a, z, sel ? 'end' : 'start');
        if (!sel) ta.setSelectionRange(a + 2, a + 2);
        ta.dispatchEvent(new Event('input'));
        return;
      }
      if (t === '≃') {
        // ≃ és \simeq (LaTeX): s'escriu al camp, on hi ha el cursor, amb un espai al darrere. Si no és dins de $…$, l'embolcalla.
        const ta = darrerCamp;
        if (!ta) { avisCopiat('Primer posa el cursor en un camp'); return; }
        const a = ta.selectionStart, z = ta.selectionEnd, abans = ta.value.slice(0, a);
        const dins = (abans.match(/\$/g) || []).length % 2 === 1;
        ta.focus();
        ta.setRangeText(dins ? '\\simeq ' : '$\\simeq$', a, z, 'end');
        ta.dispatchEvent(new Event('input'));
        avisCopiat(dins ? 'Escrit: \\simeq' : 'Escrit: $\\simeq$');
        return;
      }
      if (t === '$$') {
        const ta = darrerCamp;
        if (!ta) { avisCopiat('Primer selecciona el text d\'un camp'); return; }
        const a = ta.selectionStart, z = ta.selectionEnd, sel = ta.value.slice(a, z);
        ta.focus();
        ta.setRangeText('$' + sel + '$', a, z, sel ? 'end' : 'start');
        if (!sel) ta.setSelectionRange(a + 1, a + 1);
        ta.dispatchEvent(new Event('input'));
        return;
      }
      try { await navigator.clipboard.writeText(t); avisCopiat('Copiat: ' + t); }
      catch (e) {
        // Sense permís per al porta-retalls: s'escriu al camp, on hi ha el cursor
        if (darrerCamp) { darrerCamp.focus(); darrerCamp.setRangeText(t, darrerCamp.selectionStart, darrerCamp.selectionEnd, 'end'); darrerCamp.dispatchEvent(new Event('input')); avisCopiat('Escrit al camp: ' + t); }
        else avisCopiat('No es pot copiar');
      }
    });
  });
  let temps = null;
  const pintaXip = () => { document.getElementById('xip').hidden = !editada(doc); };
  function programa() {
    clearTimeout(temps);
    estat.textContent = 'Desant…'; estat.classList.remove('mal');
    temps = setTimeout(async () => {
      doc.actualitzat = new Date().toISOString(); doc.model = model;
      const ok = await desa(id, doc);
      estat.textContent = ok ? 'Desat ✓' : 'No desat'; estat.classList.toggle('mal', !ok);
    }, 700);
  }
  const elements = camps.map(c => {
    const el = document.createElement('section');
    el.className = 'camp';
    el.innerHTML = `<div class="camp-cap"><span class="camp-nom">${esc(c.nom)}</span><button type="button" class="petit-boto clicable" hidden>Torna a l'original</button></div><textarea spellcheck="true" lang="ca" rows="2"></textarea>`;
    const ta = el.querySelector('textarea'), torna = el.querySelector('button');
    ta.value = val(c);
    const marca = () => { const e = c.clau in doc.camps; el.classList.toggle('editat', e); torna.hidden = !e; };
    ta.addEventListener('input', () => {
      if (ta.value === c.original) { delete doc.camps[c.clau]; delete doc.originals[c.clau]; } else { doc.camps[c.clau] = ta.value; doc.originals[c.clau] = c.original; }
      tocat = true; ajusta(ta); marca(); pinta(c); pintaXip(); programa();
    });
    torna.addEventListener('click', () => { ta.value = c.original; ta.dispatchEvent(new Event('input')); ta.focus(); });
    ta.addEventListener('focus', () => { if (c.pas !== undefined && c.pas !== idx) vesA(c.pas, true); });
    marca(); pinta(c);
    panell.append(el);
    return {c, el, ta};
  });
  const com = document.createElement('section');
  com.className = 'camp comentari';
  com.innerHTML = '<div class="camp-cap"><span class="camp-nom">Comentari general sobre aquesta fitxa (opcional)</span></div><textarea rows="3" placeholder="Qualsevol cosa per a Claude sobre aquesta fitxa…"></textarea>';
  const cta = com.querySelector('textarea');
  cta.value = doc.comentari;
  const marcaCom = () => com.classList.toggle('editat', Boolean(doc.comentari.trim()));
  cta.addEventListener('input', () => { tocat = true; doc.comentari = cta.value; ajusta(cta); marcaCom(); pintaXip(); programa(); });
  marcaCom();
  panell.append(com);
  pintaProva(); pintaXip(); vesA(-1);
  estat.textContent = editada(doc) ? 'Desat ✓' : '';
  requestAnimationFrame(() => { for (const e of elements) ajusta(e.ta); ajusta(cta); });
  // Fletxes del teclat: pas anterior / següent (fora dels camps de text)
  const tecles = e => {
    if (e.target.closest('textarea, select, input')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); vesA(idx + 1); }
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); vesA(idx - 1); }
  };
  document.addEventListener('keydown', tecles);
  netejaFitxa = () => document.removeEventListener('keydown', tecles);
}

/* ── Navegació (#fitxa-<id>, o res = la portada) ───────────────────── */
function mostra() {
  if (netejaFitxa) { netejaFitxa(); netejaFitxa = null; }
  obert = null;
  const m = /^#fitxa-([a-z0-9-]+)$/.exec(location.hash);
  if (m) fitxa(m[1]); else portada();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', mostra);
mostra();

(async () => {
  const rellotge = setTimeout(() => missatge('Encara no es pot llegir la base de dades: els canvis potser no es desaran.'), 10000);
  try { db = window.claude && await window.claude.use('db'); } catch (e) { db = null; }
  if (!db) { clearTimeout(rellotge); missatge('Aquesta vista no té base de dades: els canvis no es desaran.'); return; }
  let primera = true;
  db.collection('canvis').onSnapshot(snap => {
    // El document de la fitxa oberta no es toca (la pàgina en té l'última versió), llevat que encara no s'hi hagi escrit res
    const respecta = id => enCurs[id] || (id === obert && tocat);
    for (const d of snap.docs) if (!respecta(d.id)) docs[d.id] = JSON.parse(JSON.stringify(d.data()));
    for (const ch of snap.docChanges()) if (ch.type === 'removed' && !respecta(ch.doc.id)) delete docs[ch.doc.id];
    if (!snap.metadata.fromCache) { clearTimeout(rellotge); missatge(''); }
    // La primera vegada es torna a dibuixar (amb els canvis desats); després, només la portada (a la fitxa no es trepitja el que s'escriu)
    if (!/^#fitxa-/.test(location.hash) || (primera && !tocat)) mostra();
    primera = false;
  }, e => { clearTimeout(rellotge); missatge('No es pot llegir la base de dades (' + ((e && e.code) || 'error') + ').'); });
})();
})();
</script>
