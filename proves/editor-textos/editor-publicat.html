m 2: la calculadora torna a la pantalla de càlcul, i a la barra ja no hi ha FIX.[/calc]",0],["[calc]Torna a demanar el decimal: 0.1666666667.[/calc] [mat]Arrodoneix tu al final, només quan escriguis la resposta.[/mat]",0]],"araTu":{"enunciat":"A la barra hi ha FIX. Treu-lo i calcula el decimal de $\\frac{2}{3}$ amb tots els decimals."}},{"id":"frac-plantilla","bloc":"fraccions","titol":"Escriu una fracció amb la plantilla","enunciat":"Calcula $\\frac{3}{4}+\\frac{5}{6}$ escrivint les fraccions amb la tecla de fracció.","font":"","passos":[["[calc]Prem [[frac]]: surt la plantilla de fracció, amb el cursor al numerador. Escriu el 3, baixa al denominador amb [[down]] i escriu el 4.[/calc]",0],["[calc]Per sortir del denominador, prem [[right]]; ara ja pots escriure el [[mes]]. Sense el [[right]], el «+» s'escriuria dins del 4.[/calc]",0],["[calc]La segona fracció, igual: [[frac]], el 5, [[down]] i el 6.[/calc]",0],["[calc]Prem [[exe]]: $\\frac{3}{4}+\\frac{5}{6}=\\frac{19}{12}$. Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 1.583333333.[/calc]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i escriu $\\frac{3}{4}$; sense prémer [[right]], prem [[mes]]: el «+» queda dins del denominador.[/calc]",1],["[calc]Acaba igual i prem [[exe]]: surt $\\frac{18}{29}$, perquè has calculat $\\frac{3}{4+\\frac{5}{6}}$. Després del denominador, sempre [[right]].[/calc]",1]],"tancament":"[calc]Recorda: després d'escriure el denominador, prem [[right]] per sortir de la fracció.[/calc] [mat]$\\frac{3}{4}+\\frac{5}{6}=\\frac{19}{12}$.[/mat]","araTu":{"enunciat":"Calcula $\\frac{2}{5}+\\frac{1}{3}$ amb la plantilla de fracció."}},{"id":"frac-prioritat","bloc":"fraccions","titol":"Fracció de sumes: on van els parèntesis","enunciat":"Calcula $\\frac{2+3}{4-1}$. Una manera d'escriure-ho dona un resultat equivocat.","font":"","passos":[["[calc]!!Error típic!!, com no s'ha de fer: tot en una línia, $2+3\\div 4-1$.[/calc]",1],["[calc]Prem [[exe]]: surt $\\frac{7}{4}$, no $\\frac{5}{3}$. La calculadora divideix només el 3 entre 4: $2+\\frac{3}{4}-1$. (Surt en fracció perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 1.75.)[/calc]",1],["[calc]Ara bé: prem [[frac]] i escriu tot el numerador, $2+3$.[/calc]",0],["[calc]Baixa amb [[down]] i escriu tot el denominador, $4-1$. La barra de la fracció ja fa de parèntesi.[/calc]",0],["[calc]Prem [[exe]]: $\\frac{5}{3}$. També aniria bé $(2+3)\\div(4-1)$ amb parèntesis, però la plantilla és més curta.[/calc]",0]],"araTu":{"enunciat":"Calcula $\\frac{7-1}{2+1}$ amb la plantilla de fracció."}},{"id":"pot-negativa","bloc":"fraccions","titol":"Potències de negatius","enunciat":"Calcula $(-2)^4$. Si t'oblides dels parèntesis, el resultat és diferent del que tu esperaves.","font":"","passos":[["[calc]La base és $-2$: escriu-la entre parèntesis, amb [[lpar]], [[neg]], el 2 i [[rpar]]. El signe negatiu és la tecla [[neg]], no la de restar.[/calc]",0],["[calc]Prem [[pot]]: l'exponent surt en petit. Escriu el 4.[/calc]",0],["[calc]Prem [[exe]]: $(-2)^4=16$.[/calc]",0],["[calc]!!Error típic!!: sense parèntesis. Esborra amb [[ac]] i escriu $-2^4$: [[neg]], el 2, [[pot]] i el 4.[/calc]",1],["[calc]Prem [[exe]]: surt −16.[/calc] [mat]La potència té més prioritat que el signe: és $-(2^4)$. Per elevar un negatiu, sempre amb parèntesis.[/mat]",1]],"tancament":"[mat]Recorda: per elevar un nombre negatiu, posa'l entre parèntesis: $(-2)^4=16$.[/mat]","araTu":{"enunciat":"Calcula $(-3)^4$."}},{"id":"pot-fraccio","bloc":"fraccions","titol":"Potència d'una fracció","enunciat":"Calcula $\\left(\\frac{2}{3}\\right)^{-2}$.","font":"","passos":[["[calc]Escriu la fracció entre parèntesis: [[lpar]], [[frac]], el 2, [[down]] i el 3.[/calc]",0],["[calc]Surt de la fracció amb [[right]] i tanca amb [[rpar]].[/calc] [mat]Els parèntesis diuen que l'exponent afecta tota la fracció.[/mat]",0],["[calc]Prem [[pot]] i escriu l'exponent $-2$: [[neg]] i el 2.[/calc]",0],["[calc]Prem [[exe]]: $\\left(\\frac{2}{3}\\right)^{-2}=\\frac{9}{4}$.[/calc] [mat]Un exponent negatiu inverteix la fracció.[/mat] [calc]Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 2.25.[/calc]",0],["[calc]!!Error típic!!: sense parèntesis. Esborra amb [[ac]] i escriu [[frac]], el 2, [[down]] i el 3, i no surtis del denominador.[/calc]",1],["[calc]Si ara prems [[pot]], l'exponent $-2$ s'escriu dins del denominador: només afecta el 3.[/calc]",1],["[calc]Prem [[exe]]: surt 18, perquè $\\frac{2}{3^{-2}}=\\frac{2}{1/9}$. Els parèntesis són imprescindibles.[/calc]",1]],"tancament":"[mat]Recorda: per elevar una fracció, posa-la entre parèntesis: $\\left(\\frac{2}{3}\\right)^{-2}=\\frac{9}{4}$.[/mat]","araTu":{"enunciat":"Calcula $\\left(\\frac{3}{2}\\right)^{-3}$."}},{"id":"arrel-n","bloc":"fraccions","titol":"Arrels quadrades, cúbiques, ...","enunciat":"Calcula l'arrel cúbica de $-27$, és a dir, $\\sqrt[3]{-27}$.","font":"","passos":[["[calc]Prem [[shift]] i [[pot]] (a sobre de la tecla hi ha l'arrel d'índex n, $\\sqrt[\\blacksquare]{\\square}$). Surt una arrel amb dos quadres: el petit és l'índex i el gran, el radicand.[/calc]",0],["[calc]Escriu l'índex, el 3, i prem [[right]] per passar al radicand.[/calc]",0],["[calc]Escriu el radicand, $-27$: [[neg]], el 2 i el 7.[/calc]",0],["[calc]Prem [[exe]]: $\\sqrt[3]{-27}=-3$, perquè $(-3)^3=-27$.[/calc] [mat]Una arrel d'índex senar d'un negatiu sí que existeix.[/mat]",0],["[calc]Amb qualsevol altre índex, igual: [[shift]] [[pot]], l'índex, [[right]] i el radicand.[/calc] [mat]Per exemple, $\\sqrt[4]{16}=2$.[/mat]",0]],"araTu":{"enunciat":"Calcula $\\sqrt[5]{-32}$."}},{"id":"canvia-radians","bloc":"angles","titol":"Posa la calculadora en radians","enunciat":"En un exercici de trigonometria cal treballar en radians: calcula $\\sin\\frac{\\pi}{6}$.","font":"","passos":[["[calc]Ara la calculadora és en graus: a la barra hi ha D.[/calc] [mat]Si l'angle porta π, o és la x d'una funció, ha de ser R.[/mat]",0],["[calc]Prem [[shift]] i [[menu]] (a sobre hi ha CONFIG): el menú de configuració. Les opcions es trien prement el seu número.[/calc]",0],["[calc]Prem 2: {{2:Unidad angular}}. {{1:Grado sexag (D)}} són els graus sexagesimals.[/calc]",0],["[calc]Prem 2: {{2:Radián}}. La calculadora torna a la pantalla de càlcul, i a la barra ara hi ha R.[/calc]",0],["[calc]Escriu $\\mathrm{sen}(\\pi\\div 6)$. La π és [[shift]] [[exp]]. A la calculadora, el sinus (sin) es diu sen.[/calc]",0],["[calc]Prem [[exe]]: $\\sin\\frac{\\pi}{6}=\\frac{1}{2}$. Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 0.5.[/calc]",0]],"araTu":{"enunciat":"Ara que la calculadora és en radians (R), calcula $\\cos\\frac{\\pi}{4}$."}},{"id":"error-angles","bloc":"angles","titol":"Troba l'error: el mode equivocat","enunciat":"La Laia calcula $\\cos\\frac{\\pi}{3}$, que hauria de ser $\\frac{1}{2}$, però la calculadora li dona aquest resultat: 0.9998329795.\nQuè ha passat?","font":"","passos":[["[calc]!!Error típic!!: el que ha fet la Laia, $\\cos(\\pi\\div 3)$ i [[exe]]. Surt 0.9998329795, i no $\\frac{1}{2}$.[/calc]",1],["[calc]Mira la barra: D. La calculadora ha entès «π/3 graus», un angle d'un grau escàs, i el seu cosinus és gairebé 1.[/calc]",1],["[calc]Ho arreglem: [[shift]] [[menu]] (CONFIG) i 2 ({{2:Unidad angular}}).[/calc]",0],["[calc]Prem 2 ({{2:Radián}}): tornes a la pantalla de càlcul, i ara hi ha R.[/calc]",0],["[calc]El mateix càlcul dona $\\frac{1}{2}$. Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 0.5.[/calc]",0],["[calc]!!Error típic!!, el contrari: esborra amb [[ac]] i calcula $\\mathrm{sen}(30)$ en radians: és el sinus de 30 radians, −0.9880316241. Si el 30 són graus, la calculadora ha de ser en D.[/calc]",1]],"tancament":"[calc]Recorda: abans de calcular, mira la unitat dels angles a dalt de la pantalla: R si l'angle és en radians (per exemple, si porta π); D si és en graus.[/calc]","araTu":{"enunciat":"Amb la calculadora en radians (R a la barra), calcula $\\cos\\frac{2\\pi}{3}$."}},{"id":"graus-radians","bloc":"angles","titol":"Convertir de graus a radiants","enunciat":"Expressa en radiants un angle de $60^\\circ$.","font":"","passos":[["[mat]Per canviar d'unitats es multiplica per un factor de conversió que val 1: $\\frac{\\pi\\ \\mathrm{rad}}{180^\\circ}$, perquè $\\pi$ rad i $180^\\circ$ són el mateix angle.[/mat] [calc]Escriu 60 i [[per]].[/calc]",0],["[mat]$60^\\circ\\cdot\\frac{\\pi\\ \\mathrm{rad}}{180^\\circ}$: els graus que vols treure van al denominador i se simplifiquen amb els de dalt; només hi queden radiants.[/mat] [calc]Prem [[frac]], escriu π ([[shift]] [[exp]]) al numerador i, amb [[down]], 180 al denominador.[/calc]",0],["[calc]Prem [[exe]]: obtens $\\frac{\\pi}{3}$. Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 1.047197551.[/calc] [mat]$60^\\circ=\\frac{\\pi}{3}$ rad.[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i escriu el factor capgirat, $\\frac{180}{\\pi}$.[/calc] [mat]$60^\\circ\\cdot\\frac{180^\\circ}{\\pi\\ \\mathrm{rad}}$: els graus queden a dalt tots dos cops i no se simplifiquen. El que surt ja no són radiants.[/mat]",1],["[calc]Prem [[shift]] [[exe]] (≈): surt 3437.746771.[/calc] [mat]No pot ser: 1 rad són uns $57^\\circ$, així que $60^\\circ$ ha de ser una mica més d'1 rad. El factor de conversió estava capgirat: no s'han simplificat els graus.[/mat]",1]],"tancament":"[mat]Recorda: al factor de conversió, al numerador hi va la unitat que vols ($\\pi$ rad) i al denominador la que vols treure ($180^\\circ$), perquè se simplifiqui.\n$60^\\circ=\\frac{\\pi}{3}$ rad.[/mat]","araTu":{"enunciat":"Expressa en radiants un angle de $135^\\circ$."}},{"id":"definir-fx","bloc":"pau","titol":"Calcula valors d'una funció amb \"Tabla\"","enunciat":"Sigui $f(x)=x^3-3x+2$. La funció derivada és $f'(x)=3x^2-3$.\nResolent l'equació $f'(x)=0$ has obtingut els punts crítics: $x=-1$ i $x=1$.\n\nTroba les coordenades del mínim relatiu R(x,y) i del màxim relatiu S(x,y).","font":"","passos":[["[calc]Escriuràs $f$ i $g$ un sol cop, a l'aplicació {{Tabla}}. Prem [[menu]]: surten les aplicacions; {{Tabla}} és la 3.[/calc]",0],["[calc]Prem 3: la calculadora demana $f(x)$.[/calc]",0],["[calc]Escriu $x^3-3x+2$. La $x$ és la tecla [[x]]; l'exponent és [[pot]] i, amb [[right]], en surts.[/calc]",0],["[calc]Prem [[exe]]: ara demana $g(x)$.[/calc]",0],["[calc]Escriu $g=f'=3x^2-3$. L'exponent 2 té tecla pròpia: [[x2]].[/calc]",0],["[calc]Prem [[exe]]: surt el rang de la taula, des de quina $x$ ({{Inic.}}) fins a quina ({{Final}}) i de quant en quant ({{Paso}}).[/calc]",0],["[mat]Vols $x=-1$, $0$, $1$ i $2$.[/mat] [calc]{{Inic.}}: $-1$ ([[neg]] i l'1) i [[exe]]. {{Final}}: 2 i [[exe]]. El pas, 1, ja hi és.[/calc]",0],["[calc]Prem [[exe]]: la taula. Cada fila és una $x$, amb el seu $f(x)$ i el seu $g(x)$.[/calc]",0],["[calc]Amb [[right]] vas a la columna de $f$: a baix surt el valor de la cel·la triada.[/calc] [mat]$f(-1)=4$: el punt és $(-1,\\,4)$.[/mat]",0],["[mat]Dues files més avall, $f(1)=0$: el punt és $(1,\\,0)$.[/mat]",0],["[mat]Per saber quin és el mínim, mira el signe de $g$ entre els dos punts: $g(0)=-3<0$, així que $f$ decreix de $x=-1$ a $x=1$. El màxim és $S(-1,\\,4)$ i el mínim és $R(1,\\,0)$. R és a l'eix $OX$ perquè $x=1$ és arrel doble de $f=(x-1)^2(x+2)$.[/mat]",0],["[mat]La taula també dona la recta tangent a $x=2$: el punt, $f(2)=4$ (a l'esquerra), i el pendent, $g(2)=9$. La tangent és $y-4=9(x-2)$, és a dir, $y=9x-14$.[/mat]",0]],"araTu":{"enunciat":"Troba la recta tangent a la gràfica de $f(x)=x^3-3x+2$ a $x=-2$. Recorda que $f'(x)=3x^2-3$."}},{"id":"barrow","bloc":"pau","titol":"Regla de Barrow: substitueix a la primitiva","enunciat":"La superfície del terreny és $\\int_1^6 f(x)\\,dx-\\frac{25}{2}$, amb $f(x)=-x^3+7x^2-6x+5$ (el $\\frac{25}{2}$ és el triangle que no hi entra). A mà has trobat la primitiva $F(x)=-\\frac{x^4}{4}+\\frac{7x^3}{3}-3x^2+5x$. Calcula $F(6)-F(1)$ amb la calculadora.","font":"PAU juny 2024, qüestió 3 b)","passos":[["[mat]Regla de Barrow: $F(6)-F(1)$. Primer, $F(6)$: a la primitiva, cada $x$ és un 6.[/mat] [calc]$-\\frac{6^4}{4}$: [[neg]], [[frac]], el 6, [[pot]] 4, [[right]] per sortir de l'exponent, [[down]], 4 i [[right]]. Després, igual, $+\\frac{7\\times 6^3}{3}$.[/calc]",0],["[calc]I la resta, $-3\\times 6^2+5\\times 6$. El quadrat és [[x2]].[/calc]",0],["[calc]Prem [[exe]]: $F(6)=102$.[/calc]",0],["[mat]Ara $F(1)$: amb $x=1$, totes les potències valen 1, i $F(1)=-\\frac{1}{4}+\\frac{7}{3}-3+5$.[/mat] [calc]Escriu [[ans]] (és $F(6)$), [[menys]] i $F(1)$ entre parèntesis.[/calc]",0],["[calc]Prem [[exe]]: $\\int_1^6 f(x)\\,dx=\\frac{1175}{12}$, exacte perquè la calculadora és en mode {{E Mat/S Mat}} (en mode {{E Mat/S Decimal}} sortiria 97.91666667). Sense fer les fraccions a mà.[/calc]",0],["[calc]Resta-hi el triangle: [[ans]], [[menys]] i $\\frac{25}{2}$.[/calc] [mat]La superfície és $\\frac{1025}{12}\\approx 85{,}42\\,\\text{u}^2$, com a la pauta.[/mat]",0]]},{"id":"ans","bloc":"pau","titol":"Reutilitza l'últim resultat (Ans)","enunciat":"Calcula $\\dfrac{8}{\\sin 35^\\circ}$ amb la calculadora en graus, sense copiar cap decimal intermedi.","font":"","passos":[["[calc]Primer, $\\sin 35^\\circ$: [[sen]], el 35 i [[rpar]].[/calc]",0],["[calc]Prem [[exe]]. La calculadora desa el resultat a [[ans]] sense arrodonir-lo: la pantalla només en mostra els deu primers dígits.[/calc]",0],["[mat]Ara vols $8\\div\\sin 35^\\circ$.[/mat] [calc]No escriguis el decimal: escriu 8, [[entre]] i la tecla [[ans]].[/calc]",0],["[calc]Prem [[exe]]: 13.94757436. Cap decimal copiat, cap error d'arrodoniment.[/calc]",0],["[calc]Si ara en vols el doble, no cal [[ans]]: després d'un resultat, una operació com [[per]] ja comença amb Ans.[/calc]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i copia només 0.57 en lloc de $\\sin 35^\\circ$. Surt $\\frac{800}{57}\\approx 14{,}04$ i no 13,95: ja falla el primer decimal. (Surt en fracció perquè la calculadora és en mode {{E Mat/S Mat}}.)[/calc]",1]],"tancament":"[calc]Recorda: per fer servir un resultat en el càlcul següent, prem [[ans]]. Així t'estalvies copiar tots els decimals.[/calc]","araTu":{"enunciat":"Calcula $\\dfrac{10}{\\cos 40^\\circ}$ amb la calculadora en graus, sense copiar cap decimal intermedi."}},{"id":"logaritmes","bloc":"pau","titol":"Logaritme en qualsevol base","enunciat":"Resol l'equació $3^x=7$: calcula $x=\\log_3 7$ i comprova el resultat.","font":"","passos":[["[calc]Prem [[logab]]: surt un logaritme amb dos quadres. El petit és la base i el gran, el nombre.[/calc]",0],["[calc]Escriu la base, el 3, i prem [[right]] per passar al nombre.[/calc]",0],["[calc]Escriu el 7. El parèntesi ja hi és: no cal tancar-lo.[/calc]",0],["[calc]Prem [[exe]]: $x=\\log_3 7\\approx 1{,}7712$.[/calc]",0],["[mat]Comprova-ho: $3^x$ ha de valer 7.[/mat] [calc]Escriu 3, [[pot]] i, a l'exponent, [[ans]] (el resultat d'abans, sense copiar-lo).[/calc]",0],["[calc]Prem [[exe]]: surt 7. ✓[/calc]",0],["[calc]Per a base 10 i per a base $e$ hi ha tecles pròpies: log és [[shift]] [[neg]] i ln és [[ln]]. Prova $\\log 1000$.[/calc]",0],["[calc]Prem [[exe]]: $\\log 1000=3$.[/calc]",0]],"araTu":{"enunciat":"Resol l'equació $2^x=10$: calcula $x=\\log_2 10$ i comprova el resultat."}},{"id":"combinatoria","bloc":"pau","titol":"Nombres combinatoris","enunciat":"Una variable $X$ segueix una binomial amb $n=6$ i $p=\\frac{1}{3}$.\nCalcula $P(X=4)=\\binom{6}{4}\\left(\\frac{1}{3}\\right)^{4}\\left(\\frac{2}{3}\\right)^{2}$.","font":"","passos":[["[calc]Escriu el 6 i prem [[shift]] [[entre]]: a sobre de ÷ hi ha nCr, el nombre combinatori. S'escriu una C darrere del 6.[/calc]",0],["[calc]Escriu el 4: «6C4» és $\\binom{6}{4}$.[/calc]",0],["[mat]Ara $p^4=\\left(\\frac{1}{3}\\right)^4$.[/mat] [calc]Prem [[per]], obre un parèntesi i escriu la fracció $\\frac{1}{3}$ amb [[frac]].[/calc]",0],["[calc]Surt de la fracció amb [[right]], tanca amb [[rpar]] i escriu l'exponent amb [[pot]] i el 4.[/calc]",0],["[mat]I $(1-p)^2=\\left(\\frac{2}{3}\\right)^2$.[/mat] [calc]Surt de l'exponent amb [[right]] i fes el mateix: [[per]], $\\left(\\frac{2}{3}\\right)$ i l'exponent 2.[/calc]",0],["[calc]Prem [[exe]]: $P(X=4)=\\frac{20}{243}$, perquè $\\binom{6}{4}=15$. Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 0.08230452675. A sobre de × hi ha nPr (permutacions) i, a sobre de [[inv]], el factorial, $x!$.[/calc]",0]],"araTu":{"enunciat":"Amb $n=8$ i $p=\\frac{1}{2}$, calcula $P(X=3)=\\binom{8}{3}\\left(\\frac{1}{2}\\right)^{8}$."}},{"id":"verificar","bloc":"pau","titol":"Comprova una igualtat","enunciat":"Comprova que es compleix aquesta igualtat: $\\dfrac{1}{\\sqrt{2}}=\\dfrac{\\sqrt{2}}{2}$.","font":"","passos":[["[calc]Prem [[menu]]: surten les aplicacions de la calculadora. {{Verificar}} és la 4.[/calc]",0],["[calc]Prem 4: entres a {{Verificar}}. Compte: en canviar d'aplicació, l'historial s'esborra.[/calc]",0],["[calc]Escriu el primer membre: [[frac]], el 1, [[down]], [[arrel]] i el 2.[/calc]",0],["[calc]Surt de l'arrel i de la fracció amb dos [[right]] i prem [[optn]]: hi ha els signes =, ≠, >, <, ≥ i ≤.[/calc]",0],["[calc]Prem 1: el signe {{1:=}}.[/calc]",0],["[calc]Escriu el segon membre: [[frac]], [[arrel]], el 2, [[right]] per sortir de l'arrel, [[down]] i el 2.[/calc]",0],["[calc]Prem [[exe]]: {{Verdadero}}. Si no fos cert, diria {{Falso}}. Compte: ara [[ans]] val 1 (o 0 si és fals), i si verifiques una solució arrodonida pot sortir {{Falso}} encara que sigui bona.[/calc]",0],["[calc]Quan acabis, torna a {{Calcular}}: [[menu]] i 1.[/calc]",0]],"araTu":{"enunciat":"Comprova amb {{Verificar}} que $\\sqrt{12}=2\\sqrt{3}$."}},{"id":"producte-escalar-vectorial","bloc":"pau","titol":"Producte escalar i producte vectorial","enunciat":"Siguin $\\vec u=(2,-1,3)$ i $\\vec v=(1,4,-2)$.\nCalcula el producte escalar $\\vec u\\cdot\\vec v$ i el producte vectorial $\\vec u\\times\\vec v$.","font":"","passos":[["[mat]$\\vec u\\cdot\\vec v=u_1v_1+u_2v_2+u_3v_3$.[/mat] [calc]Escriu-ho en una sola línia. Els nombres negatius, entre parèntesis; el signe és [[neg]].[/calc]",0],["[calc]Prem [[exe]].[/calc] [mat]$\\vec u\\cdot\\vec v=-8$.[/mat]",0],["[mat]Al producte vectorial, cada component és un determinant 2×2. La primera és $u_2v_3-u_3v_2=-10$.[/mat] [calc]Escriu-la i prem [[exe]]: després d'un resultat, un número nou comença un càlcul nou.[/calc]",0],["[mat]La segona, $u_3v_1-u_1v_3=7$.[/mat]",0],["[mat]La tercera, $u_1v_2-u_2v_1=9$. Per tant, $\\vec u\\times\\vec v=(-10,\\,7,\\,9)$.[/mat]",0]]},{"id":"pau-alg-24j-q2","bloc":"pau-ag","titol":"(2024). Comprova la solució d'un sistema","enunciat":"Per a $k=0$, el sistema és $$\\begin{cases}4x+2y-z=4\\\\ x-y=3\\\\ 3x+3y=1\\end{cases}$$ i has obtingut la solució $$x=\\frac{5}{3},\\qquad y=-\\frac{4}{3},\\qquad z=0.$$ Comprova que la solució trobada és correcta amb la calculadora.","font":"PAU juny 2024, qüestió 2 a)","passos":[["[calc]Primera equació, $4x+2y-z$: escriu $4\\times\\frac{5}{3}+2\\times\\left(-\\frac{4}{3}\\right)-0$. Posa $y$ entre parèntesis; el signe negatiu és la tecla [[neg]], no la de restar.[/calc]",0],["[calc]Prem [[exe]]: surt 4, que és el membre de la dreta. ✓[/calc]",0],["[calc]Segona equació, $x-y$ (amb $k=0$, el terme $kz$ no hi és): escriu $\\frac{5}{3}-\\left(-\\frac{4}{3}\\right)$. No cal esborrar res: en començar a escriure, el càlcul anterior desapareix.[/calc]",0],["[calc]Prem [[exe]]: surt 3, el membre de la dreta. ✓[/calc]",0],["[calc]Tercera equació, $3x+3y$: escriu $3\\times\\frac{5}{3}+3\\times\\left(-\\frac{4}{3}\\right)$.[/calc]",0],["[calc]Prem [[exe]]: surt 1, el membre de la dreta. ✓ Es compleixen les tres equacions: la solució és correcta.[/calc]",0]],"grup":"Àlgebra"},{"id":"pau-alg-24s-q2","bloc":"pau-ag","titol":"(2024). Un menor orlat amb la regla de Sarrus","enunciat":"Per a $m=1$, el rang de la matriu $A$ és 2. Per saber el rang de la matriu ampliada $A'$, calcula amb la regla de Sarrus el menor d'ordre 3 de les columnes de $x$, de $y$ i dels termes independents: $$A'=\\left(\\begin{array}{rrr|r}1&-3&1&-2\\\\1&1&2&3\\\\1&1&2&1\\end{array}\\right)\\qquad\\begin{vmatrix}1&-3&-2\\\\1&1&3\\\\1&1&1\\end{vmatrix}$$","font":"PAU setembre 2024, qüestió 2 a)","passos":[["[mat]El primer claudàtor de Sarrus són els tres productes amb signe +.[/mat] [calc]Escriu $1\\times 1\\times 1+(-3)\\times 3\\times 1+(-2)\\times 1\\times 1$, cada factor tal com és a la matriu. Els negatius, entre parèntesis i amb la tecla [[neg]].[/calc]",0],["[calc]Prem [[exe]]: el primer claudàtor val −10.[/calc]",0],["[calc]Ara resta-hi el segon claudàtor, el dels tres productes amb signe −: [[ans]] (el −10), [[menys]] i els tres productes entre parèntesis.[/calc] [mat]Sense aquest parèntesi, el − només afectaria el primer producte.[/mat]",0],["[calc]Prem [[exe]]: el menor val $-8\\neq 0$.[/calc] [mat]Per tant, el rang de la matriu $A'$ és 3 i, com que el de la matriu $A$ és 2, per a $m=1$ el sistema és incompatible.[/mat]",0]],"grup":"Àlgebra"},{"id":"pau-geo-25s-q4b","bloc":"pau-ag","titol":"(2025). Distància d'un punt a un pla","enunciat":"Considereu el pla $\\pi: 2x-y+z=5$ i el punt $P=(0,1,3)$.\nComproveu que la distància de $P$ a $\\pi$ és $\\frac{\\sqrt{6}}{2}$. $$d(P,\\pi)=\\frac{|2\\cdot 0-1+3-5|}{\\sqrt{2^2+(-1)^2+1^2}}$$","font":"PAU setembre 2025, exercici 4 B a)","passos":[["[mat]Primer, el numerador: substitueix $P$ a $2x-y+z-5$.[/mat] [calc]Escriu $2\\times 0-1+3-5$.[/calc]",0],["[calc]Prem [[exe]]: surt −3.[/calc] [mat]El valor absolut el fas tu: $|-3|=3$.[/mat]",0],["[calc]Ara la distància: la fracció [[frac]] amb el 3 a dalt; [[down]] i, a baix, l'arrel [[arrel]] de $2^2+(-1)^2+1^2$. El quadrat és [[x2]]. El −1, entre parèntesis: [[lpar]] [[neg]] 1 [[rpar]].[/calc]",0],["[calc]Prem [[exe]]: surt $\\frac{\\sqrt{6}}{2}$, el valor de l'enunciat. ✓ En mode {{E Mat/S Mat}} la calculadora racionalitza sola; en mode decimal sortiria 1.224744871 i no ho podries comparar.[/calc]",0]],"grup":"Geometria"},{"id":"pau-geo-25s-q4b-c","bloc":"pau-ag","titol":"(2025). El punt simètric respecte d'un pla","enunciat":"Considereu el pla $\\pi: 2x-y+z=5$ i el punt $P=(0,1,3)$.\n- Trobeu un pla $\\pi_2$ paral·lel a $\\pi$, que no passi per $P$, a una distància $\\frac{\\sqrt{6}}{2}$ de $\\pi$. Aquest pla passarà pel punt simètric $P'$ de $P$.\n- A més, sabem que la recta perpendicular a $\\pi$ per $P$, $(2\\lambda,\\,1-\\lambda,\\,3+\\lambda)$, talla el pla per a $\\lambda=\\frac{1}{2}$, al punt $M=\\left(1,\\frac{1}{2},\\frac{7}{2}\\right)$.","font":"PAU setembre 2025, exercici 4 B c)","passos":[["[mat]Primer, comprova que el punt $M$ és al pla: substitueix-lo a $2x-y+z$.[/mat] [calc]Escriu $2\\times 1-\\frac{1}{2}+\\frac{7}{2}$, amb [[frac]] per a les fraccions i [[right]] per sortir-ne.[/calc]",0],["[calc]Prem [[exe]]: surt 5, el terme independent del pla. ✓ El punt $M$ és el punt del pla $\\pi$ més proper a $P$.[/calc]",0],["[mat]El punt $M$ és el punt mitjà de $P$ i $P'$, així que $P'=2M-P$.[/mat] [calc]Les dues primeres coordenades són $2\\cdot 1-0=2$ i $2\\cdot\\frac{1}{2}-1=0$; la tercera, amb la calculadora: $2\\times\\frac{7}{2}-3=4$.[/calc] [mat]Per tant, $P'=(2,\\,0,\\,4)$.[/mat]",0],["[mat]Comprova que el punt $P'$ és a una distància $\\frac{\\sqrt{6}}{2}$ del pla $\\pi$. El numerador de la fórmula: substitueix $P'$ a $2x-y+z-5$.[/mat] [calc]Surt 3.[/calc]",0],["[calc]Ara la fracció: el 3 a dalt i, a baix, l'arrel de $2^2+(-1)^2+1^2$, com a l'apartat a).[/calc]",0],["[calc]Prem [[exe]]: $\\frac{\\sqrt{6}}{2}$. ✓ El punt $P'$ és a la mateixa distància del pla que $P$, a l'altra banda.[/calc] [calc](Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 1.224744871.)[/calc]",0],["[mat]El pla $\\pi_2$ és $2x-y+z=E$ amb $E=2\\cdot 2-0+4=8$: $\\pi_2: 2x-y+z=8$.[/mat]",0]],"grup":"Geometria"},{"id":"pau-geo-26j2-q4b","bloc":"pau-ag","titol":"(2026). Distàncies en centímetres","enunciat":"Un braç robòtic desplaça un sensor en línia recta des del punt $A=(1,2,3)$ fins al punt $B=(5,3,7)$, per damunt del pla $\\pi$, d'equació general $x-y-5=0$.\n[a]4.1. Quina distància ha recorregut el sensor?\n[/a] [b]4.2. En acabar el moviment, a quina distància del pla es troba el sensor?[/b]\nExpressa el resultat en centímetres.","font":"PAU juny 2026 (sèrie 5), exercici 4 B","passos":[["[mat]4.1. El vector $\\vec{AB}=(4,1,4)$, i la distància és el seu mòdul.[/mat] [calc]Escriu [[arrel]] i, a dins, $4^2+1^2+4^2$: el quadrat és [[x2]].[/calc]",0],["[calc]Prem [[exe]]: $\\sqrt{33}$, el valor exacte, perquè la calculadora és en mode {{E Mat/S Mat}}. En mode {{E Mat/S Decimal}} sortiria directament 5.744562647.[/calc]",0],["[calc]Com que és una longitud en centímetres, dona'n també el decimal: prem [[sd]].[/calc] [mat]El sensor ha recorregut $\\sqrt{33}\\approx 5{,}74$ cm.[/mat]",0],["[mat]4.2. La distància del punt $B$ al pla. Primer, el numerador: substitueix $B$ a $x-y-5$, és a dir, $5-3-5$.[/mat] [calc]Surt −3; el valor absolut el fas tu: 3.[/calc]",0],["[calc]Ara la fracció: [[frac]] amb el 3 a dalt i, a baix, l'arrel de $1^2+(-1)^2+0^2$. El −1, entre parèntesis.[/calc]",0],["[calc]Prem [[exe]]: $\\frac{3\\sqrt{2}}{2}$. La calculadora ja racionalitza.[/calc]",0],["[calc]En decimal, amb [[sd]]: el sensor és a $\\frac{3\\sqrt{2}}{2}\\approx 2{,}12$ cm del pla.[/calc]",0]],"grup":"Geometria"},{"id":"pau-ana-23s-q4","bloc":"pau-ap","titol":"(2023). Bolzano amb la e","enunciat":"Sigui $f(x)=-3x+e^{2x}-1$.\nJustifiqueu que l'equació $f(x)=2$ té una solució a l'interval $(-1,\\,0)$.","font":"PAU setembre 2023, qüestió 4 a)","passos":[["[calc]Calcularàs $f$ en dos punts: fes-ne una taula. [[menu]] i 3 ({{Tabla}}): la calculadora demana $f(x)$.[/calc]",0],["[calc]Escriu $-3x+e^{2x}-1$. El signe del principi és [[neg]]; la $e$ és [[alpha]] [[exp]]; l'exponent, amb [[pot]]: escriu $2x$ i surt de l'exponent amb [[right]] abans del $-1$.[/calc]",0],["[calc]Prem [[exe]]: demana $g(x)$. No en cal cap: torna a prémer [[exe]] i surt el rang.[/calc]",0],["[calc]{{Inic.}} $-1$ (amb [[neg]]), {{Final}} 0 i {{Paso}} 1, cada un amb [[exe]]: surt la taula.[/calc]",0],["[calc]Passa a la columna de $f$ amb [[right]]: a baix hi ha el valor sencer.[/calc] [mat]$f(-1)\\approx 2{,}135>2$.[/mat]",0],["[mat]$f(0)=0<2$. La funció $g(x)=f(x)-2$ és contínua, $g(-1)>0$ i $g(0)<0$: pel teorema de Bolzano, hi ha un $c\\in(-1,\\,0)$ amb $f(c)=2$. ✓[/mat]",0],["[calc]!!Error típic!!: torna a {{Calcular}} ([[menu]] i 1) i calcula $f(-1)$ sortint de l'exponent amb [[right]] abans de la $x$: la calculadora fa $e^2\\cdot(-1)$ en lloc d'$e^{-2}$.[/calc] [mat]No pot ser: $e^{-2}$ és positiu i petit, i $f(-1)$ ha de ser una mica més gran que 2.[/mat]",1]],"grup":"Anàlisi","tancament":"[mat]Recorda: tot l'exponent, $2x$, ha d'anar a l'exponent: $e^{2x}$. Així, $f(-1)\\approx 2{,}135>2$ i $f(0)=0<2$.[/mat]"},{"id":"pau-ana-24i-q1","bloc":"pau-ap","titol":"(2024). Bolzano amb la calculadora","enunciat":"Considereu $f(x)=-2+10(x-1)\\ln x$, per a $x>0$.\nComproveu que $f$ té una arrel a l'interval $[1;\\,1{,}5]$ i busqueu un interval d'una dècima de longitud que també la contingui.","font":"PAU juny 2024 (incidències), qüestió 1 a)","passos":[["[calc]Hauràs de calcular $f$ en diversos punts: fes-ne una taula. [[menu]] i 3 ({{Tabla}}): la calculadora demana $f(x)$.[/calc]",0],["[calc]Escriu $-2+10(x-1)\\ln(x)$. El signe del principi és [[neg]], la $x$ és la tecla [[x]] i ln és la tecla [[ln]].[/calc]",0],["[calc]Prem [[exe]]: demana $g(x)$. No en cal cap: torna a prémer [[exe]] i surt el rang.[/calc]",0],["[mat]L'interval és $[1;\\,1{,}5]$, i les dècimes són els punts que t'interessen.[/mat] [calc]{{Inic.}} 1, {{Final}} 1.5 i {{Paso}} 0.1, cada un amb [[exe]]: surt la taula.[/calc]",0],["[calc]Passa a la columna de $f$ amb [[right]].[/calc] [mat]$f(1)=-2<0$.[/mat]",0],["[calc]Baixa fins a l'última fila, $x=1{,}5$: a baix hi ha el valor sencer.[/calc] [mat]$f(1{,}5)\\approx 0{,}0273>0$. Com que $f$ és contínua a $[1;\\,1{,}5]$ i canvia de signe, pel teorema de Bolzano hi ha una arrel. ✓[/mat]",0],["[mat]Una fila amunt, $f(1{,}4)\\approx -0{,}654<0$: hi ha canvi de signe a $[1{,}4;\\,1{,}5]$, un interval d'una dècima. ✓[/mat]",0]],"grup":"Anàlisi"},{"id":"pau-ana-25i-q4a","bloc":"pau-ap","titol":"(2025). Una arrel cúbica en una optimització","enunciat":"Una ampolla de perfum té una part cilíndrica de $100\\,\\text{cm}^3$, de radi $r$ i altura $h=\\frac{100}{\\pi r^2}$.\nLa seva superfície total és $S(r)=3\\pi r^2+\\frac{200}{r}$.\n\nHas calculat $S'(r)$, i la solució de l'equació $S'(r)=0$ és $r^3=\\frac{100}{3\\pi}$.\n\nCalcula les dimensions de l'ampolla i la superfície mínima.","font":"PAU juny 2025 (incidències), exercici 4 A b)","passos":[["[mat]El radi és $r=\\sqrt[3]{\\frac{100}{3\\pi}}$.[/mat] [calc]Prem [[shift]] [[pot]] (arrel d'índex n), escriu l'índex 3 i, amb [[right]], passa al radicand: la fracció $\\frac{100}{3\\pi}$ amb [[frac]] (π és [[shift]] [[exp]]).[/calc]",0],["[calc]És una longitud: demana el decimal amb [[shift]] [[exe]] (≈). El radi és $r\\approx 2{,}20$ cm, i la calculadora el desa a [[ans]] amb tots els decimals.[/calc]",0],["[calc]L'altura, $h=\\frac{100}{\\pi r^2}$, sense copiar el radi: [[frac]], el 100, [[down]], π, [[ans]] i [[x2]].[/calc]",0],["[calc]Amb [[shift]] [[exe]]: l'altura és $h\\approx 6{,}59$ cm.[/calc]",0],["[calc]Ara [[ans]] ja és l'altura: per a $S(r)$, escriu el radi amb quatre decimals, 2.1974. Amb [[shift]] [[exe]], la superfície mínima és $S\\approx 136{,}52\\,\\text{cm}^2$.[/calc]",0]],"grup":"Anàlisi"},{"id":"pau-ana-25j-q1","bloc":"pau-ap","titol":"(2025). Intueix els límits amb Tabla","enunciat":"Considereu la funció $f(x)=\\dfrac{x^2-2x}{x-1}$.\n\nAbans de calcular-ne les asímptotes, fes-te una idea dels límits amb la calculadora:\n- (a.verticals) Assigna valors de $x$ molt propers a 1, per la dreta i per l'esquerra.\n- (a.horitzontals) Assigna valors de $x$ molt grans, tant positius com negatius.","font":"PAU juny 2025, exercici 1 a)","passos":[["[calc]Fes una taula de $f$: [[menu]] i 3 ({{Tabla}}).[/calc]",0],["[calc]Escriu $f$ amb la $x$ (tecla [[x]]): la fracció amb [[frac]], a dalt $x^2-2x$, [[down]] i, a baix, $x-1$.[/calc]",0],["[calc]Prem [[exe]] dues vegades: $g(x)$ no cal. Surt el rang.[/calc]",0],["[mat]Primer, valors de $x$ molt a prop d'1, per l'esquerra i per la dreta.[/mat] [calc]{{Inic.}} 0.98, {{Final}} 1.02 i {{Paso}} 0.01, cada un amb [[exe]].[/calc]",0],["[mat]Per l'esquerra: $f(0{,}98)=49{,}98$ i $f(0{,}99)=99{,}99$. Com més a prop d'1, més gran: $\\lim\\limits_{x\\to 1^-}f(x)=+\\infty$.[/mat]",0],["[mat]A $x=1$ hi ha ERROR: el denominador val 0, i 1 no és del domini.[/mat]",0],["[mat]Per la dreta: $f(1{,}01)=-99{,}99$, i $\\lim\\limits_{x\\to 1^+}f(x)=-\\infty$. Els dos límits laterals són infinits: la recta $x=1$ és una asímptota vertical.[/mat]",0],["[calc]Ara valors de $x$ molt grans. Prem [[ac]]: tornes a $f(x)$, que ja hi és.[/calc]",0],["[calc][[exe]] dues vegades: el rang, amb els valors d'abans.[/calc]",0],["[calc]{{Inic.}} $-200$, {{Final}} 200 i {{Paso}} 100, cada un amb [[exe]].[/calc]",0],["[mat]$f(100)\\approx 98{,}99$ i $f(200)\\approx 198{,}99$: $\\lim\\limits_{x\\to+\\infty}f(x)=+\\infty$, i no hi ha asímptota horitzontal. A més, quan $x$ augmenta 100, $f(x)$ també augmenta gairebé 100: pot haver-hi una asímptota obliqua de pendent 1.[/mat]",0],["[mat]I $f(-200)\\approx -200{,}995$: $\\lim\\limits_{x\\to-\\infty}f(x)=-\\infty$. Ara ja pots calcular el pendent $m$ i l'ordenada a l'origen $n$ de l'asímptota obliqua: surt $y=x-1$. Fixa't que $f(200)\\approx 200-1$.[/mat]",0]],"grup":"Anàlisi"},{"id":"pau-ana-25s-q4a","bloc":"pau-ap","titol":"(2025). Un vitrall en radians","enunciat":"Un vitrall de la Sagrada Família està limitat per:\n- les gràfiques de $y=3\\sin\\frac{x}{4}$ i $y=3\\cos\\frac{x}{4}$\n- des de l'eix d'ordenades fins al primer punt de tall $C$, que té $x=\\pi$.\n[a]a) Calculeu les coordenades del punt $C$.\n[/a] [b]b) Calculeu el preu del vitrall, a 750 € el m²\n\nNota: l'àrea és $\\left[12\\sin\\frac{x}{4}+12\\cos\\frac{x}{4}\\right]_0^{\\pi}$.[/b]","font":"PAU setembre 2025, exercici 4 A","passos":[["[calc]El sinus i el cosinus són d'una $x$ en metres, no d'un angle en graus: posa la calculadora en radians: [[shift]] [[menu]] (CONFIG), 2 ({{2:Unidad angular}}) i 2 ({{2:Radián}}). A la barra, R.[/calc]",0],["[mat]a) La segona coordenada del punt $C$ és $3\\sin\\frac{\\pi}{4}$.[/mat] [calc]Escriu el 3, [[sen]] i la fracció $\\frac{\\pi}{4}$ amb [[frac]] (π és [[shift]] [[exp]]); surt de la fracció amb [[right]] i tanca amb [[rpar]].[/calc]",0],["[calc]Prem [[exe]]: $C=\\left(\\pi,\\frac{3\\sqrt{2}}{2}\\right)$.[/calc] [mat]I $B=(0,3)$, perquè $3\\cos 0=3$.[/mat] [calc]Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 2.121320344.[/calc]",0],["[mat]b) Regla de Barrow: $F(\\pi)-F(0)$. Com que $\\sin 0=0$ i $\\cos 0=1$, $F(0)=12$.[/mat] [calc]Escriu $12\\sin\\frac{\\pi}{4}+12\\cos\\frac{\\pi}{4}-12$.[/calc]",0],["[calc]Prem [[exe]]: surt exacte, $12\\sqrt{2}-12$. Per al preu cal un decimal: prem [[sd]].[/calc] [mat]L'àrea és $12(\\sqrt{2}-1)\\approx 4{,}97\\,\\text{m}^2$.[/mat]",0],["[calc]Ara [[per]] 750: després d'un resultat, el càlcul comença amb Ans, sense arrodonir. Amb [[exe]] i [[sd]], el preu del vitrall és de $3.727{,}92$ €.[/calc]",0]],"grup":"Anàlisi"},{"id":"pau-ana-26j-q4a","bloc":"pau-ap","titol":"(2026). Dues baranes: π, ≈ i Ans","enunciat":"Dues baranes fan 10 m en total: la d'un espai circular i la d'un espai quadrat.\nSi la barana del cercle fa $x$ metres, la suma de les dues superfícies és $S(x)=\\frac{x^2}{4\\pi}+\\left(\\frac{10-x}{4}\\right)^2$.\nAmb la derivada has trobat $x=\\frac{10\\pi}{\\pi+4}$.\n\nCalcula la longitud de cada barana i la superfície mínima.","font":"PAU juny 2026, exercici 4 A","passos":[["[calc]Escriu $x$ amb [[frac]]: a dalt $10\\pi$ (π és [[shift]] [[exp]]), [[down]] i, a baix, $\\pi+4$.[/calc]",0],["[calc]És una longitud: demana el decimal amb [[shift]] [[exe]] (≈).[/calc] [mat]La barana del cercle fa 4,40 m.[/mat] [calc]La calculadora la desa a [[ans]] amb tots els decimals.[/calc]",0],["[calc]La del quadrat és $10-\\mathrm{Ans}$: escriu 10, [[menys]], [[ans]] i prem [[exe]].[/calc] [mat]La barana del quadrat fa 5,60 m.[/mat]",0],["[mat]Ara [[ans]] és la barana del quadrat, i la del cercle és $10-\\mathrm{Ans}$.[/mat] [calc]Escriu $S$ amb [[ans]], sense copiar cap decimal: $\\frac{(10-\\mathrm{Ans})^2}{4\\pi}+\\left(\\frac{\\mathrm{Ans}}{4}\\right)^2$.[/calc]",0],["[calc]Prem [[shift]] [[exe]] (≈).[/calc] [mat]La superfície mínima és $S\\approx 3{,}50\\,\\text{m}^2$.[/mat]",0]],"grup":"Anàlisi"},{"id":"pau-pro-26j2-q3","bloc":"pau-ap","titol":"(2026). Màxim i mínim absoluts en un interval","enunciat":"L'Alba dedica cada setmana $x$ hores a llegir, entre 1 i 6, i $y$ hores a fer esport, amb $y=7-x+\\ln(2x-1)$.\nAmb la derivada has trobat que l'únic punt crític és $x=1{,}5$.\n\nCalcula el màxim i el mínim d'hores d'esport.","font":"PAU juny 2026 (sèrie 5), exercici 3.3","passos":[["[calc]Calcularàs $y$ en diversos punts: fes-ne una taula. [[menu]] i 3 ({{Tabla}}): la calculadora demana $f(x)$.[/calc]",0],["[calc]Escriu $7-x+\\ln(2x-1)$. La $x$ és la tecla [[x]], i ln és la tecla [[ln]].[/calc]",0],["[calc]Prem [[exe]]: demana $g(x)$. No en cal cap: torna a prémer [[exe]] i surt el rang.[/calc]",0],["[mat]En un interval tancat, el màxim i el mínim absoluts són al punt crític o als extrems de l'interval: cal $y(1)$, $y(1{,}5)$ i $y(6)$.[/mat] [calc]{{Inic.}} 1, {{Final}} 6 i {{Paso}} 0.5, cada un amb [[exe]]: surt la taula.[/calc]",0],["[calc]Passa a la columna de $f$ amb [[right]].[/calc] [mat]$y(1)=6$.[/mat]",0],["[mat]$y(1{,}5)\\approx 6{,}193$. A partir d'aquí, els valors baixen.[/mat]",0],["[calc]Baixa fins a l'última fila, $x=6$.[/calc] [mat]$y(6)\\approx 3{,}398$. El màxim és de 6,19 h d'esport (amb $x=1{,}5$), i el mínim, de 3,40 h (amb $x=6$).[/mat]",0],["[calc]!!Error típic!!: torna a {{Calcular}} ([[menu]] i 1) i calcula $y(6)$ escrivint ln amb la tecla log ([[shift]] [[neg]]): surt 2.041392685 i no 3.397895273.[/calc] [mat]log és el logaritme en base 10, no el neperià.[/mat]",1]],"grup":"Anàlisi","tancament":"[mat]Recorda: $\\ln$ és el logaritme neperià, i log és el logaritme en base 10. El màxim és de 6,19 h i el mínim, de 3,40 h.[/mat]"},{"id":"pau-ana-26s-q1","bloc":"pau-ap","titol":"(2026). Creixement i extrems amb f(x) i g(x)","enunciat":"Considereu la funció $f(x)=\\dfrac{5x}{x^2+1}$.\nHas trobat la derivada, $f'(x)=\\dfrac{5(1-x^2)}{(x^2+1)^2}$, que s'anul·la a $x=-1$ i a $x=1$.\n\nEstudia el creixement i els extrems relatius de $f$.","font":"PAU setembre 2026, exercici 1.1","passos":[["[calc]Una sola taula et dona els signes de $f'$ i els valors de $f$. [[menu]] i 3 ({{Tabla}}).[/calc]",0],["[calc]La funció, sempre a $f(x)$: la fracció $\\frac{5x}{x^2+1}$ amb [[frac]].[/calc]",0],["[calc]Prem [[exe]]. La derivada, sempre a $g(x)$: $\\frac{5(1-x^2)}{(x^2+1)^2}$.[/calc]",0],["[calc]Prem [[exe]] i, al rang, {{Inic.}} $-2$ (amb [[neg]]), {{Final}} 2 i {{Paso}} 1, cada un amb [[exe]]: surt la taula.[/calc]",0],["[mat]Per saber el signe de $f'$ a cada interval, n'hi ha prou amb un punt.[/mat] [calc]Ves a la columna de $g$ amb dos cops [[right]].[/calc] [mat]$f'(-2)=-0{,}6<0$: $f$ decreix a $(-\\infty,-1)$.[/mat]",0],["[mat]$f'(0)=5>0$: $f$ creix a $(-1,\\,1)$.[/mat]",0],["[mat]$f'(2)=-0{,}6<0$: $f$ decreix a $(1,+\\infty)$.[/mat]",0],["[calc]A la columna de $f$, la fila $x=1$.[/calc] [mat]A $x=1$, $f$ passa de créixer a decréixer: hi ha un màxim relatiu a $\\left(1,\\frac{5}{2}\\right)$.[/mat]",0],["[mat]A $x=-1$, $f$ passa de decréixer a créixer: hi ha un mínim relatiu a $\\left(-1,-\\frac{5}{2}\\right)$.[/mat]",0]],"grup":"Anàlisi"},{"id":"pau-pro-24i-q4","bloc":"pau-ap","titol":"(2024). Probabilitat total, Bayes i binomial","enunciat":"La Rut tira un dau.\n- si surt 1, 2, 3 o 4, resol el problema ella mateixa i l'encerta el 75 % de les vegades\n- si surt 5 o 6, el copia d'Internet i l'encerta el 40 %.\nCalcula:\n[a]a) Probabilitat que la solució sigui correcta.\n[/a] [b]b) Probabilitat que l'hagi resolt ella si és correcta.\n[/b] [c]c) Probabilitat que, de 5 problemes, almenys 4 siguin correctes.[/c]","font":"PAU juny 2024 (incidències), qüestió 4","passos":[["[mat]a) Probabilitat total: $P(C)=\\frac{4}{6}\\cdot 0{,}75+\\frac{2}{6}\\cdot 0{,}4$.[/mat] [calc]Escriu-ho tal qual, amb fraccions i decimals.[/calc]",0],["[calc]Prem [[exe]]: $P(C)=\\frac{19}{30}$. La calculadora dona la fracció exacta, encara que hagis escrit decimals, perquè és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 0.6333333333.[/calc]",0],["[mat]b) Bayes: $P(R\\mid C)=\\dfrac{\\frac{4}{6}\\cdot 0{,}75}{P(C)}$.[/mat] [calc]Escriu $\\left(\\frac{4}{6}\\times 0.75\\right)\\div\\frac{19}{30}$.[/calc]",0],["[calc]Prem [[exe]]: $P(R\\mid C)=\\frac{15}{19}$.[/calc]",0],["[mat]c) Binomial, amb $n=5$ i $p=\\frac{19}{30}$: $P(X\\ge 4)=5\\,p^4(1-p)+p^5$, perquè $\\binom{5}{4}=5$ i $1-p=\\frac{11}{30}$.[/mat] [calc]La potència és [[pot]]; amb [[right]] surts de l'exponent.[/calc]",0],["[calc]Prem [[exe]]: $P(X\\ge 4)\\approx 0{,}3969$. La fracció exacta tindria massa xifres, i la calculadora la dona en decimal.[/calc]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i, si arrodoneixes $p\\approx 0{,}63$, surt 0.3906734328 i no 0.3968623045: ja falla la segona xifra decimal. Treballa amb $\\frac{19}{30}$.[/calc]",1]],"grup":"Probabilitat","tancament":"[mat]Recorda: treballa amb el valor exacte, $p=\\frac{19}{30}$, i no amb un decimal arrodonit: $P(X\\ge 4)\\approx 0{,}3969$.[/mat]"},{"id":"pau-pro-24s-q4","bloc":"pau-ap","titol":"(2024). Binomial, probabilitat total i Bayes","enunciat":"El 20 % dels habitants d'una regió pateix arrítmia. Un monitor Holter la detecta en el 95 % dels qui la pateixen, i dona falsos positius en el 0,5 % dels qui no en pateixen. \nCalcula el següent:\n[a]a) Si prenem 4 persones a l'atzar, probabilitat que almenys una pateixi arrítmia.\n[/a] [b]b) Probabilitat total d'obtenir un diagnòstic positiu.\n[/b] [c]c) Si el diagnòstic és negatiu, probabilitat que la persona pateixi arrítmia.[/c]","font":"PAU setembre 2024, qüestió 4","passos":[["[mat]a) El nombre de persones amb arrítmia segueix una binomial $B(4;\\,0{,}2)$. «Almenys una» és l'esdeveniment contrari de «cap»: $1-0{,}8^4$.[/mat] [calc]L'exponent és [[pot]].[/calc]",0],["[calc]Prem [[exe]]: surt la fracció $\\frac{369}{625}$, perquè la calculadora és en mode {{E Mat/S Mat}} i has escrit decimals exactes. Amb [[sd]], en decimal: 0.5904.[/calc]",0],["[mat]b) Probabilitat total. Hi ha dues maneres de donar positiu: amb arrítmia ($0{,}2$ i $0{,}95$) o sense ($0{,}8$ i $0{,}005$).[/mat] [calc]Escriu $0.95\\times 0.2+0.005\\times 0.8$.[/calc]",0],["[calc]Amb [[exe]] ($\\frac{97}{500}$) i [[sd]]: la probabilitat d'un diagnòstic positiu és 0,194.[/calc]",0],["[mat]c) Bayes: tenir arrítmia i donar negatiu, $0{,}2\\cdot(1-0{,}95)$, dividit per la probabilitat d'un negatiu, $1-0{,}194$.[/mat] [calc]El 0.194 és a [[ans]]: no cal copiar-lo. El denominador, entre parèntesis.[/calc]",0],["[calc]Prem [[shift]] [[exe]]: $\\approx 0{,}0124$.[/calc] [mat]Només l'1,24 % de les persones que donen negatiu pateixen arrítmia.[/mat]",0]],"grup":"Probabilitat"},{"id":"pau-pro-25j-q3","bloc":"pau-ap","titol":"(2025). Probabilitat total i un màxim","enunciat":"El 60 % de les peces d'una empresa són de ferro i la resta, d'acer. El 95 % de les peces de ferro no tenen cap defecte, i el 3 % de les d'acer són defectuoses.\nCalcula:\n[a]a) Probabilitat que una peça a l'atzar sigui defectuosa.\n[/a] [c]b) Valor màxim de la funció $f(p)=5(p^4-p^5)$ per a $p\\ge 0$ (nota: amb la derivada has trobat que el màxim és a $p=\\frac{4}{5}$).[/c]","font":"PAU juny 2025, exercici 3","passos":[["[mat]a) De les peces de ferro, en són defectuoses el 5 % (100 − 95).[/mat] [calc]Probabilitat total; escriu $0.05\\times 0.6+0.03\\times 0.4$.[/calc]",0],["[calc]Prem [[exe]] ($\\frac{21}{500}$) i [[sd]]: 0.042, és a dir, un 4,2 % de les peces són defectuoses.[/calc]",0],["[mat]c) El valor màxim és $f\\left(\\frac{4}{5}\\right)$.[/mat] [calc]Com que $\\frac{4}{5}=0{,}8$, escriu $5\\times(0.8^4-0.8^5)$. Després de cada exponent, surt-ne amb [[right]].[/calc]",0],["[calc]Prem [[exe]]: $\\frac{256}{625}$, el valor exacte del màxim, perquè la calculadora és en mode {{E Mat/S Mat}}. En mode {{E Mat/S Decimal}} sortiria 0.4096, és a dir, $\\approx 0{,}41$.[/calc]",0]],"grup":"Probabilitat"},{"id":"abans-examen","bloc":"examen","titol":"Comprova la calculadora en 30 segons","enunciat":"Abans de començar l'examen, comprova que la calculadora està ben configurada.","font":"","passos":[["[calc]Calcula $1\\div 2$: ha de sortir $\\frac{1}{2}$, perquè la calculadora ha de ser en mode {{E Mat/S Mat}}, el que dona resultats exactes. Si surt 0.5, és en {{E Mat/S Decimal}}: arregla-ho com a la fitxa «Em surt 0.5 en lloc d'1/2».[/calc]",0],["[calc]Mira la lletra de la unitat dels angles: D (graus) o R (radians).[/calc] [mat]Si l'examen té funcions trigonomètriques de $x$, ha de ser R; per a angles en graus, D.[/mat]",0],["[calc]Prem [[ac]]. A la barra no hi ha d'haver FIX ni SCI (si n'hi ha, fitxa «Tot em surt arrodonit»).[/calc]",0],["[calc]Si els menús no surten en l'idioma que esperes: [[shift]] [[menu]] (CONFIG) i, amb [[down]], passa pàgines fins a l'última, on hi ha {{Idioma}}. Tria també el mateix idioma a dalt d'aquesta pàgina («Calculadora en»): així les fitxes et mostraran els mateixos menús.[/calc]",0],["[calc]Prem [[ac]] per tornar a la pantalla de càlcul. Ja pots començar l'examen.[/calc]",0]],"araTu":{"enunciat":"Una sola operació ho comprova gairebé tot: calcula $\\cos 60$. Què ha de sortir per a un examen amb angles en graus?"}},{"id":"indicadors","bloc":"simbols","titol":"Què vol dir cada símbol de la pantalla?","enunciat":"A la pantalla, a més dels nombres, hi surten símbols: a la barra de dalt, a la línia de l'expressió i a la del resultat.","font":"","passos":[["[calc]Aquesta icona vol dir que escrius en format matemàtic: les fraccions i les arrels es veuen com al llibre. La calculadora està configurada per donar resultats exactes ({{E Mat/S Mat}}): per això el resultat surt $\\frac{\\sqrt{2}}{2}$ i no 0.7071067812.[/calc]",0],["[calc]La D amb fons fosc vol dir que els angles van en graus. És la que faràs servir quasi sempre.[/calc]",0],["[calc]El triangle ▲ vol dir que hi ha càlculs anteriors: amb [[up]] els tornes a veure.[/calc]",0],["[calc]Prem [[shift]]: a la barra surt una S. La tecla següent farà el que hi ha escrit a sobre seu (per exemple, [[shift]] [[exp]] escriu π). La S desapareix sola.[/calc]",0],["[calc]Si en lloc de la D hi ha una R, els angles van en radians. Si hi ha una G, van en graus centesimals, una unitat que no faràs servir.[/calc]",0],["[calc]FIX vol dir que tots els resultats surten arrodonits a un nombre fix de decimals: aquí, a 2, i per això $1\\div 6$ surt 0.17.[/calc]",0],["[calc]SCI vol dir que tots els resultats surten en notació científica, amb un nombre fix de xifres: aquí, 3, i per això $1\\div 6$ surt $1.67\\times 10^{-1}$.[/calc]",0],["[calc]Si prems [[alpha]], surt una A: la tecla següent farà el que hi ha escrit en rosa al seu costat (per exemple, una variable: A, B…). La A també desapareix sola.[/calc]",0],["[calc]Els triangles ◀ i ▶ a les vores de la línia volen dir que l'expressió no hi cap: n'hi ha més per aquest costat. Amb [[left]] i [[right]] t'hi mous.[/calc]",0],["[calc]Un «×10» amb un nombre petit a dalt vol dir que el resultat és en notació científica: és massa llarg per a la pantalla.[/calc] [mat]$2.592\\times 10^{13}$ és $2{,}592\\cdot 10^{13}$.[/mat]",0]],"provaTu":{"enunciat":"A la barra de dalt de la teva calculadora hi ha \"R\" i \"FIX\". Què vol dir cada cosa?","solucio":"La \"R\" vol dir que els angles van en radians.\n\"FIX\" vol dir que tots els resultats surten arrodonits a un nombre fix de decimals."}},{"id":"eso-corregeix","bloc":"eso-inici","titol":"T'has equivocat en teclejar: com corregir-ho","enunciat":"Vols calcular \"$26\\cdot 4$\", però en teclejar t'equivoques totalment i escrius \"25 × 44\". T'expliquem com corregir-ho.","font":"","passos":[["[calc]Això és el que has escrit: 25 [[per]] 44. El cursor és al final.[/calc]",0],["[calc]Prem [[del]]: esborra el que hi ha just abans del cursor, el 4 de més. ([[ac]] ho esborraria tot.)[/calc]",0],["[calc]Ara el 5 ha de ser un 6. Prem [[left]] dues vegades: el cursor es mou fins just després del 5.[/calc]",0],["[calc]Prem [[del]] per esborrar el 5 i escriu el 6: s'afegeix on és el cursor.[/calc]",0],["[calc]Prem [[exe]]: obtens 104.[/calc] [mat]$26\\cdot 4=104$.[/mat]",0]]},{"id":"eso-fraccio-decimal","bloc":"eso-pantalla","titol":"Em surt una fracció: vull el decimal","enunciat":"Calcula $7\\div 4$ i dona el resultat:\n- en forma de fracció\n- en forma decimal.","font":"","passos":[["[calc]Escriu 7 [[entre]] 4.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $\\frac{7}{4}$. Surt en fracció perquè la calculadora està configurada per donar resultats exactes; si estigués configurada per donar decimals, sortiria 1.75.[/calc] [mat]Una divisió és una fracció: $7\\div 4=\\frac{7}{4}$.[/mat]",0],["[calc]Per tenir-lo en decimal, prem [[sd]]: obtens 1.75.[/calc] [mat]La resposta correcta és $\\frac{7}{4}=1{,}75$.[/mat]",0]],"provaTu":{"enunciat":"Calcula $9\\div 8$ i dona el resultat:\n- en forma de fracció\n- en forma decimal.","solucio":"[mat]$9\\div 8=\\frac{9}{8}=1{,}125$.[/mat]"}},{"id":"eso-arrodonir","bloc":"eso-pantalla","titol":"Arrodonir el que surt a la pantalla","enunciat":"Calcula $2\\div 3$ i arrodoneix el resultat a les centèsimes.","font":"","passos":[["[calc]Escriu 2 [[entre]] 3.[/calc]",0],["[calc]Prem [[shift]] [[exe]] (≈): obtens el resultat en decimal, que és 0.6666666667. La calculadora ja ha arrodonit l'última xifra (el 7).[/calc]",0],["[mat]Per arrodonir a les centèsimes, mira la tercera xifra decimal: és un 6, més gran o igual que 5, i per això la segona puja d'un: 0,67.[/mat] [mat]La resposta correcta és $2\\div 3\\approx 0{,}67$.[/mat]",0]],"provaTu":{"enunciat":"Calcula $5\\div 7$ i arrodoneix el resultat a les centèsimes.","solucio":"[mat]$5\\div 7=0{,}714285\\ldots\\approx 0{,}71$.[/mat]"}},{"id":"ll4-1-exemple2","bloc":"eso-pantalla","titol":"L'arrel de 50: entre quins enters és?","enunciat":"Sense calculadora, digues entre quins dos nombres enters es troba $\\sqrt{50}$.\nDesprés, calcula-la amb la calculadora.","font":"Llibre 4t ESO, unitat 1, exemple 2","passos":[["[mat]Abans de calcular, estima: $7^2=49$ i $8^2=64$. Com que 50 és una mica més que 49, $\\sqrt{50}$ és entre 7 i 8, una mica més que 7.[/mat]",0],["[calc]Prem [[arrel]] i escriu a dins 50.[/calc]",0],["[calc]Prem [[exe]]: obtens $5\\sqrt{2}$. Surt així perquè la calculadora està configurada per donar resultats exactes; si estigués configurada per donar decimals, sortiria 7.071067812.[/calc] [mat]És el mateix nombre: $\\sqrt{50}=\\sqrt{25\\cdot 2}=5\\sqrt{2}$.[/mat]",0],["[calc]Per tenir-lo en decimal, prem [[sd]]: obtens 7.071067812.[/calc] [mat]La resposta correcta és que $\\sqrt{50}$ és entre 7 i 8: val 7,07 aproximadament, com havíem estimat.[/mat]",0]],"provaTu":{"enunciat":"Sense calculadora, digues entre quins dos nombres enters es troba $\\sqrt{90}$. Després, calcula-la amb la calculadora.","solucio":"[mat]$9^2=81$ i $10^2=100$: entre 9 i 10. $\\sqrt{90}=3\\sqrt{10}\\approx 9{,}49$.[/mat]"}},{"id":"eso-notacio-cientifica","bloc":"eso-pantalla","titol":"Nombres molt grans: notació científica","enunciat":"La llum recorre $3\\cdot 10^8$ metres cada segon.\n• Un dia té 86 400 segons.\nQuants metres recorre la llum en un dia?","font":"","passos":[["[mat]$3\\cdot 10^8$ és un nombre en notació científica.[/mat] [calc]Escriu 3 i prem [[exp]]: surt «×10» amb el lloc de l'exponent. Escriu el 8 i surt de l'exponent amb [[right]].[/calc]",0],["[mat]En un dia, la llum recorre 86 400 vegades el que recorre en un segon.[/mat] [calc]Ara fes l'operació [[per]] 86400.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $2.592\\times 10^{13}$. El nombre és massa llarg i la calculadora el dona en notació científica.[/calc] [mat]La resposta correcta és $2{,}592\\cdot 10^{13}$ metres, és a dir, 25 920 000 000 000 m.[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i, en lloc de [[exp]], fes servir la tecla de potència: 3 [[pot]] 8, [[right]] i [[per]] 86400.[/calc]",1],["[calc]Prem [[exe]]: obtens 566870400.[/calc] [mat]No pot ser: la llum fa 300 milions de metres cada segon, i en un dia en faria només 567 milions. Has calculat $3^8=6.561$, no $3\\cdot 10^8$.[/mat]",1]],"tancament":"[calc]Recorda: $3\\cdot 10^8$ s'escriu amb [[exp]] (×10ˣ), no amb [[pot]].[/calc] [mat]La llum recorre $2{,}592\\cdot 10^{13}$ metres en un dia.[/mat]","provaTu":{"enunciat":"El so recorre 343 metres cada segon.\n• Un any té 31 536 000 segons.\nQuants metres recorre el so en un any?","solucio":"[mat]$343\\cdot 31.536.000=1{,}0816848\\cdot 10^{10}$ metres, és a dir, 10.816.848.000 m.[/mat]"}},{"id":"cb2-26-q4","bloc":"eso-parentesis","titol":"Les patates rebaixades: el percentatge de descompte","enunciat":"La Mia ha comprat dues bosses de patates fregides que estaven rebaixades.\n• Abans de la rebaixa, les dues bosses costaven 5 euros en total.\n• Amb la rebaixa, només ha pagat 4 euros per les dues.\nQuin percentatge de descompte s'ha aplicat?","font":"CB 2ESO (2026), pregunta 4","passos":[["[mat]El descompte és el que t'han rebaixat, 5 − 4 = 1 euro, dividit entre el preu d'abans, 5 euros, i multiplicat per 100.[/mat] [calc]Primer escriu la resta entre parèntesis: [[lpar]] 5 − 4 [[rpar]].[/calc]",0],["[calc]Ara fes l'operació [[entre]] 5 [[per]] 100.[/calc] [mat]Gràcies als parèntesis, es divideix tota la resta entre 5.[/mat]",0],["[calc]Prem [[exe]]: obtens el resultat, que és 20.[/calc] [mat]La resposta correcta és que s'ha aplicat un descompte del 20 %.[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i escriu-ho sense parèntesis, $5-4\\div 5\\times 100$.[/calc]",1],["[calc]Prem [[exe]]: obtens −75.[/calc] [mat]No pot ser: un descompte no és negatiu. Sense parèntesis, la divisió i la multiplicació es fan abans que la resta: s'ha calculat $5-80$.[/mat]",1]],"tancament":"[mat]Recorda: la resta, entre parèntesis: $(5-4)\\div 5\\cdot 100=20$. El descompte és del 20 %.[/mat]","provaTu":{"enunciat":"Una samarreta costava 40 euros i ara costa 34 euros. Quin percentatge de descompte s'ha aplicat?","solucio":"[mat]$(40-34)\\div 40\\cdot 100=15$: un descompte del 15 %.[/mat]"}},{"id":"eso-quadrat-negatiu","bloc":"eso-parentesis","titol":"El quadrat d'un nombre negatiu","enunciat":"Calcula el quadrat de −3, és a dir, $(-3)^2$.","font":"","passos":[["[mat]El quadrat de −3 és $(-3)\\cdot(-3)=9$: el signe també s'eleva al quadrat.[/mat] [calc]Escriu el −3 entre parèntesis: [[lpar]] [[neg]] 3 [[rpar]]. El signe negatiu és la tecla [[neg]], no la de restar.[/calc]",0],["[calc]Prem [[x2]] per elevar-lo al quadrat.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és 9.[/calc] [mat]La resposta correcta és $(-3)^2=9$.[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i escriu-ho sense parèntesis: [[neg]] 3 [[x2]].[/calc]",1],["[calc]Prem [[exe]]: obtens −9.[/calc] [mat]No és el quadrat de −3: sense parèntesis, el quadrat només afecta el 3, i el signe es posa després: $-3^2=-(3^2)=-9$.[/mat]",1]],"tancament":"[mat]Recorda: per elevar un nombre negatiu, posa'l entre parèntesis: $(-3)^2=9$.[/mat]","provaTu":{"enunciat":"Calcula $(-5)^2$ i $-5^2$. Obtens el mateix resultat?","solucio":"[mat]$(-5)^2=25$ i $-5^2=-25$: no són iguals.[/mat]"}},{"id":"cb4-24-q7","bloc":"eso-parentesis","titol":"Les valoracions d'1 o 2 estrelles","enunciat":"En Víctor ven roba per internet i ha rebut 80 valoracions de clients, d'1 a 5 estrelles. Entre elles:\n• 8 clients li han donat 2 estrelles\n• 2 clients li han donat 1 estrella.\nEl 60 % de les valoracions d'1 o 2 estrelles diuen que la talla era equivocada. Quin percentatge representen aquestes valoracions sobre les 80?","font":"CB 4ESO (2024), pregunta 7","passos":[["[mat]Les valoracions d'1 o 2 estrelles són 8 + 2. El 60 % d'aquestes és $0{,}6\\cdot(8+2)$.[/mat] [calc]Escriu 0.6 [[per]] i la suma entre parèntesis: [[lpar]] 8 + 2 [[rpar]].[/calc]",0],["[mat]Per saber quin percentatge representen de les 80 valoracions, es divideix entre 80 i es multiplica per 100.[/mat] [calc]Ara fes l'operació [[entre]] 80 [[per]] 100.[/calc]",0],["[calc]Prem [[exe]]: obtens $\\frac{15}{2}$, en fracció perquè la calculadora està configurada per donar resultats exactes. Prem [[sd]]: en decimal, 7.5.[/calc] [mat]La resposta correcta és que representen el 7,5 % de les valoracions.[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i escriu-ho sense parèntesis, $0.6\\times 8+2\\div 80\\times 100$.[/calc]",1],["[calc]Prem [[exe]] i [[sd]]: obtens 7.3.[/calc] [mat]És a prop de 7,5, però és incorrecte: sense parèntesis s'ha calculat $0{,}6\\cdot 8+\\frac{2}{80}\\cdot 100$.[/mat]",1]],"tancament":"[mat]Recorda: la suma, entre parèntesis: $0{,}6\\cdot(8+2)\\div 80\\cdot 100=7{,}5$. Representen el 7,5 % de les valoracions.[/mat]","provaTu":{"enunciat":"Una botiga ha rebut 120 valoracions. Entre elles:\n• 9 clients li han donat 2 estrelles;\n• 6 clients li han donat 1 estrella.\nEl 40 % de les valoracions d'1 o 2 estrelles es queixen del preu. Quin percentatge representen sobre les 120?","solucio":"[mat]$0{,}4\\cdot(9+6)\\div 120\\cdot 100=5$[/mat]\nR) El 5 % de les valoracions."}},{"id":"cb2-26-q5","bloc":"eso-proporcionalitat","titol":"La recepta del pastís","enunciat":"En Biel fa un pastís de xocolata seguint una recepta per a $5$ persones: cal posar $3$ ous i $180$ g de xocolata.\n\nAl cap d'uns dies, en Biel repeteix la recepta, però s'equivoca i hi posa $5$ ous.\n\nQuanta xocolata haurà d'utilitzar per mantenir les proporcions de la recepta?","font":"CB 2ESO (2026), pregunta 5","passos":[["[mat]Abans de calcular, pensa:\n• si té més ous, haurà de gastar més xocolata o menys xocolata?\n• si tingués el doble d'ous, és cert que caldria el doble de xocolata?[/mat]",0],["[mat]$3$ ous → $180$ g de xocolata\n$1$ ou → ?[/mat] [calc]Escriu $180$ [[entre]] $3$.[/calc]",0],["[calc]Prem [[exe]]: obtens $60$.[/calc] [mat]$1$ ou → $60$ g de xocolata[/mat]",0],["[mat]Amb $5$ ous, cal gastar $5$ vegades més xocolata que amb $1$ ou.[/mat] [calc]Fes l'operació [[per]] $5$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $300$.[/calc] [mat]R) En Biel ha de fer servir $300$ g de xocolata per $5$ ous.[/mat]",0],["[calc]!!Error típic!!:\nSi apliques malament la regla de tres: $180$ [[per]] $3$ [[entre]] $5$.[/calc]",1],["[calc]Prem [[exe]]: obtens $108$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té lògica que amb $5$ ous portis menys xocolata que amb $3$ ous.[/mat]",1]],"grup":"Proporcionalitat directa","tancament":"[mat]Recorda:\n• $180\\div 3=60$ g\n• $60\\cdot 5=300$ g[/mat]","provaTu":{"enunciat":"Una recepta per a fer creps demana posar $2$ ous i $250$ ml de llet.\nTu tens a la nevera $3$ ous i els vols gastar tots. Quanta llet hauràs de posar per mantenir les proporcions?","solucio":"[mat]$250\\div 2=125$ ml\n$125\\cdot 3=375$ ml[/mat]\nR) Hauré de fer servir $375$ ml de llet."}},{"id":"cb4-22-q26","bloc":"eso-proporcionalitat","titol":"L'aixeta del lavabo","enunciat":"En Nil estudia quanta aigua es fa servir a casa seva. Ha observat que l'aixeta del lavabo omple un got de $0{,}2$ litres en $3$ segons.\n\nQuants litres d'aigua surten de l'aixeta en $60$ segons?","font":"CB 4ESO (2022), pregunta 26","passos":[["[mat]Abans de calcular, pensa:\n• en $60$ segons obté més o menys de $0{,}2$ litres?\n• si manté l'aixeta oberta el doble de temps, surt el doble d'aigua?[/mat]",0],["[mat]$3$ segons → $0{,}2$ litres\n$1$ segon → ?[/mat] [calc]Escriu $0.2$ [[entre]] $3$.[/calc]",0],["[calc]Prem [[exe]]: obtens $\\frac{1}{15}$.\nSi surt en forma de fracció és perquè la calculadora està configurada per donar resultats exactes.\nSi estigués configurada per donar decimals, sortiria $0.06666666667$.[/calc] [mat]$1$ segon → $\\frac{1}{15}\\simeq 0{,}067$ litres[/mat]",0],["[mat]En $60$ segons surt $60$ vegades més aigua que en $1$ segon.[/mat] [calc]Fes l'operació [[per]] $60$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $4$.[/calc] [mat]R) En $60$ segons surten $4$ litres d'aigua de l'aixeta.[/mat]",0]],"grup":"Proporcionalitat directa","provaTu":{"enunciat":"Una aixeta omple una ampolla d'$1{,}5$ litres en $10$ segons.\nTu deixes l'aixeta oberta $2$ minuts ($120$ segons). Quants litres d'aigua hi surten, si raja sempre igual?","solucio":"[mat]$1{,}5\\div 10=0{,}15$ litres\n$0{,}15\\cdot 120=18$ litres[/mat]\nR) De l'aixeta surten $18$ litres d'aigua."}},{"id":"cb4-25-q8","bloc":"eso-proporcionalitat","titol":"El xarop","enunciat":"A en Mario li han receptat un xarop. En $5$ ml de xarop hi ha $105$ mg de principi actiu.\n\nQuants mg de principi actiu hi ha en $16$ ml del mateix xarop?","font":"CB 4ESO (2025), pregunta 8","passos":[["[mat]Abans de calcular, pensa:\n• si prens el triple de xarop, també prendràs el triple de principi actiu?[/mat]",0],["[mat]$5$ ml → $105$ mg\n$1$ ml → ?[/mat] [calc]Escriu $105$ [[entre]] $5$.[/calc]",0],["[calc]Prem [[exe]]: obtens $21$.[/calc] [mat]$1$ ml → $21$ mg[/mat]",0],["[mat]En $16$ ml hi ha $16$ vegades més principi actiu que en $1$ ml.[/mat] [calc]Fes l'operació [[per]] $16$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $336$.[/calc] [mat]R) En $16$ ml de xarop hi ha $336$ mg de principi actiu.[/mat]",0],["[calc]!!Error típic!!:\nSi apliques malament la regla de tres: $105$ [[per]] $5$ [[entre]] $16$.[/calc]",1],["[calc]Prem [[shift]] [[exe]] (≈): obtens $32.8125$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té sentit que en $16$ ml hi hagi menys principi actiu de medicament que en $5$ ml.[/mat]",1]],"grup":"Proporcionalitat directa","tancament":"[mat]Recorda:\n• $105\\div 5=21$ mg\n• $21\\cdot 16=336$ mg[/mat]","provaTu":{"enunciat":"En $10$ ml d'un xarop hi ha $250$ mg de principi actiu.\nTu has de prendre $6$ ml de xarop. Quants mg de principi actiu prendràs?","solucio":"[mat]$250\\div 10=25$ mg\n$25\\cdot 6=150$ mg[/mat]\nR) Prendré $150$ mg de principi actiu."}},{"id":"cb4-23-q26","bloc":"eso-proporcionalitat","titol":"La fotografia més petita","enunciat":"L'Anna té una fotografia de $62$ cm d'amplada i $34$ cm d'alçada. La vol imprimir més petita, de $42$ cm d'amplada.\n\nQuina alçada tindrà la fotografia impresa, si l'Anna no la vol deformar?","font":"CB 4ESO (2023), pregunta 26","passos":[["[mat]Si no es deforma, l'alçada és proporcional a l'amplada:\n$62$ cm d'amplada → $34$ cm d'alçada\n$42$ cm d'amplada → ?\nL'alçada nova és $\\frac{34\\cdot 42}{62}$.[/mat] [calc]Escriu $34$ [[per]] $42$.[/calc]",0],["[calc]Ara fes l'operació [[entre]] $62$.[/calc]",0],["[calc]Prem [[exe]]: obtens $\\frac{714}{31}$.\nSi surt en forma de fracció és perquè la calculadora està configurada per donar resultats exactes.\nSi estigués configurada per donar decimals, sortiria $23.03225806$.[/calc] [mat]$\\frac{714}{31}\\simeq 23{,}03$ cm[/mat]",0],["[calc]Per tenir-lo en decimal, prem [[sd]]: obtens $23.03225806$.[/calc] [mat]R) La fotografia impresa farà aproximadament $23$ cm d'alçada.[/mat]",0]],"grup":"Proporcionalitat directa","provaTu":{"enunciat":"Tens una foto de $45$ cm d'amplada i $30$ cm d'alçada.\nLa vols imprimir amb $20$ cm d'amplada, sense deformar-la. Quina alçada tindrà?","solucio":"[mat]$30\\cdot 20\\div 45=13{,}33\\ldots$ cm[/mat]\nR) La foto mesurarà aproximadament $13{,}3$ cm d'alçada."}},{"id":"cb4-26-q8","bloc":"eso-proporcionalitat","titol":"Els esglaons de l'escala","enunciat":"En Samuel viu al 1r 2a, i puja a peu les escales del seu edifici.\nCada esglaó de l'escala mesura $15$ cm d'altura i en total haurà pujat $3$ m.\n\nQuants esglaons haurà pujat?","font":"CB 4ESO (2026), pregunta 8","passos":[["[mat]Abans de calcular, pensa:\n• si els esglaons fossin només de $12$ cm, creus que caldrien més esglaons o menys?[/mat]",0],["[mat]En total puja $3$ m i cada esglaó en puja $15$ cm.\nÉs **necessari** que les mesures siguin en les mateixes unitats, per exemple, en metres.\n\n$3$ m $=3$ m\n$15$ cm $=0{,}15$ m[/mat] [calc]Escriu $3$ [[entre]] $0.15$.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $20$.[/calc] [mat]R) En Samuel haurà pujat $20$ esglaons.[/mat]",0],["[calc]!!Error típic!!:\nSi no passes les mesures a les mateixes unitats: $3$ [[entre]] $15$.[/calc]",1],["[calc]Prem [[shift]] [[exe]] (≈): obtens $0.2$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té cap sentit: no es pot pujar $0{,}2$ esglaons per arribar a $3$ m d'altura![/mat]",1]],"grup":"Proporcionalitat directa","tancament":"[mat]Recorda:\n• $15$ cm $=0{,}15$ m\n• $3\\div 0{,}15=20$ esglaons[/mat]","provaTu":{"enunciat":"Una escala puja $2{,}4$ m d'altura i cada esglaó fa $16$ cm d'altura.\nQuants esglaons hauràs de pujar per arribar a dalt?","solucio":"[mat]$16$ cm $=0{,}16$ m\n$2{,}4\\div 0{,}16=15$ esglaons[/mat]\nR) Hauré de pujar $15$ esglaons."}},{"id":"cb4-26-q25","bloc":"eso-proporcionalitat","titol":"La bossa de botons","enunciat":"Una empresa fabrica botons de plàstic, tots iguals. Sabem que $20$ botons pesen $70$ g.\n\nUna bossa plena de botons pesa $2{,}41$ kg. Quants botons hi ha a la bossa, si la bossa buida pesa $30$ g?","font":"CB 4ESO (2026), pregunta 25","passos":[["[mat]Abans de calcular, pensa:\n• quants grams són $2{,}41$ kg?\n• com faràs servir que la bossa buida pesa $30$ g?[/mat]",0],["[mat]$20$ botons → $70$ g\n$1$ botó → ?[/mat] [calc]Escriu $70$ [[entre]] $20$.[/calc]",0],["[calc]Prem [[exe]]: obtens $\\frac{7}{2}$.\nSi surt en forma de fracció és perquè la calculadora està configurada per donar resultats exactes.\nSi estigués configurada per donar decimals, sortiria $3.5$.[/calc] [mat]$1$ botó → $\\frac{7}{2}=3{,}5$ g[/mat]",0],["[mat]La bossa plena pesa $2{,}41$ kg $=2.410$ g.\nSense la bossa buida, els botons pesen $2.410-30$ g.\nHi ha tants botons com vegades hi cap el pes d'un botó.[/mat] [calc]Escriu [[lpar]] $2410$ [[menys]] $30$ [[rpar]] [[entre]] i prem [[ans]].\n[[ans]] és el resultat d'abans.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $680$.[/calc] [mat]R) A la bossa hi ha $680$ botons.[/mat]",0],["[calc]!!Error típic!!:\nSi multipliques en lloc de dividir: $2380$ [[per]] $3.5$.[/calc]",1],["[calc]Prem [[exe]]: obtens $8330$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No pot ser: $8.330$ botons de $3{,}5$ g pesarien més de $29$ kg, i la bossa pesa $2{,}41$ kg.[/mat]",1]],"grup":"Proporcionalitat directa","tancament":"[mat]Recorda:\n• $70\\div 20=3{,}5$ g\n• $2.410-30=2.380$ g\n• $2.380\\div 3{,}5=680$ botons[/mat]","provaTu":{"enunciat":"Tens una caixa plena de claus iguals que pesa $1{,}5$ kg. Poses $12$ claus a la bàscula i llegeixes: $30$ g.\nQuants claus hi ha a la caixa?","solucio":"[mat]$30\\div 12=2{,}5$ g\n$1.500\\div 2{,}5=600$ claus[/mat]\nR) A la caixa hi ha $600$ claus."}},{"id":"ll4a-3-26","bloc":"eso-proporcionalitat","titol":"El plànol del pis","enunciat":"El plànol d'un pis està dibuixat a escala $1:50$. Al plànol, una de les parets fa $8$ cm de longitud.\n\nQuant mesura aquesta paret de debò, en metres?","font":"Llibre 4t ESO A, unitat 3, exercici 26","passos":[["[mat]Abans de calcular, pensa:\n• què vol dir l'escala $1:50$?\n• creus que un resultat com $3{,}2$ m seria possible? I un resultat com $0{,}4$ cm?[/mat]",0],["[mat]A escala $1:50$, cada centímetre del plànol són $50$ cm de debò.[/mat] [calc]Escriu $8$ [[per]] $50$.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $400$.[/calc] [mat]R) La paret fa $400$ cm, és a dir, $4$ m.[/mat]",0],["[calc]!!Error típic!!:\nSi divideixes en lloc de multiplicar: $8$ [[entre]] $50$.[/calc]",1],["[calc]Prem [[shift]] [[exe]] (≈): obtens $0.16$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té sentit: de debò, la paret faria $0{,}16$ cm, que és absurd.[/mat]",1]],"grup":"Proporcionalitat directa","tancament":"[mat]Recorda:\n• $8\\cdot 50=400$ cm\n• $400$ cm $=4$ m[/mat]","provaTu":{"enunciat":"En un mapa a escala $1:25.000$, dos pobles són a $6$ cm.\nQuina distància hi ha de debò entre els dos pobles, en km?","solucio":"[mat]$6\\cdot 25.000=150.000$ cm\n$150.000$ cm $=1{,}5$ km[/mat]\nR) Entre els dos pobles hi ha $1{,}5$ km."}},{"id":"ll4a-3-13","bloc":"eso-proporcionalitat","titol":"La neteja en un parc","enunciat":"L'any passat, per arreglar tot un parc, es va formar un equip de $6$ jardiners per podar els arbres, i van trigar $10$ dies per acabar la feina.\n\nAquest any només hi ha $4$ jardiners per fer la mateixa feina.\n\nQuants dies trigaran a podar tot el parc, si van al mateix ritme de feina?","font":"Llibre 4t ESO A, unitat 3, exercici 13","passos":[["[mat]Abans de calcular, pensa:\n• amb menys jardiners, es triga més dies o menys dies?\n• amb la meitat de jardiners es triga el doble de temps?[/mat]",0],["[mat]És una situació de proporcionalitat inversa.\n$6$ jardiners → $10$ dies\n$4$ jardiners → $x$\n\nSabem que $6\\cdot 10=4\\cdot x$.[/mat] [calc]Escriu $6$ [[per]] $10$.[/calc]",0],["[calc]Prem [[exe]]: obtens $60$.[/calc] [mat]Aquest nombre es manté constant: $60$.[/mat]",0],["[mat]Sabem que $4\\cdot x=60$.[/mat] [calc]Fes l'operació $60$ [[entre]] $4$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $15$.[/calc] [mat]R) Els $4$ jardiners trigaran $15$ dies a podar el parc.[/mat]",0],["[calc]!!Error típic!!:\nSi fas una regla de tres directa: $10$ [[per]] $4$ [[entre]] $6$.[/calc]",1],["[calc]Prem [[shift]] [[exe]] (≈): obtens $6.666666667$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té lògica que $4$ jardiners acabin la feina més ràpid que $6$ jardiners.[/mat]",1]],"grup":"Proporcionalitat inversa","tancament":"[mat]Recorda:\n• L'equació és aquesta: $6\\cdot 10=4\\cdot x$\n• La solució és aquesta: $x=15$ dies[/mat]","provaTu":{"enunciat":"Fa $5$ anys que es va pintar tot l'institut, i ho van fer $3$ pintors, en $8$ dies de feina.\nAquest cop, s'han contractat $4$ pintors.\n\nQuants dies trigaran a pintar l'institut, si treballen al mateix ritme?","solucio":"[mat]$3\\cdot 8=4\\cdot x$\n$x=24\\div 4=6$ dies[/mat]\nR) Els $4$ pintors trigaran $6$ dies."}},{"id":"recu-f6-102","bloc":"eso-proporcionalitat","titol":"Els pots de pintura","enunciat":"En Carles recorda que quan va pintar la seva habitació, ja fa temps, va fer servir $6$ pots de pintura de $4$ kg cadascun.\nAra la vol tornar a pintar, però a la botiga només venen pots de $3$ kg.\n\nQuants pots de $3$ kg necessitarà?","font":"Banc de recuperació de 2n ESO (proporcionalitat directa i inversa)","passos":[["[mat]Abans de calcular, pensa:\n• amb pots més petits, calen més pots o menys?\n• en el fons, quants kg de pintura calen en total?[/mat]",0],["[mat]És una situació de proporcionalitat inversa.\n$6$ pots → $4$ kg cada pot\n$x$ pots → $3$ kg cada pot\n\nSabem que $6\\cdot 4=x\\cdot 3$.[/mat] [calc]Escriu $6$ [[per]] $4$.[/calc]",0],["[calc]Prem [[exe]]: obtens $24$.[/calc] [mat]Aquest nombre es manté constant: són els $24$ kg de pintura que calen.[/mat]",0],["[mat]Sabem que $x\\cdot 3=24$.[/mat] [calc]Fes l'operació $24$ [[entre]] $3$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $8$.[/calc] [mat]R) En Carles necessita $8$ pots de $3$ kg.[/mat]",0],["[calc]!!Error típic!!:\nSi fas una regla de tres directa: $6$ [[per]] $3$ [[entre]] $4$.[/calc]",1],["[calc]Prem [[shift]] [[exe]] (≈): obtens $4.5$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té cap sentit, perquè si compres pots més petits, en necessites més de $6$, segur![/mat]",1]],"grup":"Proporcionalitat inversa","tancament":"[mat]Recorda:\n• L'equació és aquesta: $6\\cdot 4=x\\cdot 3$\n• La solució és aquesta: $x=8$ pots[/mat]","provaTu":{"enunciat":"Per omplir una piscina calen $12$ camions de $9.000$ litres.\nTu només tens camions de $6.000$ litres. Quants camions et caldran?","solucio":"[mat]$12\\cdot 9.000=x\\cdot 6.000$\n$x=108.000\\div 6.000=18$ camions[/mat]\nR) Em caldran $18$ camions."}},{"id":"ll4a-3-14","bloc":"eso-proporcionalitat","titol":"El taxi","enunciat":"Un taxi cobra $3{,}50$ € per començar el viatge i, després, $1{,}20$ € per cada km recorregut.\n\nPer anar a l'hospital a visitar un familiar has fet un trajecte de $5$ km. Després, per acompanyar-lo a casa seva, has fet un trajecte de $10$ km.\n\n**a)** Creus que el trajecte de $10$ km costa el doble que el de $5$ km?\n**b)** Quant costa cada trajecte?","font":"Llibre 4t ESO A, unitat 3, exercici 14","passos":[["[mat]Per fer un trajecte de $5$ km es paguen els $3{,}50$ € inicials i després $1{,}20$ € per cada km.\n$3{,}50$ € $+\\ 5\\cdot 1{,}20$ €[/mat] [calc]Escriu $3.5$ [[mes]] $1.2$ [[per]] $5$.[/calc]",0],["[calc]Prem directament [[shift]] [[exe]] (≈): obtens el resultat en decimal, que és $9.5$.[/calc] [mat]El trajecte de $5$ km costa $9{,}50$ €.[/mat]",0],["[mat]Per un trajecte de $10$ km: $3{,}50$ € $+\\ 10\\cdot 1{,}20$ €[/mat] [calc]Esborra amb [[ac]] i escriu $3.5$ [[mes]] $10$ [[per]] $1.2$.[/calc]",0],["[calc]Prem [[shift]] [[exe]] (≈): obtens $15.5$.[/calc] [mat]El trajecte de $10$ km costa $15{,}50$ €.[/mat]",0],["[mat]R) El trajecte de $5$ km costa $9{,}50$ € i el de $10$ km, $15{,}50$ €.\nEl preu no és proporcional als km recorreguts.[/mat]",0]],"grup":"Quan no és proporcional","provaTu":{"enunciat":"Un gimnàs cobra $30$ € de matrícula inicial i, posteriorment, cobra $25$ € cada mes.\n**a)** Quant pagaràs si hi vas $3$ mesos?\n**b)** I si hi vas $6$ mesos?\n**c)** En el segon cas, pagues el doble que en el primer cas?","solucio":"[mat]$30+25\\cdot 3=105$ €\n$30+25\\cdot 6=180$ €[/mat]\nR) Pagaré $105$ € i $180$ €, respectivament.\nNo és el doble, perquè la matrícula sempre es paga una sola vegada."}},{"id":"cb4-23-q23","bloc":"eso-percentatges","titol":"Les fotos amb descompte","enunciat":"Una botiga imprimeix fotografies en color a $0{,}30$ € cadascuna.\n\nL'Anna hi imprimeix $40$ fotografies en color i la botiga li fa un descompte del $25$ %.\n\nQuant li costarà imprimir les fotografies?","font":"CB 4ESO (2023), pregunta 23","passos":[["[mat]Sense descompte, $40$ fotografies costen això:\n$40\\cdot 0{,}30$ €.[/mat] [calc]Escriu $40$ [[per]] $0.3$.[/calc]",0],["[mat]Amb un descompte del $25$ %, es paga el $75$ % del preu.\nPagar el $75$ % és multiplicar per $0{,}75$.[/mat] [calc]Ara fes l'operació [[per]] $0.75$.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $9$.[/calc] [mat]R) A l'Anna li costarà $9$ € imprimir les $40$ fotografies.[/mat]",0],["[calc]!!Error típic!!:\nSi multipliques pel descompte en lloc de pel que es paga: $40$ [[per]] $0.3$ [[per]] $0.25$.[/calc]",1],["[calc]Prem [[exe]]: obtens $3$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té sentit: $3$ € és el que s'estalvia l'Anna, i no és el preu final que cal pagar.[/mat]",1]],"tancament":"[mat]Recorda:\n• Si et fan un descompte del $25$ %, en el fons vol dir que pagues un $75$ % del preu. Per tant, cal multiplicar per $0{,}75$\n\n$40\\cdot 0{,}30\\cdot 0{,}75=9$ €[/mat]","provaTu":{"enunciat":"Una llibreta costa $2{,}40$ €. Tu en compres $15$ i et fan un descompte del $20$ %.\nQuant pagaràs en total?","solucio":"[mat]$15\\cdot 2{,}40\\cdot 0{,}80=28{,}80$ €[/mat]\nR) Pagaré $28{,}80$ €."}},{"id":"cb4-23-q24","bloc":"eso-percentatges","titol":"Les fotos que imprimeix l'Anna","enunciat":"L'Anna va a una botiga a imprimir fotografies en color. Sap que van a $0{,}30$ € cada còpia.\n\nLi fan un descompte del $25$ % i paga $4{,}50$ €.\n\nQuantes fotografies ha imprès?","font":"CB 4ESO (2023), pregunta 24","passos":[["[mat]Amb el descompte, l'Anna paga el $75$ % del preu: $4{,}50$ € és el $75$ % del preu sense descompte.\nPer trobar el preu sense descompte, es divideix entre $0{,}75$.[/mat] [calc]Escriu $4.5$ [[entre]] $0.75$.[/calc]",0],["[calc]Prem [[exe]]: obtens $6$.[/calc] [mat]Sense descompte, les fotografies costarien $6$ €.[/mat]",0],["[mat]Cada fotografia costa $0{,}30$ €: hi ha tantes fotografies com vegades hi cap $0{,}30$ € en $6$ €.[/mat] [calc]Fes l'operació [[entre]] $0.3$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $20$.[/calc] [mat]R) L'Anna ha imprès $20$ fotografies.[/mat]",0],["[calc]!!Error típic!!:\nSi desfàs el descompte afegint un $25$ %, és a dir, multiplicant per $1.25$: $4.5$ [[per]] $1.25$ [[entre]] $0.3$.[/calc]",1],["[calc]Prem [[exe]] i després [[sd]]: obtens $18.75$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té cap sentit imprimir $18{,}75$ fotografies, i això ens fa sospitar que no hem plantejat bé les operacions.[/mat]",1]],"tancament":"[mat]Recorda:\n• Si has pagat el $75$ % del preu, per saber el preu sense descompte cal dividir entre $0{,}75$\n\n$4{,}50\\div 0{,}75=6$ €\n$6\\div 0{,}30=20$ fotografies[/mat]","provaTu":{"enunciat":"Unes llibretes costen $2{,}40$ € cadascuna. Amb un descompte del $20$ %, has pagat $28{,}80$ €.\nQuantes llibretes has comprat?","solucio":"[mat]$28{,}80\\div 0{,}80=36$ €\n$36\\div 2{,}40=15$ llibretes[/mat]\nR) He comprat $15$ llibretes."}},{"id":"ll4-2-25","bloc":"eso-percentatges","titol":"La declaració de l'IVA","enunciat":"En Jordi té una botiga d'electrodomèstics. Cada trimestre ha de fer la declaració de l'IVA a Hisenda.\n\nEn el primer trimestre de l'any ha cobrat $18.150$ € als seus clients, amb l'IVA del $21$ % inclòs.\n\n**a)** Quants diners ha facturat realment, sense IVA?\n**b)** Quants diners d'IVA haurà de pagar a Hisenda?","font":"Llibre 4t ESO, unitat 2, exercici 25","passos":[["[mat]Afegir l'IVA del $21$ % és multiplicar per $1{,}21$.\nPer calcular el preu sense IVA, cal fer aquesta operació:\n$18.150$ € $\\div 1{,}21$[/mat] [calc]Escriu $18150$ [[entre]] $1.21$.[/calc]",0],["[calc]Prem [[exe]]: obtens $15000$.[/calc] [mat]Sense IVA, en Jordi ha facturat $15.000$ €.[/mat]",0],["[mat]L'IVA és la diferència entre el que ha cobrat i el que ha facturat:\n$18.150$ € $-\\ 15.000$ €[/mat] [calc]Escriu $18150$ [[menys]] [[ans]].\n[[ans]] és el resultat d'abans.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $3150$.[/calc] [mat]R) En Jordi ha facturat $15.000$ € i haurà de pagar $3.150$ € d'IVA a Hisenda.[/mat]",0]],"provaTu":{"enunciat":"Tens una petita botiga de roba. En un trimestre has cobrat $24.200$ € als clients, amb l'IVA del $21$ % inclòs.\n**a)** Quants diners has facturat sense IVA?\n**b)** Quants diners d'IVA hauràs de pagar a Hisenda?","solucio":"[mat]$24.200\\div 1{,}21=20.000$ €\n$24.200-20.000=4.200$ €[/mat]\nR) He facturat $20.000$ € i hauré de pagar $4.200$ € d'IVA."}},{"id":"ll4a-2-17","bloc":"eso-percentatges","titol":"L'abric rebaixat","enunciat":"En una botiga de roba hi ha un cartell que diu: «Rebaixa del $40$ % i, els dijous, un $10$ % extra: tindràs un $50$ % de descompte!».\n\nEn Pau hi vol comprar un abric de $200$ €. Aprofita que és dijous per tenir més rebaixa. De fet, en Pau creu que haurà de pagar just la meitat, o sigui, $100$ €.\n\n**a)** Realment, quin és el preu rebaixat que pagarà en Pau?\n**b)** És cert que li han fet un $50$ % de descompte?","font":"Llibre 4t ESO A, unitat 2, exercici 17","passos":[["[mat]Abans de calcular, pensa:\n• el $10$ % extra es calcula sobre $200$ € o sobre un preu més petit?[/mat]",0],["[mat]Amb un $40$ % de descompte es paga el $60$ %: es multiplica per $0{,}6$.\nAmb el $10$ % extra es paga el $90$ % del que queda: es multiplica per $0{,}9$.[/mat] [calc]Escriu $200$ [[per]] $0.6$ [[per]] $0.9$.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $108$.[/calc] [mat]R) L'abric costa $108$ €.\nEl descompte que li han fet és:\n$200-108=92$ €\nPer tant, no li fan un $50$ % de descompte, perquè no li han rebaixat $100$ €.[/mat]",0],["[calc]!!Error típic!!:\nSi sumes els descomptes, $40$ % $+\\ 10$ % $=50$ %: $200$ [[per]] $0.5$.[/calc]",1],["[calc]Prem [[exe]]: obtens $100$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té sentit: el $10$ % extra és sobre $120$ €, no sobre $200$ €. Els descomptes encadenats no se sumen![/mat]",1]],"tancament":"[mat]Recorda:\n• Si et fan dos descomptes seguits, primer pagues el $60$ % del preu inicial i, després, el $90$ % del primer preu rebaixat. Per tant, cal multiplicar per $0{,}6$ i per $0{,}9$\n\n$200$ € $\\cdot 0{,}6\\cdot 0{,}9=108$ €[/mat]","provaTu":{"enunciat":"Una tauleta costa $300$ €. Primer la rebaixen un $20$ % i després, sobre el preu rebaixat, un $10$ % més.\n**a)** Quin és el preu final?\n**b)** Quin percentatge de descompte t'han fet en total?","solucio":"[mat]$300\\cdot 0{,}8\\cdot 0{,}9=216$ €\n$300-216=84$ €\n$84\\div 300=0{,}28$[/mat]\nR) La tauleta em costarà $216$ €.\nM'han fet un descompte del $28$ %, no del $30$ %."}},{"id":"ll
