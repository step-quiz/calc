4-2-16","bloc":"eso-percentatges","titol":"L'historial de preus del televisor","enunciat":"La Naia està mirant l'historial de preus d'un televisor en una botiga en línia. La Naia se sorprèn molt, fixa't què passa:\n\n• Fa $2$ mesos, el preu era $300$ €.\n• Fa $1$ mes, el preu va baixar exactament un $15$ %.\n• Ahir mateix, el preu va pujar exactament un $15$ %.\n\nPerò el preu actual, segons està veient la Naia, **no és** de $300$ €.\n\n**a)** Quin és el preu actual del televisor?\n**b)** Com pot ser que no torni a costar $300$ €?","font":"Llibre 4t ESO, unitat 2, exercici 16","passos":[["[mat]Abans de calcular, pensa:\n• Sabem que la baixada del $15$ % es calcula sobre $300$ €. Però... la pujada del $15$ %, sobre quin preu es calcula?[/mat]",0],["[mat]• Baixar un $15$ % és pagar el $85$ %: es multiplica per $0{,}85$.\n• Pujar un $15$ % és pagar el $115$ %: es multiplica per $1{,}15$.\nPreu actual: $300$ € $\\cdot 0{,}85\\cdot 1{,}15$[/mat] [calc]Escriu $300$ [[per]] $0.85$ [[per]] $1.15$.[/calc]",0],["[calc]Prem [[exe]] i després [[sd]]: obtens el resultat en decimal, que és $293.25$.[/calc] [mat]R) Ara el televisor costa $293{,}25$ €, i no $300$ €.\nLa baixada i la pujada no es compensen.[/mat]",0]],"provaTu":{"enunciat":"Una samarreta costa $40$ €. Primer el preu puja un $25$ % i després baixa un $25$ %.\nQuin és el preu final de la samarreta?","solucio":"[mat]$40\\cdot 1{,}25\\cdot 0{,}75=37{,}50$ €[/mat]\nR) La samarreta costa $37{,}50$ €, menys que al principi."}},{"id":"cb4-26-q15","bloc":"eso-mitjanes","titol":"Les places de l'hotel","enunciat":"Un hotel apunta cada setmana quantes places ha ocupat. En $4$ setmanes ha ocupat $168$, $154$, $210$ i $260$ places, respectivament.\n\nQuina ha estat la mitjana de places ocupades?","font":"CB 4ESO (2026), pregunta 15","passos":[["[mat]La mitjana és la suma de les places dividida entre el nombre de setmanes:\n$\\frac{168+154+210+260}{4}$[/mat] [calc]Primer escriu la suma entre parèntesis: [[lpar]] $168$ [[mes]] $154$ [[mes]] $210$ [[mes]] $260$ [[rpar]].[/calc]",0],["[calc]Ara fes l'operació [[entre]] $4$.[/calc] [mat]Gràcies als parèntesis, es divideix tota la suma entre $4$.[/mat]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $198$.[/calc] [mat]R) La mitjana ha estat de $198$ places ocupades per setmana.[/mat]",0],["[calc]!!Error típic!!:\nSi escrius la suma sense parèntesis: $168$ [[mes]] $154$ [[mes]] $210$ [[mes]] $260$ [[entre]] $4$.[/calc]",1],["[calc]Prem [[exe]]: obtens $597$.[/calc] [mat]La calculadora ha seguit bé les instruccions, però sense parèntesis només s'ha dividit el $260$ entre $4$.[/mat] [mat]No té cap sentit: la mitjana no pot ser més gran que les places de qualsevol setmana![/mat]",1]],"tancament":"[mat]Recorda:\n• Si vols dividir tota una suma, recorda d'escriure-la entre parèntesis.\n\n$(168+154+210+260)\\div 4=198$ places[/mat]","provaTu":{"enunciat":"Aquesta setmana, un bar ha venut $35$, $42$, $28$, $50$ i $45$ entrepans, de dilluns a divendres.\nQuina és la mitjana d'entrepans venuts per dia?","solucio":"[mat]$(35+42+28+50+45)\\div 5=40$[/mat]\nR) De mitjana, el bar ha venut $40$ entrepans per dia."}},{"id":"cb4-24-q8","bloc":"eso-mitjanes","titol":"Les estrelles de la botiga","enunciat":"Els $80$ clients d'una botiga han valorat la seva compra amb una puntuació d'$1$ a $5$ estrelles. Aquesta taula diu quants clients han donat cada puntuació:\n\n$$\\begin{array}{l|ccccc}\\text{Estrelles} & 5 & 4 & 3 & 2 & 1\\\\ \\hline \\text{Clients} & 22 & 32 & 16 & 8 & 2\\end{array}$$\nQuina és la puntuació mitjana de la botiga?","font":"CB 4ESO (2024), pregunta 8","passos":[["[mat]• Cada puntuació d'estrelles s'ha de multiplicar pel nombre de clients que l'han donada.\n• Després, cal sumar tots els resultats.\n• Finalment, caldrà fer una divisió.[/mat] [calc]Per començar, prem [[frac]] i escriu la suma al numerador.[/calc]",0],["[mat]Necessitem saber el total de clients:\n$22+32+16+8+2=80$\nCaldrà dividir la nostra suma entre el total de clients, que és $80$.[/mat] [calc]Baixa al denominador amb [[down]] i escriu $80$.[/calc]",0],["[calc]Prem [[exe]]: obtens $\\frac{19}{5}$.\nSi surt en forma de fracció és perquè la calculadora està configurada per donar resultats exactes.\nSi estigués configurada per donar decimals, sortiria $3.8$.[/calc] [mat]$\\frac{19}{5}=3{,}8$ estrelles[/mat]",0],["[calc]Per tenir-lo en decimal, prem [[sd]]: obtens $3.8$.[/calc] [mat]R) La puntuació mitjana és de $3{,}8$ estrelles.[/mat]",0]],"provaTu":{"enunciat":"Aquesta taula mostra les notes d'un examen de matemàtiques dels $30$ alumnes d'una classe:\n\n$$\\begin{array}{l|ccccccccc}\\text{Nota} & 2 & 3 & 4 & 5 & 6 & 7 & 8 & 9 & 10\\\\ \\hline \\text{Alumnes} & 1 & 2 & 3 & 5 & 6 & 5 & 4 & 2 & 2\\end{array}$$\nQuina és la nota mitjana de la classe?","solucio":"[mat]$\\frac{2\\cdot 1+3\\cdot 2+4\\cdot 3+5\\cdot 5+6\\cdot 6+7\\cdot 5+8\\cdot 4+9\\cdot 2+10\\cdot 2}{30}=\\frac{186}{30}=6{,}2$[/mat]\nR) La nota mitjana de la classe és un $6{,}2$."}},{"id":"cb4-25-q17","bloc":"eso-mitjanes","titol":"Les tardes a la biblioteca","enunciat":"S'ha fet una enquesta per saber quantes tardes per setmana els alumnes de 4t d'ESO d'un institut van a estudiar a la biblioteca del barri.\n\nDels alumnes enquestats, $25$ hi van $1$ tarda per setmana, $35$ hi van $2$ tardes, $25$ hi van $3$ tardes i $10$ hi van $4$ tardes.\n\nDe mitjana, quantes tardes per setmana hi van?","font":"CB 4ESO (2025), pregunta 17","passos":[["[mat]• Cada nombre de tardes s'ha de multiplicar pel nombre d'alumnes que hi van.\n• Després, cal sumar tots els resultats.\n• Finalment, caldrà fer una divisió.[/mat] [calc]Per començar, prem [[frac]] i escriu la suma al numerador.[/calc]",0],["[mat]Necessitem saber el total d'alumnes enquestats:\n$25+35+25+10$\nCaldrà dividir la nostra suma entre aquest total.[/mat] [calc]Baixa al denominador amb [[down]] i escriu aquesta suma.[/calc]",0],["[calc]Prem directament [[shift]] [[exe]] (≈): obtens el resultat en decimal, que és $2.210526316$.[/calc] [mat]R) De mitjana, hi van aproximadament $2{,}21$ tardes per setmana.[/mat]",0],["[calc]!!Error típic!!:\nSi ho escrius en una línia i no poses parèntesis al denominador: [[lpar]] … [[rpar]] [[entre]] $25$ [[mes]] $35$ [[mes]] $25$ [[mes]] $10$.[/calc]",1],["[calc]Prem [[exe]] i després [[sd]]: obtens $78.4$.[/calc] [mat]La calculadora ha seguit bé les instruccions, però sense parèntesis només s'ha dividit entre el primer $25$.[/mat] [mat]No té cap sentit: una setmana no té $78$ tardes![/mat]",1]],"tancament":"[mat]Recorda:\n• Si el denominador és una suma, recorda d'escriure'l entre parèntesis, o fer servir la plantilla de fracció si la calculadora en té.\n\n$\\frac{210}{95}\\simeq 2{,}21$ tardes per setmana[/mat]","provaTu":{"enunciat":"En una classe de $40$ alumnes, $12$ no tenen cap germà, $15$ en tenen $1$, $8$ en tenen $2$ i $5$ en tenen $3$.\nQuina és la mitjana de germans per alumne?","solucio":"[mat]$\\frac{0\\cdot 12+1\\cdot 15+2\\cdot 8+3\\cdot 5}{12+15+8+5}=\\frac{46}{40}=1{,}15$ germans[/mat]\nR) De mitjana, cada alumne té $1{,}15$ germans."}},{"id":"ll4a-8-56","bloc":"eso-mitjanes","titol":"La nota final de Tecnologia","enunciat":"A l'institut de la Marta, la nota final de Tecnologia es calcula així:\n• l'examen compta un $30$ %;\n• la part pràctica al laboratori, un $30$ %;\n• el projecte final, un $40$ %.\n\nLa Marta ha tret un $5$ a l'examen, un $6$ a les pràctiques i un $9$ al projecte.\n\nQuina és la nota mitjana de la Marta?","font":"Llibre 4t ESO A, unitat 8, exercici 56","passos":[["[mat]Abans de calcular, pensa:\n• és possible que la seva nota mitjana sigui un $4$?\n• creus que la seva nota s'acostarà més al $5$ o al $7$?[/mat]",0],["[mat]Cada nota es multiplica pel seu pes ($30$ % és $0{,}3$) i se sumen.\nNo cal dividir: els pesos ja sumen $1$, el $100$ %.[/mat] [calc]Escriu $0.3$ [[per]] $5$ [[mes]] $0.3$ [[per]] $6$ [[mes]] $0.4$ [[per]] $9$.[/calc]",0],["[calc]Prem directament [[shift]] [[exe]] (≈): obtens el resultat en decimal, que és $6.9$.[/calc] [mat]R) La nota mitjana de la Marta és un $6{,}9$.[/mat]",0]],"provaTu":{"enunciat":"La nota d'una matèria es calcula amb aquesta mitjana ponderada: un $60$ % l'examen i un $40$ % els treballs.\nTu has tret un $4$ a l'examen i un $8$ als treballs. Quina és la teva nota mitjana?","solucio":"[mat]$0{,}6\\cdot 4+0{,}4\\cdot 8=5{,}6$[/mat]\nR) La meva nota mitjana és un $5{,}6$."}},{"id":"cb4-26-q7","bloc":"eso-geometria","titol":"El tram d'escala","enunciat":"Una escala uneix dues plantes d'un edifici. Cada tram d'escala puja una altura de $3$ m i avança una longitud de $5$ m.\n\nQuant mesura cada tram d'escala?","font":"CB 4ESO (2026), pregunta 7","passos":[["[mat]El tram és la hipotenusa d'un triangle rectangle amb catets de $3$ m i $5$ m.\nApliquem el teorema de Pitàgores per trobar quant mesura la hipotenusa:\n$\\sqrt{3^2+5^2}$[/mat] [calc]Prem [[arrel]] i escriu a dins $3$ [[x2]] [[mes]] $5$ [[x2]].[/calc]",0],["[calc]Prem [[exe]]: obtens $\\sqrt{34}$.\nSi surt en forma d'arrel és perquè la calculadora està configurada per donar resultats exactes.\nSi estigués configurada per donar decimals, sortiria $5.830951895$.[/calc] [mat]$\\sqrt{34}\\simeq 5{,}83$ m[/mat]",0],["[calc]Per obtenir l'expressió decimal de l'arrel, prem [[sd]].\nObtens $5.830951895$.[/calc] [mat]R) Cada tram d'escala mesura aproximadament $5{,}83$ m.[/mat]",0]],"provaTu":{"enunciat":"La rampa de l'skatepark del teu barri puja una altura d'$1{,}2$ m i avança una longitud de $5$ m.\nQuant mesura la rampa?","solucio":"[mat]$\\sqrt{1{,}2^2+5^2}=\\sqrt{26{,}44}\\simeq 5{,}14$ m[/mat]\nR) La rampa mesura aproximadament $5{,}14$ m."}},{"id":"ll4a-4-34","bloc":"eso-geometria","titol":"L'escala recolzada a la paret","enunciat":"En Marc recolza una escala de $5$ m en una paret per pintar-la. El peu de l'escala queda separat una distància de $4$ m respecte de la base de la paret.\n\nA quina altura de la paret arriba l'escala?","font":"Llibre 4t ESO A, unitat 4, exercici 34","passos":[["[mat]Abans de calcular, pensa:\n• quin és el costat més llarg del triangle: l'escala, la paret o el terra?\n• l'escala pot arribar a més de $5$ m d'altura?[/mat]",0],["[mat]Podem formar un triangle rectangle, on:\n• el tros de terra ($4$ m) és un catet;\n• l'altura a la qual arriba l'escala és l'altre catet;\n• la pròpia escala és la hipotenusa.\nPel teorema de Pitàgores, l'altura de l'escala val:\n$\\sqrt{5^2-4^2}$[/mat] [calc]Prem [[arrel]] i escriu a dins $5$ [[x2]] [[menys]] $4$ [[x2]].[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $3$.[/calc] [mat]R) L'escala arriba a $3$ m d'altura de la paret.[/mat]",0],["[calc]!!Error típic!!:\nSi sumes els quadrats en lloc de restar-los: [[arrel]] $5$ [[x2]] [[mes]] $4$ [[x2]].[/calc]",1],["[calc]Prem [[shift]] [[exe]] (≈): obtens $6.403124237$.[/calc] [mat]La calculadora ha seguit les teves instruccions, però no té cap sentit, perquè una escala de $5$ m inclinada no pot arribar a $6{,}4$ m d'altura. L'altura màxima seria precisament $5$ m, posant-la vertical.[/mat]",1]],"tancament":"[mat]Recorda:\n• Si coneixes la hipotenusa i un catet, i vols trobar la mida de l'altre catet, et cal aplicar la fórmula adequada:\n\n$\\sqrt{5^2-4^2}=3$ m[/mat]","provaTu":{"enunciat":"Els bombers recolzen una escala de $6{,}5$ m en una paret. El peu de l'escala és a $2{,}5$ m de la paret.\nA quina altura arriba l'escala?","solucio":"[mat]$\\sqrt{6{,}5^2-2{,}5^2}=\\sqrt{36}=6$ m[/mat]\nR) L'escala arriba a $6$ m d'altura."}},{"id":"cb4-22-q8","bloc":"eso-geometria","titol":"El got de vidre","enunciat":"Un got de vidre té forma de cilindre. El radi de la base fa $3$ cm i l'alçada, $15$ cm.\n\nQuin és el volum del got?[nota]Volum d'un cilindre: $V=\\pi\\cdot r^2\\cdot h$[/nota]","font":"CB 4ESO (2022), pregunta 8","passos":[["[mat]El volum del got es calcula així, a partir del seu radi i de la seva altura:\n$V=\\pi\\cdot 3^2\\cdot 15$[/mat] [calc]Escriu π ([[shift]] [[exp]]), [[per]] $3$ [[x2]] [[per]] $15$.[/calc]",0],["[calc]Prem [[exe]]: obtens $135\\pi$.\nSi surt amb π és perquè la calculadora està configurada per donar resultats exactes.\nSi estigués configurada per donar decimals, sortiria $424.1150082$.[/calc]",0],["[calc]Per tenir-lo en decimal, prem [[sd]]: obtens $424.1150082$.[/calc] [mat]R) El volum del got és aproximadament de $424$ cm³.[/mat]",0]],"provaTu":{"enunciat":"Una llauna de refresc té forma de cilindre. El radi de la base fa $3$ cm i l'alçada, $11{,}66$ cm.\n• Quin és el volum de la llauna?\n• És cert que hi caben $330$ ml?","solucio":"[mat]$V=\\pi\\cdot 3^2\\cdot 11{,}66=104{,}94\\pi\\simeq 329{,}7$ cm³[/mat]\nR) El volum de la llauna és aproximadament de $329{,}7$ cm³, és a dir, uns $330$ ml: sí, hi caben."}},{"id":"cb4-25-q27","bloc":"eso-geometria","titol":"La tela del para-sol","enunciat":"Volem saber quanta tela fa falta per construir un para-sol. Podem aproximar l'àrea del para-sol per la d'un cercle de $0{,}75$ m de radi.\n\nTroba el valor d'aquesta àrea.[nota]Àrea del cercle: $A=\\pi\\cdot r^2$[/nota]","font":"CB 4ESO (2025), pregunta 27","passos":[["[mat]L'àrea del cercle es calcula així:\n$A=\\pi\\cdot 0{,}75^2$[/mat] [calc]Escriu π ([[shift]] [[exp]]), [[per]] $0.75$ [[x2]].[/calc]",0],["[calc]Prem [[exe]]: obtens $\\frac{9}{16}\\pi$.\nAmb [[sd]] el passes a decimal: $1.767145868$.[/calc] [mat]R) Calen aproximadament $1{,}77$ m² de tela.[/mat]",0]],"provaTu":{"enunciat":"Una pizza rodona fa $15$ cm de radi.\nQuant val la seva àrea?","solucio":"[mat]$A=\\pi\\cdot 15^2=225\\pi\\simeq 706{,}86$ cm²[/mat]\nR) La pizza té una àrea aproximada de $706{,}86$ cm²."}},{"id":"ll4a-4-8","bloc":"eso-geometria","titol":"L'ombra del campanar","enunciat":"Un dia de sol, la Júlia vol saber l'altura del campanar del seu poble. Fa aquest experiment:\n• En primer lloc, mesura l'ombra que fa el campanar al terra: són $12$ m.\n• Ràpidament, posa un pal vertical i pren mesures: el pal mesura $2$ m i la seva ombra, $1{,}5$ m.\n\nLa Júlia ha anat ràpid perquè no volia que el Sol canviés la seva inclinació respecte del terra.\n\nLa Júlia ja sap que el campanar mesura $16$ m d'altura. Com ho ha sabut?","font":"Llibre 4t ESO A, unitat 4, exercicis 8 i 11","passos":[["[mat]Abans de calcular, pensa:\n• el pal mesura més que la seva pròpia ombra, o menys?\n• aleshores, el campanar tindrà una altura superior o inferior a $12$ m?[/mat]",0],["[mat]El pal i el campanar, amb les seves ombres, formen triangles semblants.\nLa raó de semblança és aquesta:\n$12\\div 1{,}5$[/mat] [calc]Escriu $12$ [[entre]] $1.5$.[/calc]",0],["[calc]Prem [[exe]]: obtens $8$.[/calc] [mat]Això vol dir que l'ombra del campanar és $8$ vegades la del pal. Per tant, l'altura del campanar també serà $8$ vegades la del pal.\nCom que el pal mesura $2$ m, farem el següent:[/mat]",0],["[calc]Fes l'operació [[per]] $2$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $16$.[/calc] [mat]R) La Júlia ho ha sabut perquè l'altura del campanar és $8$ vegades la del pal: $2\\cdot 8=16$ m.[/mat]",0],["[calc]!!Error típic!!:\nSi inverteixes la raó i fas ombra entre altura: $1.5$ [[per]] $12$ [[entre]] $2$.[/calc]",1],["[calc]Prem [[exe]]: obtens $9$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té sentit: el campanar ($9$ m) seria més baix que la seva ombra ($12$ m), i el pal no![/mat]",1]],"tancament":"[mat]Recorda:\n• Si l'ombra és $8$ vegades més llarga, l'altura també és $8$ vegades més gran\n\n$12\\div 1{,}5=8$\n$2\\cdot 8=16$ m[/mat]","provaTu":{"enunciat":"Un fanal de $6$ m fa una ombra de $9$ m.\nA la mateixa hora, quina ombra faràs tu, si fas $1{,}8$ m d'alçada?","solucio":"[mat]$9\\div 6=1{,}5$\n$1{,}8\\cdot 1{,}5=2{,}7$ m[/mat]\nR) La meva ombra farà $2{,}7$ m."}},{"id":"eso-posa-graus","bloc":"eso-trigonometria","titol":"La calculadora en radians","enunciat":"A dalt de la pantalla de la calculadora hi ha una R: la calculadora treballa en radians.\n\nCalcula l'altura de l'arbre de la fitxa següent, $12\\cdot\\tan 35^\\circ$, i posa la calculadora en graus.","font":"","passos":[["[calc]!!Error típic!!:\nSi calcules amb la R a la barra: $12$ [[tan]] $35$ [[rpar]].[/calc]",1],["[calc]Prem [[exe]]: obtens $5.685776645$.[/calc] [mat]La calculadora ha seguit bé les instruccions, però ha entès $35$ radians, i no $35^\\circ$.[/mat]",1],["[calc]Ho arreglem. Prem [[shift]] i [[menu]] (a sobre hi ha CONFIG): el menú de configuració.\nLes opcions es trien prement el seu número.[/calc]",0],["[calc]Prem $2$: {{2:Unidad angular}}.[/calc]",0],["[calc]Prem $1$: {{1:Grado sexag (D)}}, els graus.\nLa calculadora torna a la pantalla de calcular, i a la barra ara hi ha D.[/calc]",0],["[calc]Torna a escriure $12$ [[tan]] $35$ [[rpar]].[/calc]",0],["[calc]Prem [[exe]]: obtens $8.402490459$.[/calc] [mat]R) Ara sí: l'arbre fa aproximadament $8{,}4$ m d'altura.[/mat]",0]],"provaTu":{"enunciat":"Primer, comprova que la calculadora és en graus: a dalt de la pantalla hi ha d'haver una D.\nDesprés, calcula $5\\cdot\\tan 30^\\circ$.","solucio":"[mat]$5\\cdot\\tan 30^\\circ=\\frac{5\\sqrt{3}}{3}\\simeq 2{,}89$[/mat]\n[nota]Si et surt $-32{,}03$, la calculadora és en radians.[/nota]"}},{"id":"ll4-7-37","bloc":"eso-trigonometria","titol":"L'arbre del pati","enunciat":"En Pol vol saber l'altura de l'arbre del pati de l'institut. Un dia de sol, l'arbre fa una ombra de $12$ m, i els raigs del sol formen un angle de $35^\\circ$ amb el terra.\n\nQuina és l'altura de l'arbre?","font":"Llibre 4t ESO, unitat 7, exercici 37","passos":[["[calc]Abans de res, mira la barra: hi ha d'haver una D (graus), perquè els angles d'aquest problema són en graus.\nSi hi ha una R, mira la fitxa anterior.[/calc]",0],["[mat]Podem formar un triangle rectangle, on:\n• l'ombra ($12$ m) és el catet contigu a l'angle de $35^\\circ$;\n• l'altura de l'arbre és el catet oposat.\nOposat i contigu → tangent. L'altura es calcula així:\n$h=12\\cdot\\tan 35^\\circ$[/mat] [calc]Escriu $12$, [[tan]], $35$ i [[rpar]].\nNo cal el [[per]].[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $8.402490459$.[/calc] [mat]R) L'arbre fa aproximadament $8{,}4$ m d'altura.[/mat]",0]],"provaTu":{"enunciat":"Un fanal del carrer fa una ombra de $6$ m, quan els raigs del sol formen un angle de $40^\\circ$ amb el terra.\nQuina és l'altura del fanal?","solucio":"[mat]$h=6\\cdot\\tan 40^\\circ\\simeq 5{,}03$ m[/mat]\nR) El fanal fa aproximadament $5{,}03$ m d'altura."}},{"id":"ll4-7-38","bloc":"eso-trigonometria","titol":"L'escala dels bombers","enunciat":"Els bombers recolzen una escala de $5$ m a la paret d'un edifici. L'escala forma un angle de $60^\\circ$ amb el terra.\n\nA quina altura de la paret arriba l'escala?","font":"Llibre 4t ESO, unitat 7, exercici 38","passos":[["[mat]Podem formar un triangle rectangle, on:\n• la pròpia escala ($5$ m) és la hipotenusa;\n• l'altura a la qual arriba és el catet oposat a l'angle de $60^\\circ$.\nOposat i hipotenusa → sinus. L'altura es calcula així:\n$h=5\\cdot\\sin 60^\\circ$[/mat] [calc]Amb la D a la barra, escriu $5$, [[sen]], $60$ i [[rpar]].[/calc]",0],["[calc]Prem [[exe]]: obtens $\\frac{5\\sqrt{3}}{2}$.\nSi surt en forma d'arrel és perquè la calculadora està configurada per donar resultats exactes.\nSi estigués configurada per donar decimals, sortiria $4.330127019$.[/calc] [mat]$\\frac{5\\sqrt{3}}{2}\\simeq 4{,}33$ m[/mat]",0],["[calc]Per obtenir l'expressió decimal de l'arrel, prem [[sd]].\nObtens $4.330127019$.[/calc] [mat]R) L'escala arriba aproximadament a $4{,}33$ m d'altura.[/mat]",0]],"provaTu":{"enunciat":"L'estel de la Laia està lligat amb un fil de $20$ m, que forma un angle de $50^\\circ$ amb el terra.\nA quina altura vola l'estel?","solucio":"[mat]$h=20\\cdot\\sin 50^\\circ\\simeq 15{,}32$ m[/mat]\nR) L'estel vola aproximadament a $15{,}32$ m d'altura."}},{"id":"ll4-7-39","bloc":"eso-trigonometria","titol":"L'angle de l'escala","enunciat":"Per seguretat, una escala de mà ha de formar un angle d'uns $75^\\circ$ amb el terra. La Laia recolza una escala de $5$ m a la paret, amb la base a $1{,}5$ m de la paret.\n\nQuin angle forma l'escala amb el terra?","font":"Llibre 4t ESO, unitat 7, exercici 39","passos":[["[mat]Coneixem el catet contigu ($1{,}5$ m) i la hipotenusa ($5$ m): $\\cos\\alpha=\\frac{1{,}5}{5}$\nPer trobar l'angle, cal la funció inversa:\n$\\alpha=\\cos^{-1}(1{,}5\\div 5)$[/mat] [calc]Prem [[shift]] [[cos]] (a sobre hi ha Arccos), escriu $1.5$ [[entre]] $5$ i tanca amb [[rpar]].[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $72.54239688$.\nÉs en graus, perquè a la barra hi ha D.[/calc] [mat]R) L'escala forma un angle d'aproximadament $72{,}5^\\circ$ amb el terra, una mica menys del recomanat.[/mat]",0],["[calc]!!Error típic!!:\nSi oblides la tecla [[shift]]: [[cos]] $1.5$ [[entre]] $5$ [[rpar]].[/calc]",1],["[calc]Prem [[shift]] [[exe]] (≈): obtens $0.9999862922$.[/calc] [mat]La calculadora ha seguit les teves instruccions, però sense la funció inversa ha calculat un cosinus, no un angle. Un angle d'$1^\\circ$ voldria dir que l'escala està gairebé estirada a terra![/mat]",1]],"tancament":"[mat]Recorda:\n• Si vols trobar un angle a partir d'una raó, cal la funció inversa ([[shift]] [[cos]])\n\n$\\alpha=\\cos^{-1}(1{,}5\\div 5)\\simeq 72{,}5^\\circ$[/mat]","provaTu":{"enunciat":"Una rampa per a cadires de rodes fa $8$ m de llarg i puja una altura d'$1$ m.\nQuin angle forma la rampa amb el terra?","solucio":"[mat]$\\sin\\alpha=\\frac{1}{8}$\n$\\alpha=\\sin^{-1}(1\\div 8)\\simeq 7{,}2^\\circ$[/mat]\nR) La rampa forma un angle d'aproximadament $7{,}2^\\circ$ amb el terra."}}],"fx-82ms":[{"id":"exacte-decimal","bloc":"exacte","titol":"Valor exacte i valor decimal","enunciat":"Calcula $\\sin 45^\\circ$. La fx-82MS sempre dona el valor decimal: el valor exacte, $\\frac{\\sqrt{2}}{2}$, l'has de conèixer tu.","font":"","passos":[["[calc]Escriu $\\sin 45$: [[sin]], el 4 i el 5. No cal parèntesi: la calculadora fa el sinus del nombre que ve darrere. La calculadora és en graus (D).[/calc]",0],["[calc]Prem [[igual]]: 0.707106781. La fx-82MS no dona arrels ni π en forma exacta: sempre en decimal.[/calc]",0],["[calc]Comprova que és $\\frac{\\sqrt{2}}{2}$: [[arrel]], el 2, [[entre]], el 2 i [[igual]]. Surt el mateix nombre. La [[arrel]] només afecta el nombre que té darrere: $\\sqrt{2}\\div 2$.[/calc]",0],["[calc]Amb fraccions sí que hi ha valor exacte. $\\frac{1}{4}+\\frac{1}{2}$, amb la tecla [[abc]], dona 3┘4, és a dir, $\\frac{3}{4}$.[/calc]",0],["[calc]La tecla [[abc]] canvia entre fracció i decimal: 0.75.[/calc]",0],["[calc]Un altre cop [[abc]], i torna la fracció.[/calc]",0]]},{"id":"mode-decimal","bloc":"exacte","titol":"Em surt 0.5 en lloc d'1/2","enunciat":"Calcules $1\\div 2$ i la calculadora dona 0.5. A la fx-82MS, si vols veure-ho en forma de fracció, fes servir la tecla [[abc]].","font":"","passos":[["[calc]Calcules $1\\div 2$ i surt 0.5: amb [[entre]], el resultat surt en decimal.[/calc]",0],["[calc]Prem [[abc]]: la calculadora passa el resultat a fracció, 1┘2.[/calc]",0],["[calc]Si escrius la fracció amb [[abc]] des del principi, el resultat ja surt en fracció: l'1, [[abc]], el 2 i [[igual]].[/calc]",0],["[calc]Compte: si hi barreges un decimal, el resultat surt en decimal. Prem [[mes]] (continua amb Ans) i 0.25: surt 0.75. Si el vols en fracció, [[abc]].[/calc]",0]]},{"id":"fix","bloc":"exacte","titol":"Tot em surt arrodonit (FIX)","enunciat":"Tens la fracció d'$\\frac{1}{6}$ i, quan la passes a decimal, et surt 0.17.\nEl motiu és que tens activat el \"FIX\" a la barra de dalt, i algú va fixar 2 decimals.","font":"","passos":[["[calc]Calcules $1\\div 6$ i surt 0.17: és arrodonit a 2 decimals per culpa de FIX.[/calc] [mat]Si calcules amb arrodoniments, s'acumulen errors.[/mat]",0],["[calc]Prem [[mode]] tres vegades: surt el format dels números, {{Fix}} (decimals fixos), {{Sci}} (xifres significatives) i {{Norm}} (normal).[/calc]",0],["[calc]Prem el [[3]], {{Norm}}. La calculadora pregunta quin dels dos normals vols: {{Norm 1~2?}}[/calc]",0],["[calc]Prem l'[[1]]: Norm 1, el de fàbrica. Tornes a la pantalla de càlcul, i FIX ja no hi és.[/calc]",0],["[calc]Torna-ho a calcular: 0.166666667.[/calc] [mat]Arrodoneix tu al final, només quan escriguis la resposta.[/mat]",0],["[calc]Amb Norm 1, els resultats més petits que 0,01 surten amb una potència de 10: $1\\div 200$ surt 5 i, a la dreta, −03, és a dir, $5\\cdot 10^{-3}=0{,}005$. Si els vols en decimal, tria Norm 2: [[mode]] tres vegades, el [[3]] i el [[2]].[/calc]",0]]},{"id":"frac-plantilla","bloc":"fraccions","titol":"Escriu una fracció amb la tecla a b/c","enunciat":"Calcula $\\frac{3}{4}+\\frac{5}{6}$ escrivint les fraccions amb la tecla [[abc]].","font":"","passos":[["[calc]Escriu el 3, prem [[abc]] i escriu el 4. A la pantalla, la fracció surt com a 3┘4: el ┘ fa de ratlla de fracció.[/calc]",0],["[calc]Continua amb [[mes]] i la segona fracció: el 5, [[abc]] i el 6. Tot s'escriu en una sola línia.[/calc]",0],["[calc]Prem [[igual]]: surt 1┘7┘12.[/calc] [mat]És un nombre mixt: 1 sencer i $\\frac{7}{12}$, és a dir, $1+\\frac{7}{12}=\\frac{19}{12}$. Els nombres mixtos no els fem servir.[/mat] [calc]La calculadora dona les fraccions així perquè ve configurada en {{ab/c}}.[/calc]",0],["[calc]Per veure la fracció impròpia, prem [[shift]] i [[abc]] (a sobre hi ha d/c): 19┘12, és a dir, $\\frac{19}{12}$. [/calc]",0],["[calc]Ara prem [[abc]] sola: canvia entre fracció i decimal. Surt 1.583333333.[/calc]",0]]},{"id":"frac-prioritat","bloc":"fraccions","titol":"Fracció de sumes: on van els parèntesis","enunciat":"Calcula $\\frac{2+3}{4-1}$. La tecla [[abc]] només fa fraccions de dos nombres: si hi ha sumes, calen parèntesis.","font":"","passos":[["[calc]!!Error típic!!, com no s'ha de fer: tot en una línia, $2+3\\div 4-1$.[/calc]",1],["[calc]Prem [[igual]]: surt 1.75, i no $\\frac{5}{3}$. La calculadora divideix només el 3 entre 4: $2+\\frac{3}{4}-1$.[/calc]",1],["[calc]Ara bé: el numerador entre parèntesis, [[entre]] i el denominador entre parèntesis, $(2+3)\\div(4-1)$.[/calc]",0],["[calc]Prem [[igual]]: 1.666666667. Surt en decimal perquè no hi has escrit cap fracció amb [[abc]].[/calc]",0],["[calc]Prem [[shift]] i [[abc]] (a sobre hi ha d/c): la calculadora el passa a fracció, 5┘3, és a dir, $\\frac{5}{3}$.[/calc]",0]]},{"id":"pot-negativa","bloc":"fraccions","titol":"Potències de negatius","enunciat":"Calcula $(-2)^4$. A la fx-82MS, el signe negatiu té una tecla pròpia, [[neg]]. Si t'oblides dels parèntesis, el resultat no és el que tu esperaves.","font":"","passos":[["[calc]La base és $-2$: escriu-la entre parèntesis, amb [[lpar]], [[neg]] (el signe negatiu, no la resta [[menys]]), el 2 i [[rpar]].[/calc]",0],["[calc]Prem [[pot]] i escriu el 4. La potència surt amb el signe ^.[/calc]",0],["[calc]Prem [[igual]]: $(-2)^4=16$. La calculadora hi posa un punt al darrere, «16.», com a tots els enters.[/calc]",0],["[calc]!!Error típic!!: sense parèntesis. Esborra amb [[ac]] i escriu [[neg]], el 2, [[pot]] i el 4.[/calc]",1],["[calc]Prem [[igual]]: surt −16.[/calc] [mat]La potència té més prioritat que el signe negatiu: és $-(2^4)$. Per elevar un negatiu, sempre amb parèntesis.[/mat]",1]],"tancament":"[mat]Recorda: per elevar un nombre negatiu, posa'l entre parèntesis: $(-2)^4=16$.[/mat]"},{"id":"pot-fraccio","bloc":"fraccions","titol":"Potència d'una fracció","enunciat":"Calcula $\\left(\\frac{2}{3}\\right)^{-2}$.","font":"","passos":[["[calc]Escriu la base entre parèntesis: $(2\\div 3)$.[/calc] [mat]Els parèntesis diuen que l'exponent afecta tota la fracció.[/mat]",0],["[calc]Prem [[pot]] i escriu l'exponent $-2$: [[neg]] i el 2. Un exponent negatiu no necessita parèntesis.[/calc]",0],["[calc]Prem [[igual]]: 2.25.[/calc]",0],["[calc]Prem [[shift]] i [[abc]] (a sobre hi ha d/c) per passar-lo a fracció: 9┘4, és a dir, $\\frac{9}{4}$.[/calc] [mat]Un exponent negatiu inverteix la fracció: $\\left(\\frac{3}{2}\\right)^2$.[/mat]",0],["[calc]!!Error típic!!: sense parèntesis. Esborra amb [[ac]] i escriu $2\\div 3$, [[pot]] i $-2$.[/calc]",1],["[calc]Prem [[igual]]: surt 18, perquè l'exponent només afecta el 3: $2\\div 3^{-2}=2\\cdot 9$. Els parèntesis són imprescindibles.[/calc]",1]],"tancament":"[mat]Recorda: per elevar una fracció, posa-la entre parèntesis: $\\left(\\frac{2}{3}\\right)^{-2}=\\frac{9}{4}$.[/mat]"},{"id":"arrel-n","bloc":"fraccions","titol":"Arrels quadrades, cúbiques, ...","enunciat":"Calcula l'arrel cúbica de $-27$, $\\sqrt[3]{-27}$, i l'arrel quarta de 16, $\\sqrt[4]{16}$.","font":"","passos":[["[calc]Prem [[shift]] i [[x3]] (a sobre hi ha l'arrel cúbica): s'escriu ³√.[/calc]",0],["[calc]Escriu $-27$: [[neg]], el 2 i el 7.[/calc]",0],["[calc]Prem [[igual]]: $\\sqrt[3]{-27}=-3$, perquè $(-3)^3=-27$.[/calc] [mat]Una arrel d'índex senar d'un negatiu sí que existeix.[/mat]",0],["[calc]Amb un altre índex, primer s'escriu l'índex: el 4, [[shift]] [[pot]] (a sobre hi ha ˣ√) i el 16.[/calc]",0],["[calc]Prem [[igual]]: $\\sqrt[4]{16}=2$.[/calc]",0]]},{"id":"canvia-radians","bloc":"angles","titol":"Posa la calculadora en radians","enunciat":"En un exercici de trigonometria cal treballar en radians: calcula $\\sin\\frac{\\pi}{6}$.","font":"","passos":[["[calc]Ara la calculadora és en graus: a dalt hi ha una D.[/calc] [mat]Si l'angle porta π, o és la x d'una funció, ha de ser R.[/mat]",0],["[calc]Prem [[mode]]: surten els modes de càlcul, {{COMP}}, {{SD}} i {{REG}}, amb el número de cada un a sota. Per calcular, sempre {{COMP}}.[/calc]",0],["[calc]Torna a prémer [[mode]]: ara surt la unitat dels angles, {{Deg}} (graus), {{Rad}} (radians) i {{Gra}} (graus centesimals: no els facis servir).[/calc]",0],["[calc]Prem el [[2]], el número de {{Rad}}: tornes a la pantalla de càlcul, i ara a dalt hi ha una R.[/calc]",0],["[calc]Escriu $\\sin(\\pi\\div 6)$: [[sin]], [[lpar]], π ([[shift]] [[exp]]), [[entre]], el 6 i [[rpar]]. Sense el parèntesi, la calculadora faria $(\\sin\\pi)\\div 6$.[/calc]",0],["[calc]Prem [[igual]]: $\\sin\\frac{\\pi}{6}=0{,}5$. La fx-82MS sempre dona decimals: per veure $\\frac{1}{2}$, prem [[abc]].[/calc]",0]]},{"id":"error-angles","bloc":"angles","titol":"Troba l'error: el mode equivocat","enunciat":"La Laia calcula $\\cos\\frac{\\pi}{3}$, que hauria de ser $\\frac{1}{2}$, i la calculadora li dona 0.999832979. Què ha passat?","font":"","passos":[["[calc]!!Error típic!!: el que ha fet la Laia, $\\cos(\\pi\\div 3)$ i [[igual]]. Surt 0.999832979, i no 0.5.[/calc]",1],["[calc]Mira a dalt: D. La calculadora ha entès «π/3 graus», un angle d'un grau escàs, i el seu cosinus és gairebé 1.[/calc]",1],["[calc]Ho arreglem: [[mode]] dues vegades (fins a {{Deg}} {{Rad}} {{Gra}}) i el [[2]], {{Rad}}. Ara hi ha una R.[/calc]",0],["[calc]El mateix càlcul dona 0.5, és a dir, $\\frac{1}{2}$.[/calc]",0],["[calc]!!Error típic!!, el contrari: esborra amb [[ac]] i calcula $\\sin 30$ en radians: és el sinus de 30 radians, −0.988031624. Si el 30 són graus, la calculadora ha de ser en D.[/calc]",1]],"tancament":"[calc]Recorda: abans de calcular, mira la unitat dels angles a dalt de la pantalla: R si l'angle és en radians (per exemple, si porta π); D si és en graus.[/calc]"},{"id":"graus-radians","bloc":"angles","titol":"Convertir de graus a radiants","enunciat":"Expressa en radiants un angle de $60^\\circ$.","font":"","passos":[["[mat]Per canviar d'unitats es multiplica per un factor de conversió que val 1: $\\frac{\\pi\\ \\mathrm{rad}}{180^\\circ}$, perquè $\\pi$ rad i $180^\\circ$ són el mateix angle.[/mat] [calc]Escriu 60 i [[per]].[/calc]",0],["[mat]$60^\\circ\\cdot\\frac{\\pi\\ \\mathrm{rad}}{180^\\circ}$: els graus que vols treure van al denominador i se simplifiquen amb els de dalt; només hi queden radiants.[/mat] [calc]Escriu π ([[shift]] [[exp]]), [[entre]] i 180.[/calc]",0],["[calc]Prem [[igual]]: obtens 1.047197551.[/calc] [mat]És el decimal de $\\frac{\\pi}{3}$: $60^\\circ=\\frac{\\pi}{3}$ rad $\\approx 1{,}047$ rad.[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i escriu el factor capgirat: 60 [[per]] 180 [[entre]] π.[/calc] [mat]$60^\\circ\\cdot\\frac{180^\\circ}{\\pi\\ \\mathrm{rad}}$: els graus queden a dalt tots dos cops i no se simplifiquen. El que surt ja no són radiants.[/mat]",1],["[calc]Prem [[igual]]: surt 3437.746771.[/calc] [mat]No pot ser: 1 rad són uns $57^\\circ$, així que $60^\\circ$ ha de ser una mica més d'1 rad. El factor de conversió estava capgirat: no s'han simplificat els graus.[/mat]",1]],"tancament":"[mat]Recorda: al factor de conversió, al numerador hi va la unitat que vols ($\\pi$ rad) i al denominador la que vols treure ($180^\\circ$), perquè se simplifiqui.\n$60^\\circ=\\frac{\\pi}{3}$ rad.[/mat]","araTu":{"enunciat":"Expressa en radiants un angle de $135^\\circ$."}},{"id":"ans","bloc":"pau","titol":"Reutilitza l'últim resultat (Ans)","enunciat":"Calcula $\\dfrac{8}{\\sin 35^\\circ}$ amb la calculadora en graus, sense copiar cap decimal intermedi.","font":"","passos":[["[calc]Primer, $\\sin 35^\\circ$: [[sin]] i el 35.[/calc]",0],["[calc]Prem [[igual]]. La calculadora desa el resultat a [[ans]] sense arrodonir-lo: la pantalla només en mostra deu xifres.[/calc]",0],["[mat]Ara vols $8\\div\\sin 35^\\circ$.[/mat] [calc]No escriguis el decimal: escriu 8, [[entre]] i la tecla [[ans]].[/calc]",0],["[calc]Prem [[igual]]: 13.94757436. Cap decimal copiat, cap error d'arrodoniment.[/calc]",0],["[calc]Si ara en vols el doble, no cal [[ans]]: després d'un resultat, una operació com [[per]] ja comença amb Ans.[/calc]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i copia només 0.57 en lloc de $\\sin 35^\\circ$. Surt 14.03508772 i no 13.94757436: ja falla el primer decimal.[/calc]",1]],"tancament":"[calc]Recorda: per fer servir un resultat en el càlcul següent, prem [[ans]]. Així t'estalvies copiar tots els decimals.[/calc]"},{"id":"logaritmes","bloc":"pau","titol":"Logaritme en qualsevol base","enunciat":"Resol l'equació $3^x=7$: calcula $x=\\log_3 7$ i comprova el resultat.\nLa fx-82MS no té logaritme en base qualsevol. Per tant, fes-ho així: $\\log_3 7=\\dfrac{\\log 7}{\\log 3}$.","font":"","passos":[["[calc]Escriu $\\log 7\\div\\log 3$: [[log]], el 7, [[entre]], [[log]] i el 3. Cada log s'aplica al nombre que té darrere.[/calc]",0],["[calc]Prem [[igual]]: $x=\\log_3 7\\approx 1{,}7712$. Amb [[ln]] en lloc de [[log]] surt el mateix.[/calc]",0],["[mat]Comprova-ho: $3^x$ ha de valer 7.[/mat] [calc]Escriu 3, [[pot]] i [[ans]] (el resultat d'abans, sense copiar-lo).[/calc]",0],["[calc]Prem [[igual]]: surt 7. ✓[/calc]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i escriu $\\log 7\\div 3$: és $(\\log 7)\\div 3$, no $\\log_3 7$: surt 0.281699347. Al denominador hi va $\\log 3$.[/calc]",1]],"tancament":"[mat]Recorda: $\\log_3 7=\\log 7\\div\\log 3\\approx 1{,}7712$[/mat]"},{"id":"combinatoria","bloc":"pau","titol":"Nombres combinatoris","enunciat":"Una variable $X$ segueix una binomial amb $n=6$ i $p=\\frac{1}{3}$.\nCalcula $P(X=4)=\\binom{6}{4}\\left(\\frac{1}{3}\\right)^{4}\\left(\\frac{2}{3}\\right)^{2}$.","font":"","passos":[["[calc]A la fx-82MS, el nombre combinatori té una tecla pròpia: escriu el 6, prem [[ncr]] i escriu el 4. «6C4» és $\\binom{6}{4}$.[/calc]",0],["[mat]Ara $p^4=\\left(\\frac{1}{3}\\right)^4$.[/mat] [calc]Continua amb [[per]] i $(1\\div 3)^4$: amb parèntesis, perquè la potència és de tota la fracció.[/calc]",0],["[mat]I $(1-p)^2=\\left(\\frac{2}{3}\\right)^2$.[/mat] [calc][[per]] i $(2\\div 3)^2$.[/calc]",0],["[calc]Prem [[igual]]: 0.082304527, perquè $\\binom{6}{4}=15$.[/calc]",0],["[calc]Amb [[abc]], en fracció: $P(X=4)=\\frac{20}{243}$. Amb [[shift]] [[ncr]] hi ha nPr (permutacions) i, amb [[shift]] [[inv]], el factorial.[/calc]",0]]},{"id":"producte-escalar-vectorial","bloc":"pau","titol":"Producte escalar i producte vectorial","enunciat":"Siguin $\\vec u=(2,-1,3)$ i $\\vec v=(1,4,-2)$.\nCalcula el producte escalar $\\vec u\\cdot\\vec v$ i el producte vectorial $\\vec u\\times\\vec v$.","font":"","passos":[["[mat]$\\vec u\\cdot\\vec v=u_1v_1+u_2v_2+u_3v_3$.[/mat] [calc]Escriu-ho en una sola línia. Els nombres negatius, entre parèntesis; el signe és [[neg]].[/calc]",0],["[calc]Prem [[igual]].[/calc] [mat]$\\vec u\\cdot\\vec v=-8$.[/mat]",0],["[mat]Al producte vectorial, cada component és un determinant 2×2. La primera és $u_2v_3-u_3v_2=-10$.[/mat] [calc]Escriu-la i prem [[igual]]: després d'un resultat, un número nou comença un càlcul nou.[/calc]",0],["[mat]La segona, $u_3v_1-u_1v_3=7$.[/mat]",0],["[mat]La tercera, $u_1v_2-u_2v_1=9$. Per tant, $\\vec u\\times\\vec v=(-10,\\,7,\\,9)$.[/mat]",0]]},{"id":"pau-alg-24j-q2","bloc":"pau-ag","titol":"(2024). Comprova la solució d'un sistema","enunciat":"Per a $k=0$, el sistema és $$\\begin{cases}4x+2y-z=4\\\\ x-y=3\\\\ 3x+3y=1\\end{cases}$$ i has obtingut la solució $$x=\\frac{5}{3},\\qquad y=-\\frac{4}{3},\\qquad z=0.$$ Comprova que la solució trobada és correcta amb la calculadora.","font":"PAU juny 2024, qüestió 2 a)","passos":[["[calc]Primera equació, $4x+2y-z$: escriu $4\\times\\frac{5}{3}+2\\times\\left(-\\frac{4}{3}\\right)-0$. Les fraccions, amb [[abc]]; $y$, entre parèntesis i amb el signe negatiu [[neg]].[/calc]",0],["[calc]Prem [[igual]]: surt 4, que és el membre de la dreta. ✓[/calc]",0],["[calc]Segona equació, $x-y$ (amb $k=0$, el terme $kz$ no hi és): escriu $\\frac{5}{3}-\\left(-\\frac{4}{3}\\right)$. En començar a escriure, el càlcul anterior desapareix.[/calc]",0],["[calc]Prem [[igual]]: surt 3, el membre de la dreta. ✓[/calc]",0],["[calc]Tercera equació, $3x+3y$: escriu $3\\times\\frac{5}{3}+3\\times\\left(-\\frac{4}{3}\\right)$.[/calc]",0],["[calc]Prem [[igual]]: surt 1, el membre de la dreta. ✓ Es compleixen les tres equacions: la solució és correcta.[/calc]",0]],"grup":"Àlgebra"},{"id":"pau-alg-24s-q2","bloc":"pau-ag","titol":"(2024). Un menor orlat amb la regla de Sarrus","enunciat":"Per a $m=1$, el rang de la matriu $A$ és 2. Per saber el rang de la matriu ampliada $A'$, calcula amb la regla de Sarrus el menor d'ordre 3 de les columnes de $x$, de $y$ i dels termes independents: $$A'=\\left(\\begin{array}{rrr|r}1&-3&1&-2\\\\1&1&2&3\\\\1&1&2&1\\end{array}\\right)\\qquad\\begin{vmatrix}1&-3&-2\\\\1&1&3\\\\1&1&1\\end{vmatrix}$$","font":"PAU setembre 2024, qüestió 2 a)","passos":[["[mat]El primer claudàtor de Sarrus són els tres productes amb signe +.[/mat] [calc]Escriu $1\\times 1\\times 1+(-3)\\times 3\\times 1+(-2)\\times 1\\times 1$, cada factor tal com és a la matriu. Els negatius, entre parèntesis i amb la tecla [[neg]].[/calc]",0],["[calc]Prem [[igual]]: el primer claudàtor val −10.[/calc]",0],["[calc]Ara resta-hi el segon claudàtor, el dels tres productes amb signe −: [[ans]] (el −10), [[menys]] i els tres productes entre parèntesis.[/calc] [mat]Sense aquest parèntesi, el − només afectaria el primer producte.[/mat]",0],["[calc]Prem [[igual]]: el menor val $-8\\neq 0$.[/calc] [mat]Per tant, el rang de la matriu $A'$ és 3 i, com que el de la matriu $A$ és 2, per a $m=1$ el sistema és incompatible.[/mat]",0]],"grup":"Àlgebra"},{"id":"pau-geo-25s-q4b","bloc":"pau-ag","titol":"(2025). Distància d'un punt a un pla","enunciat":"Considereu el pla $\\pi: 2x-y+z=5$ i el punt $P=(0,1,3)$.\nComproveu que la distància de $P$ a $\\pi$ és $\\frac{\\sqrt{6}}{2}$. $$d(P,\\pi)=\\frac{|2\\cdot 0-1+3-5|}{\\sqrt{2^2+(-1)^2+1^2}}$$","font":"PAU setembre 2025, exercici 4 B a)","passos":[["[mat]Primer, el numerador: substitueix $P$ a $2x-y+z-5$.[/mat] [calc]Escriu $2\\times 0-1+3-5$.[/calc]",0],["[calc]Prem [[igual]]: surt −3.[/calc] [mat]El valor absolut el fas tu: $|-3|=3$.[/mat]",0],["[calc]Ara la distància: 3, [[entre]] i l'arrel [[arrel]] de $2^2+(-1)^2+1^2$, tot entre parèntesis (l'arrel només afecta el que té just darrere). El quadrat és [[x2]]; el −1, entre parèntesis i amb [[neg]].[/calc]",0],["[calc]Prem [[igual]]: 1.224744871. La fx-82MS no dona l'arrel exacta: el valor de l'enunciat, $\\frac{\\sqrt{6}}{2}$, s'ha de comprovar.[/calc]",0],["[calc]Calcula $\\sqrt{6}\\div 2$: [[arrel]], el 6, [[entre]], el 2 i [[igual]]. Surt el mateix nombre, 1.224744871: la distància és $\\frac{\\sqrt{6}}{2}$. ✓[/calc]",0]],"grup":"Geometria"},{"id":"pau-geo-25s-q4b-c","bloc":"pau-ag","titol":"(2025). El punt simètric respecte d'un pla","enunciat":"Considereu el pla $\\pi: 2x-y+z=5$ i el punt $P=(0,1,3)$.\n- Trobeu un pla $\\pi_2$ paral·lel a $\\pi$, que no passi per $P$, a una distància $\\frac{\\sqrt{6}}{2}$ de $\\pi$. Aquest pla passarà pel punt simètric $P'$ de $P$.\n- A més, sabem que la recta perpendicular a $\\pi$ per $P$, $(2\\lambda,\\,1-\\lambda,\\,3+\\lambda)$, talla el pla per a $\\lambda=\\frac{1}{2}$, al punt $M=\\left(1,\\frac{1}{2},\\frac{7}{2}\\right)$.","font":"PAU setembre 2025, exercici 4 B c)","passos":[["[mat]Primer, comprova que el punt $M$ és al pla: substitueix-lo a $2x-y+z$.[/mat] [calc]Escriu $2\\times 1-\\frac{1}{2}+\\frac{7}{2}$, amb [[abc]] per a les fraccions.[/calc]",0],["[calc]Prem [[igual]]: surt 5, el terme independent del pla. ✓ El punt $M$ és el punt del pla $\\pi$ més proper a $P$.[/calc]",0],["[mat]El punt $M$ és el punt mitjà de $P$ i $P'$, així que $P'=2M-P$.[/mat] [calc]Les dues primeres coordenades són $2\\cdot 1-0=2$ i $2\\cdot\\frac{1}{2}-1=0$; la tercera, amb la calculadora: $2\\times\\frac{7}{2}-3=4$.[/calc] [mat]Per tant, $P'=(2,\\,0,\\,4)$.[/mat]",0],["[mat]Comprova que el punt $P'$ és a una distància $\\frac{\\sqrt{6}}{2}$ del pla $\\pi$. El numerador de la fórmula: substitueix $P'$ a $2x-y+z-5$.[/mat] [calc]Surt 3.[/calc]",0],["[calc]Ara la distància: 3 [[entre]] l'arrel de $2^2+(-1)^2+1^2$, entre parèntesis, com a l'apartat a).[/calc]",0],["[calc]Prem [[igual]]: 1.224744871, el decimal de $\\frac{\\sqrt{6}}{2}$ (apartat a). ✓ El punt $P'$ és a la mateixa distància del pla que $P$, a l'altra banda.[/calc] [mat]El pla $\\pi_2$ és $2x-y+z=E$ amb $E=2\\cdot 2-0+4=8$: $\\pi_2: 2x-y+z=8$.[/mat]",0]],"grup":"Geometria"},{"id":"pau-geo-26j2-q4b","bloc":"pau-ag","titol":"(2026). Distàncies en centímetres","enunciat":"Un braç robòtic desplaça un sensor en línia recta des del punt $A=(1,2,3)$ fins al punt $B=(5,3,7)$, per damunt del pla $\\pi$, d'equació general $x-y-5=0$.\n[a]4.1. Quina distància ha recorregut el sensor?\n[/a] [b]4.2. En acabar el moviment, a quina distància del pla es troba el sensor?[/b]\nExpressa el resultat en centímetres.","font":"PAU juny 2026 (sèrie 5), exercici 4 B","passos":[["[mat]4.1. El vector $\\vec{AB}=(4,1,4)$, i la distància és el seu mòdul.[/mat] [calc]Escriu [[arrel]] i, entre parèntesis, $4^2+1^2+4^2$: el quadrat és [[x2]].[/calc]",0],["[calc]Prem [[igual]]: 5.744562647, és a dir, $\\sqrt{33}\\approx 5{,}74$ cm. La fx-82MS dona directament el decimal.[/calc]",0],["[mat]4.2. La distància del punt $B$ al pla. Primer, el numerador: substitueix $B$ a $x-y-5$, és a dir, $5-3-5$.[/mat] [calc]Surt −3; el valor absolut el fas tu: 3.[/calc]",0],["[calc]Ara la fracció: 3 [[entre]] l'arrel de $1^2+(-1)^2+0^2$, tot entre parèntesis. El −1, també entre parèntesis i amb [[neg]].[/calc]",0],["[calc]Prem [[igual]]: el sensor és a $\\frac{3\\sqrt{2}}{2}\\approx 2{,}12$ cm del pla.[/calc]",0]],"grup":"Geometria"},{"id":"pau-ana-23s-q4","bloc":"pau-ap","titol":"(2023). Bolzano amb la e","enunciat":"Sigui $f(x)=-3x+e^{2x}-1$.\nJustifiqueu que l'equació $f(x)=2$ té una solució a l'interval $(-1,\\,0)$.","font":"PAU setembre 2023, qüestió 4 a)","passos":[["[calc]La fx-82MS no pot desar una funció: escriu directament $f(-1)=-3(-1)+e^{2(-1)}-1$. Els signes negatius són [[neg]]; $e^x$ és [[shift]] [[ln]], i tot l'exponent va entre parèntesis.[/calc]",0],["[calc]Prem [[igual]]: $f(-1)\\approx 2{,}135>2$.[/calc] [mat]I $f(0)=0+1-1=0<2$, de cap. La funció $g(x)=f(x)-2$ és contínua, $g(-1)>0$ i $g(0)<0$: pel teorema de Bolzano, hi ha un $c\\in(-1,\\,0)$ amb $f(c)=2$. ✓[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i escriu l'exponent sense parèntesis: la calculadora fa $e^2\\cdot(-1)$ en lloc d'$e^{-2}$.[/calc] [mat]No pot ser: $e^{-2}$ és positiu i petit, i $f(-1)$ ha de ser una mica més gran que 2.[/mat]",1]],"grup":"Anàlisi","tancament":"[mat]Recorda: tot l'exponent, $2x$, ha d'anar a l'exponent: $e^{2x}$. Així, $f(-1)\\approx 2{,}135>2$ i $f(0)=0<2$.[/mat]"},{"id":"pau-ana-24i-q1","bloc":"pau-ap","titol":"(2024). Bolzano amb la calculadora","enunciat":"Considereu $f(x)=-2+10(x-1)\\ln x$, per a $x>0$.\nComproveu que $f$ té una arrel a l'interval $[1;\\,1{,}5]$ i busqueu un interval d'una dècima de longitud que també la contingui.","font":"PAU juny 2024 (incidències), qüestió 1 a)","passos":[["[calc]La fx-82MS no pot desar una funció: escriu directament $f(1{,}5)=-2+10(1{,}5-1)\\ln 1{,}5$. El signe del principi és [[neg]]; entre el 10 i el parèntesi, i entre el parèntesi i el ln, no cal [[per]].[/calc]",0],["[calc]Prem [[igual]]: $f(1{,}5)\\approx 0{,}0273>0$.[/calc] [mat]I $f(1)=-2+0=-2<0$, de cap. Com que $f$ és contínua a $[1;\\,1{,}5]$ i canvia de signe, pel teorema de Bolzano hi ha una arrel. ✓[/mat]",0],["[calc]Ara $f(1{,}4)$, sense tornar-ho a escriure tot. [[left]] torna a l'expressió, amb el cursor al final; un altre [[left]] el posa sobre l'últim 5. Escriu el 4: la calculadora escriu a sobre del 5.[/calc]",0],["[calc]Ara el 5 de dins del parèntesi: [[left]] vuit vegades, fins a sobre del 5, i el 4.[/calc]",0],["[calc]Prem [[igual]]: $f(1{,}4)\\approx -0{,}654<0$.[/calc] [mat]Hi ha canvi de signe a $[1{,}4;\\,1{,}5]$, un interval d'una dècima. ✓[/mat]",0]],"grup":"Anàlisi"},{"id":"pau-ana-25i-q4a","bloc":"pau-ap","titol":"(2025). Una arrel cúbica en una optimització","enunciat":"Una ampolla de perfum té una part cilíndrica de $100\\,\\text{cm}^3$, de radi $r$ i altura $h=\\frac{100}{\\pi r^2}$.\nLa seva superfície total és $S(r)=3\\pi r^2+\\frac{200}{r}$.\n\nHas calculat $S'(r)$, i la solució de l'equació $S'(r)=0$ és $r^3=\\frac{100}{3\\pi}$.\n\nCalcula les dimensions de l'ampolla i la superfície mínima.","font":"PAU juny 2025 (incidències), exercici 4 A b)","passos":[["[calc]El radi és $r=\\sqrt[3]{\\frac{100}{3\\pi}}$: [[shift]] [[x3]] (l'arrel cúbica) i, entre parèntesis, $100\\div(3\\pi)$. π és [[shift]] [[exp]].[/calc]",0],["[calc]Prem [[igual]]: el radi és $r\\approx 2{,}20$ cm, i la calculadora el desa a [[ans]] amb tots els decimals.[/calc]",0],["[calc]L'altura, $h=\\frac{100}{\\pi r^2}$, sense copiar el radi: 100, [[entre]] i, entre parèntesis, π, [[ans]] i [[x2]].[/calc]",0],["[calc]Prem [[igual]]: l'altura és $h\\approx 6{,}59$ cm.[/calc]",0],["[calc]Ara [[ans]] ja és l'altura: per a $S(r)$, escriu el radi amb quatre decimals, 2.1974.[/calc] [mat]La superfície mínima és $S\\approx 136{,}52\\,\\text{cm}^2$.[/mat]",0]],"grup":"Anàlisi"},{"id":"pau-ana-25s-q4a","bloc":"pau-ap","titol":"(2025). Un vitrall en radians","enunciat":"Un vitrall de la Sagrada Família està limitat per:\n- les gràfiques de $y=3\\sin\\frac{x}{4}$ i $y=3\\cos\\frac{x}{4}$\n- des de l'eix d'ordenades fins al primer punt de tall $C$, que té $x=\\pi$.\n[a]a) Calculeu les coordenades del punt $C$.\n[/a] [b]b) Calculeu el preu del vitrall, a 750 € el m²\n\nNota: l'àrea és $\\left[12\\sin\\frac{x}{4}+12\\cos\\frac{x}{4}\\right]_0^{\\pi}$.[/b]","font":"PAU setembre 2025, exercici 4 A","passos":[["[calc]El sinus i el cosinus són d'una $x$ en metres, no d'un angle en graus: posa la calculadora en radians. [[mode]] dues vegades ({{Deg}} {{Rad}} {{Gra}}) i el [[2]]. A dalt, R.[/calc]",0],["[mat]a) La segona coordenada del punt $C$ és $3\\sin\\frac{\\pi}{4}$.[/mat] [calc]Escriu el 3, [[sin]] i, entre parèntesis, $\\pi\\div 4$ (π és [[shift]] [[exp]]).[/calc]",0],["[calc]Prem [[igual]]: 2.121320344, el decimal de $\\frac{3\\sqrt{2}}{2}$.[/calc] [mat]Així, $C=\\left(\\pi,\\frac{3\\sqrt{2}}{2}\\right)$. I $B=(0,3)$, perquè $3\\cos 0=3$.[/mat]",0],["[mat]b) Regla de Barrow: $F(\\pi)-F(0)$. Com que $\\sin 0=0$ i $\\cos 0=1$, $F(0)=12$.[/mat] [calc]Escriu $12\\sin\\frac{\\pi}{4}+12\\cos\\frac{\\pi}{4}-12$.[/calc]",0],["[calc]Prem [[igual]]: l'àrea és $12(\\sqrt{2}-1)\\approx 4{,}97\\,\\text{m}^2$.[/calc]",0],["[calc]Ara [[per]] 750: després d'un resultat, el càlcul comença amb Ans, sense arrodonir.[/calc] [mat]El preu del vitrall és de $3.727{,}92$ €.[/mat]",0]],"grup":"Anàlisi"},{"id":"pau-ana-26j-q4a","bloc":"pau-ap","titol":"(2026). Dues baranes: π, ≈ i Ans","enunciat":"Dues baranes fan 10 m en total: la d'un espai circular i la d'un espai quadrat.\nSi la barana del cercle fa $x$ metres, la suma de les dues superfícies és $S(x)=\\frac{x^2}{4\\pi}+\\left(\\frac{10-x}{4}\\right)^2$.\nAmb la derivada has trobat $x=\\frac{10\\pi}{\\pi+4}$.\n\nCalcula la longitud de cada barana i la superfície mínima.","font":"PAU juny 2026, exercici 4 A","passos":[["[calc]Escriu $x=10\\pi\\div(\\pi+4)$: π és [[shift]] [[exp]], i el denominador va entre parèntesis.[/calc]",0],["[calc]Prem [[igual]].[/calc] [mat]La barana del cercle fa 4,40 m.[/mat] [calc]La calculadora la desa a [[ans]] amb tots els decimals.[/calc]",0],["[calc]La del quadrat és $10-\\mathrm{Ans}$: escriu 10, [[menys]], [[ans]] i prem [[igual]].[/calc] [mat]La barana del quadrat fa 5,60 m.[/mat]",0],["[mat]Ara [[ans]] és la barana del quadrat, i la del cercle és $10-\\mathrm{Ans}$.[/mat] [calc]Escriu $S$ amb [[ans]], sense copiar cap decimal: $(10-\\mathrm{Ans})^2\\div(4\\pi)+(\\mathrm{Ans}\\div 4)^2$.[/calc]",0],["[calc]Prem [[igual]].[/calc] [mat]La superfície mínima és $S\\approx 3{,}50\\,\\text{m}^2$.[/mat]",0]],"grup":"Anàlisi"},{"id":"pau-pro-26j2-q3","bloc":"pau-ap","titol":"(2026). Màxim i mínim absoluts en un interval","enunciat":"L'Alba dedica cada setmana $x$ hores a llegir, entre 1 i 6, i $y$ hores a fer esport, amb $y=7-x+\\ln(2x-1)$.\nAmb la derivada has trobat que l'únic punt crític és $x=1{,}5$.\n\nCalcula el màxim i el mínim d'hores d'esport.","font":"PAU juny 2026 (sèrie 5), exercici 3.3","passos":[["[mat]En un interval tancat, el màxim i el mínim absoluts són al punt crític o als extrems de l'interval: cal $y(1)$, $y(1{,}5)$ i $y(6)$. De cap, $y(1)=7-1+\\ln 1=6$.[/mat] [calc]La fx-82MS no pot desar una funció: escriu directament $y(1{,}5)$. ln és la tecla [[ln]].[/calc]",0],["[calc]Prem [[igual]].[/calc] [mat]$y(1{,}5)\\approx 6{,}193$.[/mat]",0],["[calc]Ara $y(6)$, igual.[/calc] [mat]$y(6)\\approx 3{,}398$. El màxim és de 6,19 h d'esport (amb $x=1{,}5$), i el mínim, de 3,40 h (amb $x=6$).[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i calcula $y(6)$ amb la tecla [[log]] en lloc de [[ln]]: surt 2.041392685 i no 3.397895273.[/calc] [mat]log és el logaritme en base 10, no el neperià.[/mat]",1]],"grup":"Anàlisi","tancament":"[mat]Recorda: $\\ln$ és el logaritme neperià, i log és el logaritme en base 10. El màxim és de 6,19 h i el mínim, de 3,40 h.[/mat]"},{"id":"pau-pro-24i-q4","bloc":"pau-ap","titol":"(2024). Probabilitat total, Bayes i binomial","enunciat":"La Rut tira un dau.\n- si surt 1, 2, 3 o 4, resol el problema ella mateixa i l'encerta el 75 % de les vegades\n- si surt 5 o 6, el copia d'Internet i l'encerta el 40 %.\nCalcula:\n[a]a) Probabilitat que la solució sigui correcta.\n[/a] [b]b) Probabilitat que l'hagi resolt ella si és correcta.\n[/b] [c]c) Probabilitat que, de 5 problemes, almenys 4 siguin correctes.[/c]","font":"PAU juny 2024 (incidències), qüestió 4","passos":[["[mat]a) Probabilitat total: $P(C)=\\frac{4}{6}\\cdot 0{,}75+\\frac{2}{6}\\cdot 0{,}4$.[/mat] [calc]Escriu-ho tal qual, amb [[abc]] per a les fraccions.[/calc]",0],["[calc]Prem [[igual]]: 0.633333333. Surt en decimal perquè hi ha decimals.[/calc]",0],["[calc]Amb [[abc]], en fracció: $P(C)=\\frac{19}{30}$.[/calc]",0],["[mat]b) Bayes: $P(R\\mid C)=\\dfrac{\\frac{4}{6}\\cdot 0{,}75}{P(C)}$.[/mat] [calc]Escriu $\\left(\\frac{4}{6}\\times 0.75\\right)\\div\\frac{19}{30}$.[/calc]",0],["[calc]Prem [[igual]]: 0.789473684.[/calc]",0],["[calc]Amb [[abc]]: $P(R\\mid C)=\\frac{15}{19}$.[/calc]",0],["[mat]c) Binomial, amb $n=5$ i $p=\\frac{19}{30}$: $P(X\\ge 4)=5\\,p^4(1-p)+p^5$, perquè $\\binom{5}{4}=5$ i $1-p=\\frac{11}{30}$.[/mat] [calc]La potència és [[pot]].[/calc]",0],["[calc]Prem [[igual]]: $P(X\\ge 4)\\approx 0{,}3969$. La fracció exacta tindria massa xifres, i la calculadora la dona en decimal.[/calc]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i, si arrodoneixes $p\\approx 0{,}63$, surt 0.390673433 i no 0.396862305: ja falla la segona xifra decimal. Treballa amb $\\frac{19}{30}$.[/calc]",1]],"grup":"Probabilitat","tancament":"[mat]Recorda: treballa amb el valor exacte, $p=\\frac{19}{30}$, i no amb un decimal arrodonit: $P(X\\ge 4)\\approx 0{,}3969$.[/mat]"},{"id":"pau-pro-24s-q4","bloc":"pau-ap","titol":"(2024). Binomial, probabilitat total i Bayes","enunciat":"El 20 % dels habitants d'una regió pateix arrítmia. Un monitor Holter la detecta en el 95 % dels qui la pateixen, i dona falsos positius en el 0,5 % dels qui no en pateixen. \nCalcula el següent:\n[a]a) Si prenem 4 persones a l'atzar, probabilitat que almenys una pateixi arrítmia.\n[/a] [b]b) Probabilitat total d'obtenir un diagnòstic positiu.\n[/b] [c]c) Si el diagnòstic és negatiu, probabilitat que la persona pateixi arrítmia.[/c]","font":"PAU setembre 2024, qüestió 4","passos":[["[mat]a) El nombre de persones amb arrítmia segueix una binomial $B(4;\\,0{,}2)$. «Almenys una» és l'esdeveniment contrari de «cap»: $1-0{,}8^4$.[/mat] [calc]L'exponent és [[pot]].[/calc]",0],["[calc]Prem [[igual]]: 0.5904.[/calc]",0],["[mat]b) Probabilitat total. Hi ha dues maneres de donar positiu: amb arrítmia ($0{,}2$ i $0{,}95$) o sense ($0{,}8$ i $0{,}005$).[/mat] [calc]Escriu $0.95\\times 0.2+0.005\\times 0.8$.[/calc]",0],["[calc]Prem [[igual]]: la probabilitat d'un diagnòstic positiu és 0,194.[/calc]",0],["[mat]c) Bayes: tenir arrítmia i donar negatiu, $0{,}2\\cdot(1-0{,}95)$, dividit per la probabilitat d'un negatiu, $1-0{,}194$.[/mat] [calc]El 0.194 és a [[ans]]: no cal copiar-lo. El denominador, entre parèntesis.[/calc]",0],["[calc]Prem [[igual]]: $\\approx 0{,}0124$.[/calc] [mat]Només l'1,24 % de les persones que donen negatiu pateixen arrítmia.[/mat] [calc](Si el resultat fos més petit que 0,01, sortiria amb una potència de 10: fitxa «Tot em surt arrodonit».)[/calc]",0]],"grup":"Probabilitat"},{"id":"pau-pro-25j-q3","bloc":"pau-ap","titol":"(2025). Probabilitat total i un màxim","enunciat":"El 60 % de les peces d'una empresa són de ferro i la resta, d'acer. El 95 % de les peces de ferro no tenen cap defecte, i el 3 % de les d'acer són defectuoses.\nCalcula:\n[a]a) Probabilitat que una peça a l'atzar sigui defectuosa.\n[/a] [c]b) Valor màxim de la funció $f(p)=5(p^4-p^5)$ per a $p\\ge 0$ (nota: amb la derivada has trobat que el màxim és a $p=\\frac{4}{5}$).[/c]","font":"PAU juny 2025, exercici 3","passos":[["[mat]a) De les peces de ferro, en són defectuoses el 5 % (100 − 95).[/mat] [calc]Probabilitat total; escriu $0.05\\times 0.6+0.03\\times 0.4$.[/calc]",0],["[calc]Prem [[igual]]: 0.042, és a dir, un 4,2 % de les peces són defectuoses.[/calc]",0],["[mat]c) El valor màxim és $f\\left(\\frac{4}{5}\\right)$.[/mat] [calc]Com que $\\frac{4}{5}=0{,}8$, escriu $5\\times(0.8^4-0.8^5)$. Els exponents no necessiten parèntesis.[/calc]",0],["[calc]Prem [[igual]]: 0.4096, és a dir, $\\approx 0{,}41$.[/calc]",0],["[calc]Amb [[abc]], el valor exacte del màxim: $\\frac{256}{625}$.[/calc]",0]],"grup":"Probabilitat"},{"id":"abans-examen","bloc":"examen","titol":"Comprova la calculadora en 30 segons","enunciat":"Abans de començar l'examen, comprova que la calculadora està ben configurada.","font":"","passos":[["[calc]Calcula $\\sin 30$: ha de sortir 0.5 si la calculadora és en graus. Si surt −0.988031624, és en radians.[/calc]",0],["[calc]Mira la lletra de la unitat dels angles: D (graus) o R (radians).[/calc] [mat]Si l'examen té funcions trigonomètriques de $x$, ha de ser R; per a angles en graus, D.[/mat] [calc]Es canvia amb [[mode]] [[mode]] i el número (fitxa «Posa la calculadora en radians»).[/calc]",0],["[calc]A dalt no hi ha d'haver FIX ni SCI: si el resultat surt 0.50, o 5.00 amb −01 a la dreta, el format està fixat (fitxa «Tot em surt arrodonit»).[/calc]",0],["[calc]Prem [[mode]]: {{COMP}} és el mode de calcular. Si a dalt hi havia SD o REG, la calculadora era en un mode d'estadística.[/calc]",0],["[calc]Prem l'[[1]], {{COMP}}: tornes a la pantalla de càlcul. Ja pots començar l'examen.[/calc]",0]]},{"id":"indicadors","bloc":"simbols","titol":"Què vol dir cada símbol de la pantalla?","enunciat":"A la pantalla, a més dels nombres, hi surten símbols: a la fila de dalt, a la línia de l'expressió i a la del resultat. Què vol dir cada un?","font":"","passos":[["[calc]La D amb fons fosc vol dir que els angles van en graus. És la que faràs servir quasi sempre.[/calc]",0],["[calc]Esborra amb [[ac]] i prem [[shift]]: a dalt surt una S. La tecla següent farà el que hi ha escrit en groc a sobre seu (per exemple, [[shift]] [[exp]] escriu π). La S desapareix sola.[/calc]",0],["[calc]Si prems [[alpha]], surt una A: la tecla següent farà el que hi ha escrit en vermell a sobre seu (per exemple, una variable: A, B…). La A també desapareix sola.[/calc]",0],["[calc]Si en lloc de la D hi ha una R, els angles van en radians. Si hi ha una G, van en graus centesimals, una unitat que no faràs servir.[/calc]",0],["[calc]FIX vol dir que tots els resultats surten arrodonits a un nombre fix de decimals: aquí, a 2, i per això $1\\div 6$ surt 0.17.[/calc]",0],["[calc]SCI vol dir que tots els resultats surten en notació científica, amb un nombre fix de xifres: aquí, 3, i per això $1\\div 6$ surt 1.67 amb un −01 petit a la dreta, és a dir, $1{,}67\\cdot 10^{-1}$.[/calc]",0],["[calc]El signe ┘ separa el numerador del denominador d'una fracció: 3┘4 és $\\frac{3}{4}$.[/calc]",0],["[calc]Un nombre petit a la dreta del resultat vol dir que és en notació científica: és massa llarg per a la pantalla.[/calc] [mat]2.592 amb un 13 petit és $2{,}592\\cdot 10^{13}$.[/mat]",0],["[calc]Una fletxa a la vora de la línia de dalt vol dir que l'expressió no hi cap: n'hi ha més per aquest costat.[/calc]",0]],"provaTu":{"enunciat":"A la barra de dalt de la teva calculadora hi ha \"R\" i \"FIX\". Què vol dir cada cosa?","solucio":"La \"R\" vol dir que els angles van en radians.\n\"FIX\" vol dir que tots els resultats surten arrodonits a un nombre fix de decimals."}},{"id":"eso-corregeix","bloc":"eso-inici","titol":"T'has equivocat en teclejar: com corregir-ho","enunciat":"Vols calcular \"$26\\cdot 4$\", però en teclejar t'equivoques totalment i escrius \"25 × 44\". T'expliquem com corregir-ho.","font":"","passos":[["[calc]Això és el que has escrit: 25 [[per]] 44. El cursor és al final.[/calc]",0],["[calc]Prem [[del]]: amb el cursor al final, esborra l'última xifra, el 4 de més. ([[ac]] ho esborraria tot.)[/calc]",0],["[calc]Ara el 5 ha de ser un 6. Prem [[left]] tres vegades, fins que el cursor és a sota del 5.[/calc]",0],["[calc]Escriu el 6: a la fx-82MS, el que escrius substitueix la xifra del cursor. (Per afegir sense substituir, abans prem [[shift]] [[del]], INS.)[/calc]",0],["[calc]Prem [[igual]]: obtens 104.[/calc] [mat]$26\\cdot 4=104$.[/mat]",0]]},{"id":"eso-fraccio-decimal","bloc":"eso-pantalla","titol":"Em surt una fracció: vull el decimal","enunciat":"Calcula $7\\div 4$ i dona el resultat:\n- en forma de fracció\n- en forma decimal.","font":"","passos":[["[calc]Escriu 7 [[entre]] 4.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat en decimal, que és 1.75. Amb [[entre]], la fx-82MS sempre dona decimals.[/calc]",0],["[calc]Prem [[shift]] i [[abc]] (a sobre hi ha d/c): el resultat passa a fracció, 7┘4, és a dir, $\\frac{7}{4}$.[/calc] [mat]La resposta correcta és $\\frac{7}{4}=1{,}75$.[/mat]",0]],"provaTu":{"enunciat":"Calcula $9\\div 8$ i dona el resultat:\n- en forma de fracció\n- en forma decimal.","solucio":"[mat]$9\\div 8=\\frac{9}{8}=1{,}125$.[/mat]"}},{"id":"eso-arrodonir","bloc":"eso-pantalla","titol":"Arrodonir el que surt a la pantalla","enunciat":"Calcula $2\\div 3$ i arrodoneix el resultat a les centèsimes.","font":"","passos":[["[calc]Escriu 2 [[entre]] 3.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és 0.666666667. La pantalla només en mostra deu xifres i ja ha arrodonit l'última (el 7).[/calc]",0],["[mat]Per arrodonir a les centèsimes, mira la tercera xifra decimal: és un 6, més gran o igual que 5, i per això la segona puja d'un: 0,67.[/mat] [mat]La resposta correcta és $2\\div 3\\approx 0{,}67$.[/mat]",0]],"provaTu":{"enunciat":"Calcula $5\\div 7$ i arrodoneix el resultat a les centèsimes.","solucio":"[mat]$5\\div 7=0{,}714285\\ldots\\approx 0{,}71$.[/mat]"}},{"id":"ll4-1-exemple2","bloc":"eso-pantalla","titol":"L'arrel de 50: entre quins enters és?","enunciat":"Sense calculadora, digues entre quins dos nombres enters es troba $\\sqrt{50}$.\nDesprés, calcula-la amb la calculadora.","font":"Llibre 4t ESO, unitat 1, exemple 2","passos":[["[mat]Abans de calcular, estima: $7^2=49$ i $8^2=64$. Com que 50 és una mica més que 49, $\\sqrt{50}$ és entre 7 i 8, una mica més que 7.[/mat]",0],["[calc]Prem [[arrel]] i escriu 50.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és 7.071067812.[/calc] [mat]La resposta correcta és que $\\sqrt{50}$ és entre 7 i 8: val 7,07 aproximadament, com havíem estimat.[/mat]",0]],"provaTu":{"enunciat":"Sense calculadora, digues entre quins dos nombres enters es troba $\\sqrt{90}$. Després, calcula-la amb la calculadora.","solucio":"[mat]$9^2=81$ i $10^2=100$: entre 9 i 10. $\\sqrt{90}=3\\sqrt{10}\\approx 9{,}49$.[/mat]"}},{"id":"eso-notacio-cientifica","bloc":"eso-pantalla","titol":"Nombres molt grans: notació científica","enunciat":"La llum recorre $3\\cdot 10^8$ metres cada segon.\n• Un dia té 86 400 segons.\nQuants metres recorre la llum en un dia?","font":"","passos":[["[calc]Escriu 3 [[per]] 10, prem [[pot]] i escriu l'exponent 8.[/calc]",0],["[mat]En un dia, la llum recorre 86 400 vegades el que recorre en un segon.[/mat] [calc]Ara fes l'operació [[per]] 86400.[/calc]",0],["[calc]Prem [[igual]]: obtens 2.592 i, a la dreta, un 13 petit: vol dir $2{,}592\\cdot 10^{13}$. El nombre és massa llarg i la calculadora el dona en notació científica.[/calc] [mat]La resposta correcta és $2{,}592\\cdot 10^{13}$ metres, és a dir, 25 920 000 000 000 m.[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i oblida el «× 10»: 3 [[pot]] 8 i, després, [[per]] 86400.[/calc]",1],["[calc]Prem [[igual]]: obtens 566870400.[/calc] [mat]No pot ser: la llum fa 300 milions de metres cada segon, i en un dia en faria només 567 milions. Has calculat $3^8=6.561$, no $3\\cdot 10^8$.[/mat]",1]],"tancament":"[calc]Recorda: $3\\cdot 10^8$ s'escriu 3 [[per]] 10 [[pot]] 8, no 3 [[pot]] 8.[/calc] [mat]La llum recorre $2{,}592\\cdot 10^{13}$ metres en un dia.[/mat]","provaTu":{"enunciat":"El so recorre 343 metres cada segon.\n• Un any té 31 536 000 segons.\nQuants metres recorre el so en un any?","solucio":"[mat]$343\\cdot 31.536.000=1{,}0816848\\cdot 10^{10}$ metres, és a dir, 10.816.848.000 m.[/mat]"}},{"id":"cb2-26-q4","bloc":"eso-parentesis","titol":"Les patates rebaixades: el percentatge de descompte","enunciat":"La Mia ha comprat dues bosses de patates fregides que estaven rebaixades.\n• Abans de la rebaixa, les dues bosses costaven 5 euros en total.\n• Amb la rebaixa, només ha pagat 4 euros per les dues.\nQuin percentatge de descompte s'ha aplicat?","font":"CB 2ESO (2026), pregunta 4","passos":[["[mat]El descompte és el que t'han rebaixat, 5 − 4 = 1 euro, dividit entre el preu d'abans, 5 euros, i multiplicat per 100.[/mat] [calc]Primer escriu la resta entre parèntesis: [[lpar]] 5 − 4 [[rpar]].[/calc]",0],["[calc]Ara fes l'operació [[entre]] 5 [[per]] 100.[/calc] [mat]Gràcies als parèntesis, es divideix tota la resta entre 5.[/mat]",0],["[calc]Prem [[igual]]: obtens el resultat, que és 20.[/calc] [mat]La resposta correcta és que s'ha aplicat un descompte del 20 %.[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i escriu-ho sense parèntesis, $5-4\\div 5\\times 100$.[/calc]",1],["[calc]Prem [[igual]]: obtens −75.[/calc] [mat]No pot ser: un descompte no és negatiu. Sense parèntesis, la divisió i la multiplicació es fan abans que la resta: s'ha calculat $5-80$.[/mat]",1]],"tancament":"[mat]Recorda: la resta, entre parèntesis: $(5-4)\\div 5\\cdot 100=20$. El descompte és del 20 %.[/mat]","provaTu":{"enunciat":"Una samarreta costava 40 euros i ara costa 34 euros. Quin percentatge de descompte s'ha aplicat?","solucio":"[mat]$(40-34)\\div 40\\cdot 100=15$: un descompte del 15 %.[/mat]"}},{"id":"eso-quadrat-negatiu","bloc":"eso-parentesis","titol":"El quadrat d'un nombre negatiu","enunciat":"Calcula el quadrat de −3, és a dir, $(-3)^2$.","font":"","passos":[["[mat]El quadrat de −3 és $(-3)\\cdot(-3)=9$: el signe també s'eleva al quadrat.[/mat] [calc]Escriu el −3 entre parèntesis: [[lpar]] [[neg]] 3 [[rpar]] (el signe negatiu és [[neg]]).[/calc]",0],["[calc]Prem [[x2]] per elevar-lo al quadrat.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és 9.[/calc] [mat]La resposta correcta és $(-3)^2=9$.[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i escriu-ho sense parèntesis: [[neg]] 3 [[x2]].[/calc]",1],["[calc]Prem [[igual]]: obtens −9.[/calc] [mat]No és el quadrat de −3: sense parèntesis, el quadrat només afecta el 3, i el signe es posa després: $-3^2=-(3^2)=-9$.[/mat]",1]],"tancament":"[mat]Recorda: per elevar un nombre negatiu, posa'l entre parèntesis: $(-3)^2=9$.[/mat]","provaTu":{"enunciat":"Calcula $(-5)^2$ i $-5^2$. Obtens el mateix resultat?","solucio":"[mat]$(-5)^2=25$ i $-5^2=-25$: no són iguals.[/mat]"}},{"id":"cb4-24-q7","bloc":"eso-parentesis","titol":"Les valoracions d'1 o 2 estrelles","enunciat":"En Víctor ven roba per internet i ha rebut 80 valoracions de clients, d'1 a 5 estrelles. Entre elles:\n• 8 clients li han donat 2 estrelles\n• 2 clients li han donat 1 estrella.\nEl 60 % de les valoracions d'1 o 2 estrelles diuen que la talla era equivocada. Quin percentatge representen aquestes valoracions sobre les 80?","font":"CB 4ESO (2024), pregunta 7","passos":[["[mat]Les valoracions d'1 o 2 estrelles són 8 + 2. El 60 % d'aquestes és $0{,}6\\cdot(8+2)$.[/mat] [calc]Escriu 0.6 [[per]] i la suma entre parèntesis: [[lpar]] 8 + 2 [[rpar]].[/calc]",0],["[mat]Per saber quin percentatge representen de les 80 valoracions, es divideix entre 80 i es multiplica per 100.[/mat] [calc]Ara fes l'operació [[entre]] 80 [[per]] 100.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és 7.5.[/calc] [mat]La resposta correcta és que representen el 7,5 % de les valoracions.[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i escriu-ho sense parèntesis, $0.6\\times 8+2\\div 80\\times 100$.[/calc]",1],["[calc]Prem [[igual]]: obtens 7.3.[/calc] [mat]És a prop de 7,5, però és incorrecte: sense parèntesis s'ha calculat $0{,}6\\cdot 8+\\frac{2}{80}\\cdot 100$.[/mat]",1]],"tancament":"[mat]Recorda: la suma, entre parèntesis: $0{,}6\\cdot(8+2)\\div 80\\cdot 100=7{,}5$. Representen el 7,5 % de les valoracions.[/mat]","provaTu":{"enunciat":"Una botiga ha rebut 120 valoracions. Entre elles:\n• 9 clients li han donat 2 estrelles;\n• 6 clients li han donat 1 estrella.\nEl 40 % de les valoracions d'1 o 2 estrelles es queixen del preu. Quin percentatge representen sobre les 120?","solucio":"[mat]$0{,}4\\cdot(9+6)\\div 120\\cdot 100=5$[/mat]\nR) El 5 % de les valoracions."}},{"id":"cb2-26-q5","bloc":"eso-proporcionalitat","titol":"La recepta del pastís","enunciat":"En Biel fa un pastís de xocolata seguint una recepta per a $5$ persones: cal posar $3$ ous i $180$ g de xocolata.\n\nAl cap d'uns dies, en Biel repeteix la recepta, però s'equivoca i hi posa $5$ ous.\n\nQuanta xocolata haurà d'utilitzar per mantenir les proporcions de la recepta?","font":"CB 2ESO (2026), pregunta 5","passos":[["[mat]Abans de calcular, pensa:\n• si té més ous, haurà de gastar més xocolata o menys xocolata?\n• si tingués el doble d'ous, és cert que caldria el doble de xocolata?[/mat]",0],["[mat]$3$ ous → $180$ g de xocolata\n$1$ ou → ?[/mat] [calc]Escriu $180$ [[entre]] $3$.[/calc]",0],["[calc]Prem [[igual]]: obtens $60$.[/calc] [mat]$1$ ou → $60$ g de xocolata[/mat]",0],["[mat]Amb $5$ ous, cal gastar $5$ vegades més xocolata que amb $1$ ou.[/mat] [calc]Fes l'operació [[per]] $5$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $300$.[/calc] [mat]R) En Biel ha de fer servir $300$ g de xocolata per $5$ ous.[/mat]",0],["[calc]!!Error típic!!:\nSi apliques malament la regla de tres: $180$ [[per]] $3$ [[entre]] $5$.[/calc]",1],["[calc]Prem [[igual]]: obtens $108$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té lògica que amb $5$ ous portis menys xocolata que amb $3$ ous.[/mat]",1]],"grup":"Proporcionalitat directa","tancament":"[mat]Recorda:\n• $180\\div 3=60$ g\n• $60\\cdot 5=300$ g[/mat]","provaTu":{"enunciat":"Una recepta per a fer creps demana posar $2$ ous i $250$ ml de llet.\nTu tens a la nevera $3$ ous i els vols gastar tots. Quanta llet hauràs de posar per mantenir les proporcions?","solucio":"[mat]$250\\div 2=125$ ml\n$125\\cdot 3=375$ ml[/mat]\nR) Hauré de fer servir $375$ ml de llet."}},{"id":"cb4-22-q26","bloc":"eso-proporcionalitat","titol":"L'aixeta del lavabo","enunciat":"En Nil estudia quanta aigua es fa servir a casa seva. Ha observat que l'aixeta del lavabo omple un got de $0{,}2$ litres en $3$ segons.\n\nQuants litres d'aigua surten de l'aixeta en $60$ segons?","font":"CB 4ESO (2022), pregunta 26","passos":[["[mat]Abans de calcular, pensa:\n• en $60$ segons obté més o menys de $0{,}2$ litres?\n• si manté l'aixeta oberta el doble de temps, surt el doble d'aigua?[/mat]",0],["[mat]$3$ segons → $0{,}2$ litres\n$1$ segon → ?[/mat] [calc]Escriu $0.2$ [[entre]] $3$.[/calc]",0],["[calc]Prem [[igual]]: obtens $0.066666667$.\nNo l'arrodoneixis: la calculadora el guarda sencer (Ans).[/calc] [mat]$1$ segon → $0{,}0666\\ldots\\simeq 0{,}067$ litres[/mat]",0],["[mat]En $60$ segons surt $60$ vegades més aigua que en $1$ segon.[/mat] [calc]Fes l'operació [[per]] $60$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $4$.[/calc] [mat]R) En $60$ segons surten $4$ litres d'aigua de l'aixeta.[/mat]",0]],"grup":"Proporcionalitat directa","provaTu":{"enunciat":"Una aixeta omple una ampolla d'$1{,}5$ litres en $10$ segons.\nTu deixes l'aixeta oberta $2$ minuts ($120$ segons). Quants litres d'aigua hi surten, si raja sempre igual?","solucio":"[mat]$1{,}5\\div 10=0{,}15$ litres\n$0{,}15\\cdot 120=18$ litres[/mat]\nR) De l'aixeta surten $18$ litres d'aigua."}},{"id":"cb4-25-q8","bloc":"eso-proporcionalitat","titol":"El xarop","enunciat":"A en Mario li han receptat un xarop. En $5$ ml de xarop hi ha $105$ mg de principi actiu.\n\nQuants mg de principi actiu hi ha en $16$ ml del mateix xarop?","font":"CB 4ESO (2025), pregunta 8","passos":[["[mat]Abans de calcular, pensa:\n• si prens el triple de xarop, també prendràs el triple de principi actiu?[/mat]",0],["[mat]$5$ ml → $105$ mg\n$1$ ml → ?[/mat] [calc]Escriu $105$ [[entre]] $5$.[/calc]",0],["[calc]Prem [[igual]]: obtens $21$.[/calc] [mat]$1$ ml → $21$ mg[/mat]",0],["[mat]En $16$ ml hi ha $16$ vegades més principi actiu que en $1$ ml.[/mat] [calc]Fes l'operació [[per]] $16$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $336$.[/calc] [mat]R) En $16$ ml de xarop hi ha $336$ mg de principi actiu.[/mat]",0],["[calc]!!Error típic!!:\nSi apliques malament la regla de tres: $105$ [[per]] $5$ [[entre]] $16$.[/calc]",1],["[calc]Prem [[igual]]: obtens $32.8125$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té sentit que en $16$ ml hi hagi menys principi actiu de medicament que en $5$ ml.[/mat]",1]],"grup":"Proporcionalitat directa","tancament":"[mat]Recorda:\n• $105\\div 5=21$ mg\n• $21\\cdot 16=336$ mg[/mat]","provaTu":{"enunciat":"En $10$ ml d'un xarop hi ha $250$ mg de principi actiu.\nTu has de prendre $6$ ml de xarop. Quants mg de principi actiu prendràs?","solucio":"[mat]$250\\div 10=25$ mg\n$25\\cdot 6=150$ mg[/mat]\nR) Prendré $150$ mg de principi actiu."}},{"id":"cb4-23-q26","bloc":"eso-proporcionalitat","titol":"La fotografia més petita","enunciat":"L'Anna té una fotografia de $62$ cm d'amplada i $34$ cm d'alçada. La vol imprimir més petita, de $42$ cm d'amplada.\n\nQuina alçada tindrà la fotografia impresa, si l'Anna no la vol deformar?","font":"CB 4ESO (2023), pregunta 26","passos":[["[mat]Si no es deforma, l'alçada és proporcional a l'amplada:\n$62$ cm d'amplada → $34$ cm d'alçada\n$42$ cm d'amplada → ?\nL'alçada nova és $\\frac{34\\cdot 42}{62}$.[/mat] [calc]Escriu $34$ [[per]] $42$.[/calc]",0],["[calc]Ara fes l'operació [[entre]] $62$.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $23.03225806$.[/calc] [mat]R) La fotografia impresa farà aproximadament $23$ cm d'alçada.[/mat]",0]],"grup":"Proporcionalitat directa","provaTu":{"enunciat":"Tens una foto de $45$ cm d'amplada i $30$ cm d'alçada.\nLa vols imprimir amb $20$ cm d'amplada, sense deformar-la. Quina alçada tindrà?","solucio":"[mat]$30\\cdot 20\\div 45=13{,}33\\ldots$ cm[/mat]\nR) La foto mesurarà aproximadament $13{,}3$ cm d'alçada."}},{"id":"cb4-26-q8","bloc":"eso-proporcionalitat","titol":"Els esglaons de l'escala","enunciat":"En Samuel viu al 1r 2a, i puja a peu les escales del seu edifici.\nCada esglaó de l'escala mesura $15$ cm d'altura i en total haurà pujat $3$ m.\n\nQuants esglaons haurà pujat?","font":"CB 4ESO (2026), pregunta 8","passos":[["[mat]Abans de calcular, pensa:\n• si els esglaons fossin només de $12$ cm, creus que caldrien més esglaons o menys?[/mat]",0],["[mat]En total puja $3$ m i cada esglaó en puja $15$ cm.\nÉs **necessari** que les mesures siguin en les mateixes unitats, per exemple, en metres.\n\n$3$ m $=3$ m\n$15$ cm $=0{,}15$ m[/mat] [calc]Escriu $3$ [[entre]] $0.15$.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $20$.[/calc] [mat]R) En Samuel haurà pujat $20$ esglaons.[/mat]",0],["[calc]!!Error típic!!:\nSi no passes les mesures a les mateixes unitats: $3$ [[entre]] $15$.[/calc]",1],["[calc]Prem [[igual]]: obtens $0.2$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té cap sentit: no es pot pujar $0{,}2$ esglaons per arribar a $3$ m d'altura![/mat]",1]],"grup":"Proporcionalitat directa","tancament":"[mat]Recorda:\n• $15$ cm $=0{,}15$ m\n• $3\\div 0{,}15=20$ esglaons[/mat]","provaTu":{"enunciat":"Una escala puja $2{,}4$ m d'altura i cada esglaó fa $16$ cm d'altura.\nQuants esglaons hauràs de pujar per arribar a dalt?","solucio":"[mat]$16$ cm $=0{,}16$ m\n$2{,}4\\div 0{,}16=15$ esglaons[/mat]\nR) Hauré de pujar $15$ esglaons."}},{"id":"cb4-26-q25","bloc":"eso-proporcionalitat","titol":"La bossa de botons","enunciat":"Una empresa fabrica botons de plàstic, tots iguals. Sabem que $20$ botons pesen $70$ g.\n\nUna bossa plena de botons pesa $2{,}41$ kg. Quants botons hi ha a la bossa, si la bossa buida pesa $30$ g?","font":"CB 4ESO (2026), pregunta 25","passos":[["[mat]Abans de calcular, pensa:\n• quants grams són $2{,}41$ kg?\n• com faràs servir que la bossa buida pesa $30$ g?[/mat]",0],["[mat]$20$ botons → $70$ g\n$1$ botó → ?[/mat] [calc]Escriu $70$ [[entre]] $20$.[/calc]",0],["[calc]Prem [[igual]]: obtens $3.5$.[/calc] [mat]$1$ botó → $3{,}5$ g[/mat]",0],["[mat]La bossa plena pesa $2{,}41$ kg $=2.410$ g.\nSense la bossa buida, els botons pesen $2.410-30$ g.\nHi ha tants botons com vegades hi cap el pes d'un botó.[/mat] [calc]Escriu [[lpar]] $2410$ [[menys]] $30$ [[rpar]] [[entre]] i prem [[ans]].\n[[ans]] és el resultat d'abans.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $680$.[/calc] [mat]R) A la bossa hi ha $680$ botons.[/mat]",0],["[calc]!!Error típic!!:\nSi multipliques en lloc de dividir: $2380$ [[per]] $3.5$.[/calc]",1],["[calc]Prem [[igual]]: obtens $8330$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No pot ser: $8.330$ botons de $3{,}5$ g pesarien més de $29$ kg, i la bossa pesa $2{,}41$ kg.[/mat]",1]],"grup":"Proporcionalitat directa","tancament":"[mat]Recorda:\n• $70\\div 20=3{,}5$ g\n• $2.410-30=2.380$ g\n• $2.380\\div 3{,}5=680$ botons[/mat]","provaTu":{"enunciat":"Tens una caixa plena de claus iguals que pesa $1{,}5$ kg. Poses $12$ claus a la bàscula i llegeixes: $30$ g.\nQuants claus hi ha a la caixa?","solucio":"[mat]$30\\div 12=2{,}5$ g\n$1.500\\div 2{,}5=600$ claus[/mat]\nR) A la caixa hi ha $600$ claus."}},{"id":"ll4a-3-26","bloc":"eso-proporcionalitat","titol":"El plànol del pis","enunciat":"El plànol d'un pis està dibuixat a escala $1:50$. Al plànol, una de les parets fa $8$ cm de longitud.\n\nQuant mesura aquesta paret de debò, en metres?","font":"Llibre 4t ESO A, unitat 3, exercici 26","passos":[["[mat]Abans de calcular, pensa:\n• què vol dir l'escala $1:50$?\n• creus que un resultat com $3{,}2$ m seria possible? I un resultat com $0{,}4$ cm?[/mat]",0],["[mat]A escala $1:50$, cada centímetre del plànol són $50$ cm de debò.[/mat] [calc]Escriu $8$ [[per]] $50$.[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $400$.[/calc] [mat]R) La paret fa $400$ cm, és a dir, $4$ m.[/mat]",0],["[calc]!!Error típic!!:\nSi divideixes en lloc de multiplicar: $8$ [[entre]] $50$.[/calc]",1],["[calc]Prem [[igual]]: obtens $0.16$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té sentit: de debò, la paret faria $0{,}16$ cm, que és absurd.[/mat]",1]],"grup":"Proporcionalitat directa","tancament":"[mat]Recorda:\n• $8\\cdot 50=400$ cm\n• $400$ cm $=4$ m[/mat]","provaTu":{"enunciat":"En un mapa a escala $1:25.000$, dos pobles són a $6$ cm.\nQuina distància hi ha de debò entre els dos pobles, en km?","solucio":"[mat]$6\\cdot 25.000=150.000$ cm\n$150.000$ cm $=1{,}5$ km[/mat]\nR) Entre els dos pobles hi ha $1{,}5$ km."}},{"id":"ll4a-3-13","bloc":"eso-proporcionalitat","titol":"La neteja en un parc","enunciat":"L'any passat, per arreglar tot un parc, es va formar un equip de $6$ jardiners per podar els arbres, i van trigar $10$ dies per acabar la feina.\n\nAquest any només hi ha $4$ jardiners per fer la mateixa feina.\n\nQuants dies trigaran a podar tot el parc, si van al mateix ritme de feina?","font":"Llibre 4t ESO A, unitat 3, exercici 13","passos":[["[mat]Abans de calcular, pensa:\n• amb menys jardiners, es triga més dies o menys dies?\n• amb la meitat de jardiners es triga el doble de temps?[/mat]",0],["[mat]És una situació de proporcionalitat inversa.\n$6$ jardiners → $10$ dies\n$4$ jardiners → $x$\n\nSabem que $6\\cdot 10=4\\cdot x$.[/mat] [calc]Escriu $6$ [[per]] $10$.[/calc]",0],["[calc]Prem [[igual]]: obtens $60$.[/calc] [mat]Aquest nombre es manté constant: $60$.[/mat]",0],["[mat]Sabem que $4\\cdot x=60$.[/mat] [calc]Fes l'operació $60$ [[entre]] $4$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[igual]]: obtens el resultat, que és $15$.[/calc] [mat]R) Els $4$ jardiners trigaran $15$ dies a podar el parc.[/mat]",0],["[calc]!!Error típic!!:\nSi fas una regla de tres directa: $10$ [[per]] $4$ [[entre]] $6$.[/calc]",1],["[calc]Prem [[igual]]: obtens $6.666666667$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té lògica que $4$ jardiners acabin la feina més ràpid que $6$ jardiners.[/mat]",1]],"grup":"Proporcionalitat inversa","tancament":"[mat]Recorda:\n• L'equació és aquesta: $6\\cdot 10=4\\cdot x$\n• La solució és aquesta: $x=15$ dies[/mat]","provaTu":{"enunciat":"Fa $5$ anys que es va pintar tot l'institut, i ho van fer $3$ pintors, en $8$ dies de feina.\nAquest cop, s'han contractat $4$ pintors.\n\nQuants dies trigaran a pintar l'institut, si treballen al mateix ritme?","solucio":"[mat]$3\\cdot 8=4\\cdot x$\n$x=24\\div 4=6$ dies[/mat]\nR) Els $4$ pi
