nova és $\\frac{34\\cdot 42}{62}$.[/mat] [calc]Escriu $34$ [[per]] $42$.[/calc]",0],["[calc]Ara fes l'operació [[entre]] $62$.[/calc]",0],["[calc]Prem [[exe]]: obtens $\\frac{714}{31}$.\nSi surt en forma de fracció és perquè la calculadora està configurada per donar resultats exactes.\nSi estigués configurada per donar decimals, sortiria $23.03225806$.[/calc] [mat]$\\frac{714}{31}\\simeq 23{,}03$ cm[/mat]",0],["[calc]Per tenir-lo en decimal, prem [[shift]] i [[exe]] (≈): obtens $23.03225806$.[/calc] [mat]R) La fotografia impresa farà aproximadament $23$ cm d'alçada.[/mat]",0]],"grup":"Proporcionalitat directa","provaTu":{"enunciat":"Tens una foto de $45$ cm d'amplada i $30$ cm d'alçada.\nLa vols imprimir amb $20$ cm d'amplada, sense deformar-la. Quina alçada tindrà?","solucio":"[mat]$30\\cdot 20\\div 45=13{,}33\\ldots$ cm[/mat]\nR) La foto mesurarà aproximadament $13{,}3$ cm d'alçada."}},{"id":"cb4-26-q8","bloc":"eso-proporcionalitat","titol":"Els esglaons de l'escala","enunciat":"En Samuel viu al 1r 2a, i puja a peu les escales del seu edifici.\nCada esglaó de l'escala mesura $15$ cm d'altura i en total haurà pujat $3$ m.\n\nQuants esglaons haurà pujat?","font":"CB 4ESO (2026), pregunta 8","passos":[["[mat]Abans de calcular, pensa:\n• si els esglaons fossin només de $12$ cm, creus que caldrien més esglaons o menys?[/mat]",0],["[mat]En total puja $3$ m i cada esglaó en puja $15$ cm.\nÉs **necessari** que les mesures siguin en les mateixes unitats, per exemple, en metres.\n\n$3$ m $=3$ m\n$15$ cm $=0{,}15$ m[/mat] [calc]Escriu $3$ [[entre]] $0.15$.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $20$.[/calc] [mat]R) En Samuel haurà pujat $20$ esglaons.[/mat]",0],["[calc]!!Error típic!!:\nSi no passes les mesures a les mateixes unitats: $3$ [[entre]] $15$.[/calc]",1],["[calc]Prem [[shift]] [[exe]] (≈): obtens $0.2$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té cap sentit: no es pot pujar $0{,}2$ esglaons per arribar a $3$ m d'altura![/mat]",1]],"grup":"Proporcionalitat directa","tancament":"[mat]Recorda:\n• $15$ cm $=0{,}15$ m\n• $3\\div 0{,}15=20$ esglaons[/mat]","provaTu":{"enunciat":"Una escala puja $2{,}4$ m d'altura i cada esglaó fa $16$ cm d'altura.\nQuants esglaons hauràs de pujar per arribar a dalt?","solucio":"[mat]$16$ cm $=0{,}16$ m\n$2{,}4\\div 0{,}16=15$ esglaons[/mat]\nR) Hauré de pujar $15$ esglaons."}},{"id":"cb4-26-q25","bloc":"eso-proporcionalitat","titol":"La bossa de botons","enunciat":"Una empresa fabrica botons de plàstic, tots iguals. Sabem que $20$ botons pesen $70$ g.\n\nUna bossa plena de botons pesa $2{,}41$ kg. Quants botons hi ha a la bossa, si la bossa buida pesa $30$ g?","font":"CB 4ESO (2026), pregunta 25","passos":[["[mat]Abans de calcular, pensa:\n• quants grams són $2{,}41$ kg?\n• com faràs servir que la bossa buida pesa $30$ g?[/mat]",0],["[mat]$20$ botons → $70$ g\n$1$ botó → ?[/mat] [calc]Escriu $70$ [[entre]] $20$.[/calc]",0],["[calc]Prem [[exe]]: obtens $\\frac{7}{2}$.\nSi surt en forma de fracció és perquè la calculadora està configurada per donar resultats exactes.\nSi estigués configurada per donar decimals, sortiria $3.5$.[/calc] [mat]$1$ botó → $\\frac{7}{2}=3{,}5$ g[/mat]",0],["[mat]La bossa plena pesa $2{,}41$ kg $=2.410$ g.\nSense la bossa buida, els botons pesen $2.410-30$ g.\nHi ha tants botons com vegades hi cap el pes d'un botó.[/mat] [calc]Escriu [[lpar]] $2410$ [[menys]] $30$ [[rpar]] [[entre]] i prem [[ans]].\n[[ans]] és el resultat d'abans.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $680$.[/calc] [mat]R) A la bossa hi ha $680$ botons.[/mat]",0],["[calc]!!Error típic!!:\nSi multipliques en lloc de dividir: $2380$ [[per]] $3.5$.[/calc]",1],["[calc]Prem [[exe]]: obtens $8330$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No pot ser: $8.330$ botons de $3{,}5$ g pesarien més de $29$ kg, i la bossa pesa $2{,}41$ kg.[/mat]",1]],"grup":"Proporcionalitat directa","tancament":"[mat]Recorda:\n• $70\\div 20=3{,}5$ g\n• $2.410-30=2.380$ g\n• $2.380\\div 3{,}5=680$ botons[/mat]","provaTu":{"enunciat":"Tens una caixa plena de claus iguals que pesa $1{,}5$ kg. Poses $12$ claus a la bàscula i llegeixes: $30$ g.\nQuants claus hi ha a la caixa?","solucio":"[mat]$30\\div 12=2{,}5$ g\n$1.500\\div 2{,}5=600$ claus[/mat]\nR) A la caixa hi ha $600$ claus."}},{"id":"ll4a-3-26","bloc":"eso-proporcionalitat","titol":"El plànol del pis","enunciat":"El plànol d'un pis està dibuixat a escala $1:50$. Al plànol, una de les parets fa $8$ cm de longitud.\n\nQuant mesura aquesta paret de debò, en metres?","font":"Llibre 4t ESO A, unitat 3, exercici 26","passos":[["[mat]Abans de calcular, pensa:\n• què vol dir l'escala $1:50$?\n• creus que un resultat com $3{,}2$ m seria possible? I un resultat com $0{,}4$ cm?[/mat]",0],["[mat]A escala $1:50$, cada centímetre del plànol són $50$ cm de debò.[/mat] [calc]Escriu $8$ [[per]] $50$.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $400$.[/calc] [mat]R) La paret fa $400$ cm, és a dir, $4$ m.[/mat]",0],["[calc]!!Error típic!!:\nSi divideixes en lloc de multiplicar: $8$ [[entre]] $50$.[/calc]",1],["[calc]Prem [[shift]] [[exe]] (≈): obtens $0.16$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té sentit: de debò, la paret faria $0{,}16$ cm, que és absurd.[/mat]",1]],"grup":"Proporcionalitat directa","tancament":"[mat]Recorda:\n• $8\\cdot 50=400$ cm\n• $400$ cm $=4$ m[/mat]","provaTu":{"enunciat":"En un mapa a escala $1:25.000$, dos pobles són a $6$ cm.\nQuina distància hi ha de debò entre els dos pobles, en km?","solucio":"[mat]$6\\cdot 25.000=150.000$ cm\n$150.000$ cm $=1{,}5$ km[/mat]\nR) Entre els dos pobles hi ha $1{,}5$ km."}},{"id":"ll4a-3-13","bloc":"eso-proporcionalitat","titol":"La neteja en un parc","enunciat":"L'any passat, per arreglar tot un parc, es va formar un equip de $6$ jardiners per podar els arbres, i van trigar $10$ dies per acabar la feina.\n\nAquest any només hi ha $4$ jardiners per fer la mateixa feina.\n\nQuants dies trigaran a podar tot el parc, si van al mateix ritme de feina?","font":"Llibre 4t ESO A, unitat 3, exercici 13","passos":[["[mat]Abans de calcular, pensa:\n• amb menys jardiners, es triga més dies o menys dies?\n• amb la meitat de jardiners es triga el doble de temps?[/mat]",0],["[mat]És una situació de proporcionalitat inversa.\n$6$ jardiners → $10$ dies\n$4$ jardiners → $x$\n\nSabem que $6\\cdot 10=4\\cdot x$.[/mat] [calc]Escriu $6$ [[per]] $10$.[/calc]",0],["[calc]Prem [[exe]]: obtens $60$.[/calc] [mat]Aquest nombre es manté constant: $60$.[/mat]",0],["[mat]Sabem que $4\\cdot x=60$.[/mat] [calc]Fes l'operació $60$ [[entre]] $4$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $15$.[/calc] [mat]R) Els $4$ jardiners trigaran $15$ dies a podar el parc.[/mat]",0],["[calc]!!Error típic!!:\nSi fas una regla de tres directa: $10$ [[per]] $4$ [[entre]] $6$.[/calc]",1],["[calc]Prem [[shift]] [[exe]] (≈): obtens $6.666666667$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té lògica que $4$ jardiners acabin la feina més ràpid que $6$ jardiners.[/mat]",1]],"grup":"Proporcionalitat inversa","tancament":"[mat]Recorda:\n• L'equació és aquesta: $6\\cdot 10=4\\cdot x$\n• La solució és aquesta: $x=15$ dies[/mat]","provaTu":{"enunciat":"Fa $5$ anys que es va pintar tot l'institut, i ho van fer $3$ pintors, en $8$ dies de feina.\nAquest cop, s'han contractat $4$ pintors.\n\nQuants dies trigaran a pintar l'institut, si treballen al mateix ritme?","solucio":"[mat]$3\\cdot 8=4\\cdot x$\n$x=24\\div 4=6$ dies[/mat]\nR) Els $4$ pintors trigaran $6$ dies."}},{"id":"recu-f6-102","bloc":"eso-proporcionalitat","titol":"Els pots de pintura","enunciat":"En Carles recorda que quan va pintar la seva habitació, ja fa temps, va fer servir $6$ pots de pintura de $4$ kg cadascun.\nAra la vol tornar a pintar, però a la botiga només venen pots de $3$ kg.\n\nQuants pots de $3$ kg necessitarà?","font":"Banc de recuperació de 2n ESO (proporcionalitat directa i inversa)","passos":[["[mat]Abans de calcular, pensa:\n• amb pots més petits, calen més pots o menys?\n• en el fons, quants kg de pintura calen en total?[/mat]",0],["[mat]És una situació de proporcionalitat inversa.\n$6$ pots → $4$ kg cada pot\n$x$ pots → $3$ kg cada pot\n\nSabem que $6\\cdot 4=x\\cdot 3$.[/mat] [calc]Escriu $6$ [[per]] $4$.[/calc]",0],["[calc]Prem [[exe]]: obtens $24$.[/calc] [mat]Aquest nombre es manté constant: són els $24$ kg de pintura que calen.[/mat]",0],["[mat]Sabem que $x\\cdot 3=24$.[/mat] [calc]Fes l'operació $24$ [[entre]] $3$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $8$.[/calc] [mat]R) En Carles necessita $8$ pots de $3$ kg.[/mat]",0],["[calc]!!Error típic!!:\nSi fas una regla de tres directa: $6$ [[per]] $3$ [[entre]] $4$.[/calc]",1],["[calc]Prem [[shift]] [[exe]] (≈): obtens $4.5$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té cap sentit, perquè si compres pots més petits, en necessites més de $6$, segur![/mat]",1]],"grup":"Proporcionalitat inversa","tancament":"[mat]Recorda:\n• L'equació és aquesta: $6\\cdot 4=x\\cdot 3$\n• La solució és aquesta: $x=8$ pots[/mat]","provaTu":{"enunciat":"Per omplir una piscina calen $12$ camions de $9.000$ litres.\nTu només tens camions de $6.000$ litres. Quants camions et caldran?","solucio":"[mat]$12\\cdot 9.000=x\\cdot 6.000$\n$x=108.000\\div 6.000=18$ camions[/mat]\nR) Em caldran $18$ camions."}},{"id":"ll4a-3-14","bloc":"eso-proporcionalitat","titol":"El taxi","enunciat":"Un taxi cobra $3{,}50$ € per començar el viatge i, després, $1{,}20$ € per cada km recorregut.\n\nPer anar a l'hospital a visitar un familiar has fet un trajecte de $5$ km. Després, per acompanyar-lo a casa seva, has fet un trajecte de $10$ km.\n\n**a)** Creus que el trajecte de $10$ km costa el doble que el de $5$ km?\n**b)** Quant costa cada trajecte?","font":"Llibre 4t ESO A, unitat 3, exercici 14","passos":[["[mat]Per fer un trajecte de $5$ km es paguen els $3{,}50$ € inicials i després $1{,}20$ € per cada km.\n$3{,}50$ € $+\\ 5\\cdot 1{,}20$ €[/mat] [calc]Escriu $3.5$ [[mes]] $1.2$ [[per]] $5$.[/calc]",0],["[calc]Prem directament [[shift]] [[exe]] (≈): obtens el resultat en decimal, que és $9.5$.[/calc] [mat]El trajecte de $5$ km costa $9{,}50$ €.[/mat]",0],["[mat]Per un trajecte de $10$ km: $3{,}50$ € $+\\ 10\\cdot 1{,}20$ €[/mat] [calc]Esborra amb [[ac]] i escriu $3.5$ [[mes]] $10$ [[per]] $1.2$.[/calc]",0],["[calc]Prem [[shift]] [[exe]] (≈): obtens $15.5$.[/calc] [mat]El trajecte de $10$ km costa $15{,}50$ €.[/mat]",0],["[mat]R) El trajecte de $5$ km costa $9{,}50$ € i el de $10$ km, $15{,}50$ €.\nEl preu no és proporcional als km recorreguts.[/mat]",0]],"grup":"Quan no és proporcional","provaTu":{"enunciat":"Un gimnàs cobra $30$ € de matrícula inicial i, posteriorment, cobra $25$ € cada mes.\n**a)** Quant pagaràs si hi vas $3$ mesos?\n**b)** I si hi vas $6$ mesos?\n**c)** En el segon cas, pagues el doble que en el primer cas?","solucio":"[mat]$30+25\\cdot 3=105$ €\n$30+25\\cdot 6=180$ €[/mat]\nR) Pagaré $105$ € i $180$ €, respectivament.\nNo és el doble, perquè la matrícula sempre es paga una sola vegada."}},{"id":"cb4-23-q23","bloc":"eso-percentatges","titol":"Les fotos amb descompte","enunciat":"Una botiga imprimeix fotografies en color a $0{,}30$ € cadascuna.\n\nL'Anna hi imprimeix $40$ fotografies en color i la botiga li fa un descompte del $25$ %.\n\nQuant li costarà imprimir les fotografies?","font":"CB 4ESO (2023), pregunta 23","passos":[["[mat]Sense descompte, $40$ fotografies costen això:\n$40\\cdot 0{,}30$ €.[/mat] [calc]Escriu $40$ [[per]] $0.3$.[/calc]",0],["[mat]Amb un descompte del $25$ %, es paga el $75$ % del preu.\nPagar el $75$ % és multiplicar per $0{,}75$.[/mat] [calc]Ara fes l'operació [[per]] $0.75$.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $9$.[/calc] [mat]R) A l'Anna li costarà $9$ € imprimir les $40$ fotografies.[/mat]",0],["[calc]!!Error típic!!:\nSi multipliques pel descompte en lloc de pel que es paga: $40$ [[per]] $0.3$ [[per]] $0.25$.[/calc]",1],["[calc]Prem [[exe]]: obtens $3$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té sentit: $3$ € és el que s'estalvia l'Anna, i no és el preu final que cal pagar.[/mat]",1]],"tancament":"[mat]Recorda:\n• Si et fan un descompte del $25$ %, en el fons vol dir que pagues un $75$ % del preu. Per tant, cal multiplicar per $0{,}75$\n\n$40\\cdot 0{,}30\\cdot 0{,}75=9$ €[/mat]","provaTu":{"enunciat":"Una llibreta costa $2{,}40$ €. Tu en compres $15$ i et fan un descompte del $20$ %.\nQuant pagaràs en total?","solucio":"[mat]$15\\cdot 2{,}40\\cdot 0{,}80=28{,}80$ €[/mat]\nR) Pagaré $28{,}80$ €."}},{"id":"cb4-23-q24","bloc":"eso-percentatges","titol":"Les fotos que imprimeix l'Anna","enunciat":"L'Anna va a una botiga a imprimir fotografies en color. Sap que van a $0{,}30$ € cada còpia.\n\nLi fan un descompte del $25$ % i paga $4{,}50$ €.\n\nQuantes fotografies ha imprès?","font":"CB 4ESO (2023), pregunta 24","passos":[["[mat]Amb el descompte, l'Anna paga el $75$ % del preu: $4{,}50$ € és el $75$ % del preu sense descompte.\nPer trobar el preu sense descompte, es divideix entre $0{,}75$.[/mat] [calc]Escriu $4.5$ [[entre]] $0.75$.[/calc]",0],["[calc]Prem [[exe]]: obtens $6$.[/calc] [mat]Sense descompte, les fotografies costarien $6$ €.[/mat]",0],["[mat]Cada fotografia costa $0{,}30$ €: hi ha tantes fotografies com vegades hi cap $0{,}30$ € en $6$ €.[/mat] [calc]Fes l'operació [[entre]] $0.3$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $20$.[/calc] [mat]R) L'Anna ha imprès $20$ fotografies.[/mat]",0],["[calc]!!Error típic!!:\nSi desfàs el descompte afegint un $25$ %, és a dir, multiplicant per $1.25$: $4.5$ [[per]] $1.25$ [[entre]] $0.3$.[/calc]",1],["[calc]Prem [[shift]] [[exe]] (≈): obtens $18.75$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té cap sentit imprimir $18{,}75$ fotografies, i això ens fa sospitar que no hem plantejat bé les operacions.[/mat]",1]],"tancament":"[mat]Recorda:\n• Si has pagat el $75$ % del preu, per saber el preu sense descompte cal dividir entre $0{,}75$\n\n$4{,}50\\div 0{,}75=6$ €\n$6\\div 0{,}30=20$ fotografies[/mat]","provaTu":{"enunciat":"Unes llibretes costen $2{,}40$ € cadascuna. Amb un descompte del $20$ %, has pagat $28{,}80$ €.\nQuantes llibretes has comprat?","solucio":"[mat]$28{,}80\\div 0{,}80=36$ €\n$36\\div 2{,}40=15$ llibretes[/mat]\nR) He comprat $15$ llibretes."}},{"id":"ll4-2-25","bloc":"eso-percentatges","titol":"La declaració de l'IVA","enunciat":"En Jordi té una botiga d'electrodomèstics. Cada trimestre ha de fer la declaració de l'IVA a Hisenda.\n\nEn el primer trimestre de l'any ha cobrat $18.150$ € als seus clients, amb l'IVA del $21$ % inclòs.\n\n**a)** Quants diners ha facturat realment, sense IVA?\n**b)** Quants diners d'IVA haurà de pagar a Hisenda?","font":"Llibre 4t ESO, unitat 2, exercici 25","passos":[["[mat]Afegir l'IVA del $21$ % és multiplicar per $1{,}21$.\nPer calcular el preu sense IVA, cal fer aquesta operació:\n$18.150$ € $\\div 1{,}21$[/mat] [calc]Escriu $18150$ [[entre]] $1.21$.[/calc]",0],["[calc]Prem [[exe]]: obtens $15000$.[/calc] [mat]Sense IVA, en Jordi ha facturat $15.000$ €.[/mat]",0],["[mat]L'IVA és la diferència entre el que ha cobrat i el que ha facturat:\n$18.150$ € $-\\ 15.000$ €[/mat] [calc]Escriu $18150$ [[menys]] [[ans]].\n[[ans]] és el resultat d'abans.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $3150$.[/calc] [mat]R) En Jordi ha facturat $15.000$ € i haurà de pagar $3.150$ € d'IVA a Hisenda.[/mat]",0]],"provaTu":{"enunciat":"Tens una petita botiga de roba. En un trimestre has cobrat $24.200$ € als clients, amb l'IVA del $21$ % inclòs.\n**a)** Quants diners has facturat sense IVA?\n**b)** Quants diners d'IVA hauràs de pagar a Hisenda?","solucio":"[mat]$24.200\\div 1{,}21=20.000$ €\n$24.200-20.000=4.200$ €[/mat]\nR) He facturat $20.000$ € i hauré de pagar $4.200$ € d'IVA."}},{"id":"ll4a-2-17","bloc":"eso-percentatges","titol":"L'abric rebaixat","enunciat":"En una botiga de roba hi ha un cartell que diu: «Rebaixa del $40$ % i, els dijous, un $10$ % extra: tindràs un $50$ % de descompte!».\n\nEn Pau hi vol comprar un abric de $200$ €. Aprofita que és dijous per tenir més rebaixa. De fet, en Pau creu que haurà de pagar just la meitat, o sigui, $100$ €.\n\n**a)** Realment, quin és el preu rebaixat que pagarà en Pau?\n**b)** És cert que li han fet un $50$ % de descompte?","font":"Llibre 4t ESO A, unitat 2, exercici 17","passos":[["[mat]Abans de calcular, pensa:\n• el $10$ % extra es calcula sobre $200$ € o sobre un preu més petit?[/mat]",0],["[mat]Amb un $40$ % de descompte es paga el $60$ %: es multiplica per $0{,}6$.\nAmb el $10$ % extra es paga el $90$ % del que queda: es multiplica per $0{,}9$.[/mat] [calc]Escriu $200$ [[per]] $0.6$ [[per]] $0.9$.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $108$.[/calc] [mat]R) L'abric costa $108$ €.\nEl descompte que li han fet és:\n$200-108=92$ €\nPer tant, no li fan un $50$ % de descompte, perquè no li han rebaixat $100$ €.[/mat]",0],["[calc]!!Error típic!!:\nSi sumes els descomptes, $40$ % $+\\ 10$ % $=50$ %: $200$ [[per]] $0.5$.[/calc]",1],["[calc]Prem [[exe]]: obtens $100$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té sentit: el $10$ % extra és sobre $120$ €, no sobre $200$ €. Els descomptes encadenats no se sumen![/mat]",1]],"tancament":"[mat]Recorda:\n• Si et fan dos descomptes seguits, primer pagues el $60$ % del preu inicial i, després, el $90$ % del primer preu rebaixat. Per tant, cal multiplicar per $0{,}6$ i per $0{,}9$\n\n$200$ € $\\cdot 0{,}6\\cdot 0{,}9=108$ €[/mat]","provaTu":{"enunciat":"Una tauleta costa $300$ €. Primer la rebaixen un $20$ % i després, sobre el preu rebaixat, un $10$ % més.\n**a)** Quin és el preu final?\n**b)** Quin percentatge de descompte t'han fet en total?","solucio":"[mat]$300\\cdot 0{,}8\\cdot 0{,}9=216$ €\n$300-216=84$ €\n$84\\div 300=0{,}28$[/mat]\nR) La tauleta em costarà $216$ €.\nM'han fet un descompte del $28$ %, no del $30$ %."}},{"id":"ll4-2-16","bloc":"eso-percentatges","titol":"L'historial de preus del televisor","enunciat":"La Naia està mirant l'historial de preus d'un televisor en una botiga en línia. La Naia se sorprèn molt, fixa't què passa:\n\n• Fa $2$ mesos, el preu era $300$ €.\n• Fa $1$ mes, el preu va baixar exactament un $15$ %.\n• Ahir mateix, el preu va pujar exactament un $15$ %.\n\nPerò el preu actual, segons està veient la Naia, **no és** de $300$ €.\n\n**a)** Quin és el preu actual del televisor?\n**b)** Com pot ser que no torni a costar $300$ €?","font":"Llibre 4t ESO, unitat 2, exercici 16","passos":[["[mat]Abans de calcular, pensa:\n• Sabem que la baixada del $15$ % es calcula sobre $300$ €. Però... la pujada del $15$ %, sobre quin preu es calcula?[/mat]",0],["[mat]• Baixar un $15$ % és pagar el $85$ %: es multiplica per $0{,}85$.\n• Pujar un $15$ % és pagar el $115$ %: es multiplica per $1{,}15$.\nPreu actual: $300$ € $\\cdot 0{,}85\\cdot 1{,}15$[/mat] [calc]Escriu $300$ [[per]] $0.85$ [[per]] $1.15$.[/calc]",0],["[calc]Prem [[shift]] [[exe]] (≈): obtens el resultat en decimal, que és $293.25$.[/calc] [mat]R) Ara el televisor costa $293{,}25$ €, i no $300$ €.\nLa baixada i la pujada no es compensen.[/mat]",0]],"provaTu":{"enunciat":"Una samarreta costa $40$ €. Primer el preu puja un $25$ % i després baixa un $25$ %.\nQuin és el preu final de la samarreta?","solucio":"[mat]$40\\cdot 1{,}25\\cdot 0{,}75=37{,}50$ €[/mat]\nR) La samarreta costa $37{,}50$ €, menys que al principi."}},{"id":"cb4-26-q15","bloc":"eso-mitjanes","titol":"Les places de l'hotel","enunciat":"Un hotel apunta cada setmana quantes places ha ocupat. En $4$ setmanes ha ocupat $168$, $154$, $210$ i $260$ places, respectivament.\n\nQuina ha estat la mitjana de places ocupades?","font":"CB 4ESO (2026), pregunta 15","passos":[["[mat]La mitjana és la suma de les places dividida entre el nombre de setmanes:\n$\\frac{168+154+210+260}{4}$[/mat] [calc]Primer escriu la suma entre parèntesis: [[lpar]] $168$ [[mes]] $154$ [[mes]] $210$ [[mes]] $260$ [[rpar]].[/calc]",0],["[calc]Ara fes l'operació [[entre]] $4$.[/calc] [mat]Gràcies als parèntesis, es divideix tota la suma entre $4$.[/mat]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $198$.[/calc] [mat]R) La mitjana ha estat de $198$ places ocupades per setmana.[/mat]",0],["[calc]!!Error típic!!:\nSi escrius la suma sense parèntesis: $168$ [[mes]] $154$ [[mes]] $210$ [[mes]] $260$ [[entre]] $4$.[/calc]",1],["[calc]Prem [[exe]]: obtens $597$.[/calc] [mat]La calculadora ha seguit bé les instruccions, però sense parèntesis només s'ha dividit el $260$ entre $4$.[/mat] [mat]No té cap sentit: la mitjana no pot ser més gran que les places de qualsevol setmana![/mat]",1]],"tancament":"[mat]Recorda:\n• Si vols dividir tota una suma, recorda d'escriure-la entre parèntesis.\n\n$(168+154+210+260)\\div 4=198$ places[/mat]","provaTu":{"enunciat":"Aquesta setmana, un bar ha venut $35$, $42$, $28$, $50$ i $45$ entrepans, de dilluns a divendres.\nQuina és la mitjana d'entrepans venuts per dia?","solucio":"[mat]$(35+42+28+50+45)\\div 5=40$[/mat]\nR) De mitjana, el bar ha venut $40$ entrepans per dia."}},{"id":"cb4-24-q8","bloc":"eso-mitjanes","titol":"Les estrelles de la botiga","enunciat":"Els $80$ clients d'una botiga han valorat la seva compra amb una puntuació d'$1$ a $5$ estrelles. Aquesta taula diu quants clients han donat cada puntuació:\n\n$$\\begin{array}{l|ccccc}\\text{Estrelles} & 5 & 4 & 3 & 2 & 1\\\\ \\hline \\text{Clients} & 22 & 32 & 16 & 8 & 2\\end{array}$$\nQuina és la puntuació mitjana de la botiga?","font":"CB 4ESO (2024), pregunta 8","passos":[["[mat]• Cada puntuació d'estrelles s'ha de multiplicar pel nombre de clients que l'han donada.\n• Després, cal sumar tots els resultats.\n• Finalment, caldrà fer una divisió.[/mat] [calc]Per començar, prem [[frac]] i escriu la suma al numerador.[/calc]",0],["[mat]Necessitem saber el total de clients:\n$22+32+16+8+2=80$\nCaldrà dividir la nostra suma entre el total de clients, que és $80$.[/mat] [calc]Baixa al denominador amb [[down]] i escriu $80$.[/calc]",0],["[calc]Prem [[exe]]: obtens $\\frac{19}{5}$.\nSi surt en forma de fracció és perquè la calculadora està configurada per donar resultats exactes.\nSi estigués configurada per donar decimals, sortiria $3.8$.[/calc] [mat]$\\frac{19}{5}=3{,}8$ estrelles[/mat]",0],["[calc]Per tenir-lo en decimal, prem [[shift]] [[exe]] (≈): obtens $3.8$.[/calc] [mat]R) La puntuació mitjana és de $3{,}8$ estrelles.[/mat]",0]],"provaTu":{"enunciat":"Aquesta taula mostra les notes d'un examen de matemàtiques dels $30$ alumnes d'una classe:\n\n$$\\begin{array}{l|ccccccccc}\\text{Nota} & 2 & 3 & 4 & 5 & 6 & 7 & 8 & 9 & 10\\\\ \\hline \\text{Alumnes} & 1 & 2 & 3 & 5 & 6 & 5 & 4 & 2 & 2\\end{array}$$\nQuina és la nota mitjana de la classe?","solucio":"[mat]$\\frac{2\\cdot 1+3\\cdot 2+4\\cdot 3+5\\cdot 5+6\\cdot 6+7\\cdot 5+8\\cdot 4+9\\cdot 2+10\\cdot 2}{30}=\\frac{186}{30}=6{,}2$[/mat]\nR) La nota mitjana de la classe és un $6{,}2$."}},{"id":"cb4-25-q17","bloc":"eso-mitjanes","titol":"Les tardes a la biblioteca","enunciat":"S'ha fet una enquesta per saber quantes tardes per setmana els alumnes de 4t d'ESO d'un institut van a estudiar a la biblioteca del barri.\n\nDels alumnes enquestats, $25$ hi van $1$ tarda per setmana, $35$ hi van $2$ tardes, $25$ hi van $3$ tardes i $10$ hi van $4$ tardes.\n\nDe mitjana, quantes tardes per setmana hi van?","font":"CB 4ESO (2025), pregunta 17","passos":[["[mat]• Cada nombre de tardes s'ha de multiplicar pel nombre d'alumnes que hi van.\n• Després, cal sumar tots els resultats.\n• Finalment, caldrà fer una divisió.[/mat] [calc]Per començar, prem [[frac]] i escriu la suma al numerador.[/calc]",0],["[mat]Necessitem saber el total d'alumnes enquestats:\n$25+35+25+10$\nCaldrà dividir la nostra suma entre aquest total.[/mat] [calc]Baixa al denominador amb [[down]] i escriu aquesta suma.[/calc]",0],["[calc]Prem directament [[shift]] [[exe]] (≈): obtens el resultat en decimal, que és $2.210526316$.[/calc] [mat]R) De mitjana, hi van aproximadament $2{,}21$ tardes per setmana.[/mat]",0],["[calc]!!Error típic!!:\nSi ho escrius en una línia i no poses parèntesis al denominador: [[lpar]] … [[rpar]] [[entre]] $25$ [[mes]] $35$ [[mes]] $25$ [[mes]] $10$.[/calc]",1],["[calc]Prem [[shift]] [[exe]] (≈): obtens $78.4$.[/calc] [mat]La calculadora ha seguit bé les instruccions, però sense parèntesis només s'ha dividit entre el primer $25$.[/mat] [mat]No té cap sentit: una setmana no té $78$ tardes![/mat]",1]],"tancament":"[mat]Recorda:\n• Si el denominador és una suma, recorda d'escriure'l entre parèntesis, o fer servir la plantilla de fracció si la calculadora en té.\n\n$\\frac{210}{95}\\simeq 2{,}21$ tardes per setmana[/mat]","provaTu":{"enunciat":"En una classe de $40$ alumnes, $12$ no tenen cap germà, $15$ en tenen $1$, $8$ en tenen $2$ i $5$ en tenen $3$.\nQuina és la mitjana de germans per alumne?","solucio":"[mat]$\\frac{0\\cdot 12+1\\cdot 15+2\\cdot 8+3\\cdot 5}{12+15+8+5}=\\frac{46}{40}=1{,}15$ germans[/mat]\nR) De mitjana, cada alumne té $1{,}15$ germans."}},{"id":"ll4a-8-56","bloc":"eso-mitjanes","titol":"La nota final de Tecnologia","enunciat":"A l'institut de la Marta, la nota final de Tecnologia es calcula així:\n• l'examen compta un $30$ %;\n• la part pràctica al laboratori, un $30$ %;\n• el projecte final, un $40$ %.\n\nLa Marta ha tret un $5$ a l'examen, un $6$ a les pràctiques i un $9$ al projecte.\n\nQuina és la nota mitjana de la Marta?","font":"Llibre 4t ESO A, unitat 8, exercici 56","passos":[["[mat]Abans de calcular, pensa:\n• és possible que la seva nota mitjana sigui un $4$?\n• creus que la seva nota s'acostarà més al $5$ o al $7$?[/mat]",0],["[mat]Cada nota es multiplica pel seu pes ($30$ % és $0{,}3$) i se sumen.\nNo cal dividir: els pesos ja sumen $1$, el $100$ %.[/mat] [calc]Escriu $0.3$ [[per]] $5$ [[mes]] $0.3$ [[per]] $6$ [[mes]] $0.4$ [[per]] $9$.[/calc]",0],["[calc]Prem directament [[shift]] [[exe]] (≈): obtens el resultat en decimal, que és $6.9$.[/calc] [mat]R) La nota mitjana de la Marta és un $6{,}9$.[/mat]",0]],"provaTu":{"enunciat":"La nota d'una matèria es calcula amb aquesta mitjana ponderada: un $60$ % l'examen i un $40$ % els treballs.\nTu has tret un $4$ a l'examen i un $8$ als treballs. Quina és la teva nota mitjana?","solucio":"[mat]$0{,}6\\cdot 4+0{,}4\\cdot 8=5{,}6$[/mat]\nR) La meva nota mitjana és un $5{,}6$."}},{"id":"cb4-26-q7","bloc":"eso-geometria","titol":"El tram d'escala","enunciat":"Una escala uneix dues plantes d'un edifici. Cada tram d'escala puja una altura de $3$ m i avança una longitud de $5$ m.\n\nQuant mesura cada tram d'escala?","font":"CB 4ESO (2026), pregunta 7","passos":[["[mat]El tram és la hipotenusa d'un triangle rectangle amb catets de $3$ m i $5$ m.\nApliquem el teorema de Pitàgores per trobar quant mesura la hipotenusa:\n$\\sqrt{3^2+5^2}$[/mat] [calc]Prem [[arrel]] i escriu a dins $3$ [[x2]] [[mes]] $5$ [[x2]].[/calc]",0],["[calc]Prem [[exe]]: obtens $\\sqrt{34}$.\nSi surt en forma d'arrel és perquè la calculadora està configurada per donar resultats exactes.\nSi estigués configurada per donar decimals, sortiria $5.830951895$.[/calc] [mat]$\\sqrt{34}\\simeq 5{,}83$ m[/mat]",0],["[calc]Per obtenir l'expressió decimal de l'arrel, prem [[shift]] [[exe]] (≈).\nObtens $5.830951895$.[/calc] [mat]R) Cada tram d'escala mesura aproximadament $5{,}83$ m.[/mat]",0]],"provaTu":{"enunciat":"La rampa de l'skatepark del teu barri puja una altura d'$1{,}2$ m i avança una longitud de $5$ m.\nQuant mesura la rampa?","solucio":"[mat]$\\sqrt{1{,}2^2+5^2}=\\sqrt{26{,}44}\\simeq 5{,}14$ m[/mat]\nR) La rampa mesura aproximadament $5{,}14$ m."}},{"id":"ll4a-4-34","bloc":"eso-geometria","titol":"L'escala recolzada a la paret","enunciat":"En Marc recolza una escala de $5$ m en una paret per pintar-la. El peu de l'escala queda separat una distància de $4$ m respecte de la base de la paret.\n\nA quina altura de la paret arriba l'escala?","font":"Llibre 4t ESO A, unitat 4, exercici 34","passos":[["[mat]Abans de calcular, pensa:\n• quin és el costat més llarg del triangle: l'escala, la paret o el terra?\n• l'escala pot arribar a més de $5$ m d'altura?[/mat]",0],["[mat]Podem formar un triangle rectangle, on:\n• el tros de terra ($4$ m) és un catet;\n• l'altura a la qual arriba l'escala és l'altre catet;\n• la pròpia escala és la hipotenusa.\nPel teorema de Pitàgores, l'altura de l'escala val:\n$\\sqrt{5^2-4^2}$[/mat] [calc]Prem [[arrel]] i escriu a dins $5$ [[x2]] [[menys]] $4$ [[x2]].[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $3$.[/calc] [mat]R) L'escala arriba a $3$ m d'altura de la paret.[/mat]",0],["[calc]!!Error típic!!:\nSi sumes els quadrats en lloc de restar-los: [[arrel]] $5$ [[x2]] [[mes]] $4$ [[x2]].[/calc]",1],["[calc]Prem [[shift]] [[exe]] (≈): obtens $6.403124237$.[/calc] [mat]La calculadora ha seguit les teves instruccions, però no té cap sentit, perquè una escala de $5$ m inclinada no pot arribar a $6{,}4$ m d'altura. L'altura màxima seria precisament $5$ m, posant-la vertical.[/mat]",1]],"tancament":"[mat]Recorda:\n• Si coneixes la hipotenusa i un catet, i vols trobar la mida de l'altre catet, et cal aplicar la fórmula adequada:\n\n$\\sqrt{5^2-4^2}=3$ m[/mat]","provaTu":{"enunciat":"Els bombers recolzen una escala de $6{,}5$ m en una paret. El peu de l'escala és a $2{,}5$ m de la paret.\nA quina altura arriba l'escala?","solucio":"[mat]$\\sqrt{6{,}5^2-2{,}5^2}=\\sqrt{36}=6$ m[/mat]\nR) L'escala arriba a $6$ m d'altura."}},{"id":"cb4-22-q8","bloc":"eso-geometria","titol":"El got de vidre","enunciat":"Un got de vidre té forma de cilindre. El radi de la base fa $3$ cm i l'alçada, $15$ cm.\n\nQuin és el volum del got?[nota]Volum d'un cilindre: $V=\\pi\\cdot r^2\\cdot h$[/nota]","font":"CB 4ESO (2022), pregunta 8","passos":[["[mat]El volum del got es calcula així, a partir del seu radi i de la seva altura:\n$V=\\pi\\cdot 3^2\\cdot 15$[/mat] [calc]Escriu π ([[shift]] [[7]]), [[per]] $3$ [[x2]] [[per]] $15$.[/calc]",0],["[calc]Prem [[exe]]: obtens $135\\pi$.\nSi surt amb π és perquè la calculadora està configurada per donar resultats exactes.\nSi estigués configurada per donar decimals, sortiria $424.1150082$.[/calc]",0],["[calc]Per tenir-lo en decimal, prem [[shift]] [[exe]] (≈): obtens $424.1150082$.[/calc] [mat]R) El volum del got és aproximadament de $424$ cm³.[/mat]",0]],"provaTu":{"enunciat":"Una llauna de refresc té forma de cilindre. El radi de la base fa $3$ cm i l'alçada, $11{,}66$ cm.\n• Quin és el volum de la llauna?\n• És cert que hi caben $330$ ml?","solucio":"[mat]$V=\\pi\\cdot 3^2\\cdot 11{,}66=104{,}94\\pi\\simeq 329{,}7$ cm³[/mat]\nR) El volum de la llauna és aproximadament de $329{,}7$ cm³, és a dir, uns $330$ ml: sí, hi caben."}},{"id":"cb4-25-q27","bloc":"eso-geometria","titol":"La tela del para-sol","enunciat":"Volem saber quanta tela fa falta per construir un para-sol. Podem aproximar l'àrea del para-sol per la d'un cercle de $0{,}75$ m de radi.\n\nTroba el valor d'aquesta àrea.[nota]Àrea del cercle: $A=\\pi\\cdot r^2$[/nota]","font":"CB 4ESO (2025), pregunta 27","passos":[["[mat]L'àrea del cercle es calcula així:\n$A=\\pi\\cdot 0{,}75^2$[/mat] [calc]Escriu π ([[shift]] [[7]]), [[per]] $0.75$ [[x2]].[/calc]",0],["[calc]Prem directament [[shift]] [[exe]] (≈): obtens el resultat en decimal, que és $1.767145868$.[/calc] [mat]R) Calen aproximadament $1{,}77$ m² de tela.[/mat]",0]],"provaTu":{"enunciat":"Una pizza rodona fa $15$ cm de radi.\nQuant val la seva àrea?","solucio":"[mat]$A=\\pi\\cdot 15^2=225\\pi\\simeq 706{,}86$ cm²[/mat]\nR) La pizza té una àrea aproximada de $706{,}86$ cm²."}},{"id":"ll4a-4-8","bloc":"eso-geometria","titol":"L'ombra del campanar","enunciat":"Un dia de sol, la Júlia vol saber l'altura del campanar del seu poble. Fa aquest experiment:\n• En primer lloc, mesura l'ombra que fa el campanar al terra: són $12$ m.\n• Ràpidament, posa un pal vertical i pren mesures: el pal mesura $2$ m i la seva ombra, $1{,}5$ m.\n\nLa Júlia ha anat ràpid perquè no volia que el Sol canviés la seva inclinació respecte del terra.\n\nLa Júlia ja sap que el campanar mesura $16$ m d'altura. Com ho ha sabut?","font":"Llibre 4t ESO A, unitat 4, exercicis 8 i 11","passos":[["[mat]Abans de calcular, pensa:\n• el pal mesura més que la seva pròpia ombra, o menys?\n• aleshores, el campanar tindrà una altura superior o inferior a $12$ m?[/mat]",0],["[mat]El pal i el campanar, amb les seves ombres, formen triangles semblants.\nLa raó de semblança és aquesta:\n$12\\div 1{,}5$[/mat] [calc]Escriu $12$ [[entre]] $1.5$.[/calc]",0],["[calc]Prem [[exe]]: obtens $8$.[/calc] [mat]Això vol dir que l'ombra del campanar és $8$ vegades la del pal. Per tant, l'altura del campanar també serà $8$ vegades la del pal.\nCom que el pal mesura $2$ m, farem el següent:[/mat]",0],["[calc]Fes l'operació [[per]] $2$.\nLa calculadora continua amb el resultat d'abans (Ans).[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $16$.[/calc] [mat]R) La Júlia ho ha sabut perquè l'altura del campanar és $8$ vegades la del pal: $2\\cdot 8=16$ m.[/mat]",0],["[calc]!!Error típic!!:\nSi inverteixes la raó i fas ombra entre altura: $1.5$ [[per]] $12$ [[entre]] $2$.[/calc]",1],["[calc]Prem [[exe]]: obtens $9$.[/calc] [mat]La calculadora ha seguit bé les instruccions. El problema és que s'han plantejat malament els càlculs.[/mat] [mat]No té sentit: el campanar ($9$ m) seria més baix que la seva ombra ($12$ m), i el pal no![/mat]",1]],"tancament":"[mat]Recorda:\n• Si l'ombra és $8$ vegades més llarga, l'altura també és $8$ vegades més gran\n\n$12\\div 1{,}5=8$\n$2\\cdot 8=16$ m[/mat]","provaTu":{"enunciat":"Un fanal de $6$ m fa una ombra de $9$ m.\nA la mateixa hora, quina ombra faràs tu, si fas $1{,}8$ m d'alçada?","solucio":"[mat]$9\\div 6=1{,}5$\n$1{,}8\\cdot 1{,}5=2{,}7$ m[/mat]\nR) La meva ombra farà $2{,}7$ m."}},{"id":"eso-posa-graus","bloc":"eso-trigonometria","titol":"La calculadora en radians","enunciat":"A dalt de la pantalla de la calculadora hi ha una R: la calculadora treballa en radians.\n\nCalcula l'altura de l'arbre de la fitxa següent, $12\\cdot\\tan 35^\\circ$, i posa la calculadora en graus.","font":"","passos":[["[calc]!!Error típic!!:\nSi calcules amb la R a la barra: $12$ [[tan]] $35$ [[rpar]].[/calc]",1],["[calc]Prem [[exe]]: obtens $5.685776645$.[/calc] [mat]La calculadora ha seguit bé les instruccions, però ha entès $35$ radians, i no $35^\\circ$.[/mat]",1],["[calc]Ho arreglem. Prem [[settings]]: menú CONFIG.[/calc]",0],["[calc]Entra a {{Config cálculo}} amb [[ok]].[/calc]",0],["[calc]Baixa a {{Unidad angular}} amb [[down]].[/calc]",0],["[calc]Prem [[ok]]. El ◉ és a {{Radián}}: per això hi ha la R.[/calc]",0],["[calc]Puja a {{Grado sexag (D)}} (graus) amb [[up]].[/calc]",0],["[calc]Prem [[ok]]: el ◉ passa a {{Grado sexag (D)}}.[/calc]",0],["[calc]Prem [[ac]] per tornar a calcular.\nA la barra ara hi ha D.[/calc]",0],["[calc]Torna a escriure $12$ [[tan]] $35$ [[rpar]].[/calc]",0],["[calc]Prem [[exe]]: obtens $8.402490459$.[/calc] [mat]R) Ara sí: l'arbre fa aproximadament $8{,}4$ m d'altura.[/mat]",0]],"provaTu":{"enunciat":"Primer, comprova que la calculadora és en graus: a dalt de la pantalla hi ha d'haver una D.\nDesprés, calcula $5\\cdot\\tan 30^\\circ$.","solucio":"[mat]$5\\cdot\\tan 30^\\circ=\\frac{5\\sqrt{3}}{3}\\simeq 2{,}89$[/mat]\n[nota]Si et surt $-32{,}03$, la calculadora és en radians.[/nota]"}},{"id":"ll4-7-37","bloc":"eso-trigonometria","titol":"L'arbre del pati","enunciat":"En Pol vol saber l'altura de l'arbre del pati de l'institut. Un dia de sol, l'arbre fa una ombra de $12$ m, i els raigs del sol formen un angle de $35^\\circ$ amb el terra.\n\nQuina és l'altura de l'arbre?","font":"Llibre 4t ESO, unitat 7, exercici 37","passos":[["[calc]Abans de res, mira la barra: hi ha d'haver una D (graus), perquè els angles d'aquest problema són en graus.\nSi hi ha una R, mira la fitxa anterior.[/calc]",0],["[mat]Podem formar un triangle rectangle, on:\n• l'ombra ($12$ m) és el catet contigu a l'angle de $35^\\circ$;\n• l'altura de l'arbre és el catet oposat.\nOposat i contigu → tangent. L'altura es calcula així:\n$h=12\\cdot\\tan 35^\\circ$[/mat] [calc]Escriu $12$, [[tan]], $35$ i [[rpar]].\nNo cal el [[per]].[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $8.402490459$.[/calc] [mat]R) L'arbre fa aproximadament $8{,}4$ m d'altura.[/mat]",0]],"provaTu":{"enunciat":"Un fanal del carrer fa una ombra de $6$ m, quan els raigs del sol formen un angle de $40^\\circ$ amb el terra.\nQuina és l'altura del fanal?","solucio":"[mat]$h=6\\cdot\\tan 40^\\circ\\simeq 5{,}03$ m[/mat]\nR) El fanal fa aproximadament $5{,}03$ m d'altura."}},{"id":"ll4-7-38","bloc":"eso-trigonometria","titol":"L'escala dels bombers","enunciat":"Els bombers recolzen una escala de $5$ m a la paret d'un edifici. L'escala forma un angle de $60^\\circ$ amb el terra.\n\nA quina altura de la paret arriba l'escala?","font":"Llibre 4t ESO, unitat 7, exercici 38","passos":[["[mat]Podem formar un triangle rectangle, on:\n• la pròpia escala ($5$ m) és la hipotenusa;\n• l'altura a la qual arriba és el catet oposat a l'angle de $60^\\circ$.\nOposat i hipotenusa → sinus. L'altura es calcula així:\n$h=5\\cdot\\sin 60^\\circ$[/mat] [calc]Amb la D a la barra, escriu $5$, [[sen]], $60$ i [[rpar]].[/calc]",0],["[calc]Prem [[exe]]: obtens $\\frac{5\\sqrt{3}}{2}$.\nSi surt en forma d'arrel és perquè la calculadora està configurada per donar resultats exactes.\nSi estigués configurada per donar decimals, sortiria $4.330127019$.[/calc] [mat]$\\frac{5\\sqrt{3}}{2}\\simeq 4{,}33$ m[/mat]",0],["[calc]Per obtenir l'expressió decimal de l'arrel, prem [[shift]] [[exe]] (≈).\nObtens $4.330127019$.[/calc] [mat]R) L'escala arriba aproximadament a $4{,}33$ m d'altura.[/mat]",0]],"provaTu":{"enunciat":"L'estel de la Laia està lligat amb un fil de $20$ m, que forma un angle de $50^\\circ$ amb el terra.\nA quina altura vola l'estel?","solucio":"[mat]$h=20\\cdot\\sin 50^\\circ\\simeq 15{,}32$ m[/mat]\nR) L'estel vola aproximadament a $15{,}32$ m d'altura."}},{"id":"ll4-7-39","bloc":"eso-trigonometria","titol":"L'angle de l'escala","enunciat":"Per seguretat, una escala de mà ha de formar un angle d'uns $75^\\circ$ amb el terra. La Laia recolza una escala de $5$ m a la paret, amb la base a $1{,}5$ m de la paret.\n\nQuin angle forma l'escala amb el terra?","font":"Llibre 4t ESO, unitat 7, exercici 39","passos":[["[mat]Coneixem el catet contigu ($1{,}5$ m) i la hipotenusa ($5$ m): $\\cos\\alpha=\\frac{1{,}5}{5}$\nPer trobar l'angle, cal la funció inversa:\n$\\alpha=\\cos^{-1}(1{,}5\\div 5)$[/mat] [calc]Prem [[shift]] [[cos]] (a sobre hi ha Arccos), escriu $1.5$ [[entre]] $5$ i tanca amb [[rpar]].[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $72.54239688$.\nÉs en graus, perquè a la barra hi ha D.[/calc] [mat]R) L'escala forma un angle d'aproximadament $72{,}5^\\circ$ amb el terra, una mica menys del recomanat.[/mat]",0],["[calc]!!Error típic!!:\nSi oblides la tecla [[shift]]: [[cos]] $1.5$ [[entre]] $5$ [[rpar]].[/calc]",1],["[calc]Prem [[shift]] [[exe]] (≈): obtens $0.9999862922$.[/calc] [mat]La calculadora ha seguit les teves instruccions, però sense la funció inversa ha calculat un cosinus, no un angle. Un angle d'$1^\\circ$ voldria dir que l'escala està gairebé estirada a terra![/mat]",1]],"tancament":"[mat]Recorda:\n• Si vols trobar un angle a partir d'una raó, cal la funció inversa ([[shift]] [[cos]])\n\n$\\alpha=\\cos^{-1}(1{,}5\\div 5)\\simeq 72{,}5^\\circ$[/mat]","provaTu":{"enunciat":"Una rampa per a cadires de rodes fa $8$ m de llarg i puja una altura d'$1$ m.\nQuin angle forma la rampa amb el terra?","solucio":"[mat]$\\sin\\alpha=\\frac{1}{8}$\n$\\alpha=\\sin^{-1}(1\\div 8)\\simeq 7{,}2^\\circ$[/mat]\nR) La rampa forma un angle d'aproximadament $7{,}2^\\circ$ amb el terra."}}],"fx-570sp-cw":[{"id":"exacte-decimal","bloc":"exacte","titol":"Valor exacte i valor decimal","enunciat":"Calcula $\\sin 45^\\circ$ en forma exacta i també en forma decimal.","font":"","passos":[["[calc]Escriu $\\mathrm{sen}(45)$: [[sen]], el 45 i [[rpar]]. A la tecla de la calculadora, el sinus es diu sen; als enunciats en català, sin. La calculadora és en graus (D).[/calc]",0],["[calc]Prem [[exe]]. Com que la calculadora és en mode {{E Mat/S Mat}}, el resultat és el valor exacte, $\\frac{\\sqrt{2}}{2}$.[/calc] [mat]A la PAU, aquesta és la resposta.[/mat]",0],["[calc]La tecla [[format]] obre un menú per canviar com es mostra el resultat. La primera opció, {{Estándar}}, és la forma exacta.[/calc]",0],["[calc]Baixa fins a {{Decimal}} amb [[down]].[/calc]",0],["[calc]Prem [[ok]]. És el mateix nombre, però ara en decimal: 0.7071067812.[/calc]",0],["[calc]Per tornar a la forma exacta: [[format]] i [[ok]], perquè {{Estándar}} ja està triada.[/calc]",0],["[calc]Ara una drecera. Esborra amb [[ac]] i torna a escriure $\\mathrm{sen}(45)$.[/calc]",0],["[calc]En lloc de [[exe]], prem [[shift]] i després [[exe]] (a sobre d'EXE hi ha ≈): surt el resultat en decimal directament.[/calc]",0]],"araTu":{"enunciat":"Calcula $\\cos 30^\\circ$ en forma exacta i en forma decimal."}},{"id":"mode-decimal","bloc":"exacte","titol":"Em surt 0.5 en lloc d'1/2","enunciat":"Calcules $1\\div 2$ i la calculadora dona 0.5, mai fraccions .[/calc]",0],["[calc]Prem [[ok]]. El ◉ és a {{Grado sexag (D)}}: graus sexagesimals.[/calc]",0],["[calc]Baixa a {{Radián}}.[/calc]",0],["[calc]Prem [[ok]]: el ◉ passa a {{Radián}}.[/calc]",0],["[calc]Prem [[ac]] per tornar a calcular. A la barra ara hi ha R.[/calc]",0],["[calc]Escriu $\\mathrm{sen}(\\pi\\div 6)$. La π és [[shift]] [[7]]. A la calculadora, el sinus (sin) es diu sen.[/calc]",0],["[calc]Prem [[exe]]: $\\sin\\frac{\\pi}{6}=\\frac{1}{2}$. Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 0.5.[/calc]",0]],"araTu":{"enunciat":"Ara que la calculadora és en radians (R), calcula $\\cos\\frac{\\pi}{4}$."}},{"id":"error-angles","bloc":"angles","titol":"Troba l'error: el mode equivocat","enunciat":"La Laia calcula $\\cos\\frac{\\pi}{3}$, que hauria de ser $\\frac{1}{2}$, però la calculadora li dona aquest resultat: 0.9998329795.\nQuè ha passat?","font":"","passos":[["[calc]!!Error típic!!: el que ha fet la Laia, $\\cos(\\pi\\div 3)$ i [[exe]]. Surt 0.9998329795, i no $\\frac{1}{2}$.[/calc]",1],["[calc]Mira la barra: D. La calculadora ha entès «π/3 graus», un angle d'un grau escàs, i el seu cosinus és gairebé 1.[/calc]",1],["[calc]Ho arreglem: [[settings]], [[ok]] ({{Config cálculo}}), [[down]] ({{Unidad angular}}) i [[ok]].[/calc]",0],["[calc]Tria {{Radián}}: [[down]] i [[ok]].[/calc]",0],["[calc]Prem [[ac]]. Ara hi ha R.[/calc]",0],["[calc]El mateix càlcul dona $\\frac{1}{2}$. Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 0.5.[/calc]",0],["[calc]!!Error típic!!, el contrari: esborra amb [[ac]] i calcula $\\mathrm{sen}(30)$ en radians: és el sinus de 30 radians, −0.9880316241. Si el 30 són graus, la calculadora ha de ser en D.[/calc]",1]],"tancament":"[calc]Recorda: abans de calcular, mira la unitat dels angles a dalt de la pantalla: R si l'angle és en radians (per exemple, si porta π); D si és en graus.[/calc]","araTu":{"enunciat":"Amb la calculadora en radians (R a la barra), calcula $\\cos\\frac{2\\pi}{3}$."}},{"id":"graus-radians","bloc":"angles","titol":"Convertir de graus a radiants","enunciat":"Expressa en radiants un angle de $60^\\circ$.","font":"","passos":[["[mat]Per canviar d'unitats es multiplica per un factor de conversió que val 1: $\\frac{\\pi\\ \\mathrm{rad}}{180^\\circ}$, perquè $\\pi$ rad i $180^\\circ$ són el mateix angle.[/mat] [calc]Escriu 60 i [[per]].[/calc]",0],["[mat]$60^\\circ\\cdot\\frac{\\pi\\ \\mathrm{rad}}{180^\\circ}$: els graus que vols treure van al denominador i se simplifiquen amb els de dalt; només hi queden radiants.[/mat] [calc]Prem [[frac]], escriu π ([[shift]] [[7]]) al numerador i, amb [[down]], 180 al denominador.[/calc]",0],["[calc]Prem [[exe]]: obtens $\\frac{\\pi}{3}$. Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 1.047197551.[/calc] [mat]$60^\\circ=\\frac{\\pi}{3}$ rad.[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i escriu el factor capgirat, $\\frac{180}{\\pi}$.[/calc] [mat]$60^\\circ\\cdot\\frac{180^\\circ}{\\pi\\ \\mathrm{rad}}$: els graus queden a dalt tots dos cops i no se simplifiquen. El que surt ja no són radiants.[/mat]",1],["[calc]Prem [[shift]] [[exe]] (≈): surt 3437.746771.[/calc] [mat]No pot ser: 1 rad són uns $57^\\circ$, així que $60^\\circ$ ha de ser una mica més d'1 rad. El factor de conversió estava capgirat: no s'han simplificat els graus.[/mat]",1]],"tancament":"[mat]Recorda: al factor de conversió, al numerador hi va la unitat que vols ($\\pi$ rad) i al denominador la que vols treure ($180^\\circ$), perquè se simplifiqui.\n$60^\\circ=\\frac{\\pi}{3}$ rad.[/mat]","araTu":{"enunciat":"Expressa en radiants un angle de $135^\\circ$."}},{"id":"definir-fx","bloc":"pau","titol":"Defineix les funcions f(x) i g(x), i calcula'n valors","enunciat":"Sigui $f(x)=x^3-3x+2$. La funció derivada és $f'(x)=3x^2-3$.\nResolent l'equació $f'(x)=0$ has obtingut els punts crítics: $x=-1$ i $x=1$.\n\nTroba les coordenades del mínim relatiu R(x,y) i del màxim relatiu S(x,y).","font":"","passos":[["[calc]Defineix $f$ un sol cop. Prem [[funcio]] (FUNCTION), baixa fins a {{Definir f(x)}} i prem [[ok]].[/calc]",0],["[calc]Escriu $x^3-3x+2$. La $x$ és la tecla [[x]]; l'exponent és [[pot]] i, amb [[right]], en surts.[/calc]",0],["[calc]Prem [[exe]]: $f$ queda desada i tornes a la pantalla de càlcul.[/calc]",0],["[calc]Ara $g$, igual però triant {{Definir g(x)}}: [[funcio]], tres cops [[down]] i [[ok]].[/calc]",0],["[calc]Escriu $3x^2-3$. L'exponent 2 té tecla pròpia: [[x2]].[/calc]",0],["[calc]Prem [[exe]]: $f$ i $g$ ja són desades. No cal tornar-les a escriure.[/calc]",0],["[calc]Calcula $f(-1)$: [[funcio]], {{f(x)}} amb [[ok]] (escriu «f(»), $-1$, [[rpar]] i [[exe]]. Surt 4: el punt és $(-1,\\,4)$.[/calc]",0],["[mat]Igual amb $f(1)=0$: el punt és $(1,\\,0)$.[/mat]",0],["[calc]Per saber quin és el mínim, mira el signe de $g$ entre els dos punts: {{g(x)}} és la fila de sota de {{f(x)}}.[/calc] [mat]$g(0)=-3<0$, així que $f$ decreix de $x=-1$ a $x=1$: el màxim és $S(-1,\\,4)$ i el mínim és $R(1,\\,0)$. R és a l'eix $OX$ perquè $x=1$ és arrel doble de $f=(x-1)^2(x+2)$.[/mat]",0],["[mat]Com que ja tens $f$ i $g=f'$, la recta tangent és immediata. A $x=2$: $f(2)=4$ (el punt) i $g(2)=9$ (el pendent). La tangent és $y-4=9(x-2)$, és a dir, $y=9x-14$.[/mat]",0]],"araTu":{"enunciat":"Amb $f$ i $g=f'$ encara desades, troba la recta tangent a la gràfica de $f$ a $x=-2$."}},{"id":"barrow","bloc":"pau","titol":"Regla de Barrow amb f(x)","enunciat":"La superfície del terreny és $\\int_1^6 f(x)\\,dx-\\frac{25}{2}$, amb $f(x)=-x^3+7x^2-6x+5$ (el $\\frac{25}{2}$ és el triangle que no hi entra). A mà has trobat la primitiva $F(x)=-\\frac{x^4}{4}+\\frac{7x^3}{3}-3x^2+5x$. Calcula $F(6)-F(1)$ amb la calculadora.","font":"PAU juny 2024, qüestió 3 b)","passos":[["[calc]Defineix la primitiva $F$ com a $f(x)$: així l'escrius un sol cop. [[funcio]], baixa fins a {{Definir f(x)}} i [[ok]].[/calc]",0],["[calc]El ]].[/calc]",0],["[calc]Surt de la fracció amb [[right]], tanca amb [[rpar]] i escriu l'exponent amb [[pot]] i el 4.[/calc]",0],["[mat]I $(1-p)^2=\\left(\\frac{2}{3}\\right)^2$.[/mat] [calc]Surt de l'exponent amb [[right]] i fes el mateix: [[per]], $\\left(\\frac{2}{3}\\right)$ i l'exponent 2.[/calc]",0],["[calc]Prem [[exe]]: $P(X=4)=\\frac{20}{243}$, perquè $\\binom{6}{4}=15$. Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 0.08230452675. Al mateix menú hi ha {{Factorial(!)}} i {{Permutación(P)}}.[/calc]",0]],"araTu":{"enunciat":"Amb $n=8$ i $p=\\frac{1}{2}$, calcula $P(X=3)=\\binom{8}{3}\\left(\\frac{1}{2}\\right)^{8}$."}},{"id":"verificar","bloc":"pau","titol":"Comprova una igualtat","enunciat":"Comprova que es compleix aquesta igualtat: $\\dfrac{1}{\\sqrt{2}}=\\dfrac{\\sqrt{2}}{2}$.","font":"","passos":[["[calc]Prem [[tools]] (TOOLS): surt un menú amb {{Deshacer}}, {{Simplificar}} i {{Verificar ON}}.[/calc]",0],["[calc]Baixa dues files amb [[down]] fins a {{Verificar ON}} i prem [[ok]]: a dalt surt ✔. Compte: mentre Verificar és activat, la calculadora només serveix per verificar i l'historial s'esborra.[/calc]",0],["[calc]Escriu el primer membre: [[frac]], el 1, [[down]], [[arrel]] i el 2.[/calc]",0],["[calc]Surt de l'arrel i de la fracció amb dos [[right]] i prem [[catalog]]: ara hi ha {{Verificar}} a dalt de tot.[/calc]",0],["[calc]Prem [[ok]] per entrar a {{Verificar}} i [[ok]] un altre cop per triar el signe {{=}} (també hi ha $\\neq$, $>$, $<$, $\\geq$ i $\\leq$).[/calc]",0],["[calc]Escriu el segon membre: [[frac]], [[arrel]], el 2, [[right]] per sortir de l'arrel, [[down]] i el 2.[/calc]",0],["[calc]Prem [[exe]]: {{Verdadero}}. Si no fos cert, diria {{Falso}}. Compte: ara [[ans]] val 1 (o 0 si és fals), i si verifiques una solució arrodonida pot sortir {{Falso}} encara que sigui bona.[/calc]",0],["[calc]Quan acabis, desactiva-ho: [[tools]], baixa a {{Verificar OFF}} amb [[down]] (la primera fila és {{Deshacer}}) i [[ok]]. El ✔ desapareix i la calculadora torna a calcular amb normalitat.[/calc]",0]],"araTu":{"enunciat":"Comprova amb {{Verificar}} que $\\sqrt{12}=2\\sqrt{3}$."}},{"id":"producte-escalar-vectorial","bloc":"pau","titol":"Producte escalar i producte vectorial","enunciat":"Siguin $\\vec u=(2,-1,3)$ i $\\vec v=(1,4,-2)$.\nCalcula el producte escalar $\\vec u\\cdot\\vec v$ i el producte vectorial $\\vec u\\times\\vec v$.","font":"","passos":[["[mat]$\\vec u\\cdot\\vec v=u_1v_1+u_2v_2+u_3v_3$.[/mat] [calc]Escriu-ho en una sola línia. Els nombres negatius, entre parèntesis; el signe és [[menys]].[/calc]",0],["[calc]Prem [[exe]].[/calc] [mat]$\\vec u\\cdot\\vec v=-8$.[/mat]",0],["[mat]Al producte vectorial, cada component és un determinant 2×2. La primera és $u_2v_3-u_3v_2=-10$.[/mat] [calc]Escriu-la i prem [[exe]]: després d'un resultat, un número nou comença un càlcul nou.[/calc]",0],["[mat]La segona, $u_3v_1-u_1v_3=7$.[/mat]",0],["[mat]La tercera, $u_1v_2-u_2v_1=9$. Per tant, $\\vec u\\times\\vec v=(-10,\\,7,\\,9)$.[/mat]",0]]},{"id":"pau-alg-24j-q2","bloc":"pau-ag","titol":"(2024). Comprova la solució d'un sistema","enunciat":"Per a $k=0$, el sistema és $$\\begin{cases}4x+2y-z=4\\\\ x-y=3\\\\ 3x+3y=1\\end{cases}$$ i has obtingut la solució $$x=\\frac{5}{3},\\qquad y=-\\frac{4}{3},\\qquad z=0.$$ Comprova que la solució trobada és correcta amb la calculadora.","font":"PAU juny 2024, qüestió 2 a)","passos":[["[calc]Primera equació, $4x+2y-z$: escriu $4\\times\\frac{5}{3}+2\\times\\left(-\\frac{4}{3}\\right)-0$. Posa $y$ entre parèntesis; el signe negatiu és la tecla [[menys]] de sempre.[/calc]",0],["[calc]Prem [[exe]]: surt 4, que és el membre de la dreta. ✓[/calc]",0],["[calc]Segona equació, $x-y$ (amb $k=0$, el terme $kz$ no hi és): escriu $\\frac{5}{3}-\\left(-\\frac{4}{3}\\right)$. No cal esborrar res: en començar a escriure, el càlcul anterior desapareix.[/calc]",0],["[calc]Prem [[exe]]: surt 3, el membre de la dreta. ✓[/calc]",0],["[calc]Tercera equació, $3x+3y$: escriu $3\\times\\frac{5}{3}+3\\times\\left(-\\frac{4}{3}\\right)$.[/calc]",0],["[calc]Prem [[exe]]: surt 1, el membre de la dreta. ✓ Es compleixen les tres equacions: la solució és correcta.[/calc]",0]],"grup":"Àlgebra"},{"id":"pau-alg-24s-q2","bloc":"pau-ag","titol":"(2024). Un menor orlat amb la regla de Sarrus","enunciat":"Per a $m=1$, el rang de la matriu $A$ és 2. Per saber el rang de la matriu ampliada $A'$, calcula amb la regla de Sarrus el menor d'ordre 3 de les columnes de $x$, de $y$ i dels termes independents: $$A'=\\left(\\begin{array}{rrr|r}1&-3&1&-2\\\\1&1&2&3\\\\1&1&2&1\\end{array}\\right)\\qquad\\begin{vmatrix}1&-3&-2\\\\1&1&3\\\\1&1&1\\end{vmatrix}$$","font":"PAU setembre 2024, qüestió 2 a)","passos":[["[mat]El primer claudàtor de Sarrus són els tres productes amb signe +.[/mat] [calc]Escriu $1\\times 1\\times 1+(-3)\\times 3\\times 1+(-2)\\times 1\\times 1$, cada factor tal com és a la matriu. Els negatius, entre parèntesis i amb la tecla [[menys]].[/calc]",0],["[calc]Prem [[exe]]: el primer claudàtor val −10.[/calc]",0],["[calc]Ara resta-hi el segon claudàtor, el dels tres productes amb signe −: [[ans]] (el −10), [[menys]] i els tres productes entre parèntesis.[/calc] [mat]Sense aquest parèntesi, el − només afectaria el primer producte.[/mat]",0],["[calc]Prem [[exe]]: el menor val $-8\\neq 0$.[/calc] [mat]Per tant, el rang de la matriu $A'$ és 3 i, com que el de la matriu $A$ és 2, per a $m=1$ el sistema és incompatible.[/mat]",0]],"grup":"Àlgebra"},{"id":"pau-geo-25s-q4b","bloc":"pau-ag","titol":"(2025). Distància d'un punt a un pla","enunciat":"Considereu el pla $\\pi: 2x-y+z=5$ i el punt $P=(0,1,3)$.\nComproveu que la distància de $P$ a $\\pi$ és $\\frac{\\sqrt{6}}{2}$. $$d(P,\\pi)=\\frac{|2\\cdot 0-1+3-5|}{\\sqrt{2^2+(-1)^2+1^2}}$$","font":"PAU setembre 2025, exercici 4 B a)","passos":[["[mat]Primer, el numerador: substitueix $P$ a $2x-y+z-5$.[/mat] [calc]Escriu $2\\times 0-1+3-5$.[/calc]",0],["[calc]Prem [[exe]]: surt −3.[/calc] [mat]El valor absolut el fas tu: $|-3|=3$.[/mat]",0],["[calc]Ara la distància: la fracció [[frac]] amb el 3 a dalt; [[down]] i, a baix, l'arrel [[arrel]] de $2^2+(-1)^2+1^2$. El quadrat és [[x2]]. El −1, entre parèntesis: [[lpar]] [[menys]] 1 [[rpar]].[/calc]",0],["[calc]Prem [[exe]]: surt $\\frac{\\sqrt{6}}{2}$, el valor de l'enunciat. ✓ En mode {{E Mat/S Mat}} la calculadora racionalitza sola; en mode decimal sortiria 1.224744871 i no ho podries comparar.[/calc]",0]],"grup":"Geometria"},{"id":"pau-geo-25s-q4b-c","bloc":"pau-ag","titol":"(2025). El punt simètric respecte d'un pla","enunciat":"Considereu el pla $\\pi: 2x-y+z=5$ i el punt $P=(0,1,3)$.\n- Trobeu un pla $\\pi_2$ paral·lel a $\\pi$, que no passi per $P$, a una distància $\\frac{\\sqrt{6}}{2}$ de $\\pi$. Aquest pla passarà pel punt simètric $P'$ de $P$.\n- A més, sabem que la recta perpendicular a $\\pi$ per $P$, $(2\\lambda,\\,1-\\lambda,\\,3+\\lambda)$, talla el pla per a $\\lambda=\\frac{1}{2}$, al punt $M=\\left(1,\\frac{1}{2},\\frac{7}{2}\\right)$.","font":"PAU setembre 2025, exercici 4 B c)","passos":[["[mat]Primer, comprova que el punt $M$ és al pla: substitueix-lo a $2x-y+z$.[/mat] [calc]Escriu $2\\times 1-\\frac{1}{2}+\\frac{7}{2}$, amb [[frac]] per a les fraccions i [[right]] per sortir-ne.[/calc]",0],["[calc]Prem [[exe]]: surt 5, el terme independent del pla. ✓ El punt $M$ és el punt del pla $\\pi$ més proper a $P$.[/calc]",0],["[mat]El punt $M$ és el punt mitjà de $P$ i $P'$, així que $P'=2M-P$.[/mat] [calc]Les dues primeres coordenades són $2\\cdot 1-0=2$ i $2\\cdot\\frac{1}{2}-1=0$; la tercera, amb la calculadora: $2\\times\\frac{7}{2}-3=4$.[/calc] [mat]Per tant, $P'=(2,\\,0,\\,4)$.[/mat]",0],["[mat]Comprova que el punt $P'$ és a una distància $\\frac{\\sqrt{6}}{2}$ del pla $\\pi$. El numerador de la fórmula: substitueix $P'$ a $2x-y+z-5$.[/mat] [calc]Surt 3.[/calc]",0],["[calc]Ara la fracció: el 3 a dalt i, a baix, l'arrel de $2^2+(-1)^2+1^2$, com a l'apartat a).[/calc]",0],["[calc]Prem [[exe]]: $\\frac{\\sqrt{6}}{2}$. ✓ El punt $P'$ és a la mateixa distància del pla que $P$, a l'altra banda.[/calc] [calc](Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 1.224744871.)[/calc]",0],["[mat]El pla $\\pi_2$ és $2x-y+z=E$ amb $E=2\\cdot 2-0+4=8$: $\\pi_2: 2x-y+z=8$.[/mat]",0]],"grup":"Geometria"},{"id":"pau-geo-26j2-q4b","bloc":"pau-ag","titol":"(2026). Distàncies en centímetres","enunciat":"Un braç robòtic desplaça un sensor en línia recta des del punt $A=(1,2,3)$ fins al punt $B=(5,3,7)$, per damunt del pla $\\pi$, d'equació general $x-y-5=0$.\n[a]4.1. Quina distància ha recorregut el sensor?\n[/a] [b]4.2. En acabar el moviment, a quina distància del pla es troba el sensor?[/b]\nExpressa el resultat en centímetres.","font":"PAU juny 2026 (sèrie 5), exercici 4 B","passos":[["[mat]4.1. El vector $\\vec{AB}=(4,1,4)$, i la distància és el seu mòdul.[/mat] [calc]Escriu [[arrel]] i, a dins, $4^2+1^2+4^2$: el quadrat és [[x2]].[/calc]",0],["[calc]Prem [[exe]]: $\\sqrt{33}$, el valor exacte, perquè la calculadora és en mode {{E Mat/S Mat}}. En mode {{E Mat/S Decimal}} sortiria directament 5.744562647.[/calc]",0],["[calc]Com que és una longitud en centímetres, dona'n també el decimal: [[format]], {{Decimal}} amb [[down]] i [[ok]].[/calc] [mat]El sensor ha recorregut $\\sqrt{33}\\approx 5{,}74$ cm.[/mat]",0],["[mat]4.2. La distància del punt $B$ al pla. Primer, el numerador: substitueix $B$ a $x-y-5$, és a dir, $5-3-5$.[/mat] [calc]Surt −3; el valor absolut el fas tu: 3.[/calc]",0],["[calc]Ara la fracció: [[frac]] amb el 3 a dalt i, a baix, l'arrel de $1^2+(-1)^2+0^2$. El −1, entre parèntesis.[/calc]",0],["[calc]Prem [[exe]]: $\\frac{3\\sqrt{2}}{2}$. La calculadora ja racionalitza.[/calc]",0],["[calc]En decimal, amb [[format]] i {{Decimal}}: el sensor és a $\\frac{3\\sqrt{2}}{2}\\approx 2{,}12$ cm del pla.[/calc]",0]],"grup":"Geometria"},{"id":"pau-ana-23s-q4","bloc":"pau-ap","titol":"(2023). Bolzano amb la e","enunciat":"Sigui $f(x)=-3x+e^{2x}-1$.\nJustifiqueu que l'equació $f(x)=2$ té una solució a l'interval $(-1,\\,0)$.","font":"PAU setembre 2023, qüestió 4 a)","passos":[["[calc]Defineix $f$: [[funcio]], dos cops [[down]] fins a {{Definir f(x)}} i [[ok]]. La $e$ és [[shift]] [[8]]; l'exponent, amb [[pot]]: escriu $2x$ i surt de l'exponent amb [[right]] abans del $-1$.[/calc]",0],["[calc]Prem [[exe]]: $f$ queda desada i tornes a la pantalla de càlcul.[/calc]",0],["[calc]Calcula $f(-1)$: [[funcio]], {{f(x)}} amb [[ok]], $-1$, [[rpar]] i [[exe]].[/calc] [mat]$f(-1)\\approx 2{,}135>2$.[/mat]",0],["[mat]$f(0)=0<2$. La funció $g(x)=f(x)-2$ és contínua, $g(-1)>0$ i $g(0)<0$: pel teorema de Bolzano, hi ha un $c\\in(-1,\\,0)$ amb $f(c)=2$. ✓[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i calcula $f(-1)$ sortint de l'exponent amb [[right]] abans de la $x$: la calculadora fa $e^2\\cdot(-1)$ en lloc d'$e^{-2}$.[/calc] [mat]No pot ser: $e^{-2}$ és positiu i petit, i $f(-1)$ ha de ser una mica més gran que 2.[/mat]",1]],"grup":"Anàlisi","tancament":"[mat]Recorda: tot l'exponent, $2x$, ha d'anar a l'exponent: $e^{2x}$. Així, $f(-1)\\approx 2{,}135>2$ i $f(0)=0<2$.[/mat]"},{"id":"pau-ana-24i-q1","bloc":"pau-ap","titol":"(2024). Bolzano amb la calculadora","enunciat":"Considereu $f(x)=-2+10(x-1)\\ln x$, per a $x>0$.\nComproveu que $f$ té una arrel a l'interval $[1;\\,1{,}5]$ i busqueu un interval d'una dècima de longitud que també la contingui.","font":"PAU juny 2024 (incidències), qüestió 1 a)","passos":[["[calc]Hauràs de calcular $f$ en diversos punts: defineix-la un sol cop. Prem [[funcio]] (FUNCTION).[/calc]",0],["[calc]Baixa fins a {{Definir f(x)}} i prem [[ok]].[/calc]",0],["[calc]Escriu $-2+10(x-1)\\ln(x)$. La $x$ és la tecla [[x]], i ln és [[shift]] [[logab]].[/calc]",0],["[calc]Prem [[exe]]: $f$ queda desada i tornes a la pantalla de càlcul.[/calc]",0],["[calc]Calcula $f(1)$: [[funcio]], {{f(x)}} amb [[ok]] (escriu «f(»), l'1 i tanca el parèntesi.[/calc]",0],["[calc]Prem [[exe]]: $f(1)=-2<0$.[/calc]",0],["[calc]Ara $f(1{,}5)$, igual.[/calc]",0],["[mat]$f(1{,}5)\\approx 0{,}0273>0$. Com que $f$ és contínua a $[1;\\,1{,}5]$ i canvia de signe, pel teorema de Bolzano hi ha una arrel. ✓[/mat]",0],["[mat]$f(1{,}5)$ és molt a prop de 0: l'arrel deu ser a prop d'1,5. Prova $f(1{,}4)$.[/mat]",0],["[mat]$f(1{,}4)\\approx -0{,}654<0$: hi ha canvi de signe a $[1{,}4;\\,1{,}5]$, un interval d'una dècima. ✓[/mat]",0]],"grup":"Anàlisi"},{"id":"pau-ana-25i-q4a","bloc":"pau-ap","titol":"(2025). Una arrel cúbica en una optimització","enunciat":"Una ampolla de perfum té una part cilíndrica de $100\\,\\text{cm}^3$, de radi $r$ i altura $h=\\frac{100}{\\pi r^2}$.\nLa seva superfície total és $S(r)=3\\pi r^2+\\frac{200}{r}$.\n\nHas calculat $S'(r)$, i la solució de l'equació $S'(r)=0$ és $r^3=\\frac{100}{3\\pi}$.\n\nCalcula les dimensions de l'ampolla i la superfície mínima.","font":"PAU juny 2025 (incidències), exercici 4 A b)","passos":[["[mat]El radi és $r=\\sqrt[3]{\\frac{100}{3\\pi}}$.[/mat] [calc]Prem [[shift]] [[arrel]] (arrel d'índex n), escriu l'índex 3 i, amb [[right]], passa al radicand: la fracció $\\frac{100}{3\\pi}$ amb [[frac]] (π és [[shift]] [[7]]).[/calc]",0],["[calc]És una longitud: demana el decimal amb [[shift]] [[exe]] (≈). El radi és $r\\approx 2{,}20$ cm, i la calculadora el desa a [[ans]] amb tots els decimals.[/calc]",0],["[calc]L'altura, $h=\\frac{100}{\\pi r^2}$, sense copiar el radi: [[frac]], el 100, [[down]], π, [[ans]] i [[x2]].[/calc]",0],["[calc]Amb [[shift]] [[exe]]: l'altura és $h\\approx 6{,}59$ cm.[/calc]",0],["[calc]Ara [[ans]] ja és l'altura: per a $S(r)$, escriu el radi amb quatre decimals, 2.1974. Amb [[shift]] [[exe]], la superfície mínima és $S\\approx 136{,}52\\,\\text{cm}^2$.[/calc]",0]],"grup":"Anàlisi"},{"id":"pau-ana-25j-q1","bloc":"pau-ap","titol":"(2025). Intueix els límits amb f(x)","enunciat":"Considereu la funció $f(x)=\\dfrac{x^2-2x}{x-1}$.\n\nAbans de calcular-ne les asímptotes, fes-te una idea dels límits amb la calculadora:\n- (a.verticals) Assigna valors de $x$ molt propers a 1, per la dreta i per l'esquerra.\n- (a.horitzontals) Assigna valors de $x$ molt grans, tant positius com negatius.","font":"PAU juny 2025, exercici 1 a)","passos":[["[calc]Defineix $f$ un sol cop: [[funcio]], dos cops [[down]] fins a {{Definir f(x)}} i [[ok]]. Escriu la fracció amb [[frac]]: a dalt $x^2-2x$, [[down]] i, a baix, $x-1$.[/calc]",0],["[calc]Prem [[exe]]: $f$ queda desada i tornes a la pantalla de càlcul.[/calc]",0],["[mat]Valors una mica més grans que 1: $f(1{,}1)$.[/mat] [calc][[funcio]], {{f(x)}} amb [[ok]], 1.1 i [[rpar]]. Per veure com creix, el vols en decimal: [[shift]] [[exe]]. Surt −9.9.[/calc]",0],["[mat]$f(1{,}01)=-99{,}99$: com més a prop d'1, més negatiu. Per tant, $\\lim\\limits_{x\\to 1^+}f(x)=-\\infty$.[/mat]",0],["[mat]Ara per l'esquerra, amb valors una mica més petits que 1: $f(0{,}9)=9{,}9$.[/mat]",0],["[mat]$f(0{,}99)=99{,}99$, així que $\\lim\\limits_{x\\to 1^-}f(x)=+\\infty$. Els dos límits laterals són infinits: la recta $x=1$ és una asímptota vertical.[/mat]",0],["[mat]Ara valors de $x$ molt grans: $f(200)\\approx 198{,}99$.[/mat]",0],["[mat]$f(201)=199{,}995$: $\\lim\\limits_{x\\to+\\infty}f(x)=+\\infty$, i no hi ha asímptota horitzontal. A més, quan $x$ augmenta 1, $f(x)$ també augmenta gairebé 1: pot haver-hi una asímptota obliqua de pendent 1.[/mat]",0],["[mat]I valors molt negatius: $f(-200)\\approx -200{,}995$.[/mat]",0],["[mat]$f(-201)\\approx -201{,}995$: $\\lim\\limits_{x\\to-\\infty}f(x)=-\\infty$. Ara ja pots calcular el pendent $m$ i l'ordenada a l'origen $n$ de l'asímptota obliqua: surt $y=x-1$. Fixa't que $f(200)\\approx 200-1$.[/mat]",0]],"grup":"Anàlisi"},{"id":"pau-ana-25s-q4a","bloc":"pau-ap","titol":"(2025). Un vitrall en radians","enunciat":"Un vitrall de la Sagrada Família està limitat per:\n- les gràfiques de $y=3\\sin\\frac{x}{4}$ i $y=3\\cos\\frac{x}{4}$\n- des de l'eix d'ordenades fins al primer punt de tall $C$, que té $x=\\pi$.\n[a]a) Calculeu les coordenades del punt $C$.\n[/a] [b]b) Calculeu el preu del vitrall, a 750 € el m²\n\nNota: l'àrea és $\\left[12\\sin\\frac{x}{4}+12\\cos\\frac{x}{4}\\right]_0^{\\pi}$.[/b]","font":"PAU setembre 2025, exercici 4 A","passos":[["[calc]El sinus i el cosinus són d'una $x$ en metres, no d'un angle en graus: posa la calculadora en radians. [[settings]], [[ok]], [[down]] ({{Unidad angular}}), [[ok]], [[down]] ({{Radián}}), [[ok]] i [[ac]]. A la barra, R.[/calc]",0],["[mat]a) La segona coordenada del punt $C$ és $3\\sin\\frac{\\pi}{4}$.[/mat] [calc]Escriu el 3, [[sen]] i la fracció $\\frac{\\pi}{4}$ amb [[frac]] (π és [[shift]] [[7]]); surt de la fracció amb [[right]] i tanca amb [[rpar]].[/calc]",0],["[calc]Prem [[exe]]: $C=\\left(\\pi,\\frac{3\\sqrt{2}}{2}\\right)$.[/calc] [mat]I $B=(0,3)$, perquè $3\\cos 0=3$.[/mat] [calc]Surt exacte perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 2.121320344.[/calc]",0],["[mat]b) Regla de Barrow: $F(\\pi)-F(0)$. Com que $\\sin 0=0$ i $\\cos 0=1$, $F(0)=12$.[/mat] [calc]Escriu $12\\sin\\frac{\\pi}{4}+12\\cos\\frac{\\pi}{4}-12$.[/calc]",0],["[calc]Per al preu cal un decimal: prem [[shift]] [[exe]] (≈).[/calc] [mat]L'àrea és $12(\\sqrt{2}-1)\\approx 4{,}97\\,\\text{m}^2$.[/mat]",0],["[calc]Ara [[per]] 750: després d'un resultat, el càlcul comença amb Ans, sense arrodonir. Amb [[shift]] [[exe]], el preu del vitrall és de $3.727{,}92$ €.[/calc]",0]],"grup":"Anàlisi"},{"id":"pau-ana-26j-q4a","bloc":"pau-ap","titol":"(2026). Dues baranes: π, ≈ i Ans","enunciat":"Dues baranes fan 10 m en total: la d'un espai circular i la d'un espai quadrat.\nSi la barana del cercle fa $x$ metres, la suma de les dues superfícies és $S(x)=\\frac{x^2}{4\\pi}+\\left(\\frac{10-x}{4}\\right)^2$.\nAmb la derivada has trobat $x=\\frac{10\\pi}{\\pi+4}$.\n\nCalcula la longitud de cada barana i la superfície mínima.","font":"PAU juny 2026, exercici 4 A","passos":[["[calc]Escriu $x$ amb [[frac]]: a dalt $10\\pi$ (π és [[shift]] [[7]]), [[down]] i, a baix, $\\pi+4$.[/calc]",0],["[calc]És una longitud: demana el decimal amb [[shift]] [[exe]] (≈).[/calc] [mat]La barana del cercle fa 4,40 m.[/mat] [calc]La calculadora la desa a [[ans]] amb tots els decimals.[/calc]",0],["[calc]La del quadrat és $10-\\mathrm{Ans}$: escriu 10, [[menys]], [[ans]] i prem [[exe]].[/calc] [mat]La barana del quadrat fa 5,60 m.[/mat]",0],["[mat]Ara [[ans]] és la barana del quadrat, i la del cercle és $10-\\mathrm{Ans}$.[/mat] [calc]Escriu $S$ amb [[ans]], sense copiar cap decimal: $\\frac{(10-\\mathrm{Ans})^2}{4\\pi}+\\left(\\frac{\\mathrm{Ans}}{4}\\right)^2$.[/calc]",0],["[calc]Prem [[shift]] [[exe]] (≈).[/calc] [mat]La superfície mínima és $S\\approx 3{,}50\\,\\text{m}^2$.[/mat]",0]],"grup":"Anàlisi"},{"id":"pau-pro-26j2-q3","bloc":"pau-ap","titol":"(2026). Màxim i mínim absoluts en un interval","enunciat":"L'Alba dedica cada setmana $x$ hores a llegir, entre 1 i 6, i $y$ hores a fer esport, amb $y=7-x+\\ln(2x-1)$.\nAmb la derivada has trobat que l'únic punt crític és $x=1{,}5$.\n\nCalcula el màxim i el mínim d'hores d'esport.","font":"PAU juny 2026 (sèrie 5), exercici 3.3","passos":[["[calc]Calcularàs $y$ en tres punts: defineix-la un sol cop com a $f(x)$. [[funcio]], dos cops [[down]] fins a {{Definir f(x)}} i [[ok]].[/calc]",0],["[calc]Escriu $7-x+\\ln(2x-1)$. La $x$ és la tecla [[x]], i ln és [[shift]] [[logab]].[/calc]",0],["[calc]Prem [[exe]]: $f$ queda desada i tornes a la pantalla de càlcul.[/calc]",0],["[mat]En un interval tancat, el màxim i el mínim absoluts són al punt crític o als extrems de l'interval: cal $f(1)$, $f(1{,}5)$ i $f(6)$.[/mat] [calc][[funcio]], {{f(x)}} amb [[ok]], l'1, [[rpar]] i [[exe]]: $f(1)=6$.[/calc]",0],["[calc]Ara $f(1{,}5)$, igual.[/calc] [mat]$f(1{,}5)\\approx 6{,}193$.[/mat]",0],["[mat]$f(6)\\approx 3{,}398$. El màxim és de 6,19 h d'esport (amb $x=1{,}5$), i el mínim, de 3,40 h (amb $x=6$).[/mat]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i calcula $y(6)$ escrivint ln amb la tecla log ([[shift]] [[x2]]): surt 2.041392685 i no 3.397895273.[/calc] [mat]log és el logaritme en base 10, no el neperià.[/mat]",1]],"grup":"Anàlisi","tancament":"[mat]Recorda: $\\ln$ és el logaritme neperià, i log és el logaritme en base 10. El màxim és de 6,19 h i el mínim, de 3,40 h.[/mat]"},{"id":"pau-ana-26s-q1","bloc":"pau-ap","titol":"(2026). Creixement i extrems amb f(x) i g(x)","enunciat":"Considereu la funció $f(x)=\\dfrac{5x}{x^2+1}$.\nHas trobat la derivada, $f'(x)=\\dfrac{5(1-x^2)}{(x^2+1)^2}$, que s'anul·la a $x=-1$ i a $x=1$.\n\nEstudia el creixement i els extrems relatius de $f$.","font":"PAU setembre 2026, exercici 1.1","passos":[["[calc]La funció, sempre a $f(x)$: [[funcio]], dos cops [[down]] fins a {{Definir f(x)}}, [[ok]] i la fracció amb [[frac]].[/calc]",0],["[calc]Prem [[exe]]: $f$ queda desada.[/calc]",0],["[calc]La derivada, sempre a $g(x)$: [[funcio]], tres cops [[down]] fins a {{Definir g(x)}} i [[ok]]. Escriu la fracció.[/calc]",0],["[calc]Prem [[exe]]: $g$ queda desada.[/calc]",0],["[mat]Per saber el signe de $f'$ a $(-\\infty,-1)$, n'hi ha prou amb un punt: $g(-2)=-\\frac{3}{5}<0$, i $f$ decreix.[/mat] [calc]$g(x)$ és la segona del menú: [[funcio]], [[down]] i [[ok]]. Surt una fracció perquè la calculadora és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria −0.6.[/calc]",0],["[mat]$g(0)=5>0$: $f$ creix a $(-1,\\,1)$.[/mat]",0],["[mat]$g(2)=-\\frac{3}{5}<0$: $f$ decreix a $(1,+\\infty)$.[/mat]",0],["[mat]A $x=-1$, $f$ passa de decréixer a créixer: hi ha un mínim relatiu a $\\left(-1,-\\frac{5}{2}\\right)$.[/mat]",0],["[mat]A $x=1$, passa de créixer a decréixer: hi ha un màxim relatiu a $\\left(1,\\frac{5}{2}\\right)$.[/mat]",0]],"grup":"Anàlisi"},{"id":"pau-pro-24i-q4","bloc":"pau-ap","titol":"(2024). Probabilitat total, Bayes i binomial","enunciat":"La Rut tira un dau.\n- si surt 1, 2, 3 o 4, resol el problema ella mateixa i l'encerta el 75 % de les vegades\n- si surt 5 o 6, el copia d'Internet i l'encerta el 40 %.\nCalcula:\n[a]a) Probabilitat que la solució sigui correcta.\n[/a] [b]b) Probabilitat que l'hagi resolt ella si és correcta.\n[/b] [c]c) Probabilitat que, de 5 problemes, almenys 4 siguin correctes.[/c]","font":"PAU juny 2024 (incidències), qüestió 4","passos":[["[mat]a) Probabilitat total: $P(C)=\\frac{4}{6}\\cdot 0{,}75+\\frac{2}{6}\\cdot 0{,}4$.[/mat] [calc]Escriu-ho tal qual, amb fraccions i decimals.[/calc]",0],["[calc]Prem [[exe]]: $P(C)=\\frac{19}{30}$. La calculadora dona la fracció exacta, encara que hagis escrit decimals, perquè és en mode {{E Mat/S Mat}}; en mode {{E Mat/S Decimal}} sortiria 0.6333333333.[/calc]",0],["[mat]b) Bayes: $P(R\\mid C)=\\dfrac{\\frac{4}{6}\\cdot 0{,}75}{P(C)}$.[/mat] [calc]Escriu $\\left(\\frac{4}{6}\\times 0.75\\right)\\div\\frac{19}{30}$.[/calc]",0],["[calc]Prem [[exe]]: $P(R\\mid C)=\\frac{15}{19}$.[/calc]",0],["[mat]c) Binomial, amb $n=5$ i $p=\\frac{19}{30}$: $P(X\\ge 4)=5\\,p^4(1-p)+p^5$, perquè $\\binom{5}{4}=5$ i $1-p=\\frac{11}{30}$.[/mat] [calc]La potència és [[pot]]; amb [[right]] surts de l'exponent.[/calc]",0],["[calc]Prem [[exe]]: $P(X\\ge 4)\\approx 0{,}3969$. La fracció exacta tindria massa xifres, i la calculadora la dona en decimal.[/calc]",0],["[calc]!!Error típic!!: esborra amb [[ac]] i, si arrodoneixes $p\\approx 0{,}63$, surt 0.3906734328 i no 0.3968623045: ja falla la segona xifra decimal. Treballa amb $\\frac{19}{30}$.[/calc]",1]],"grup":"Probabilitat","tancament":"[mat]Recorda: treballa amb el valor exacte, $p=\\frac{19}{30}$, i no amb un decimal arrodonit: $P(X\\ge 4)\\approx 0{,}3969$.[/mat]"},{"id":"pau-pro-24s-q4","bloc":"pau-ap","titol":"(2024). Binomial, probabilitat total i Bayes","enunciat":"El 20 % dels habitants d'una regió pateix arrítmia. Un monitor Holter la detecta en el 95 % dels qui la pateixen, i dona falsos positius en el 0,5 % dels qui no en pateixen. \nCalcula el següent:\n[a]a) Si prenem 4 persones a l'atzar, probabilitat que almenys una pateixi arrítmia.\n[/a] [b]b) Probabilitat total d'obtenir un diagnòstic positiu.\n[/b] [c]c) Si el diagnòstic és negatiu, probabilitat que la persona pateixi arrítmia.[/c]","font":"PAU setembre 2024, qüestió 4","passos":[["[mat]a) El nombre de persones amb arrítmia segueix una binomial $B(4;\\,0{,}2)$. «Almenys una» és l'esdeveniment contrari de «cap»: $1-0{,}8^4$.[/mat] [calc]L'exponent és [[pot]].[/calc]",0],["[calc]Prem [[shift]] [[exe]]: 0.5904. Amb [[exe]] sortiria la fracció $\\frac{369}{625}$, perquè la calculadora és en mode {{E Mat/S Mat}} i has escrit decimals exactes.[/calc]",0],["[mat]b) Probabilitat total. Hi ha dues maneres de donar positiu: amb arrítmia ($0{,}2$ i $0{,}95$) o sense ($0{,}8$ i $0{,}005$).[/mat] [calc]Escriu $0.95\\times 0.2+0.005\\times 0.8$.[/calc]",0],["[calc]Amb [[shift]] [[exe]]: la probabilitat d'un diagnòstic positiu és 0,194.[/calc]",0],["[mat]c) Bayes: tenir arrítmia i donar negatiu, $0{,}2\\cdot(1-0{,}95)$, dividit per la probabilitat d'un negatiu, $1-0{,}194$.[/mat] [calc]El 0.194 és a [[ans]]: no cal copiar-lo. El denominador, entre parèntesis.[/calc]",0],["[calc]Prem [[shift]] [[exe]]: $\\approx 0{,}0124$.[/calc] [mat]Només l'1,24 % de les persones que donen negatiu pateixen arrítmia.[/mat]",0]],"grup":"Probabilitat"},{"id":"pau-pro-25j-q3","bloc":"pau-ap","titol":"(2025). Probabilitat total i un màxim","enunciat":"El 60 % de les peces d'una empresa són de ferro i la resta, d'acer. El 95 % de les peces de ferro no tenen cap defecte, i el 3 % de les d'acer són defectuoses.\nCalcula:\n[a]a) Probabilitat que una peça a l'atzar sigui defectuosa.\n[/a] [c]b) Valor màxim de la funció $f(p)=5(p^4-p^5)$ per a $p\\ge 0$ (nota: amb la derivada has trobat que el màxim és a $p=\\frac{4}{5}$).[/c]","font":"PAU juny 2025, exercici 3","passos":[["[mat]a) De les peces de ferro, en són defectuoses el 5 % (100 − 95).[/mat] [calc]Probabilitat total; escriu $0.05\\times 0.6+0.03\\times 0.4$.[/calc]",0],["[calc]Prem [[shift]] [[exe]]: 0.042, és a dir, un 4,2 % de les peces són defectuoses.[/calc]",0],["[mat]c) El valor màxim és $f\\left(\\frac{4}{5}\\right)$.[/mat] [calc]Com que $\\frac{4}{5}=0{,}8$, escriu $5\\times(0.8^4-0.8^5)$. Després de cada exponent, surt-ne amb [[right]].[/calc]",0],["[calc]Prem [[exe]]: $\\frac{256}{625}$, el valor exacte del màxim, perquè la calculadora és en mode {{E Mat/S Mat}}. En mode {{E Mat/S Decimal}} sortiria 0.4096, és a dir, $\\approx 0{,}41$.[/calc]",0]],"grup":"Probabilitat"},{"id":"abans-examen","bloc":"examen","titol":"Comprova la calculadora en 30 segons","enunciat":"Abans de començar l'examen, comprova que la calculadora està ben configurada.","font":"","passos":[["[calc]Calcula $1\\div 2$: ha de sortir $\\frac{1}{2}$, perquè la calculadora ha de ser en mode {{E Mat/S Mat}}, el que dona resultats exactes. Si surt 0.5, és en {{E Mat/S Decimal}}: arregla-ho com a la fitxa «Em surt 0.5 en lloc d'1/2».[/calc]",0],["[calc]Mira la lletra de la unitat dels angles: D (graus) o R (radians).[/calc] [mat]Si l'examen té funcions trigonomètriques de $x$, ha de ser R; per a angles en graus, D.[/mat]",0],["[calc]Prem [[ac]]. A la barra no hi ha d'haver FIX ni SCI (si n'hi ha, fitxa «Tot em surt arrodonit») ni ✔ (si n'hi és, [[tools]] i {{Verificar OFF}}).[/calc]",0],["[calc]Si els menús no surten en l'idioma que esperes: [[settings]], {{Config sistema}} i {{Idioma}}. Tria també el mateix idioma a dalt d'aquesta pàgina («Calculadora en»): així les fitxes et mostraran els mateixos menús.[/calc]",0],["[calc]Prem [[ac]] per tornar a la pantalla de càlcul. Ja pots començar l'examen.[/calc]",0]],"araTu":{"enunciat":"Una sola operació ho comprova gairebé tot: calcula $\\cos 60$. Què ha de sortir per a un examen amb angles en graus?"}},{"id":"indicadors","bloc":"simbols","titol":"Què vol dir cada símbol de la pantalla?","enunciat":"A la pantalla, a més dels nombres, hi surten símbols: a la barra de dalt, a la línia de l'expressió i a la del resultat.","font":"","passos":[["[calc]Aquesta icona vol dir que escrius en format matemàtic: les fraccions i les arrels es veuen com al llibre. La calculadora està configurada per donar resultats exactes ({{E Mat/S Mat}}): per això el resultat surt $\\frac{\\sqrt{2}}{2}$ i no 0.7071067812.[/calc]",0],["[calc]La D amb fons fosc vol dir que els angles van en graus. És la que faràs servir quasi sempre.[/calc]",0],["[calc]El triangle ▲ vol dir que hi ha càlculs anteriors: amb [[up]] els tornes a veure.[/calc]",0],["[calc]Prem [[shift]]: a la barra surt una S. La tecla següent farà el que hi ha escrit a sobre seu (per exemple, [[shift]] [[7]] escriu π). La S desapareix sola.[/calc]",0],["[calc]Si en lloc de la D hi ha una R, els angles van en radians. Si hi ha una G, van en graus centesimals, una unitat que no faràs servir.[/calc]",0],["[calc]FIX vol dir que tots els resultats surten arrodonits a un nombre fix de decimals: aquí, a 2, i per això $1\\div 6$ surt 0.17.[/calc]",0],["[calc]SCI vol dir que tots els resultats surten en notació científica, amb un nombre fix de xifres: aquí, 3, i per això $1\\div 6$ surt $1.67\\times 10^{-1}$.[/calc]",0],["[calc]El ✔ vol dir que {{Verificar}} està activat: la calculadora no calcula, sinó que diu si una igualtat és certa o falsa.[/calc]",0],["[calc]Els triangles ◀ i ▶ a les vores de la línia volen dir que l'expressió no hi cap: n'hi ha més per aquest costat. Amb [[left]] i [[right]] t'hi mous.[/calc]",0],["[calc]Un «×10» amb un nombre petit a dalt vol dir que el resultat és en notació científica: és massa llarg per a la pantalla.[/calc] [mat]$2.592\\times 10^{13}$ és $2{,}592\\cdot 10^{13}$.[/mat]",0]],"provaTu":{"enunciat":"A la barra de dalt de la teva calculadora hi ha \"R\" i \"FIX\". Què vol dir cada cosa?","solucio":"La \"R\" vol dir que els angles van en radians.\n\"FIX\" vol dir que tots els resultats surten arrodonits a un nombre fix de decimals."}},{"id":"eso-corregeix","bloc":"eso-inici","titol":"T'has equivocat en teclejar: com corregir-ho","enunciat":"Vols calcular \"$26\\cdot 4$\", però en teclejar t'equivoques totalment i escrius \"25 × 44\". T'expliquem com corregir-ho.","font":"","passos":[["[calc]Això és el que has escrit: 25 [[per]] 44. El cursor és al final.[/calc]",0],["[calc]Prem [[del]]: esborra el que hi ha just abans del cursor, el 4 de més. ([[ac]] ho esborraria tot.)[/calc]",0],["[calc]Ara el 5 ha de ser un 6. Prem [[left]] dues vegades: el cursor es mou fins just després del 5.[/calc]",0],["[calc]Prem [[del]] per esborrar el 5 i escriu el 6: s'afegeix on és el cursor.[/calc]",0],["[calc]Prem [[exe]]: obtens 104.[/calc] [mat]$26\\cdot 4=104$.[/mat]",0]]},{"id":"eso-fraccio-decimal","bloc":"eso-pantalla","titol":"Em surt una fracció: vull el decimal","enunciat":"Calcula $7\\div 4$ i dona el resultat:\n- en forma de fracció\n- en forma decimal.","font":"","passos":[["[calc]Escriu 7 [[entre]] 4.[/calc]",0],["[calc]Prem [[exe]]: obtens el resultat, que és $\\frac{7}{4}$. Surt en fracció perquè la calculadora està configurada per donar resultats exactes; si estigués configurada per donar decimals, sortiria 1.75.[/calc] [mat]Una divisió és una fracció: $7\\div 4=\\frac{7}{4}$.[/mat]",0],["[calc]Per tenir-lo en decimal, prem [[shift]] i [[exe]] (a sobre d'EXE hi ha ≈): obtens 1.75.[/calc] [mat]La resposta correcta és $\\frac{7}{4}=1{,}75$.[/mat]",0]],"provaTu":{"enunciat":"Calcula $9\\div 8$ i dona el resultat:\n- en forma de fracció\n- en forma decimal.","solucio":"[mat]$9\\div 8=\\frac{9}{8}=1{,}125$.[/mat]"}},{"id":"eso-arrodonir","bloc":"eso-pantalla","titol":"Arrodonir el que surt a la pantalla","enunciat":"Calcula $2\\div 3$ i arrodoneix el resultat a les centèsimes.","font":"","passos":[["[calc]Escriu 2 [[entre]] 3.[/calc]",0],["[calc]Prem [[shift]] [[exe]] (≈): obtens el resultat en decimal, que és 0.6666666667. La calculadora ja ha arrodonit l'última xifra (el 7).[/calc]",0],["[mat]Per arrodonir a les centèsimes, mira la tercera xifra decimal: és un 6, més gran o igual que 5, i per això la segona puja d'un: 0,67.[/mat] [mat]La resposta
